准与投资权限。", "特约用户、研究方法与人物角色使判断扎根真实目标用户，同时警惕尝鲜者、群体讨论与刻板印象的误导。"], "related_concepts": ["opportunity", "principles", "persona", "charter-users"], "anchors": ["PDF p. 54–82"], "voice": "editor"}, {"id": "solution", "title": "第二部分中段 · 方案如何成立（第18—22章）", "summary": "把设计变成能操作、能比较、能被证伪的对象。", "details": ["原型成为说明主体，但业务规则、质量和兼容要求仍需补充；不是取消所有文档。", "产品、设计、工程共同压缩出最小完整方案，对价值、可用性与可行性分别验证。", "原型测试保持首次印象、少提示、观察关键任务、快速修改；不成立时及时停止，避免把全部开发当成昂贵试验。"], "related_concepts": ["prototype", "spec", "minimal-product", "prototype-testing"], "anchors": ["PDF p. 83–102"], "voice": "editor"}, {"id": "delivery", "title": "第二部分后段 · 交付与持续改进（第23—30章）", "summary": "验证不止于上线，方法要适合团队与产品。", "details": ["改进已有产品先看任务与指标，不把功能数量当成绩。", "平滑部署保护用户习惯，快速响应保留上线后资源，补足原型没有揭示的现实问题。", "敏捷与瀑布各有局限，关键是别推迟基础验证；创业与大公司则需以不同资源条件组织探索、创新与合作。"], "related_concepts": ["metrics", "release", "response", "agile", "innovation"], "anchors": ["PDF p. 103–125"], "voice": "editor"}, {"id": "product", "title": "第三部分 · 产品（第31—39章）", "summary": "找到需求、技术与体验的契合，而非只追逐新奇。", "details": ["苹果案例连接硬件、软件、体验、情感与真实需要；特例产品则展示短期收入如何扭曲通用方向。", "成熟市场、情感动机与接纳访谈提醒团队：新的办法可以解决老问题，早期热情也必须辨认原因。", "消费者、企业与平台产品的运行、采购、角色和渠道不同，不能将一套用户关系和交付方式机械照搬。"], "related_concepts": ["emotion", "adoption", "enterprise", "platform"], "anchors": ["PDF p. 127–153"], "voice": "editor"}, {"id": "summary", "title": "总结 · 十项实践与十个反省问题（第40—41章）", "summary": "把方法连成循环，再持续检查实际结果。", "details": ["第40章把职责、体验、机会、特约用户、原则、人物角色、探索、原型、测试和数据改善重新串起。", "第41章要求检查实际产品的吸引力、易用、竞争、差异、质量、完整性、匹配、价格和团队认识。", "深入阅读页列出当时SVPG网站、培训及译注；本次未访问这些外部页面，链接状态与当前服务不在校核范围内。"], "related_concepts": ["validation", "metrics", "product-management"], "anchors": ["PDF p. 154–159"], "voice": "editor"}], "chapters": [{"id": "ch-01", "title": "第1章 关键角色及其职责", "question": "一支软件产品团队必须有人负责哪些事？", "role": "先明确职责，再讨论流程，防止把岗位名称当成实际工作。", "mainline": "作者把产品经理的工作分为机会评估与产品定义：前者判断问题是否值得投入，后者把功能、体验和发布要求整合成可开发的方案。交互设计、工程、项目管理、运维和营销各有任务，协作不能变成互相替代。一个人可以兼任多个角色，但每种责任都必须有人承担。", "sections": [{"title": "产品经理负责选择机会与定义方案", "detail": "创意可以来自高管、用户、测试、营销和工程；来源有权威不等于值得开发。产品经理应审核机会，再与设计师探索功能及体验，清楚描述产品的行为和属性。作者倾向于轻量机会评估与围绕原型展开的说明，而非堆积文档。", "anchors": ["PDF p. 9"], "excerpts": []}, {"title": "体验、交付、运行和推广分别解决不同问题", "detail": "交互设计师研究目标用户并设计导航、流程；工程团队实现产品；项目管理统筹计划与进度；运维保持在线服务运行；营销向市场传达价值、支持销售。缺少任何一项，都不能靠其他团队额外努力自动补齐。", "anchors": ["PDF p. 9–10"], "excerpts": []}, {"title": "按真实职责识别团队，人数比例仅供参考", "detail": "微软在书中采用的头衔与作者不同，说明名称并不可靠。作者给出每5–10名开发人员配1名产品经理等配置参考，并强调比例受产品类型、经验和能力影响；大型项目及火车式发布需要专门的项目管理。", "anchors": ["PDF p. 11"], "excerpts": []}], "argument_flow": ["产品经理负责选择机会与定义方案", "体验、交付、运行和推广分别解决不同问题", "按真实职责识别团队，人数比例仅供参考"], "takeaways": ["先画责任图，检查哪些关键工作无人负责，再讨论招聘几个产品经理。"], "related_concepts": ["product-management", "opportunity", "ux", "project-management", "marketing"], "anchors": ["PDF p. 9–11"], "confidence": "high", "voice": "editor", "part": "人员"}, {"id": "ch-02", "title": "第2章 产品管理与产品营销", "question": "能宣传产品，是否就能定义产品？", "role": "防止产品定义被营销活动或高低层需求的分割架空。", "mainline": "营销与产品管理都重要，但前者解决对外沟通，后者要详细定义有价值、可用、可行的产品。作者批评三种模式：营销直接把粗略要求交给工程、两人分担高低层需求却无人对整体负责、一个人同时承担两类高强度工作。出路是明确负责人并建立双向信息交流。", "sections": [{"title": "只收集高层需求会留下定义真空", "detail": "会命名、定价、培训销售，不意味着能够确定具体功能与用户体验。若营销人员只把粗略要求转给工程，团队仍得有人补上探索方案的工作，否则开发人员只能猜测真正要做什么。", "anchors": ["PDF p. 12–13"], "excerpts": []}, {"title": "把需求切成两层，可能失去整体负责人", "detail": "业务负责人提出高层要求，技术产品经理写底层需求，看起来分工细致，却可能没人对最后的体验和价值负责。作者反对的是割裂的责任链，特别是认为高层业务要求可以脱离具体使用体验单独完成。", "anchors": ["PDF p. 13"], "excerpts": []}, {"title": "职责分开，信息仍须紧密互通", "detail": "营销提供市场与渠道信息，产品经理提供产品设计和能力信息。作者承认有人能兼任，但认为人才稀少、精力有限、难以扩展。成功的产品仍需一个对整体定义负责的人，而不是让两项工作竞争同一份注意力。", "anchors": ["PDF p. 14"], "excerpts": []}], "argument_flow": ["只收集高层需求会留下定义真空", "把需求切成两层，可能失去整体负责人", "职责分开，信息仍须紧密互通"], "takeaways": ["区分“让外界理解产品”和“把产品定义清楚”，为两者建立合作接口。"], "related_concepts": ["product-management", "marketing", "product-value"], "anchors": ["PDF p. 12–14"], "confidence": "high", "voice": "editor", "part": "人员"}, {"id": "ch-03", "title": "第3章 产品管理与项目管理", "question": "为什么频繁发布的互联网产品更需要独立的项目管理？", "role": "把探索正确方向与可靠执行区分开。", "mainline": "传统零售软件的产品和项目粒度接近，产品经理比较容易兼管进度。互联网服务却频繁发布、并行开发，一次发布可能跨多个产品经理和团队，因此需要统筹全局的项目管理。作者再用eBay同事的例子说明，项目管理的核心是推动判断与行动，而非操作排期软件。", "sections": [{"title": "火车式发布改变了协调对象", "detail": "功能开发可能跨数次发布，每次发布又混合多个项目。项目经理必须协调开发、运维、客服和产品等方面，解决一次整体交付的问题；单个产品经理掌握自己功能的进度，不能等同于掌握全局发布。", "anchors": ["PDF p. 16–17"], "excerpts": []}, {"title": "产品探索与执行计划需要不同重心", "detail": "产品管理探索值得开发且能用的方案，项目管理确保计划得到执行。作者认为即便传统软件也值得分开职责，同时承认强项目管理能力能帮助产品经理更快把产品推向市场。", "anchors": ["PDF p. 17"], "excerpts": []}, {"title": "优秀项目经理推动问题得到解决", "detail": "琳·丽迪的案例归纳出紧迫感、识别问题、思路清晰、依靠数据、果断、判断力和承担责任的态度。它们共同指向及时拆开问题、找到责任人、促成决策，而不是把管理简化为更新甘特图。作者的个人典范不能直接当作所有组织的因果证明。", "anchors": ["PDF p. 18–19"], "excerpts": []}], "argument_flow": ["火车式发布改变了协调对象", "产品探索与执行计划需要不同重心", "优秀项目经理推动问题得到解决"], "takeaways": ["项目管理负责让跨团队承诺落地，产品管理负责避免高效交付没有价值的东西。"], "related_concepts": ["project-management", "discovery", "release"], "anchors": ["PDF p. 16–19"], "confidence": "high", "voice": "editor", "part": "人员"}, {"id": "ch-04", "title": "第4章 产品管理与产品设计", "question": "为什么最后给界面“穿漂亮衣服”不能补救用户体验？", "role": "说明设计的专业分工及其应参与的时点。", "mainline": "体验不是开发后期的装饰，它与产品需求共同形成解决方案。作者区分用户研究、交互设计、视觉设计和原型制作四种工作，要求它们与产品经理密切合作，并由工程评估可行性。小团队可以兼任，但不能把某种工作删掉；外包选择取决于能否保留持续的用户理解与决策能力。", "sections": [{"title": "四种设计工作相互衔接", "detail": "研究理解用户并评估方案；交互组织功能、导航和流程；视觉通过布局、颜色、字体传达信息和情感；原型把想法变成可试用对象。四者解决不同问题，一位会画界面的人不一定能全部胜任。", "anchors": ["PDF p. 20–21"], "excerpts": []}, {"title": "价值、可用性和可行性共同塑造体验", "detail": "产品经理与设计师既要让人理解怎么操作，也要让人真的想用。架构师应及早检查方案是否做得出。书中三人创业团队由一位产品经理和两位兼任多种设计职责的成员完成原型，说明角色完整不等于必须设四个设计岗位。", "anchors": ["PDF p. 21"], "excerpts": []}, {"title": "外包不能让关键学习从公司消失", "detail": "作者反对把交互设计整体外包：用户理解需要积累，开发中的细节又需要持续决策。视觉设计或研究测试可以借助外部服务，但产品经理仍须参与。原型代码用于学习，不能未经工程处理直接作为正式产品。", "anchors": ["PDF p. 21–22"], "excerpts": []}], "argument_flow": ["四种设计工作相互衔接", "价值、可用性和可行性共同塑造体验", "外包不能让关键学习从公司消失"], "takeaways": ["检查设计是否参与问题定义，而不是只在上线前接受美化任务。"], "related_concepts": ["ux", "prototype", "feasibility"], "anchors": ["PDF p. 20–22"], "confidence": "high", "voice": "editor", "part": "人员"}, {"id": "ch-05", "title": "第5章 产品管理与软件开发", "question": "怎样与工程平等合作，并避免被迫停下来整体重写？", "role": "把可行性、分布式沟通与技术持续性纳入产品责任。", "mainline": "产品经理定义正确的产品，工程正确地实现产品；双方平等且相互依赖。工程应早期接触用户、提供技术机会和可行性判断，产品经理则聚焦基本产品、减少开发中的随意变更。异地协作需要更清楚的原型与指挥接口；长期只加功能会耗尽技术余量，最终让产品停滞。", "sections": [{"title": "让工程参与探索，避免完成文档才交接", "detail": "邀请工程师观察原型测试、讨论新技术、评估早期方案，能够同时改善价值和可行性。产品经理应快速处理用例遗漏，却不能把开发期当成不断试新点子的探索期；变更应围绕守住基本产品所需的完整体验。", "anchors": ["PDF p. 23–24"], "excerpts": []}, {"title": "异地沟通靠共享对象、清楚接口和直接交流", "detail": "远程团队面临语言、文化和时差。作者建议围绕高保真原型沟通，明确本地协调负责人，并安排面对面交流或人员互换。他把外包的主要理由解释为获得合适人才，而不只是压低工资；这是一种管理立场，不是对所有外包收益的定论。", "anchors": ["PDF p. 24–26"], "excerpts": []}, {"title": "技术余量保护未来交付能力", "detail": "系统承载用户、事务与功能的能力有上限。作者以eBay危机为例，建议预留约20%的工程自主资源改善架构、性能和代码。该比例是经验建议，不是容量公式；完全等到系统崩溃才重写，会使用户长期看不到价值改进。", "anchors": ["PDF p. 27"], "excerpts": []}, {"title": "需要重写时尽量分块推进", "detail": "重新估算重写计划时要警惕缺乏经验导致的乐观；尽量增量重构，同时保留用户可见的功能改进。作者宁愿把重建周期拉长，也不愿全面停止对用户的交付，核心是保住产品竞争力和技术演进的连续性。", "anchors": ["PDF p. 28"], "excerpts": []}], "argument_flow": ["让工程参与探索，避免完成文档才交接", "异地沟通靠共享对象、清楚接口和直接交流", "技术余量保护未来交付能力", "需要重写时尽量分块推进"], "takeaways": ["技术改善不是产品工作的对立面，它是未来价值交付的条件。"], "related_concepts": ["feasibility", "headroom", "minimal-product", "prototype"], "anchors": ["PDF p. 23–28"], "confidence": "high", "voice": "editor", "part": "人员"}, {"id": "ch-06", "title": "第6章 招聘产品经理", "question": "应该依据学历、年龄和行业经验，还是可观察的产品能力选人？", "role": "建立选人标准，并区分难培养的特质与可学习的技能。", "mainline": "作者首先重视产品热情、用户立场、思考能力、正直、信心和承担责任的态度，再讨论技术理解、专注、时间管理、沟通及商业技能。他主张从公司内部不同岗位寻找潜力，考察学习新领域的方式，而不是简单按MBA、年龄或行业年限筛选；同时承认特定领域可能需要专业知识。", "sections": [{"title": "从热情与用户立场识别潜力", "detail": "让候选人解释喜欢和不喜欢哪些产品、如何改进，能观察其投入程度。更关键的是能否尊重与自己不同的目标用户，而不是把改变用户习惯当成默认目标。解决陌生问题的思路，比背出正确答案更能显示判断能力。", "anchors": ["PDF p. 29–30"], "excerpts": []}, {"title": "影响力建立在正直和责任感上", "detail": "产品经理通常没有团队成员的直接管理权，需要依靠信任说服他人。作者把担当描述得很强：出问题主动负责，顺利时认可同事；这不等于亲自监督所有事。他关于工时和牺牲的论述体现个人职业观，不能由此推导出长工时就是胜任的证据。", "anchors": ["PDF p. 30–32"], "excerpts": []}, {"title": "技能应同时通向用户、技术与商业", "detail": "理解技术应用潜力，控制无效功能，区分重要与紧急，写清楚且有人读的材料，用简短演示说明价值。所谓“双语”是能与工程讨论技术，也能与管理层讨论成本、定位和收益；商业知识只是技能组合中的一部分。", "anchors": ["PDF p. 32–35"], "excerpts": []}, {"title": "可迁移能力不等于可以忽视行业学习", "detail": "候选人可以来自工程、设计、客服乃至用户群。作者强调进入新行业后必须深入学习，防止老经验造成盲目自信，并以金融背景同事跨领域任职为例。年龄、性别、种族、口音不是能力的可靠替代指标；某些高度专业的产品仍需要相应知识。", "anchors": ["PDF p. 35–38"], "excerpts": []}], "argument_flow": ["从热情与用户立场识别潜力", "影响力建立在正直和责任感上", "技能应同时通向用户、技术与商业", "可迁移能力不等于可以忽视行业学习"], "takeaways": ["用真实作品、陌生问题推演和用户理解来面试，别把背景标签当成能力本身。"], "related_concepts": ["product-management", "user-understanding", "influence"], "anchors": ["PDF p. 29–38"], "confidence": "high", "voice": "editor", "part": "人员"}, {"id": "ch-07", "title": "第7章 管理产品经理", "question": "产品总监如何同时对团队成长和产品组合负责？", "role": "把个人产品实践连接到组织能力、战略与考核。", "mainline": "产品总监一方面招募、培养并适度授权产品经理，另一方面让产品组合支持商业战略并解决产品间冲突。作者推荐用产品结果评估工作，介绍NPS来关注用户态度，但明确满意度不能替代盈利。组织上倾向产品与设计独立，同时承认业务结构与团队能力决定具体安排。", "sections": [{"title": "培训、胜任与授权有先后关系", "detail": "新人需要系统接触用户、技术、市场和竞争；作者给出约三个月的领域学习建议，且不包含基础技能培训。对有潜力者辅导，对不适合者调整岗位；确认胜任后应留出空间，既不能放任不管，也不能事事替他作决定。", "anchors": ["PDF p. 39–40"], "excerpts": []}, {"title": "产品总监管理全局取舍", "detail": "商业战略要转为产品原则、各产品战略与组合路线图。单个产品经理优化自己产品时可能损害其他产品，因此总监需处理资源冲突，向高管公开解释决策依据，建立足以抵制错误决定的信任。", "anchors": ["PDF p. 40–41"], "excerpts": []}, {"title": "结果评价要看体验，也要看商业健康", "detail": "书中介绍NPS为推荐者比例减贬损者比例，用来观察产品变化和用户态度。作者同时指出即使用户全满意，公司也可能逐单亏损；广告带来的短期收入若伤害体验，可能属于牺牲长期关系换来的劣质收益。", "anchors": ["PDF p. 41–42"], "excerpts": []}, {"title": "组织结构是支持条件，不是成功保证", "detail": "作者倾向将产品管理和设计放在与工程、营销同级的位置，避免被执行细节或销售要求淹没。分散业务部门、集中开发服务的公司可能需要把产品与交互放在业务部门。他最终承认优秀人员与共同价值观比组织图更关键。", "anchors": ["PDF p. 42–44"], "excerpts": []}], "argument_flow": ["培训、胜任与授权有先后关系", "产品总监管理全局取舍", "结果评价要看体验，也要看商业健康", "组织结构是支持条件，不是成功保证"], "takeaways": ["产品总监的成绩应体现为团队能力和产品组合结果，而非替所有人做产品决定。"], "related_concepts": ["influence", "principles", "nps", "product-management"], "anchors": ["PDF p. 39–44"], "confidence": "high", "voice": "editor", "part": "人员"}, {"id": "ch-08", "title": "第8章 巴顿将军的忠告", "question": "怎样避免把客户的方案或自己的实现偏好当成需求？", "role": "用“做什么”与“怎么做”的区别释放专业协作。", "mainline": "作者借巴顿的目标管理观点，先要求产品经理从客户提出的办法追问其真实问题，再要求产品经理对设计师和工程说明目标而非预先锁死实现。早期引入专业人员、给出创造空间，才能产生超过单个人设想的方案。", "sections": [{"title": "客户提出的往往是一种解法", "detail": "人会自然地把需求表达为“加一个按钮”或某种具体操作。产品经理需要辨认对方真正想完成什么，不能假定客户已知道当前技术下最好的实现方式。先重新表述问题，才有机会比较不同方案。", "anchors": ["PDF p. 45"], "excerpts": []}, {"title": "专业协作应从探索初期开始", "detail": "交互设计师若只在需求文档完成后接手，作用就被压缩成执行。让设计师早期分析用户与方案，让工程决定适当的技术实现，并不等于目标含糊；恰恰需要把目标和约束解释清楚。", "anchors": ["PDF p. 45–46"], "excerpts": []}], "argument_flow": ["客户提出的往往是一种解法", "专业协作应从探索初期开始"], "takeaways": ["清楚规定需要解决的问题，同时为专业人员保留提出办法的空间。"], "related_concepts": ["problem-solution", "ux", "feasibility"], "anchors": ["PDF p. 45–46"], "confidence": "high", "voice": "editor", "part": "人员"}, {"id": "ch-09", "title": "第9章 产品副经理", "question": "创意一定要由产品经理本人提出吗？", "role": "把产品负责人从个人创意中心改为组织智慧的汇集者。", "mainline": "“产品副经理”在此不是一套正式职级，而是作者给公司内富有洞察力的帮手的称呼。通过工程、销售支持等岗位的例子，他说明低调、年轻或被偏见遮蔽的人可能贡献关键想法。产品经理应主动接触、倾听和借力，并继续承担整合及产品决策责任。", "sections": [{"title": "职位评价会遮蔽真实的产品洞察", "detail": "系统工程师能把客户问题讲清楚，内向开发人员可能特别理解用户体验；能力也可能被上级的不安全感或年龄、文化偏见埋没。作者用化名案例提醒读者，不要只向头衔显赫或表达强势的人寻找创意。", "anchors": ["PDF p. 47–48"], "excerpts": []}, {"title": "主动建立开放的创意网络", "detail": "走出办公室、认真听会上的讨论、公开产品难题、欢迎建议，并在工作外与不同岗位交流。作者反对因为自负而排斥别人的创意：目标是做出好产品，而不是证明产品经理是唯一聪明的人。", "anchors": ["PDF p. 48–49"], "excerpts": []}], "argument_flow": ["职位评价会遮蔽真实的产品洞察", "主动建立开放的创意网络"], "takeaways": ["建立能让各岗位贡献洞察的渠道，创意归属不应压过产品质量。"], "related_concepts": ["influence", "user-understanding", "product-management"], "anchors": ["PDF p. 47–49"], "confidence": "high", "voice": "editor", "part": "人员"}, {"id": "ch-10", "title": "第10章 管理上司", "question": "高管指示不断变化时，怎样保持推进能力？", "role": "处理组织波动，避免把全部时间耗在被动返工。", "mainline": "竞争、技术、预算和多位决策者都会造成计划波动，作者不承诺彻底消除它们，而是建议记录、预留和改善沟通。十条经验围绕理解上司、会前沟通、准备替代方案、用事实支持建议以及内部传播展开。其目的在于缩短决策和协调成本，让产品工作真正推进。", "sections": [{"title": "先认识波动并适应沟通习惯", "detail": "记录每周推进与返工的时间，寻找规律，并在计划里留出调整空间。弄清不同管理者需要怎样的汇报方式和频率，能减少沟通落差；适应并不意味着放弃对问题的判断。", "anchors": ["PDF p. 50"], "excerpts": []}, {"title": "把会议前的工作做充分", "detail": "逐一了解关键参与者的疑问，准备问题、选项和推荐依据。向上司借力时要提供可靠信息，让他能准确转达方案。会前沟通帮助形成共识，但编者提醒，仍需保留真实异议，不能把形式一致当成证据一致。", "anchors": ["PDF p. 51"], "excerpts": []}, {"title": "用简洁事实建立信任", "detail": "短邮件、充分准备、数据与事实、内部宣传以及减少上司不必要的负担，共同提升协作效率。作者建议另寻导师，与第7章要求直接管理者培养产品经理存在角色分配上的张力；不宜解读为管理者无需辅导。", "anchors": ["PDF p. 51–52"], "excerpts": []}], "argument_flow": ["先认识波动并适应沟通习惯", "把会议前的工作做充分", "用简洁事实建立信任"], "takeaways": ["把波动与分歧转成可讨论的问题、选项和依据。"], "related_concepts": ["influence", "principles", "metrics"], "anchors": ["PDF p. 50–52"], "confidence": "high", "voice": "editor", "part": "人员"}, {"id": "ch-11", "title": "第11章 评估产品机会", "question": "投入设计和工程前，怎样判断问题值得解决？", "role": "把机会选择与具体解决方案拆开，并接通商业结果。", "mainline": "机会评估不是为已决定的功能补写理由，而是筛掉价值不足的想法。作者以十个问题检查用户问题、市场、成功标准、竞争、团队优势、时机、渠道和必要条件，最后作出继续或放弃的建议。新产品和旧产品改进都应比较机会价值，财务信息则帮助理解收益、成本和客户行为。", "sections": [{"title": "十问组成选择机会的决策框架", "detail": "依次说明解决什么、为谁解决、市场规模、成功指标、竞争产品、为何适合由我们做、时机、推向市场的方式、必要条件，以及继续或放弃的结论。重点是把问题与约束讲清楚，暂时不指定详细方案。", "anchors": ["PDF p. 54–55"], "excerpts": []}, {"title": "不要因一个解法失败而放弃整个机会", "detail": "价值问题最难回答，团队容易用功能清单代替用户问题。市场规模须谨慎估计，渠道要求可能形成产品约束。某种实现不可行，不代表用户问题不重要；保留机会与方案的区分，才能继续寻找别的办法。", "anchors": ["PDF p. 55–56"], "excerpts": []}, {"title": "新旧项目按同一种机会逻辑比较", "detail": "作者反对用固定比例分配新旧产品资源。注册成功率改善、客服成本下降，也可能比另造新产品更有回报。书中的转化翻倍例子用于说明改进潜力，并不保证任何注册率翻倍都会自动让总收益翻倍。", "anchors": ["PDF p. 56–57"], "excerpts": []}, {"title": "用财务伙伴看见产品经济性", "detail": "财务可帮助分析营利模式、投入产出、交易与账单中的机会，并检验商业构想。作者同时提醒，只取得有权获取的数据；数据的解释和使用同样需要专业协助，不能把查看报表等同于理解业务。", "anchors": ["PDF p. 57–58"], "excerpts": []}], "argument_flow": ["十问组成选择机会的决策框架", "不要因一个解法失败而放弃整个机会", "新旧项目按同一种机会逻辑比较", "用财务伙伴看见产品经济性"], "takeaways": ["先证明问题、对象和成功标准，再选择实现路径。"], "related_concepts": ["opportunity", "problem-solution", "metrics", "business"], "anchors": ["PDF p. 54–58"], "confidence": "high", "voice": "editor", "part": "流程"}, {"id": "ch-12", "title": "第12章 产品探索", "question": "为什么不能把定义产品当成准时交卷的文档生产？", "role": "说明探索的不确定性及其与执行的转换。", "mainline": "产品探索要找出用户需要且技术可实现的解决方案，执行阶段则把经过验证的定义可靠交付。两者工作心态不同，探索不能因工程等待而被假定必然按期成功。作者建议用低成本原型学习，把创造性试错放在全面开发前，同时可以探索下一版本，但不能干扰当前交付。", "sections": [{"title": "探索与执行不是同一种工作", "detail": "探索收集需求、运用技术、构思和测试方案；执行关注开发、测试、发布及解决遗漏。进入开发后继续随意改创意，会导致延期、砍功能或质量下降。将新想法纳入下一版本，是作者避免扰动当前版本的办法。", "anchors": ["PDF p. 59–60"], "excerpts": []}, {"title": "时间盒不能保证探索得到有效答案", "detail": "书中“四周定义新产品”的例子说明，安排了调研、原型、测试和评审，并不代表用户一定喜欢结果。为了让工程有活做而交出未经验证的方案，只是把探索成本扩大为完整开发成本。", "anchors": ["PDF p. 60–61"], "excerpts": []}, {"title": "先用小投入检验，再扩大承诺", "detail": "作者区分发现值得解决的问题与找到可行方案，后者可能特别困难。创业公司可能没有资金承受数轮完整产品试错；既有工程人员可以参与探索或建设必要基础，而不是为了保持忙碌直接全面开发。", "anchors": ["PDF p. 61–62"], "excerpts": []}], "argument_flow": ["探索与执行不是同一种工作", "时间盒不能保证探索得到有效答案", "先用小投入检验，再扩大承诺"], "takeaways": ["管理探索投入和证据，不要承诺未知的解决方案必然按期成立。"], "related_concepts": ["discovery", "validation", "prototype", "feasibility"], "anchors": ["PDF p. 59–62"], "confidence": "high", "voice": "editor", "part": "流程"}, {"id": "ch-13", "title": "第13章 产品原则", "question": "意见冲突时，依据什么作出取舍？", "role": "建立超出单个功能、可被团队共同使用的价值判断框架。", "mainline": "产品原则说明团队最重视什么，是产品战略的一部分，不是功能清单或通用界面规范。原则必须具体并有优先级，才能在冲突时帮助取舍。作者把很多无效争论追溯到对问题、目标用户、目标及目标顺序没有共识，并要求公开决策依据。", "sections": [{"title": "原则表达有辨识度的价值选择", "detail": "电影网站信任社区影评胜过专业评论，是能影响决策的原则；“导航清晰”则更接近通用设计准则。原则可以内部使用或对外公开，作用是让产品线的决定保持一致，而非为每个功能单独找理由。", "anchors": ["PDF p. 63–64"], "excerpts": []}, {"title": "没有排序，原则无法处理冲突", "detail": "安全、易用、速度、成本和隐私可能互相牵制。把所有目标都标为重要，只会把冲突推迟到方案讨论。团队应先确定问题与关键人物角色，再把目标从高到低排序，避免各自使用不同标准争论细节。", "anchors": ["PDF p. 64–65"], "excerpts": []}, {"title": "透明的判断过程比个人权威更可复用", "detail": "作者建议讨论前把目标和优先级写在白板上，解释每个决定为何成立。不是所有分歧都来自事实争议，很多来自价值顺序不同；先修复共同标准，才可能让建设性辩论真正完善方案。", "anchors": ["PDF p. 65–66"], "excerpts": []}], "argument_flow": ["原则表达有辨识度的价值选择", "没有排序，原则无法处理冲突", "透明的判断过程比个人权威更可复用"], "takeaways": ["原则的检验不是读起来正确，而是发生冲突时能否明确舍弃某个选项。"], "related_concepts": ["principles", "persona", "influence"], "anchors": ["PDF p. 63–66"], "confidence": "high", "voice": "editor", "part": "流程"}, {"id": "ch-14", "title": "第14章 产品评审团", "question": "怎样让高管及时决定投资，又不接管设计细节？", "role": "设立分阶段的产品治理和成本估算机制。", "mainline": "产品评审团把关键部门放到同一决策机制中，依据商业战略配置产品资源。它监督四个里程碑：启动机会评估、批准探索方案、批准开发、批准发布；产品细节仍归团队。成本也分两次估算，机会阶段只判断规模，具体方案形成后再作详细估算，避免过早给出虚假的精确承诺。", "sections": [{"title": "跨部门代表聚焦关键投资决定", "detail": "评审团通常包括业务负责人、产品、设计、营销、工程、运维和客服代表，人数尽量控制在十人以内。主持人要促成决策；小公司可以由老板承担组织任务。评审团提出匹配商业战略的产品战略，并不代替公司制定商业战略。", "anchors": ["PDF p. 67–68"], "excerpts": []}, {"title": "四道里程碑分别需要不同证据", "detail": "先选择值得评估的机会，再判断是否探索解决方案；原型、用户测试和成本明细支持开发决策；最终质量与发布准备支持上市决策。评审团不应审批每次小修，也不应亲自改界面；有缺陷就退回产品团队。", "anchors": ["PDF p. 68–69"], "excerpts": []}, {"title": "由粗到细估算，并回看决定的效果", "detail": "没有方案时只能粗分大中小，不能把猜测包装成精确成本。探索中让工程比较方案代价，最终说明确定后再估算工期与投入。上市3–6个月回顾市场表现，是作者建议的治理反馈；会前沟通帮助暴露问题，而非省略审查。", "anchors": ["PDF p. 69–70"], "excerpts": []}], "argument_flow": ["跨部门代表聚焦关键投资决定", "四道里程碑分别需要不同证据", "由粗到细估算，并回看决定的效果"], "takeaways": ["每个决策关口明确需要的证据，既避免无依据投资，也避免高管审批所有细节。"], "related_concepts": ["council", "opportunity", "feasibility", "metrics"], "anchors": ["PDF p. 67–70"], "confidence": "high", "voice": "editor", "part": "流程"}, {"id": "ch-15", "title": "第15章 特约用户", "question": "怎样持续接触目标用户，并在发布时获得可信推荐？", "role": "将用户洞察、产品验证和口碑连接成长期合作。", "mainline": "特约用户既是理解问题的伙伴，也是未来可能推荐产品的人。作者建议从项目开始招募少量真实目标用户，贯穿原型、开发和发布合作，不能把项目变成替少数客户定制。人数与产品类型有关，更不能把愿意尝鲜、能容忍缺陷的人直接当作大众需求代表。", "sections": [{"title": "合作从真实问题开始，不从免费名额开始", "detail": "用户因问题亟待解决而参与，公司因此获得现场调研、快速反馈和潜在推荐。书中一般建议至少六位、可先招8–10位筛选，且强调深入合作能力。人数建议不是抽样统计标准，也不是召集越多越好。", "anchors": ["PDF p. 71–72"], "excerpts": []}, {"title": "控制规模与承诺，保留通用产品方向", "detail": "通常不向特约用户收取参与费用，避免关系变成付费定制。确认他们属于目标群体，说明做的是通用产品，贯穿研发持续试用；平台产品把用户合作转为约六个示范应用。后文明确大众互联网服务可采用10–15人，不能把前面的“不超过十个”脱离语境照搬。", "anchors": ["PDF p. 72–74"], "excerpts": []}, {"title": "产品经理不能外包对用户的理解", "detail": "营销调查、销售转述和客服月报可以补充，却无法替代亲自交流。作者要求产品经理参加可用性测试和用户讨论，并与洞察力强的用户保持联系。招募困难本身也可能提示问题不够重要，但不能单凭一次招募受阻就断言没有市场。", "anchors": ["PDF p. 73–75"], "excerpts": []}], "argument_flow": ["合作从真实问题开始，不从免费名额开始", "控制规模与承诺，保留通用产品方向", "产品经理不能外包对用户的理解"], "takeaways": ["招募少量能持续合作的真实用户，记录其需求与大众目标之间的相同点和差异。"], "related_concepts": ["charter-users", "user-understanding", "prototype", "adoption"], "anchors": ["PDF p. 71–75"], "confidence": "high", "voice": "editor", "part": "流程"}, {"id": "ch-16", "title": "第16章 市场调研", "question": "调研能告诉我们什么，又不能替团队决定什么？", "role": "纠正忽略研究与迷信研究两种极端。", "mainline": "调查、使用分析、数据挖掘、现场拜访、人物角色、可用性测试及竞品研究，都能增加对用户的理解。但发现用户喜欢什么，不等于已经知道应采用什么技术和体验方案。作者尤其警惕问卷措辞、群体互相影响，以及把用户提出的功能原样转成产品需求。", "sections": [{"title": "选择方法要看需要知道的问题", "detail": "使用分析揭示行为，现场拜访揭示环境与工作习惯，可用性测试暴露理解障碍，竞品分析发现他人的长处。问卷设计需要专业技巧，用户数据收集应明确告知用途并保护隐私。各种方法互补，不能只凭一个百分比推断全部原因。", "anchors": ["PDF p. 76–77"], "excerpts": []}, {"title": "研究提供设计依据，不能替代设计判断", "detail": "用户可能表达喜欢X功能，但Y方案也许更好地解决同一问题。作者把成功产品归结为理解用户需求与理解当前技术可能性相结合；研究并不自动生成产品，更不能保证从意见汇总中诞生全新解决方案。", "anchors": ["PDF p. 77–78"], "excerpts": []}, {"title": "焦点小组的局限必须被看见", "detail": "群体讨论容易由健谈者主导、互相影响；没体验具体方案时，用户很难凭空评价未来产品。作者对研讨会态度强烈，但仍要求必须开展时亲自参与，不能把信息理解和分析一并外包。编者将其保留为方法边界判断，而非所有焦点小组都无效的定论。", "anchors": ["PDF p. 78–79"], "excerpts": []}], "argument_flow": ["选择方法要看需要知道的问题", "研究提供设计依据，不能替代设计判断", "焦点小组的局限必须被看见"], "takeaways": ["研究要回答明确问题，结论应回到设计假设与可测试方案。"], "related_concepts": ["research", "user-understanding", "problem-solution", "persona"], "anchors": ["PDF p. 76–79"], "confidence": "high", "voice": "editor", "part": "流程"}, {"id": "ch-17", "title": "第17章 产品人物角色", "question": "面对多类用户，怎样确定这一版本优先服务谁？", "role": "把对用户的理解转为日常决策工具。", "mainline": "人物角色是基于真实接触形成的典型用户模型，聚焦行为、态度和目标。它帮助选择重要功能，抑制团队把自身需求投射给用户，并在设计与开发间传递共同理解。作者要求为每个发布周期选择关键角色，但同时提醒测试不能只找完全符合模型的人。", "sections": [{"title": "角色模型须来自研究，不来自想象", "detail": "产品经理、交互设计师和研究人员一起与用户沟通，形成典型行为与目标。营销人物角色用于定位消费者，设计人物角色用于理解使用行为，二者目的不同。角色的价值不在姓名、照片或装饰性背景资料。", "anchors": ["PDF p. 80"], "excerpts": []}, {"title": "角色帮助明确取舍及分布式决策", "detail": "如果功能只服务非重点用户，就要审视是否应进入本轮。多类用户不能靠简单叠加功能来满足；对优先级达成共识后，文案、工程、测试等成员能据此处理大量细节，而不必每次等产品经理裁决。", "anchors": ["PDF p. 81"], "excerpts": []}, {"title": "重点不等于排除所有非典型用户", "detail": "作者倾向每个版本聚焦一类关键人物角色，以发挥优势；并非其他用户就应被做成无法使用。测试需要覆盖关键用户，也需要边界之外的多样化用户，防止团队把抽象模型当成全部现实。", "anchors": ["PDF p. 81–82"], "excerpts": []}], "argument_flow": ["角色模型须来自研究，不来自想象", "角色帮助明确取舍及分布式决策", "重点不等于排除所有非典型用户"], "takeaways": ["人物角色应改变功能取舍与测试招募，否则只是被束之高阁的文档。"], "related_concepts": ["persona", "research", "principles"], "anchors": ["PDF p. 80–82"], "confidence": "high", "voice": "editor", "part": "流程"}, {"id": "ch-18", "title": "第18章 重新定义产品说明文档", "question": "怎样把产品说明从“写完了”变成“大家理解且用户验证过了”？", "role": "用可交互的共同对象取代含糊的文字交接。", "mainline": "作者批评篇幅长却缺少关键细节的说明文档：它容易制造进展良好的错觉。理想说明应完整、准确、直观、可更新，并有统一主体。高保真原型承担功能与体验描述，业务规则及质量要求仍需补充文档；最大的收益是可以先测试，而不是原型看起来更漂亮。", "sections": [{"title": "说明文档应服务共同理解与可验证行为", "detail": "受众不仅是工程，还包括测试、客服、营销、运维和管理者。文档要能表达完整体验、软件行为与最新决策。线框、优先级清单和草图可以作为过程产物，但不能留下多个相互矛盾的“最终版本”。", "anchors": ["PDF p. 83–84"], "excerpts": []}, {"title": "高保真原型是真实体验，不等于真实后台", "detail": "原型应覆盖页面与主要用例，可模拟数据和后台结果，帮助用户像面对真实产品一样行动。税务、运费等业务逻辑，性能、可靠性、兼容性、安装等要求仍需文字或用例补充；作者没有主张取消一切文档。", "anchors": ["PDF p. 84–85"], "excerpts": []}, {"title": "更早发现问题，才可能缩短上市时间", "detail": "未经测试的文字方案把疑问推迟到开发期，引发猜测、返工或糟糕交付。原型让用户验证价值与可用性，让各部门预先理解设计，虽要多轮修改，却有望省去后期更昂贵的调整。它的作用是降低误解与风险，并非保证绝不延期。", "anchors": ["PDF p. 85–86"], "excerpts": []}], "argument_flow": ["说明文档应服务共同理解与可验证行为", "高保真原型是真实体验，不等于真实后台", "更早发现问题，才可能缩短上市时间"], "takeaways": ["“有原型”不等于说明完整，还需覆盖原型无法表达的规则与发布要求。"], "related_concepts": ["prototype", "spec", "validation"], "anchors": ["PDF p. 83–86"], "confidence": "high", "voice": "editor", "part": "流程"}, {"id": "ch-19", "title": "第19章 用户体验设计与实现", "question": "哪些工作可以并行，哪些应先验证再实施？", "role": "处理设计试错速度与生产开发稳定性的冲突。", "mainline": "需求研究与设计应相互影响，开发与测试可以交叉；作者却反对把关键体验设计留到生产开发同步试错。设计需要快速尝试并保持端到端连贯，工程需要据此做架构选择。其建议是让设计先行，同时让工程在探索中检查可行性，不能误读成隔离的部门接力。", "sections": [{"title": "过早开发让改变设计变得更昂贵", "detail": "架构和实现越深入，重做成本越高，还会打击士气。设计师一两天可尝试很多点子，用两到四周的工程迭代来逐个验证会拖慢学习；原型为可抛弃的试验对象，正式产品则承担持续运行的责任。", "anchors": ["PDF p. 87–88"], "excerpts": []}, {"title": "体验要整体连贯，不能按工程切片任意拼接", "detail": "生产工作可以拆成多次迭代，但用户仍经历完整流程。若开发等待设计、设计又被催促交差，就会出现仓促方案进入开发、改善永远推迟的循环。作者因此主张先形成足够完整的体验定义。", "anchors": ["PDF p. 88"], "excerpts": []}, {"title": "设计先行仍须工程早期参与", "detail": "书中提到第零次迭代，也允许后台基础设施与体验设计并行。至少一位开发人员应检查设计、比较成本和可行性。这里强调关键体验在承诺前得到验证，而不是主张设计人员独立猜完全部技术问题。", "anchors": ["PDF p. 88–89"], "excerpts": []}], "argument_flow": ["过早开发让改变设计变得更昂贵", "体验要整体连贯，不能按工程切片任意拼接", "设计先行仍须工程早期参与"], "takeaways": ["区分同一版本的探索与生产承诺，也保留设计与工程持续沟通。"], "related_concepts": ["discovery", "ux", "agile", "feasibility"], "anchors": ["PDF p. 87–89"], "confidence": "high", "voice": "editor", "part": "流程"}, {"id": "ch-20", "title": "第20章 基本产品", "question": "工期超出预期时，为何有些功能不能继续删？", "role": "给功能取舍设定“保持完整价值与体验”的底线。", "mainline": "基本产品不是最终功能大全，也不是任意砍掉功能后的残片，而是满足价值、可用性和可行性的最小完整方案。产品经理、设计师和工程在原型阶段共同压缩范围，再请真实用户验证。一旦已真正不可再减，估算偏差就不能靠破坏整体体验补救。", "sections": [{"title": "传统的末端砍功能容易破坏整体", "detail": "先写庞大需求、后估工期、再被迫删功能和压缩测试，常得到各方都不满意的拼凑产品。作者把问题追溯到定义流程，而不是把讨价还价当作天然合理的项目常态。", "anchors": ["PDF p. 90"], "excerpts": []}, {"title": "范围、成本与用户验证共同形成基本产品", "detail": "先设计实现商业目标所必需的功能及体验，让架构师比较直接、间接成本与不确定性，并由真实用户试用。不是产品经理觉得功能少就算基本产品，而是删去任何必需部分都会失去预期价值。", "anchors": ["PDF p. 90–91"], "excerpts": []}, {"title": "不可再删的判断本身需要证据", "detail": "作者认为若还可继续删，之前定义的就不是基本产品；若真正达到边界而估算偏差，只能延长工期。他不鼓励开发中随意改设计。编者提醒应重新检验“不可再删”假设，而不能把任何已写进文档的功能都宣布不可删。", "anchors": ["PDF p. 91"], "excerpts": []}], "argument_flow": ["传统的末端砍功能容易破坏整体", "范围、成本与用户验证共同形成基本产品", "不可再删的判断本身需要证据"], "takeaways": ["最小化的是复杂度和浪费，保留的是一项任务能完整成立的条件。"], "related_concepts": ["minimal-product", "prototype", "feasibility", "product-value"], "anchors": ["PDF p. 90–91"], "confidence": "high", "voice": "editor", "part": "流程"}, {"id": "ch-21", "title": "第21章 产品验证", "question": "怎样在全面开发前分别证明做得出、会使用、值得使用？", "role": "把探索结果转为三类互不替代的验证证据。", "mainline": "可行性测试由工程判断技术障碍，可用性测试观察真实用户完成任务，价值测试判断用户是否需要、喜欢并愿意采用方案。三类验证对应不同问题，不能用漂亮的演示或顺畅操作替代价值证据。原型要足够真实才能产生有效反馈，但不必实现完整生产后台。", "sections": [{"title": "先识别技术上的关键障碍", "detail": "架构师与开发人员寻找难以克服的限制，必要时开展技术调研。目的是在投入大量资金之前发现死路，比较可行方案；“理论上可以开发”仍需结合现有条件和具体技术风险判断。", "anchors": ["PDF p. 92"], "excerpts": []}, {"title": "会使用与愿意使用必须分别检查", "detail": "可用性关注用户能否理解、完成操作，价值关注功能是否值得用、实现方式是否令人满意，二者可使用同一原型测试。一个任务做得出来，并不意味着用户有动力从现有办法切换过来。", "anchors": ["PDF p. 92–93"], "excerpts": []}, {"title": "原型形式应匹配需要验证的体验", "detail": "复杂软件通常需要可交互的高保真模拟，简单产品也可能通过纸上方案验证。物理设备或软硬件结合也有相应原型。作者在此承认原型并非互联网服务唯一的验证方式；核心是别把首轮设计检验留到公开测试。", "anchors": ["PDF p. 93–94"], "excerpts": []}], "argument_flow": ["先识别技术上的关键障碍", "会使用与愿意使用必须分别检查", "原型形式应匹配需要验证的体验"], "takeaways": ["把三种“通过”分开记录，避免某一方面的成功遮住另一方面的失败。"], "related_concepts": ["validation", "feasibility", "usability", "product-value", "prototype"], "anchors": ["PDF p. 92–94"], "confidence": "high", "voice": "editor", "part": "流程"}, {"id": "ch-22", "title": "第22章 原型测试", "question": "怎样让真实用户的行为纠正产品创意，而不是为它背书？", "role": "全书最具体的实操章节，说明招募、准备、主持与迭代。", "mainline": "作者把原型测试定位为了解用户、检验产品创意的核心技能。先找到合适的用户，记录他们原来的解决办法与首次印象，再以关键任务观察可用性、以对比和追问理解价值。主持人需要克制提示和赞许，及时记录问题、修改原型，必要时放弃不能成立的创意。", "sections": [{"title": "招募真实目标用户，降低便利样本偏差", "detail": "特约用户、展会、用户邮件名单、网站志愿者和用户聚集地都可用于招募，但要筛选，避免全是科技从业者、亲密朋友或尝鲜者。可统一安排定期测试时段，向参与者表达感谢并确认预约；书中费用和爽约比例属于当时经验。", "anchors": ["PDF p. 95–97"], "excerpts": []}, {"title": "保留只能观察一次的初始反应", "detail": "先拟定关键任务；展示原型前，观察用户怎样用原有渠道解决问题，再看首页能否让他明白产品用途和价值。一旦介绍了产品，就无法重新获得完全陌生的第一印象。任务后再比较旧方案、推荐意愿和付费看法，记录变化。", "anchors": ["PDF p. 97–98"], "excerpts": []}, {"title": "环境与分工服务于真实观察", "detail": "办公室、咖啡馆或实验室都可测试，用户自己的场所还有环境信息。理想分工是一人主持、一人记录，但不必因设备不齐而停止。作者要求产品经理亲自观察，外部研究团队可以协助，却不能替代其理解细微犹豫的责任。", "anchors": ["PDF p. 98–99"], "excerpts": []}, {"title": "测试原型，不评判测试者", "detail": "简短寒暄后说明这不是正式产品，失败属于原型。少提示、少价值判断，必要时复述动作或问题而不告诉答案。记录独立完成、尝试后完成、放弃三类行为；别把让用户挑三处难看元素之类问题误当成任务测试。", "anchors": ["PDF p. 99–101"], "excerpts": []}, {"title": "根据重复障碍快速迭代，必要时停止", "detail": "两三人遇到相同问题就可修正，不必等全部人失败后才动手。作者用连续六位理解价值并完成关键任务作为经验性结束信号，不是统计充分性的保证。若一直无法激起兴趣或建立易用体验，停止创意能避免更大开发损失。", "anchors": ["PDF p. 101–102"], "excerpts": []}], "argument_flow": ["招募真实目标用户，降低便利样本偏差", "保留只能观察一次的初始反应", "环境与分工服务于真实观察", "测试原型，不评判测试者", "根据重复障碍快速迭代，必要时停止"], "takeaways": ["把提示次数、实际完成行为和真实兴趣分开记录，别只收集“挺好的”。"], "related_concepts": ["prototype-testing", "research", "usability", "product-value", "charter-users"], "anchors": ["PDF p. 95–102"], "confidence": "high", "voice": "editor", "part": "流程"}, {"id": "ch-23", "title": "第23章 改进现有产品", "question": "怎样避免把产品改进做成功能加工厂？", "role": "把上线后的改善转为围绕结果的研究与设计。", "mainline": "产品路线图不应只是用户要求与新增功能的排队表。作者用投保网站申请流程说明，应先确定业务目标和用户路径指标，找出阻碍，再选择能改变结果的设计。分析工具、测试、客服和销售意见、盈亏与NPS可以相互补充，而不能用添加功能的数量衡量改进。", "sections": [{"title": "先建立目标和路径基线", "detail": "投保网站要知道多少人进入申请、在哪页离开、是否因隐私信息而退出以及最后完成多少。把完成率从7%提升到15%在书中是示例目标，用来说明应对准可观察结果，而不是承诺所有产品有同样改善幅度。", "anchors": ["PDF p. 103"], "excerpts": []}, {"title": "从行为寻找原因，再选设计变化", "detail": "如果用户不确定是否应提供详细资料，应检查注册时机、信息要求和信任，而非直接再加一项功能。产品经理、设计、研究和工程共同提出改进可能性，并利用多种信息核对解释，避免对单个用户意见照单全收。", "anchors": ["PDF p. 103"], "excerpts": []}], "argument_flow": ["先建立目标和路径基线", "从行为寻找原因，再选设计变化"], "takeaways": ["以用户任务与业务目标的变化判断产品是否改善。"], "related_concepts": ["metrics", "research", "product-value", "nps"], "anchors": ["PDF p. 103"], "confidence": "high", "voice": "editor", "part": "流程"}, {"id": "ch-24", "title": "第24章 平滑部署", "question": "新版本更好，为什么老用户仍可能反感？", "role": "把迁移负担与使用习惯纳入发布设计。", "mainline": "用户期待改善，却未必愿意承受突然改版、学习成本、不兼容和连续更新。作者把审慎降低这些负面影响的更新称为平滑部署。提前通知只是一个环节，还要测试质量、安排新旧过渡、分区或增量发布，让用户能以可承受的节奏适应。", "sections": [{"title": "更新的成本由用户真实承担", "detail": "没有预告、没有适应时间、无法使用旧数据、强行改变熟悉流程，都会侵蚀信任。用户不喜欢变化不能被理解为不需要价值改善；产品团队要区分真正解决问题的变化与没有必要的打扰。", "anchors": ["PDF p. 105"], "excerpts": []}, {"title": "质量测试与过渡安排共同降低风险", "detail": "作者建议加强性能、可靠性、扩展性检查；大规模变化可先让自愿用户试用，逐渐把新版设为默认，保留旧版一段时间并说明支持期限。维护两个版本增加工程与运维负担，必须提前协调资源。", "anchors": ["PDF p. 106"], "excerpts": []}, {"title": "发布方式服务于适应，而非只服务于上线速度", "detail": "区域逐步部署或把更新拆成几个较小部分，也可减少影响范围。核心是预测副作用、保护用户信任，给用户时间消化改变；不是所有更新都必须采用相同的双版本安排。", "anchors": ["PDF p. 106–107"], "excerpts": []}], "argument_flow": ["更新的成本由用户真实承担", "质量测试与过渡安排共同降低风险", "发布方式服务于适应，而非只服务于上线速度"], "takeaways": ["把用户学习、数据兼容和运营负担写进发布方案。"], "related_concepts": ["release", "user-understanding", "headroom"], "anchors": ["PDF p. 105–107"], "confidence": "high", "voice": "editor", "part": "流程"}, {"id": "ch-25", "title": "第25章 快速响应阶段", "question": "发布后为什么不能立刻把团队撤去做下一个项目？", "role": "闭合验证—交付—反馈循环。", "mainline": "正式环境总会出现原型与测试无法完全预料的问题。发布后的几天至一周，应保留团队处理反馈，根据产品商业目标观察指标，及时判断轻重缓急。作者认为这是投入较小、学习回报很高的阶段，适用于网络、企业、平台和基础设施产品，但具体观察方式不同。", "sections": [{"title": "事先预留响应能力，而非出了事再找人", "detail": "如果发布就解散团队，修复会被推到下一周期，用户承担等待成本。作者建议所有项目成员保留数天到一周处理时间；该时长是起点建议，实际响应窗口仍应服从产品风险与使用周期。", "anchors": ["PDF p. 108"], "excerpts": []}, {"title": "指标必须对应产品的商业目标", "detail": "访问、注册、停留、转化、订阅和广告收益只是可选指标，应明确主次及什么结果代表成功。企业产品可以安排团队现场安装，网络产品可结合实时行为数据，尽早发现设计与真实使用环境的不一致。", "anchors": ["PDF p. 108–109"], "excerpts": []}, {"title": "短会决定问题优先级与处理方式", "detail": "产品、设计、工程、客服和营销至少每天简短同步，决定补丁、说明或其他解决办法。既看量化行为，也看留言、邮件、现场体验及合作伙伴反馈；关键不在宣称不会出问题，而在发现和处理有多快。", "anchors": ["PDF p. 109"], "excerpts": []}], "argument_flow": ["事先预留响应能力，而非出了事再找人", "指标必须对应产品的商业目标", "短会决定问题优先级与处理方式"], "takeaways": ["上线前就明确观察者、响应资源、成功标准和问题处理机制。"], "related_concepts": ["response", "metrics", "release", "validation"], "anchors": ["PDF p. 108–109"], "confidence": "high", "voice": "editor", "part": "流程"}, {"id": "ch-26", "title": "第26章 合理运用敏捷方法", "question": "敏捷能改善交付，为什么仍不能省略产品探索？", "role": "把产品定义与体验设计接入迭代开发。", "mainline": "作者支持敏捷带来的沟通、测试与短周期反馈，但反对把开发迭代当成唯一的产品设计验证。产品经理承担产品负责人责任，提前一到两个迭代与设计师探索方案，工程持续参与可行性评估，再自主切分实现。章节关于敏捷起源、定制软件人才和规模的概括属于作者的历史解释，应与可操作建议分开判断。", "sections": [{"title": "产品责任、规划与成功标准仍然存在", "detail": "产品经理不能以敏捷为由退出需求判断或把产品负责人另设成纯传话岗位。规划可以缩短、轻量化、反复调整，但仍须清楚方向与成功指标；机会评估用来替代沉重材料，不是取消思考。", "anchors": ["PDF p. 110"], "excerpts": []}, {"title": "让探索先行，让工程选择实现节奏", "detail": "设计与产品通常领先一到两个迭代，既形成可验证的整体体验，又避免拆得过碎。原型与用户故事说明行为，工程自行判断实现划分、质量、性能与扩展性。产品与设计参与晨会，沟通不是每天只发生那几分钟。", "anchors": ["PDF p. 110–111"], "excerpts": []}, {"title": "迭代完成不意味着必须公开发布", "detail": "产品经理应确保版本达到要求，并考虑频繁更新的用户负担；每轮展示结果和下一轮原型，配合团队培训。真实产品初期迭代虽能学习，但作者认为它通常比可抛弃原型慢、贵且难大改，不能用来回避探索。", "anchors": ["PDF p. 111–112"], "excerpts": []}, {"title": "保留作者论断的适用边界", "detail": "后半章将产品软件与定制软件作强烈对比，并担忧把简单重构思路直接用于大规模架构。这里是第一版的经验观点，不能据此断言所有定制项目都缺乏设计或所有敏捷实践都不重视架构。可迁移的核心是匹配实际产品风险。", "anchors": ["PDF p. 112–114"], "excerpts": []}], "argument_flow": ["产品责任、规划与成功标准仍然存在", "让探索先行，让工程选择实现节奏", "迭代完成不意味着必须公开发布", "保留作者论断的适用边界"], "takeaways": ["敏捷是一种交付与学习方式，不能替代“应该开发什么”的责任。"], "related_concepts": ["agile", "discovery", "prototype", "spec", "release"], "anchors": ["PDF p. 110–114"], "confidence": "high", "voice": "editor", "part": "流程"}, {"id": "ch-27", "title": "第27章 合理运用瀑布式开发方法", "question": "如果组织仍用阶段式流程，产品经理怎样减少其伤害？", "role": "说明方法约束下仍可提前验证与管理变化。", "mainline": "瀑布方法把需求、架构、细节、开发、测试和部署逐阶段评审，给管理层带来计划与文档的确定感。问题在于验证太晚、前期变更昂贵且难追市场。作者不只批评流程，也给出不得不用时的补救：在进入工程承诺前验证原型与可行性，发现错误尽早纠正。", "sections": [{"title": "理解阶段式流程为何吸引管理者", "detail": "在需求与技术确实清楚且稳定时，详细计划和阶段交付物能提供监督依据。但有文档不等于方案已被用户验证，材料带来的安心可能遮蔽真正的不确定性。", "anchors": ["PDF p. 115–116"], "excerpts": []}, {"title": "三种成本相互强化", "detail": "直到开发尾声才能测试可用性，会把产品错误发现得过晚；修改前期决定又需要重做，文档与审批开销则削弱市场响应。作者建议尽早解决新发现的问题，不能因为下一个版本存在就总是延期处理。", "anchors": ["PDF p. 116–117"], "excerpts": []}, {"title": "在既有流程中把验证提前", "detail": "产品经理仍可在探索期制作原型，请目标用户试用，并邀请工程检查技术风险。书中所谓先验证，不代表从此没有变更，而是减少在昂贵阶段才发现基础问题的概率。", "anchors": ["PDF p. 117"], "excerpts": []}], "argument_flow": ["理解阶段式流程为何吸引管理者", "三种成本相互强化", "在既有流程中把验证提前"], "takeaways": ["即便不能立即换流程，也能改变首次验证发生的时点。"], "related_concepts": ["waterfall", "validation", "prototype", "feasibility"], "anchors": ["PDF p. 115–117"], "confidence": "high", "voice": "editor", "part": "流程"}, {"id": "ch-28", "title": "第28章 创业型公司的产品管理", "question": "创业初期最该扩大的是开发队伍，还是对方案的理解？", "role": "把探索方法应用到资金有限的团队。", "mainline": "作者批评拿到资金就大规模招工程、由创始人在秘密状态下边想边改的模式：第一次真实检验太晚，资金已被生产开发消耗。他建议先确保产品管理、交互设计和原型制作三种工作有人做，以真实用户反复验证，再扩大实现投入。这不是保证几周一定找到市场，而是降低试错成本。", "sections": [{"title": "边做边猜可能耗尽生存时间", "detail": "创始人同时充当产品与设计，半年才有内部版本，之后继续补洞，外包若不改变流程也无法自动解救。作者把问题归到未先验证产品定义，而非简单归因于开发人员不够努力。", "anchors": ["PDF p. 118"], "excerpts": []}, {"title": "小团队先建立可测试方案", "detail": "三种职责可由少数人兼任：形成体验原型、邀请真实用户、反复修正。书中给出几周到两个月的经验时间，但不构成成功保证；前文已指出探索不可预测。验证后招募更多开发人员，可以让其面对清楚的行为与目标。", "anchors": ["PDF p. 118–119"], "excerpts": []}], "argument_flow": ["边做边猜可能耗尽生存时间", "小团队先建立可测试方案"], "takeaways": ["创业资源有限，更要先验证关键假设，再扩大不可逆的工程承诺。"], "related_concepts": ["discovery", "prototype", "charter-users", "business"], "anchors": ["PDF p. 118–119"], "confidence": "high", "voice": "editor", "part": "流程"}, {"id": "ch-29", "title": "第29章 大公司如何创新", "question": "规模大、流程多，是否就不能持续创新？", "role": "识别大组织的创新来源与支持条件。", "mainline": "大公司承担更大风险，因此倾向保守，但不意味着没有创新能力。作者从员工自主探索、低调原型研究、观察真实用户、改善体验和收购等路径讨论创新。其共同点不是追逐技术热词，而是让新的可能性解决长期未被满足的问题，并保留能推动它的人。", "sections": [{"title": "为员工创意保留资源", "detail": "20%法则鼓励普通员工而非只有高管提出想法。作者以惠普经历说明其价值，但这是个人案例与建议比例。受限条件下的“臭鼬工程”用小成果争取支持；应将它理解为书中做法，不把额外工时或绕过公司约定设为通行要求。", "anchors": ["PDF p. 120–121"], "excerpts": []}, {"title": "观察概念模型与实现模型的错位", "detail": "看用户何时欣喜、何时受挫，区分可运行与有用。功能删减、操作重组和更贴近用户思路的体验，本身就是创新机会。技术实现方便却让用户困惑，提示当前方案可能还没有解决真正问题。", "anchors": ["PDF p. 121–122"], "excerpts": []}, {"title": "收购也需要承接人才和持续关系", "detail": "收购可引入技术与创新型人员，但整合不善会消耗价值。作者建议平时就与创业公司合作、交流；创新来自文化和领导观念，也来自真实用户接触与员工探索的日常条件。", "anchors": ["PDF p. 122"], "excerpts": []}], "argument_flow": ["为员工创意保留资源", "观察概念模型与实现模型的错位", "收购也需要承接人才和持续关系"], "takeaways": ["为发现与验证新办法提供空间，创新不只发生在战略会议上。"], "related_concepts": ["innovation", "mental-model", "user-understanding", "headroom"], "anchors": ["PDF p. 120–122"], "confidence": "high", "voice": "editor", "part": "流程"}, {"id": "ch-30", "title": "第30章 在大公司施展拳脚", "question": "怎样把大公司的资源真正转成产品支持？", "role": "将组织现实转成可采取行动的协作策略。", "mainline": "风险规避与矩阵共享资源使大公司行动困难。作者建议先理解真实决策机制、建立关系、用原型争取资源，再有选择地争论、做会前沟通、分享信息和向上借力。最终目标是保护用于战略、原型和用户理解的时间，而不是在流程中表现得无限忙碌。", "sections": [{"title": "理解风险和决策权所在", "detail": "大公司出错的损失更大，共享设计、开发和运维资源也意味着竞争。看清谁决策、他认可什么证据，才能针对性准备原型、数据或用户承诺；了解现实不等于将内部政治置于用户价值之上。", "anchors": ["PDF p. 123"], "excerpts": []}, {"title": "平时建立关系，有成果再争取支持", "detail": "主动帮助各部门、交流产品，而不是有需求才找人。小型原型研究可帮助取得支持；资源缺口出现时适当补位。分歧须对事不对人、选择值得争取的关键问题，不能每件事都打成争夺输赢的战役。", "anchors": ["PDF p. 124"], "excerpts": []}, {"title": "把协调成本控制在产品目标之内", "detail": "会前沟通、删掉无关会议、信任同事、分享信息、向上司提供可靠材料以及持续传播愿景，是十条建议的后半部分。若所有时间都花在会议与邮件，最核心的产品工作反而无人推进，说明协作方式需要重审。", "anchors": ["PDF p. 124–125"], "excerpts": []}], "argument_flow": ["理解风险和决策权所在", "平时建立关系，有成果再争取支持", "把协调成本控制在产品目标之内"], "takeaways": ["用证据、人际信任和清楚目标争取支持，同时保护核心产品工作的时间。"], "related_concepts": ["influence", "innovation", "principles", "prototype"], "anchors": ["PDF p. 123–125"], "confidence": "high", "voice": "editor", "part": "流程"}, {"id": "ch-31", "title": "第31章 苹果公司给我的启示", "question": "为什么模仿苹果的硬件或营销，不一定复制其产品效果？", "role": "通过历史案例把技术、体验、情感与真实需求连起来。", "mainline": "作者从第一代iPhone时期观察苹果，提出四层关系：硬件服务软件、软件服务体验、体验服务情感、产品服务真实需求。他认为成功并非仅靠新技术与强营销，而是把已有领域中长期不佳的体验重新组织好。该章是作者的解释性案例，不是对苹果全部成功因素的实证分解。", "sections": [{"title": "技术选择应服从使用体验", "detail": "多点触控、传感器等不是孤立卖点，而应帮助软件完成用户需要的任务。作者强调资源长期投入交互、视觉和工业设计，并把软件是否好用置于硬件炫技之前。", "anchors": ["PDF p. 127–128"], "excerpts": []}, {"title": "情感吸引必须有实际需求承接", "detail": "语音邮件、地址簿、浏览与电子邮箱等长期痛点，为改进提供机会。情感上的喜爱与实际使用价值相连，不能只复制外形。价格、市场评价和竞品比较均属书中时代的案例，不当作今天的市场描述。", "anchors": ["PDF p. 128"], "excerpts": []}], "argument_flow": ["技术选择应服从使用体验", "情感吸引必须有实际需求承接"], "takeaways": ["分析成功产品时追问各项技术怎样服务任务和体验，而非只抄功能外观。"], "related_concepts": ["ux", "emotion", "innovation", "product-value"], "anchors": ["PDF p. 127–128"], "confidence": "high", "voice": "editor", "part": "产品"}, {"id": "ch-32", "title": "第32章 提防有特殊要求的产品", "question": "大客户带来收入，为什么其特殊功能仍可能伤害产品？", "role": "揭示合同收入、通用需求与长期机会成本的冲突。", "mainline": "特例产品以特定客户或广告伙伴的承诺换取功能或布局改变。作者担心它把个别解法误当成大众需求，消耗关键资源，并通过合同、版本和支持责任锁定未来。解决办法不是不听客户，而是重新理解问题，尝试通用方案或由合作方提供扩展，同时用产品原则评估取舍。", "sections": [{"title": "短期收入容易遮住全生命周期成本", "detail": "七个功能换大额订单的故事说明诱惑所在。特殊版本不仅开发一次，还需要测试、发布、文档、支持和未来维护；对一个客户负责的承诺可能阻碍对更多用户更有价值的调整。", "anchors": ["PDF p. 129–130"], "excerpts": []}, {"title": "先重述问题，再考虑通用能力与外部扩展", "detail": "客户往往说出的是办法，产品经理应一起追问本质。能够用通用能力解决就优先考虑；需要个性化时可以引入集成商，但要清楚约定接口与问题责任，避免客户不知道找谁。", "anchors": ["PDF p. 130"], "excerpts": []}, {"title": "广告合作也可能是一种特例", "detail": "为了合同牺牲服务目标和用户信任，可能带来短期访问或收入、长期却损害产品。作者不否定所有合作，主张设定能让用户、平台和广告伙伴共赢的方式，而不是对所有高价要求无条件妥协。", "anchors": ["PDF p. 130–131"], "excerpts": []}], "argument_flow": ["短期收入容易遮住全生命周期成本", "先重述问题，再考虑通用能力与外部扩展", "广告合作也可能是一种特例"], "takeaways": ["计算订单之外的维护与机会成本，再判断能否用通用方案满足真实问题。"], "related_concepts": ["specials", "principles", "business", "product-value"], "anchors": ["PDF p. 129–131"], "confidence": "high", "voice": "editor", "part": "产品"}, {"id": "ch-33", "title": "第33章 新瓶装老酒", "question": "成熟市场是否意味着没有新产品机会？", "role": "把创新从找新热点转回需求与技术的重新匹配。", "mainline": "作者认为很多成功产品没有发明全新的需求，而是在已有市场提供更好、更方便或更便宜的解法。Google与iPod是其历史例子。要进入成熟市场，既要理解现有产品哪里让用户失望，也要掌握技术让什么新方案成为可能；需求管理软件无法替代这种判断。", "sections": [{"title": "已有市场中的缺陷就是机会线索", "detail": "搜索和音乐播放器都在Google、iPod之前存在。作者强调不是“竞争者多就不做”，而是要比别人更准确地抓住未满足的问题；这也不意味着市场拥挤不会增加进入难度。", "anchors": ["PDF p. 132"], "excerpts": []}, {"title": "工具整理请求，不能自动形成产品", "detail": "需求管理软件可收集、跟踪和汇报用户意见，却可能强化“用户要求等于产品需求”的误区。作者倾向简单工具，批评的是把工具当成洞察的替代物，而不是所有复杂工具在任何团队都没有用途。", "anchors": ["PDF p. 133"], "excerpts": []}], "argument_flow": ["已有市场中的缺陷就是机会线索", "工具整理请求，不能自动形成产品"], "takeaways": ["成熟市场中的进入理由必须是可证明的体验与价值改进，不只是再做一份。"], "related_concepts": ["innovation", "problem-solution", "research"], "anchors": ["PDF p. 132–133"], "confidence": "high", "voice": "editor", "part": "产品"}, {"id": "ch-34", "title": "第34章 恐惧、贪婪、欲望", "question": "表面的功能请求背后，是什么在推动用户行动？", "role": "引入情感需求，并扩展对竞争替代的理解。", "mainline": "作者要求技术与经济背景的团队，从情感角度理解采用行为。企业客户可能关注风险与收益，个人用户可能寻求联结、成就和自我表达，同一产品的用户也会有不同动机。原型测试除了看会不会用，还要探索为什么需要；满足同一情感的线下活动也可能是竞争办法。", "sections": [{"title": "从功能名称追问驱动动机", "detail": "买安全软件可能为了避免损失，参与社交可能为了缓解孤独，展示照片可能关乎自豪。作者用强烈的情绪词提醒团队观察人，而不是把三种情绪当作穷尽全部需求的科学分类。", "anchors": ["PDF p. 134"], "excerpts": []}, {"title": "测试动机，重画竞争边界", "detail": "不同eBay买家可能偏好折扣、竞价刺激或其他价值。理解动机后，应问还有什么办法能满足同一需要；竞争者可能是线下生活方式，而不只是同类别网站。技术、既有应用和不满体验不断创造机会，属于作者对行业的判断。", "anchors": ["PDF p. 134–135"], "excerpts": []}], "argument_flow": ["从功能名称追问驱动动机", "测试动机，重画竞争边界"], "takeaways": ["同一个功能可能服务不同动机，竞争分析应围绕问题与动机而非产品分类。"], "related_concepts": ["emotion", "alternatives", "product-value", "prototype-testing"], "anchors": ["PDF p. 134–135"], "confidence": "high", "voice": "editor", "part": "产品"}, {"id": "ch-35", "title": "第35章 情感接纳曲线", "question": "最早使用产品的人，是因为爱技术还是迫切需要解决问题？", "role": "通过访谈补充技术接纳模型，改善早期用户判断。", "mainline": "本章是与杰夫·邦弗特的对话，主张按情感需求强度补充技术接纳分类。技术爱好者因新技术购买，强烈需求者则因不满、恐惧或孤独愿意付出高代价；后者可能更能提示大众需求，但大众要求更成熟、更实惠的体验。它是启发性访谈模型，不是由本书证明的普遍人群分布规律。", "sections": [{"title": "同样早采用，背后原因可能完全不同", "detail": "技术爱好者追逐技术本身，访谈所称“非理性消费者”则与大众有类似情感但强度更高，愿意忍受较大成本。理性、超理性消费者及观望者对成熟度和性价比要求不同；这些名称是书中用语，不是对用户的诊断或价值评判。", "anchors": ["PDF p. 136–138"], "excerpts": []}, {"title": "用强烈需求发现价值，再研究大众采用门槛", "detail": "环保车型、Skype等案例用于区别技术迷恋与问题驱动。不能按年龄性别简单推定动机，同一人在不同领域可能表现不同。即使早期强烈需求者愿意购买，也不能跳过对大众用户成本、可靠性和体验的验证。", "anchors": ["PDF p. 138–139"], "excerpts": []}, {"title": "以新生视角重新观察习以为常的不便", "detail": "访谈建议关注长期失望与不满，像刚进入新环境一样观察，不把糟糕服务当成正常。书中对视频通话需求弱等判断反映当时情境；正文保留为历史例子，不能借此预测今天相同技术的市场潜力。", "anchors": ["PDF p. 139–140"], "excerpts": []}], "argument_flow": ["同样早采用，背后原因可能完全不同", "用强烈需求发现价值，再研究大众采用门槛", "以新生视角重新观察习以为常的不便"], "takeaways": ["早期用户有多热情并不够，要知道他为何热情，以及哪些条件能让大众采用。"], "related_concepts": ["adoption", "emotion", "charter-users", "persona"], "anchors": ["PDF p. 136–140"], "confidence": "high", "voice": "editor", "part": "产品"}, {"id": "ch-36", "title": "第36章 可用性与美感", "question": "好操作和好看，能相互替代吗？", "role": "澄清交互与视觉的互补关系。", "mainline": "作者观察到视觉出色却难用、操作清楚却缺乏吸引力两种极端，认为它们分别暴露了交互与视觉能力的缺口。视觉设计能够回应情感，不只是表层装饰。产品经理、研究和工程还需共同照顾性能、广告干扰和缺陷，才能形成完整体验。", "sections": [{"title": "两种专业能力解决不同的问题", "detail": "交互组织任务、导航和流程，视觉传达信息、风格和情绪。招聘“一位设计师”不代表这两种能力自动齐备，尤其不能默认产品经理与界面工程会自然补上它们。", "anchors": ["PDF p. 141"], "excerpts": []}, {"title": "整体体验由更多条件共同决定", "detail": "相同功能的精致原型和粗糙线框可能引起不同反应，因此测试要意识到视觉呈现的影响。同时，速度慢、广告过多、漏洞等也会毁掉体验，不能以漂亮界面掩盖产品无法正常工作。", "anchors": ["PDF p. 141–142"], "excerpts": []}], "argument_flow": ["两种专业能力解决不同的问题", "整体体验由更多条件共同决定"], "takeaways": ["分别评估操作与情感呈现，并把它们放回真实任务、性能和质量条件中。"], "related_concepts": ["ux", "usability", "emotion", "prototype"], "anchors": ["PDF p. 141–142"], "confidence": "high", "voice": "editor", "part": "产品"}, {"id": "ch-37", "title": "第37章 大众网络服务产品", "question": "用户规模增长后，哪些问题会成为产品生存条件？", "role": "把探索方法延伸到规模化运营。", "mainline": "直接面对大量用户既便于获得反馈，也放大性能、停机、客服、隐私和版本变化的影响。作者以十项要点把用户体验、人物角色、扩展、持续运行、客服、隐私、推荐、全球化、部署和社区管理连接起来。成功不止是吸引第一批人，还要能持续可靠地服务他们。", "sections": [{"title": "规模要求体验与系统能力共同增长", "detail": "页面速度本身就是可用性。以人物角色理解众多用户，对新功能持续测试；扩展性需要产品、设计、开发和运维协作，尽早预留资源。20%建议再次出现，但与第29章员工创新时间不是同一件事。", "anchors": ["PDF p. 143–144"], "excerpts": []}, {"title": "可靠运行和用户信任影响长期生存", "detail": "故障会放大客服压力，保护资料、防止泄露则关系用户信任。书中隐私事件属于历史例子，本页不提供当代法律结论。作者主张从设计开始考虑持续服务，而不是用户增长后才被迫补救。", "anchors": ["PDF p. 144"], "excerpts": []}, {"title": "传播、全球化与更新都要尊重用户", "detail": "让推荐更容易，尽早考虑语言、货币与文化差异，通过平滑部署减少大规模变化的副作用，并认真对待社区成员的反馈。口碑来自有价值的可靠体验，而不是只有奖励与宣传动作。", "anchors": ["PDF p. 144–145"], "excerpts": []}], "argument_flow": ["规模要求体验与系统能力共同增长", "可靠运行和用户信任影响长期生存", "传播、全球化与更新都要尊重用户"], "takeaways": ["规模不是给原产品简单加服务器，而是把用户体验、运行和信任一起扩展。"], "related_concepts": ["headroom", "release", "persona", "trust", "nps"], "anchors": ["PDF p. 143–145"], "confidence": "high", "voice": "editor", "part": "产品"}, {"id": "ch-38", "title": "第38章 打造企业级产品的经验", "question": "付钱的人与使用的人不同，怎样仍把产品做好？", "role": "覆盖企业软件的多角色、渠道和交付全链路。", "mainline": "企业级软件容易因销售与采购主导而忽略真实使用者。作者以十条建议要求同时满足买方、最终用户、管理员和渠道，保证正常工作、易用、安装、配置、集成和升级。后半章区分可重复支持的专用解决方案与临时补丁，强调解决业务问题不等于为单一客户另造一套产品。", "sections": [{"title": "卖得出去不能替代正常工作与可用性", "detail": "采购者未必承担操作负担，最终用户却每天受影响。作者批评未经验证的体验和需要昂贵补丁才能运行的软件，同时要求用特约用户合作理解问题，拒绝被单笔特殊订单牵走产品方向。", "anchors": ["PDF p. 146–147"], "excerpts": []}, {"title": "多方价值贯穿安装到升级", "detail": "系统集成商、增值转售商、企业管理者、终端用户与管理员各有要求。安装、配置、自定义、集成、迁移和升级的复杂度会转成客户成本。产品团队不能因为“企业有专职IT”就把所有困难推给客户。", "anchors": ["PDF p. 147–148"], "excerpts": []}, {"title": "销售策略与可支持性也是产品的一部分", "detail": "作者希望利用互联网改进评估与销售，而非仅靠关系。合格产品须能服务多种环境，经渠道销售，得到持续支持，并让合作方和客户知道如何安装、配置和使用；这是作者的产品质量标准。", "anchors": ["PDF p. 148–149"], "excerpts": []}, {"title": "专用解决方案必须真正预先整合", "detail": "垂直业务方案可以由多家组件组成，但应预先集成，必要时通过伙伴认证，并能被多位客户使用。重新包装说明书或临时自定义脚本，不会自动成为完整方案；客户真正关心的是业务结果而非技术规格。", "anchors": ["PDF p. 149–150"], "excerpts": []}], "argument_flow": ["卖得出去不能替代正常工作与可用性", "多方价值贯穿安装到升级", "销售策略与可支持性也是产品的一部分", "专用解决方案必须真正预先整合"], "takeaways": ["把购买、使用、管理、部署和升级分别检查，不能只验证采购签字。"], "related_concepts": ["enterprise", "specials", "charter-users", "business", "usability"], "anchors": ["PDF p. 146–150"], "confidence": "high", "voice": "editor", "part": "产品"}, {"id": "ch-39", "title": "第39章 打造平台产品的经验", "question": "为开发者省事，是否一定让平台成功？", "role": "揭示平台三方需求及优先顺序的常见误判。", "mainline": "平台使应用供应商与开发者能在其上提供终端用户需要的应用，不是把半成品交给别人补完。供应商在意持续经营与商业支持，开发者在意效率和工具，终端用户在意结果。作者批评只倾听最接近自己的开发者，要求最终回到应用是否创造真实使用价值。", "sections": [{"title": "平台的判据是能支持真实应用运行", "detail": "操作系统、运行环境、Web服务和应用平台都是书中例子。没有有效接口、不能支持多个应用正常工作的产品，不能因自称平台就免除完整性责任。平台要面对三类相互依赖的客户。", "anchors": ["PDF p. 151"], "excerpts": []}, {"title": "三方需求互相依赖，也会发生冲突", "detail": "供应商关心平台存续、定价、质量、认证与支持；开发者关心语言、工具和便捷实现；终端用户关心有没有需要的功能及体验。最后一方最远、声音最小，却决定应用收入与平台价值能否持续。", "anchors": ["PDF p. 151–152"], "excerpts": []}, {"title": "不能让易开发成为牺牲终端体验的理由", "detail": "作者以客户端开发环境等历史例子说明，工程便利可能转嫁用户成本。这里不是主张故意让开发者痛苦，而是评估权衡。不同交付形式、定制与技术支持使平台管理更复杂；可持续生态依赖各方价值共同成立。", "anchors": ["PDF p. 152–153"], "excerpts": []}], "argument_flow": ["平台的判据是能支持真实应用运行", "三方需求互相依赖，也会发生冲突", "不能让易开发成为牺牲终端体验的理由"], "takeaways": ["同时验证开发者流程、供应商商业条件与终端用户结果。"], "related_concepts": ["platform", "enterprise", "product-value", "feasibility"], "anchors": ["PDF p. 151–153"], "confidence": "high", "voice": "editor", "part": "产品"}, {"id": "ch-40", "title": "第40章 最佳实践经验", "question": "前面分散的建议怎样组成一套工作系统？", "role": "以十项实践回收全书主线，而不是增加一套新方法。", "mainline": "作者重申产品管理职责、用户体验、机会评估、特约用户、产品原则、人物角色、产品探索、原型、用户测试及数据改善。十项不是互不相关的技巧：先明确问题和对象，合作设计并验证，再依据实际表现持续改进。它们共同防止产品经理只写文档、赶进度或堆功能。", "sections": [{"title": "前六项为探索建立人与判断条件", "detail": "清楚职责、重视体验、筛选机会、持续接触用户、建立取舍原则和关键角色，让团队知道为谁解决什么。仅拥有某张模板或某个岗位名，不代表这些条件已经成立。", "anchors": ["PDF p. 155"], "excerpts": []}, {"title": "后四项形成证据循环", "detail": "探索同时检查价值、可用与可行；高保真原型让思路具体且可测试；真实用户参与使反馈有效；上线后依数据改进，避免重新落入按要求加功能的惯性。总结应被用来检查实践缺口。", "anchors": ["PDF p. 155–156"], "excerpts": []}], "argument_flow": ["前六项为探索建立人与判断条件", "后四项形成证据循环"], "takeaways": ["把十项实践看作相互支撑的系统，找出当前最薄弱的一环。"], "related_concepts": ["product-management", "opportunity", "discovery", "validation", "metrics"], "anchors": ["PDF p. 终端用户优先不等于故意恶化开发体验；三方价值缺一仍可能失败。", "relations": [{"target_id": "charter-users", "label": "示范应用", "explanation": "约六个合作应用是作者的起步建议。"}, {"target_id": "product-value", "label": "最终检验", "explanation": "生态需落到终端任务与需求。"}, {"target_id": "feasibility", "label": "支持能力", "explanation": "接口与运行条件必须让应用实际成立。"}], "excerpts": [], "anchors": ["PDF p. 151–153"], "voice": "editor", "confidence": "medium"}], "formulations": [{"text": "产品经理的任务是探索产品的价值、可用性、可行性。", "commentary": "这是全书的基本任务定义，三者需要分别建立依据。", "anchors": ["PDF p. 7"], "verbatim": true, "voice": "author"}, {"text": "机会评估只讨论待解决的问题,不应涉及具体解决方案。", "commentary": "保留问题与解法的区别，能防止一个解法遇阻就丢弃好机会。", "anchors": ["PDF p. 55"], "verbatim": true, "voice": "author"}, {"text": "产品原则不是产品功能的清单", "commentary": "原则应指导多个功能与版本的取舍。", "anchors": ["PDF p. 63"], "verbatim": true, "voice": "author"}, {"text": "唯有理解用户需求的工作,产品经理不能推诿他人。", "commentary": "可以请人协助研究，却不能放弃自己的用户理解责任。", "anchors": ["PDF p. 75"], "verbatim": true, "voice": "author"}, {"text": "如果还能削减,那说明你定义的不是基本产品。", "commentary": "前提是已对必要性与完整价值作过验证，不是把所有初始功能冻结。", "anchors": ["PDF p. 91"], "verbatim": true, "voice": "author"}, {"text": "被测试的对象是原型,不是测试者", "commentary": "主持人应减少压力，使失败成为设计信息而非用户的过错。", "anchors": ["PDF p. 100"], "verbatim": true, "voice": "author"}, {"text": "关键不在于是否会出现问题,而在于能多快解决问题。", "commentary": "上线后需要预留响应能力，不能以已通过测试为由撤走全部资源。", "anchors": ["PDF p. 108"], "verbatim": true, "voice": "author"}, {"text": "创新不是发现新问题,而是用新方法解决已有的问题。", "commentary": "这是本书的创新立场，强调未满足需求与技术可能性的结合。", "anchors": ["PDF p. 121"], "verbatim": true, "voice": "author"}, {"text": "用户体验是产品立足之本。", "commentary": "在苹果案例中，体验连接技术能力、情感与实际需要。", "anchors": ["PDF p. 128"], "verbatim": true, "voice": "author"}], "critique": [{"title": "先保留第一版语境，再谈迁移", "analysis": "本地PDF版权页对应2008年英文版与2011年中文版，文件由calibre重新生成。产品示例、技术、价格、培训和工具评论都带有时代背景。本次只重构这一版，未把后续版的框架混入，也不把历史市场判断作为今天的事实。", "anchors": ["PDF p. 3、127–140、159"], "voice": "editor"}, {"title": "经验丰富，不等于因果证明完备", "analysis": "本书大量依据作者职业经历、公司案例与访谈，适合生成判断和实践假设；但没有给出系统样本、对照或各项实践的独立效应。因此“优秀公司这样做”支持借鉴，不足以证明只要组织照做就一定成功。", "anchors": ["PDF p. 4–6、17–19、120–122"], "voice": "editor"}, {"title": "负责人清楚，不等于产品经理能独自控制结果", "analysis": "第6章用“产品的CEO”与承担全部责任强调担当，第5章又强调工程平等，第7章要求管理者培养与授权。应把它读成不推诿定义责任，而非给没有资源决定权的人分配无限责任。招聘不能只奖励长工时或表达强势。", "anchors": ["PDF p. 23、30–33、39–43"], "voice": "editor"}, {"title": "早验证与开发稳定之间仍有张力", "analysis": "第12、19、20章主张先定义、减少开发变更，第27章又承认变化不可避免并主张尽早改。较忠实的解释是尽量前置可发现的风险，同时对新证据作清楚的成本与目标判断，不能把稳定承诺变成拒绝纠错。", "anchors": ["PDF p. 59–62、87–91、116–117"], "voice": "editor"}, {"title": "高保真是手段，证据问题才是起点", "analysis": "作者对高保真的推崇很强，但第21章仍承认简单产品可用纸上方案，且原型并非唯一验证方法。应根据未知与任务选择真实程度，不把制作漂亮原型当成已经完成探索。模拟后台也不能证明性能或规模。", "anchors": ["PDF p. 84、92–94"], "voice": "editor"}, {"title": "小样本能找障碍，不能保证整个市场", "analysis": "两三位遇到同类困难就改、连续六位通过就收尾，是第22章的实务建议。它有利于快速发现显著问题，却不能保证不存在其他用户问题、真实支付会发生或市场规模成立。特约用户还可能存在合作与选择偏差。", "anchors": ["PDF p. 71–74、96–101"], "voice": "editor"}, {"title": "20%与人数建议各有用途", "analysis": "技术余量、员工创新、特约用户数量、设计师配置及设计领先周期，是不同情境下的经验规则。尤其第15章后文对大众服务给出10–15人的例外。不能把数字抽成统一绩效标准，或将同一个20%同时许诺给多个用途。", "anchors": ["PDF p. 11、27–28、71–74、110–111、120、144"], "voice": "editor"}, {"title": "情感模型用于提问，不宜替人贴标签", "analysis": "第35章是访谈提出的补充框架，不是完成心理测量验证的分类系统。“非理性”等名称应保留为书中术语，理解重点在动机与强度。通过缓解真实困难创造价值，不应被改写成制造恐惧或刺激脆弱情绪的策略。", "anchors": ["PDF p. 134–140"], "voice": "editor"}, {"title": "NPS与结果指标要防止单项替代", "analysis": "作者自己已指出满意用户多也可能亏损，因此不能把NPS当作唯一经营或人员评价。完成率和收入的例子也需要检查使用人群与其他变化；本书没有充分展开实验因果、长期留存和测量偏差的系统方法。", "anchors": ["PDF p. 41–42、56–57、98、103"], "voice": "editor"}, {"title": "直接接触用户，也要约束确认偏误", "analysis": "作者要求产品经理亲自参加测试，理由是能理解细节；他也意识到设计者可能不客观。实践时可保留原始记录、少提示、邀请第二观察者，区分观察与解释。这里是对书中张力的编者建议，不是另一个由原书证明的实验方案。", "anchors": ["PDF p. 74–79、99–101"], "voice": "editor"}, {"title": "专业分工与资源紧缺应一起阅读", "analysis": "第2章强调专职定义，第28章又允许创始人与设计人员兼任角色；两者并非必须冲突。核心是工作有人承担、有时间和能力，而非任何规模都必须建立相同编制。部门独立也不是成功的充分条件。", "anchors": ["PDF p. 12–14、20–22、42–43、118–119"], "voice": "editor"}], "reality": [{"question": "我们现在是在解决问题，还是执行某个人指定的办法？", "application": "把当前最大的功能请求改写为目标用户、情境与障碍。请请求者确认，再比较其他办法；若不能说明为何值得做，应回到机会评估。", "anchors": ["PDF p. 45、54–56"], "related_concepts": ["problem-solution", "opportunity"], "voice": "editor"}, {"question": "用户会用，却没有继续用，是哪一项假设失败？", "application": "将任务可用性与需要程度分开。比较原有办法，追问实际采用理由；不要因一次操作顺利就宣称产品已验证。", "anchors": ["PDF p. 92–93、97–101"], "related_concepts": ["product-value", "usability", "alternatives"], "voice": "editor"}, {"question": "为什么开发总觉得需求在变？", "application": "检查是正常发现遗漏，还是关键体验从未验证；看原型和规则是否一致，再决定修正当前版本还是纳入下一版本。", "anchors": ["PDF p. 59–60、83–89"], "related_concepts": ["spec", "discovery", "prototype"], "voice": "editor"}, {"question": "大客户的订单究竟带来多少净价值？", "application": "除合同收入外列出特殊版本、测试、升级、技术支持及被推迟机会的成本，寻找通用能力和外部扩展方案。", "anchors": ["PDF p. 129–131、147–150"], "related_concepts": ["specials", "business", "principles"], "voice": "editor"}, {"question": "改版后投诉很多，真的是用户拒绝进步吗？", "application": "检查通知、数据兼容、学习负担、可靠性和旧版过渡。比较不同用户路径，而不是把所有抱怨视为不理性。", "anchors": ["PDF p. 105–107"], "related_concepts": ["release", "trust", "user-understanding"], "voice": "editor"}, {"question": "团队全速加功能，系统却越来越难改，谁应负责？", "application": "请工程说明容量、架构与维护风险，产品解释业务优先级，共同预留改善资源；避免等停工重写时才让工程独自背锅。", "anchors": ["PDF p. 27–28、143–144"], "related_concepts": ["headroom", "feasibility"], "voice": "editor"}, {"question": "企业客户满意，实际使用者为什么抱怨？", "application": "分别访问采购者、管理员和终端用户，走查安装、配置、真实工作和升级，检查销售验收是否掩盖使用成本。", "anchors": ["PDF p. 146–150"], "related_concepts": ["enterprise", "usability"], "voice": "editor"}, {"question": "开发者说平台好用，为什么应用没人用？", "application": "跟随一个真实应用看终端任务与结果，同时检查供应商商业支持、开发成本和终端体验，不只收集API意见。", "anchors": ["PDF p. 151–153"], "related_concepts": ["platform", "product-value", "charter-users"], "voice": "editor"}], "actions": [{"title": "完成一页机会评估", "trigger": "新创意、大订单或改版进入排期前", "steps": ["写清用户问题与目标人群，不先指定界面或技术。", "逐项回答十问，标明事实、假设和资料出处。", "粗分项目规模，并向决策者说明继续、修改或停止的理由。"], "signal": "团队能解释成功标准和当前最大的未知。", "review": "是否用功能描述冒充问题，是否忽视更好的旧产品改进机会？", "anchors": ["PDF p. 54–58"], "related_concepts": ["opportunity", "business"], "voice": "editor"}, {"title": "建立角色与决策责任图", "trigger": "需求、设计、进度和营销相互推诿时", "steps": ["列出机会、定义、研究、交互、视觉、原型、工程、发布和推广。", "为每项标出责任人、协作者与决策权限，允许兼任但检查时间能力。", "把无人负责的工作和资源缺口提交管理者处理。"], "signal": "定义与执行、推广的责任清楚，每种关键工作有承担者。", "review": "是否把头衔当能力，或让产品经理承担无资源权限的无限责任？", "anchors": ["PDF p. 9–22、39–43"], "related_concepts": ["product-management", "project-management", "marketing"], "voice": "editor"}, {"title": "用真实案例建立关键人物角色", "trigger": "多类用户导致功能无节制叠加时", "steps": ["接触实际使用者，记录任务、情境、已有办法和障碍。", "整理典型行为及目标，选本版本重点服务的人群。", "用一次功能取舍检验角色是否有用，并安排多样用户测试。"], "signal": "能说明哪些需求本轮优先、哪些暂不做。", "review": "角色是研究结果，还是先写结论再寻找支持？", "anchors": ["PDF p. 74–82"], "related_concepts": ["persona", "user-understanding"], "voice": "editor"}, {"title": "形成可取舍的产品原则", "trigger": "团队对安全、易用、速度或收入争执不下时", "steps": ["先确认问题、关键角色与本轮目标。", "把真正冲突的目标排序，写出具有产品特色的原则。", "用两个真实方案试判，并公开理由和例外。"], "signal": "原则能够排除一个看似有利却不合方向的选项。", "review": "是不是把所有目标都标为最重要？", "anchors": ["PDF p. 63–66"], "related_concepts": ["principles", "influence"], "voice": "editor"}, {"title": "制作最小完整体验原型", "trigger": "尚不清楚具体怎么做，却准备全面开发时", "steps": ["产品、设计和工程一起走查端到端任务，删掉非必要复杂度。", "用足够真实的页面与数据模拟关键体验。", "补上业务规则、异常、性能和交付要求，列出不能由原型证明的未知。"], "signal": "团队能理解同一方案，用户能真实尝试关键任务。", "review": "删减后价值是否仍完整，保真是否服务当前验证问题？", "anchors": ["PDF p. 83–94"], "related_concepts": ["prototype", "minimal-product", "spec"], "voice": "editor"}, {"title": "组织一轮中立原型测试", "trigger": "关键体验与价值尚依靠团队信念时", "steps": ["招募合适用户，写好任务与问题；测试前先观察现有解决办法。", "说明测试的是原型，少介绍、少提示，分别记录行为与解释。", "区分独立完成、尝试完成和放弃；任务后比较价值与替代。", "出现重复障碍及时修改，再找新用户验证；无法成立时建议停止。"], "signal": "发现并修正具体问题，而不是只获得赞许。", "review": "提示或关系是否污染反馈，早期用户是否代表目标需求？", "anchors": ["PDF p. 95–102"], "related_concepts": ["prototype-testing", "usability", "product-value"], "voice": "editor"}, {"title": "给投资评审准备阶段证据", "trigger": "机会、开发或发布决定反复拉扯时", "steps": ["明确当前是哪一道里程碑，不跨阶段要求不存在的信息。", "机会阶段给问题与粗规模，开发前给原型、测试、风险与详细估算。", "指定决定与条件，保留依据，并约定上市后的结果回看。"], "signal": "关键决定及时作出，同时保留产品团队的设计责任。", "review": "评审是否变成界面讨论或无依据的精确工期承诺？", "anchors": ["PDF p. 67–70"], "related_concepts": ["council", "validation"], "voice": "editor"}, {"title": "安排平滑部署与快速响应", "trigger": "会影响既有习惯或大量用户的版本即将发布", "steps": ["走查学习、兼容、质量与运维影响，选择合适的过渡方式。", "清楚通知变化和旧版期限，先测试再逐步扩大。", "预留发布后团队，确定目标指标与反馈来源，短会分配问题。"], "signal": "用户可适应，问题能被及时识别、归属和处理。", "review": "是否只完成了上线，却没有准备迁移和真实反馈？", "anchors": ["PDF p. 105–109"], "related_concepts": ["release", "response", "trust"], "voice": "editor"}, {"title": "用结果改进已有流程", "trigger": "路线图只剩新增功能列表时", "steps": ["选一个关键任务，记录路径基线和业务目标。", "结合行为数据、用户测试、客服及财务解释障碍。", "选择针对原因的改动，记录前后结果和仍可能的其他解释。"], "signal": "改进能回到完成行为与业务效果，而非仅上线数量。", "review": "是否将同时变化误当作因果，是否牺牲长期体验换短期数字？", "anchors": ["PDF p. 56–58、103"], "related_concepts": ["metrics", "research", "nps"], "voice": "editor"}, {"title": "为技术演进保留真实资源", "trigger": "容量紧张、维护积压或工程提出重写时", "steps": ["请工程解释当前限制、增长风险与最低改善工作。", "共同安排持续重构和容量准备；书中20%作讨论起点，不照抄。", "如需重建，尽量分块并保留用户可见改进，重新检验估算。"], "signal": "风险被持续处理，产品交付不再完全依赖临时救火。", "review": "是否把技术余量与员工创新时间重复计算？", "anchors": ["PDF p. 27–28、144"], "related_concepts": ["headroom", "feasibility"], "voice": "editor"}, {"title": "分别检验企业或平台的多方价值", "trigger": "采购、开发者与使用者不一致时", "steps": ["企业产品分别列采购、使用、管理员与渠道任务；平台再列供应商和应用开发者。", "跟随真实工作从安装或开发走到终端使用。", "记录每方价值与成本，检查通用支持、升级和责任接口。"], "signal": "不只中间人认可，终端用户也得到可重复交付的价值。", "review": "是否因最响亮或直接付费的角色而忽略远端用户？", "anchors": ["PDF p. 146–153"], "related_concepts": ["enterprise", "platform", "business"], "voice": "editor"}, {"title": "用反省清单做证据复盘", "trigger": "版本结束、用户变化或竞争加剧时", "steps": ["回看第40章的十项实践，找目前缺失的一环。", "逐项讨论第41章的吸引力、易用、竞争、用户、差异、运行、完整性、匹配、价格和共识。", "每项记录证据、未知与一个下一步，不以勾选全部完成结案。"], "signal": "反省转成明确的验证或改进行动。", "review": "我们讨论的是实际产品，还是想象中的理想产品？", "anchors": ["PDF p. 155–157"], "related_concepts": ["validation", "metrics", "influence"], "voice": "editor"}], "glossary": [{"term": "产品管理", "definition": "评估机会，并对产品定义的整体质量负责。", "anchors": ["PDF p. 9–14"], "related_concepts": ["product-management"], "voice": "editor"}, {"term": "产品机会评估", "definition": "在选方案前判断一个问题是否值得投入。", "anchors": ["PDF p. 54–58"], "related_concepts": ["opportunity"], "voice": "editor"}, {"term": "问题与解决方案", "definition": "用户提出的办法，不必等于最合适的产品要求。", "anchors": ["PDF p. 45–46、54–56、129–130"], "related_concepts": ["problem-solution"], "voice": "editor"}, {"term": "产品价值", "definition": "目标用户对产品的需要、认可和采用意愿。", "anchors": ["PDF p. 4、10、92–93、134–135、146–149"], "related_concepts": ["product-value"], "voice": "editor"}, {"term": "可用性", "definition": "用户能否明白如何使用，并完成关键任务。", "anchors": ["PDF p. 10、92–93、99–101、143–144"], "related_concepts": ["usability"], "voice": "editor"}, {"term": "可行性", "definition": "在现有技术与实际条件下，方案能否实现。", "anchors": ["PDF p. 23–24、69–70、89–93"], "related_concepts": ["feasibility"], "voice": "editor"}, {"term": "用户体验设计", "definition": "把功能、流程、视觉与情感组织成实际体验。", "anchors": ["PDF p. 20–22、83–89、141–148"], "related_concepts": ["ux"], "voice": "editor"}, {"term": "高保真原型", "definition": "足够真实地模拟体验，用于理解、沟通与验证。", "anchors": ["PDF p. 22、83–94"], "related_concepts": ["prototype"], "voice": "editor"}, {"term": "产品说明", "definition": "以原型为主体，辅以规则、质量要求和决策记录。", "anchors": ["PDF p. 83–86"], "related_concepts": ["spec"], "voice": "editor"}, {"term": "产品探索", "definition": "在全面开发前寻找并验证正确方案。", "anchors": ["PDF p. 59–62、87–91、118–119"], "related_concepts": ["discovery"], "voice": "editor"}, {"term": "产品验证", "definition": "分别检验价值、可用性与可行性。", "anchors": ["PDF p. 92–94、108–109"], "related_concepts": ["validation"], "voice": "editor"}, {"term": "基本产品", "definition": "满足目标的最小完整方案，不能任意割裂。", "anchors": ["PDF p. 90–91"], "related_concepts": ["minimal-product"], "voice": "editor"}, {"term": "理解真实用户", "definition": "亲自理解使用情境、行为、目标与困难。", "anchors": ["PDF p. 29–30、74–79、95–101"], "related_concepts": ["user-understanding"], "voice": "editor"}, {"term": "市场与用户研究", "definition": "提供理解用户的证据，不能代替产品设计判断。", "anchors": ["PDF p. 76–79"], "related_concepts": ["research"], "voice": "editor"}, {"term": "产品人物角色", "definition": "基于研究的典型用户行为、态度与目标模型。", "anchors": ["PDF p. 80–82"], "related_concepts": ["persona"], "voice": "editor"}, {"term": "特约用户", "definition": "从项目开始持续合作的目标用户伙伴。", "anchors": ["PDF p. 71–75"], "related_concepts": ["charter-users"], "voice": "editor"}, {"term": "原型测试", "definition": "观察用户的真实行动，检验体验与价值假设。", "anchors": ["PDF p. 95–102"], "related_concepts": ["prototype-testing"], "voice": "editor"}, {"term": "产品原则", "definition": "用于真实取舍的、有优先顺序的价值准则。", "anchors": ["PDF p. 63–66、129–130"], "related_concepts": ["principles"], "voice": "editor"}, {"term": "产品评审团", "definition": "跨部门根据阶段证据决定产品投资与发布。", "anchors": ["PDF p. 67–70"], "related_concepts": ["council"], "voice": "editor"}, {"term": "产品指标与结果改进", "definition": "从目标出发观察效果，而不是用功能数衡量工作。", "anchors": ["PDF p. 56–58、103、108–109"], "related_concepts": ["metrics"], "voice": "editor"}, {"term": "用户净推荐值 NPS", "definition": "推荐者比例减去贬损者比例的态度指标。", "anchors": ["PDF p. 41–42、98"], "related_concepts": ["nps"], "voice": "editor"}, {"term": "产品经济性与商业条件", "definition": "用户价值需要与渠道、成本、收益及持续支持相容。", "anchors": ["PDF p. 54–58、129–130、147–153"], "related_concepts": ["business"], "voice": "editor"}, {"term": "技术余量", "definition": "为增长、维护和演进保留容量与工程资源。", "anchors": ["PDF p. 27–28、143–144"], "related_concepts": ["headroom"], "voice": "editor"}, {"term": "平滑部署", "definition": "把新版本作为用户迁移过程来设计。", "anchors": ["PDF p. 105–107、145"], "related_concepts": ["release"], "voice": "editor"}, {"term": "快速响应", "definition": "发布后保留团队，及时处理真实使用反馈。", "anchors": ["PDF p. 108–109"], "related_concepts": ["response"], "voice": "editor"}, {"term": "项目管理", "definition": "统筹依赖、推进决策并按计划交付。", "anchors": ["PDF p. 16–19"], "related_concepts": ["project-management"], "voice": "editor"}, {"term": "产品营销", "definition": "向市场传达价值，支持渠道、发布与销售。", "anchors": ["PDF p. 12–14"], "related_concepts": ["marketing"], "voice": "editor"}, {"term": "无直接权力的产品影响力", "definition": "通过信任、共同目标与证据促成合作。", "anchors": ["PDF p. 31–34、39–43、50–51、123–125"], "related_concepts": ["influence"], "voice": "editor"}, {"term": "产品环境中的敏捷", "definition": "短周期交付仍需产品探索、设计和发布判断。", "anchors": ["PDF p. 110–114"], "related_concepts": ["agile"], "voice": "editor"}, {"term": "瀑布式开发", "definition": "以顺序阶段和阶段评审组织开发。", "anchors": ["PDF p. 115–117"], "related_concepts": ["waterfall"], "voice": "editor"}, {"term": "创新", "definition": "利用新的办法更好地解决已有需要。", "anchors": ["PDF p. 120–122、132–135"], "related_concepts": ["innovation"], "voice": "editor"}, {"term": "概念模型与实现模型", "definition": "用户理解问题的方式，可能不同于系统实现的方式。", "anchors": ["PDF p. 7、121–122"], "related_concepts": ["mental-model"], "voice": "editor"}, {"term": "情感需求", "definition": "安全、收益、联结和自我表达等动机影响采用。", "anchors": ["PDF p. 127–140"], "related_concepts": ["emotion"], "voice": "editor"}, {"term": "情感接纳与采用动机", "definition": "早期采用者可能追技术，也可能被真实问题强烈驱动。", "anchors": ["PDF p. 136–140"], "related_concepts": ["adoption"], "voice": "editor"}, {"term": "竞争与替代办法", "definition": "满足同一问题或情感的现有途径。", "anchors": ["PDF p. 97–98、134–135"], "related_concepts": ["alternatives"], "voice": "editor"}, {"term": "特例产品", "definition": "因单个客户或伙伴承诺而产生的特殊版本或要求。", "anchors": ["PDF p. 129–131、147"], "related_concepts": ["specials"], "voice": "editor"}, {"term": "用户信任与持续服务", "definition": "通过可靠运行、尊重资料和审慎变化维护关系。", "anchors": ["PDF p. 41–42、105–109、143–145"], "related_concepts": ["trust"], "voice": "editor"}, {"term": "企业级产品", "definition": "同时满足购买、使用、管理及渠道的多方需求。", "anchors": ["PDF p. 146–150"], "related_concepts": ["enterprise"], "voice": "editor"}, {"term": "平台产品", "definition": "支持他人开发应用并向终端用户交付价值的基础软件。", "anchors": ["PDF p. 151–153"], "related_concepts": ["platform"], "voice": "editor"}], "notes": ["版本：原英文版权2008年，中文译本版权2011年；版权页印刷信息为2011年6月第1版第2次印刷。PDF元数据中的2026年日期为文件生成信息，不作为出版日期。", "页码统一使用PDF页序（1–161），不冒充重排版电子书中的纸质页码。绿色出处可打开同目录上一级原PDF并定位到对应页；定位效果取决于本地PDF阅读器。", "本页是经过分析的原创重构，不是全文转载。9条短引逐条匹配源页；兼容汉字经NFKC规范化，换行合并。原始文本与规范化文本都保存在work/pages.json。", "逐章释义忠实重构作者主张；核心概念的因素、关系和观察方法属于编者跨章整理。批判、现实问题和行动清单明确标为编者分析。", "第41章第7、8项有源文件排版串行；相关解读按上下文释义，未伪造修复引文。全文另有零散错字和专名误识，未以不确定文字作为逐字引文。", "没有访问或购买外部书籍、网站或培训，也没有补入后续版框架；外部推荐资源仅按本文件记载。"]}</script>
<script>
const D=JSON.parse(document.getElementById('book-data').textContent);let mode='read',readPosition=0;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const sourceHref=a=>{const m=String(a).match(/PDF p\.\s*(\d+)/);return m?`${D.meta.source_file}#page=${m[1]}`:null};
const arr=v=>Array.isArray(v)?v:[],anchors=v=>arr(v).map(x=>sourceHref(x)?`<a class="tag anchor" target="_blank" rel="noopener" href="${esc(sourceHref(x))}">原文 ${esc(x)} ↗</a>`:`<span class="tag anchor">${esc(x)}</span>`).join('');
const voice=v=>v==='editor'?'<span class="tag editor">编者分析</span>':v==='external'?'<span class="tag">外部资料</span>':'';
const list=(items,cls='detail-list')=>arr(items).length?`<ul class="${cls}">${arr(items).map(x=>`<li>${esc(typeof x==='string'?x:x.detail||x.name)}</li>`).join('')}</ul>`:'';
const excerpts=items=>arr(items).map(x=>`<blockquote class="excerpt">“${esc(x.text)}”<br>${anchors([x.anchor])}</blockquote>`).join('');
const card=(x,body='')=>`<article class="card searchable"><h3>${esc(x.title||x.question||x.term)}</h3>${body}${arr(x.related_concepts).length?relationButtons(x.related_concepts):''}${voice(x.voice)}${anchors(x.anchors)}</article>`;
const section=(id,kicker,title,sub,body,m,open=false)=>`<section id="${id}" data-mode-section="${m}" class="mode-section"><button class="section-toggle" aria-expanded="${open}" aria-controls="${id}-body"><span class="section-heading"><span class="section-kicker">${kicker}</span><span class="section-title">${title}</span><span class="section-sub">${sub}</span></span><span class="chevron" aria-hidden="true">＋</span></button><div class="section-body" id="${id}-body" ${open?'':'hidden'}>${body||'<p class="empty">本书未设置此部分。</p>'}</div></section>`;
function relationButtons(ids){return `<div class="relation-list">${arr(ids).map(id=>{const c=arr(D.concepts).find(x=>x.id===id);return c?`<button class="concept-link" data-concept-target="${esc(id)}">${esc(c.title)}</button>`:''}).join('')}</div>`}
function chapter(x,i){const parts=arr(x.sections).map(s=>`<details class="subargument searchable"><summary>${esc(s.title)}</summary><div class="subargument-content"><p>${esc(s.detail)}</p>${excerpts(s.excerpts)}${anchors(s.anchors)}<div class="source-note">依据原书释义 · 非全文转载</div></div></details>`).join('');const flow=arr(x.argument_flow).length?`<div class="argument-flow">${x.argument_flow.map((s,j)=>`${j?'<span class="flow-arrow">→</span>':''}<span class="flow-step">${esc(s)}</span>`).join('')}</div>`:'';return `<article class="fold chapter searchable" id="${esc(x.id)}"><button class="fold-toggle" aria-expanded="${i===0}" aria-controls="${esc(x.id)}-body"><span class="fold-no">${String(i+1).padStart(2,'0')}</span><span><span class="fold-title">${esc(x.title)}</span><span class="fold-role">${esc(x.role)}</span></span><span class="chevron" aria-hidden="true">＋</span></button><div class="fold-body" id="${esc(x.id)}-body" ${i===0?'':'hidden'}>${x.question?`<p class="chapter-question"><b>本章回答：</b>${esc(x.question)}</p>`:''}<p class="mainline"><b>本章主线：</b>${esc(x.mainline||x.summary)}</p>${flow}${parts}${arr(x.takeaways).length?`<h4>读完应留下什么</h4>${list(x.takeaways)}`:''}${arr(x.related_concepts).length?`<div class="concept-block"><h4>相关概念</h4>${relationButtons(x.related_concepts)}</div>`:''}<span class="tag editor">依据原书重构</span><span class="confidence">依据强度：${esc(x.confidence||'未标注')}</span>${anchors(x.anchors)}</div></article>`}
function concept(x){const factors=arr(x.factors).map(f=>`<li><b>${esc(f.name)}：</b>${esc(f.detail)} ${anchors(f.anchors)}</li>`).join('');const relations=arr(x.relations).map(r=>{const t=arr(D.concepts).find(c=>c.id===r.target_id);return `<div><button class="concept-link" data-concept-target="${esc(r.target_id)}">${esc(r.label||'关联')}：${esc(t?.title||r.target_id)}</button><p>${esc(r.explanation)}</p></div>`}).join('');return `<article class="card concept searchable" id="concept-${esc(x.id)}"><button class="fold-toggle" aria-expanded="false" aria-controls="concept-${esc(x.id)}-body"><span><span class="fold-title">${esc(x.title)}</span><span class="fold-role">${esc(x.one_line)}</span></span><span class="chevron" aria-hidden="true">＋</span></button><div class="fold-body" id="concept-${esc(x.id)}-body" hidden><p>${esc(x.explanation)}</p>${factors?`<div class="concept-block"><h4>影响因素</h4><ul>${factors}</ul></div>`:''}${arr(x.effects).length?`<div class="concept-block"><h4>它会影响什么</h4>${list(x.effects)}</div>`:''}${arr(x.observables).length?`<div class="concept-block"><h4>如何观察或使用</h4>${list(x.observables)}</div>`:''}${x.boundary?`<div class="concept-block"><h4>边界</h4><p>${esc(x.boundary)}</p></div>`:''}${relations?`<div class="concept-block"><h4>概念关系</h4>${relations}</div>`:x.connection?`<div class="concept-block"><h4>概念关系</h4><p>${esc(x.connection)}</p></div>`:''}${excerpts(x.excerpts)}${voice(x.voice)}${anchors(x.anchors)}<div class="confidence">置信度：${esc(x.confidence||'未标注')}</div></div></article>`}
function render(){
document.documentElement.style.setProperty('--accent',D.meta?.theme?.accent||'#9E2A24');
$('#bookMeta').innerHTML=`<h1>${esc(D.meta.title)}</h1><p>${esc(D.meta.author)}${D.meta.edition?' · '+esc(D.meta.edition):''}</p><span class="coverage">${D.meta.coverage==='complete'?'完整覆盖':'部分覆盖'}</span>`;
const o=D.orientation||{};let html=`<div class="scope-notice"><strong>161页 · 41章完整分析</strong><p>基于第一版逐章重构，保留原文出处、适用边界与可跳转概念。</p><p><a class="source-link" href="#coverage" id="scopeLink">查看版本与逐页覆盖 ↓</a></p></div>`;html+=`<div class="hero searchable"><div class="eyebrow">${esc(o.eyebrow||`${D.meta.author} · 深度蒸馏`)}</div><h2>${esc(D.meta.title)}</h2><p class="lead">${esc(o.thesis)}</p><div class="orientation-grid"><article><b>本书解决什么问题</b><p>${esc(o.problem)}</p></article><article><b>适合谁与如何阅读</b><p>${esc(o.reader||'希望建立完整知识骨架的读者')}</p><p>${esc(o.how_to_read||'先顺序阅读，再进入深度探究。')}</p></article></div></div>`;
html+=section('coverage','阅读','版本与阅读覆盖','逐页处理记录与文本质量说明。',`<p>${esc(D.meta.coverage_note)}</p><div class="stats"><span class="stat">${D.meta.source_pages}页已处理</span><span class="stat">${D.chapters.length}章</span><span class="stat">${D.chapters.reduce((n,c)=>n+arr(c.sections).length,0)}个细分论证</span><span class="stat">${D.concepts.length}个概念</span><span class="stat">${D.concepts.reduce((n,c)=>n+arr(c.relations).length,0)}条概念关系</span></div><p>原英文版权2008年；中文2011年版。此PDF为电子重排，全部出处采用PDF页序。第41章第7、8项的串行仅作释义，不作原文引用。</p><details><summary>展开161页处理台账</summary><div class="table-wrap"><table class="scope-table"><thead><tr><th>范围</th><th>状态</th><th>说明</th></tr></thead><tbody>${arr(D.coverage_map).map(r=>`<tr><td>${anchors([r.range])}</td><td>${esc(({read:'已处理',excluded:'不作论证证据'})[r.status]||r.status)}</td><td>${esc(r.notes)}</td></tr>`).join('')}</tbody></table></div></details>`,'read');
html+=section('overview','阅读','全书速览','点击标题展开或收起完整知识骨架。',`<div class="card-grid">${arr(D.overview).map(x=>card(x,`<p><b>${esc(x.summary)}</b></p>${list(x.details)}`)).join('')}</div>`,'read',true);
html+=section('chapters','阅读','逐章解读','41章与121个细分论证均可独立展开，按人员、流程、产品、总结顺序阅读。',`<label class="chapter-picker">跳至章节 <select id="chapterJump" aria-label="跳至章节"><option value="">选择章节…</option>${D.chapters.map(c=>`<option value="${esc(c.id)}">${esc(c.part)} · ${esc(c.title)}</option>`).join('')}</select></label>`+arr(D.chapters).map(chapter).join(''),'read',true);
html+=section('concepts','深度探究','核心概念','展开概念查看定义、影响因素、结果、边界和可跳转关系。',`<div class="card-grid">${arr(D.concepts).map(concept).join('')}</div>`,'explore',true);
html+=section('formulations','深度探究','金句与关键表述','短引文保留作者措辞，同时提供语境解释和出处。',`<div class="card-grid">${arr(D.formulations).map(x=>card({title:x.verbatim?'原文短引':'关键表述',anchors:x.anchors},`<p class="quote">${esc(x.text)}</p><p>${esc(x.commentary)}</p>`)).join('')}</div>`,'explore');
html+=section('critique','深度探究','批判与评价','检验论证、边界与隐含前提。',`<div class="card-grid">${arr(D.critique).map(x=>card(x,`<p>${esc(x.analysis)}</p>`)).join('')}</div>`,'explore');
html+=section('reality','深度探究','现实问题','把书中的洞见转成可观察的问题。',`<div class="card-grid">${arr(D.reality).map(x=>card(x,`<p>${esc(x.application)}</p>`)).join('')}</div>`,'explore');
html+=section('actions','深度探究','行动清单','从理解走向实践，并留下复盘信号。',`<div class="card-grid">${arr(D.actions).map(x=>card(x,`<p><b>触发：</b>${esc(x.trigger)}</p><ol>${arr(x.steps).map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p><b>观察信号：</b>${esc(x.signal)}</p><p><b>复盘：</b>${esc(x.review)}</p>`)).join('')}</div>`,'explore');
html+=section('glossary','深度探究','术语表','按本书语境解释关键词。',`<div class="card-grid">${arr(D.glossary).map(x=>card(x,`<p>${esc(x.definition)}</p>`)).join('')}</div>`,'explore');
html+=section('notes','阅读','来源与编者说明','版本、引文、文本问题与声音区分。',list(D.notes),'read');html+=`<div class="footer">本地离线阅读 · 以原书为据，保留独立思考</div>`;$('#content').innerHTML=html;bindAccordions();bindConceptLinks();setMode(mode);$('#chapterJump').onchange=e=>{const target=document.getElementById(e.target.value);if(target){openAncestors(target);target.scrollIntoView({block:'start',behavior:'instant'})}};$('#scopeLink').onclick=e=>{e.preventDefault();setMode('read');const s=$('#coverage');toggle(s.querySelector('.section-toggle'),true);s.scrollIntoView({block:'start'})}}
function toggle(button,open){button.setAttribute('aria-expanded',String(open));const body=document.getElementById(button.getAttribute('aria-controls'));if(body)body.hidden=!open}
function bindAccordions(){document.querySelectorAll('.section-toggle,.fold-toggle').forEach(b=>b.onclick=()=>toggle(b,b.getAttribute('aria-expanded')!=='true'))}
function setMode(next){if(mode==='read'&&next!=='read')readPosition=scrollY;mode=next;$('#backRead').hidden=mode==='read';document.querySelectorAll('[data-mode-button]').forEach(x=>{x.classList.toggle('active',x.dataset.modeButton===mode);x.setAttribute('aria-selected',String(x.dataset.modeButton===mode))});document.querySelectorAll('[data-mode-section]').forEach(x=>x.classList.toggle('hidden',x.dataset.modeSection!==mode));buildNav()}
function openAncestors(el){let ancestor=el;while(ancestor){if(ancestor.tagName==='DETAILS')ancestor.open=true;ancestor=ancestor.parentElement}const sectionEl=el.closest('.mode-section');if(sectionEl){const b=sectionEl.querySelector(':scope > .section-toggle');toggle(b,true)}const fold=el.closest('.fold');if(fold){const b=fold.querySelector(':scope > .fold-toggle');toggle(b,true)}if(el.classList.contains('concept')){const b=el.querySelector(':scope > .fold-toggle');toggle(b,true)}}
function goConcept(id){setMode('explore');const target=document.getElementById(`concept-${id}`);if(!target)return;openAncestors(target);target.classList.add('search-hit');target.scrollIntoView({block:'start',behavior:'instant'});setTimeout(()=>target.classList.remove('search-hit'),1500)}
function bindConceptLinks(){document.querySelectorAll('[data-concept-target]').forEach(b=>b.onclick=e=>{e.stopPropagation();goConcept(b.dataset.conceptTarget)})}
function buildNav(){const items=[...document.querySelectorAll(`.mode-section[data-mode-section="${mode}"]`)];$('#nav').innerHTML=`<div class="nav-group"><p class="nav-label">${mode==='read'?'顺序阅读':'跳转探究'}</p>${items.map(x=>`<button class="nav-link" data-target="${x.id}">${esc(x.querySelector('.section-title').textContent)}</button>${x.id==='chapters'?D.chapters.map(c=>`<button class="nav-link unit-link" data-target="${esc(c.id)}">${esc(c.title)}</button>`).join(''):''}`).join('')}</div>`;document.querySelectorAll('.nav-link').forEach(b=>b.onclick=()=>{const s=document.getElementById(b.dataset.target);{const b=s.querySelector(':scope > .section-toggle');if(b)toggle(b,true);openAncestors(s)};s.scrollIntoView()})}
document.querySelectorAll('[data-mode-button]').forEach(b=>b.onclick=()=>{const next=b.dataset.modeButton;setMode(next);scrollTo({top:next==='read'?readPosition:0,behavior:'instant'})});
$('#backRead').onclick=()=>{setMode('read');scrollTo({top:readPosition,behavior:'instant'})};
$('#expandAll').onclick=()=>{document.querySelectorAll('.mode-section:not(.hidden) .section-toggle,.mode-section:not(.hidden) .fold-toggle').forEach(b=>toggle(b,true));document.querySelectorAll('.mode-section:not(.hidden) details').forEach(x=>x.open=true)};
$('#collapseAll').onclick=()=>{document.querySelectorAll('.mode-section:not(.hidden) .section-toggle,.mode-section:not(.hidden) .fold-toggle').forEach(b=>toggle(b,false));document.querySelectorAll('.mode-section:not(.hidden) details').forEach(x=>x.open=false)};
let searchHits=[],searchIndex=0;
function revealSearchHit(){document.querySelectorAll('.search-hit').forEach(x=>x.classList.remove('search-hit'));if(!searchHits.length)return;const hit=searchHits[searchIndex];const sectionEl=hit.closest('.mode-section');if(sectionEl&&sectionEl.dataset.modeSection!==mode)setMode(sectionEl.dataset.modeSection);openAncestors(hit);hit.classList.add('search-hit');hit.scrollIntoView({block:'start',behavior:'instant'});$('#searchStatus').textContent=`${searchIndex+1}/${searchHits.length}处 · 回车下一处`}
$('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.search-hit').forEach(x=>x.classList.remove('search-hit'));searchHits=[];searchIndex=0;if(!q){$('#searchStatus').textContent='';return;}searchHits=[...document.querySelectorAll('.subargument,.concept,.card:not(.concept),.mainline,.chapter-question,.chapter > .fold-toggle,.hero')].filter(x=>x.textContent.toLowerCase().includes(q));if(searchHits.length)revealSearchHit();else $('#searchStatus').textContent='未找到匹配内容';});
$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'&&searchHits.length){e.preventDefault();searchIndex=(searchIndex+(e.shiftKey?-1:1)+searchHits.length)%searchHits.length;revealSearchHit();}});
window.addEventListener('beforeprint',()=>document.querySelectorAll('details').forEach(x=>{x.dataset.printOpen=String(x.open);x.open=true}));window.addEventListener('afterprint',()=>document.querySelectorAll('details').forEach(x=>{x.open=x.dataset.printOpen==='true'}));
window.addEventListener('scroll',()=>{$('#progress').style.width=(100*scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight))+'%'});$('#toTop').onclick=()=>scrollTo({top:0,behavior:'smooth'});render();const headerObserver=new ResizeObserver(()=>document.documentElement.style.setProperty('--header-height',$('.topbar').getBoundingClientRect().height+'px'));headerObserver.observe($('.topbar'));window.addEventListener('scroll',()=>$('#toTop').classList.toggle('shown',scrollY>500));
</script></body></html>
