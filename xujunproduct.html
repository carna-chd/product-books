<script id="book-data" type="application/json">{"meta": {"title": "俞军产品方法论", "author": "俞军等", "edition": "2020年1月第1版", "source_file": "俞军产品方法论.pdf", "coverage": "complete", "coverage_note": "已逐页处理 PDF 1-317页：正文第4-8章、附录第9章、推荐序、序言和目录均纳入覆盖台账；少量图片页以相邻正文和页面视觉核对。", "generated_at": "2026-10-22", "theme": {"accent": "#9E2A24"}}, "orientation": {"eyebrow": "俞军等 · 产品经理 · 用户价值与交易", "thesis": "企业以产品为媒介与用户交换价值；产品经理的核心工作，是在真实约束中理解用户选择、设计可持续交易，并提高关键产品决策的质量。", "problem": "当用户诉求、商业目标、组织分工和资源约束相互冲突时，产品经理怎样看清价值从哪里产生、用户为什么选择，以及企业为什么值得投入？", "reader": "已经遇到需求冲突、资源取舍、商业价值或职业成长瓶颈的产品从业者。", "how_to_read": "先展开“全书速览”理解价值交换总线，再按第4-8章顺序阅读；附录用于观察方法论如何从搜索实践逐步演化。遇到术语时，可直接跳到深度探究中的概念节点。"}, "coverage_map": [{"range": "PDF p. 1-15", "chapter_id": "frontmatter", "status": "read", "quality": "medium", "notes": "封面、推荐序、序言与目录；个别推荐语页面存在字体提取错位。"}, {"range": "PDF p. 16-36", "chapter_id": "ch-04-role", "status": "read", "quality": "high", "notes": "第4章，产品经理的历史、互联网条件、四项职能、用户模型与交易模型。"}, {"range": "PDF p. 37-86", "chapter_id": "ch-05-enterprise-user-product", "status": "read", "quality": "high", "notes": "第5章，企业、用户与产品的价值交换关系。"}, {"range": "PDF p. 87-135", "chapter_id": "ch-06-transaction", "status": "read", "quality": "high", "notes": "第6章，交易、效用、边际、成本、供需和相对价格。"}, {"range": "PDF p. 136-182", "chapter_id": "ch-07-decision", "status": "read", "quality": "high", "notes": "第7章，理性决策、认知偏误、落地方法与滴滴案例。"}, {"range": "PDF p. 183-248", "chapter_id": "ch-08-growth", "status": "read", "quality": "high", "notes": "第8章，产品经理的选拔、能力、成长和职业选择。"}, {"range": "PDF p. 249-312", "chapter_id": "ch-09-appendix", "status": "read", "quality": "medium", "notes": "第9章附录，含历史文档、访谈、讲座和回顾材料；扫描截图页结合标题与相邻正文核对。"}, {"range": "PDF p. 313-317", "chapter_id": "toc", "status": "read", "quality": "high", "notes": "全书目录复核。"}], "overview": [{"id": "arc-value-exchange", "title": "价值交换是方法论的总入口", "summary": "序言没有把产品只定义成界面、功能或需求集合，而是把它放进企业与用户的交换关系中。", "details": ["用户一侧要判断新方案相对旧方案是否产生足够净价值；新体验只是收益的一部分，旧体验的既有价值和迁移阻力同样参与选择。", "企业一侧不能只问用户喜不喜欢，还要判断交换能否带来收入、增长、效率或其他组织价值，并覆盖持续供给产品的成本。", "产品经理位于两侧之间：把用户的选择条件翻译成产品决策，同时把企业约束带回方案设计；交易模型进一步回答多方利益怎样创造、分配并保持可持续。"], "related_concepts": ["user-value", "user-choice", "enterprise-transaction"], "anchors": ["PDF p. 5-9"]}, {"id": "arc-role-evolution", "title": "产品经理的价值随产业稀缺资源迁移", "summary": "同一个岗位名称在消费品、软件和互联网阶段承担的主要问题不同，原因是生产、分发、反馈和协作条件发生了变化。", "details": ["消费品阶段，跨部门资源分散且品牌缺少单一负责人，岗位价值首先表现为协调定位、营销、渠道和结果责任。", "软件阶段，产品复杂、生产周期长、客户需求需要转译，产品经理更靠近需求分析、生产协调和交付。", "互联网阶段，复制和分发成本下降、用户规模扩大、反馈加快，试验与迭代成为可能，于是理解用户和提高决策质量变得更重要。", "因此不能只按职位名称理解产品经理，应该先问：当前组织最稀缺、最影响结果的能力是什么？"], "related_concepts": ["division-value"], "anchors": ["PDF p. 16-36"]}, {"id": "arc-user-model", "title": "用户模型解释行为，交易模型设计可持续关系", "summary": "本书把产品经理的成长分成两个相连的里程碑：先能较准确地预判用户行为，再能设计多方都愿意持续参与的利益机制。", "details": ["用户不是自然人标签，而是特定情境中的需求集合；行为由认知、偏好、情境刺激和预期效用共同塑造，并被结果反馈持续修正。", "交易模型不止描述一次买卖，而是回答利从何来、利往何去，怎样降低交易成本并保持多边利益平衡。", "用户模型是理解一方行为的基础，交易模型要求把用户、企业、供给方、平台和受影响第三方放进同一系统。"], "related_concepts": ["user-model", "transaction-model", "utility"], "anchors": ["PDF p. 33-36", "PDF p. 43-59", "PDF p. 89-101"]}, {"id": "arc-decision-growth", "title": "方法论最终服务于决策质量与长期成长", "summary": "书的后半部分把经济学概念收束为决策方法，再把决策能力落实到产品经理的选拔、培养、岗位匹配和职业发展。", "details": ["理性决策先检查信念与目标，再寻找行动方案；产品经理的核心不是产出更多方案，而是在多方冲突中做权衡。", "数据、逻辑和主观判断各有适用题型；认知偏误、组织决策人和落地能力都会改变最终结果。", "产品经理的能力依赖实践机会、用户模型、交易模型、批判性思维、人文关怀与实践精神，不能仅用年限和职级衡量。"], "related_concepts": ["rational-decision", "product-manager-value", "product-manager-growth"], "anchors": ["PDF p. 138-182", "PDF p. 183-248"]}], "chapters": [{"id": "sample-preface", "title": "序言：方法论从冲突、约束与选择中产生", "question": "产品经理为什么需要经济学、心理学和一套可验证的方法，而不能只依赖流程与经验？", "role": "界定本书要处理的问题、观察产品的基本视角，以及方法论不能替代具体判断的边界。", "mainline": "序言把产品工作描述成约束下的决策活动。用户不是抽象的“需求集合”，而是在旧方案、新方案、迁移成本和风险之间做选择；企业也不是无条件满足需求，而是通过产品寻求可持续的价值交换。经济学帮助分析选择、激励和约束，心理学帮助理解人的异质性与情境性。方法论的意义是提高看问题和做判断的质量，但任何结论都必须回到具体用户、具体企业和具体阶段中验证。", "argument_flow": ["产品工作存在冲突与取舍", "用户和企业都在约束中选择", "引入经济学与心理学解释行为", "形成用户模型与交易视角", "用实践证据修正判断"], "sections": [{"title": "产品是企业与用户发生交换的媒介", "detail": "作者先把产品放回交换关系中：用户投入时间、金钱、注意力或数据，企业投入研发、运营、服务和机会成本。产品是否成立，取决于双方是否都获得足以继续交换的价值。这个视角把“功能有没有做出来”改写成“为什么双方愿意持续参与”。", "excerpts": [{"text": "企业以产品为媒介，与用户进行价值交换", "anchor": "PDF p. 9"}], "anchors": ["PDF p. 8-10"]}, {"title": "用户价值来自相对比较，而不是孤立体验", "detail": "推荐序给出的公式强调，用户面对新产品时会带着现有方案进行比较。即使新体验本身不错，只要旧体验仍有较高价值，或切换需要学习、迁移、重新建立信任并承担失败风险，用户仍可能不选择新产品。产品经理要找的是足以改变选择的净改善。", "excerpts": [{"text": "用户价值=新体验-旧体验-替换成本", "anchor": "PDF p. 5"}], "anchors": ["PDF p. 5-7"]}, {"title": "方法论提供判断工具，但不直接替代决策", "detail": "书中强调产品决策有情境性。同一套理论在用户群体、竞争状态、公司阶段和资源条件变化后，可能导向不同结论。理论的作用是提出更好的问题、暴露被忽略的变量并组织证据；真正的决策仍要接受实践结果检验。", "excerpts": [{"text": "产品是约束条件下的效用组合", "anchor": "PDF p. 7"}], "anchors": ["PDF p. 7-10"]}, {"title": "交流记录显示：低试错成本仍有现实边界", "detail": "相关交流以出行产品为例提醒，互联网产品虽然可以快速迭代，但实验会影响真实的人和利益关系。发布成本低不等于社会成本低；当变化涉及安全、生计或不可逆后果时，产品判断必须把受影响者与外部性纳入约束。", "excerpts": [], "anchors": ["PDF p. 11-12"]}], "takeaways": ["产品工作首先是价值判断与选择问题，原型和流程只是表达与执行工具。", "分析用户采用时，要同时写出新体验、旧体验和替换成本。", "分析企业投入时，要说明企业得到什么、付出什么，以及交换为什么能够持续。", "理论结论必须标明适用条件，并用用户行为和交易结果验证。"], "related_concepts": ["user-value", "user-choice", "switching-cost", "enterprise-transaction"], "anchors": ["PDF p. 5-12"], "confidence": "high"}, {"id": "ch-04-role", "title": "什么是产品经理：岗位随稀缺资源迁移", "question": "为什么消费品、软件和互联网公司都叫“产品经理”，实际工作却差别很大？", "role": "通过职业史说明岗位价值不是固定职责清单，而是对当时最重要的协作与决策问题进行专业化分工。", "mainline": "章节从宝洁的品牌实践切入：当研发、生产、销售等部门各自按本部门目标行动时，新品牌没有人对整体结果负责，设置单一负责人可以降低跨部门协调损耗。进入软件时代，产品复杂性和交付周期使需求转译与生产协调成为主要瓶颈。互联网又改变了复制、分发、反馈和迭代条件，产品经理的重心继续向用户研究、快速验证和产品决策迁移。作者借这段历史说明，理解岗位不能背职责清单，而要识别当前产业和组织中最稀缺的能力。", "argument_flow": ["分工造成局部目标", "单一负责人弥补整体责任缺口", "软件复杂性提高需求与交付协调价值", "互联网降低复制与反馈成本", "岗位重心转向用户理解和决策"], "sections": [{"title": "消费品阶段：为一个品牌建立整体责任", "detail": "卡玫尔香皂案例说明，职能部门可能都完成了各自任务，却没有人持续整合定位、生产、渠道与销售结果。品牌负责人不是简单增加一层流程，而是把原本分散的目标集中到一个可追责的决策单元中。", "excerpts": [], "anchors": ["PDF p. 17-18"]}, {"title": "软件阶段：把客户语言转译为可生产、可交付的方案", "detail": "软件产品包含更多抽象逻辑与复杂协作，需求理解错误会在长周期生产中放大。产品经理需要在客户、研发和商业目标之间翻译，管理范围与优先级，并帮助团队按时交付能够解决问题的版本。", "excerpts": [], "anchors": ["PDF p. 19-21"]}, {"title": "互联网阶段：反馈速度改变决策方式", "detail": "信息复制分发的边际成本下降、大用户量、快速迭代、数据和AB测试共同降低了入行门槛，也把产品经理的能力上限推向理解用户与交易。体验价值变大源于用户选择权、口碑传播和规模乘数，但好体验只是降低部分交易成本，并非产品全部。", "excerpts": [], "anchors": ["PDF p. 20-28"]}, {"title": "四项职能：需求、生产、销售与协调", "detail": "产品经理对市场结果负责，要根据阶段在四项职能间分配注意力。需求决定满足谁、解决什么；生产把判断转成可交付方案；销售促成用户使用或购买；协调让分工后的组织共同完成目标。互联网早期最能决定生死的常是需求判断。", "excerpts": [], "anchors": ["PDF p. 29-31"]}, {"title": "用户模型是合格线，交易模型是进阶路线", "detail": "产品工作属于强实践性的社会科学，结论受人的异质性与情境性约束。用户模型要求通过大量真实样本预判行为；交易模型进一步理解多方价值、交易费用和利益分配，建立有效用、有利润、可持续的互惠结构。", "excerpts": [{"text": "企业与用户交换的从来不是产品，而是价值", "anchor": "PDF p. 36"}], "anchors": ["PDF p. 31-36"]}, {"title": "岗位定义应从当前瓶颈反推", "detail": "职业史的实际用途，是反过来审视今天的团队：若最大损失来自跨部门割裂，产品经理要强化整体责任；若来自错误理解用户，要强化研究与验证；若来自商业闭环不成立，就要回到交易模型。岗位价值来自解决真实瓶颈，而不是覆盖更多流程。", "excerpts": [], "anchors": ["PDF p. 17-36"]}], "takeaways": ["产品经理的长期价值来自专业化分工能否提高组织总收益。", "职位名称相同，不代表工作对象、约束和成功标准相同。", "快速迭代降低单次发布与反馈成本，但不能自动提高决策质量。", "定义岗位职责前，应先定位团队当前最大的结果瓶颈。"], "related_concepts": ["division-value", "user-model", "transaction-model"], "anchors": ["PDF p. 16-36"], "confidence": "high"}, {"id": "ch-05-enterprise-user-product", "title": "企业、用户、产品：用价值交换统一两端", "question": "用户价值与商业价值怎样同时成立，企业究竟通过产品交换什么？", "role": "建立全书的三方框架，并分别解释用户、产品与企业，为交易模型提供对象和边界。", "mainline": "企业有选择地创造有利可图的用户价值，以产品为媒介与用户交换。用户不是自然人数量，而是特定情境中的需求集合；其行为由认知、偏好、情境、期望效用和经验反馈形成。产品是约束条件下的效用组合，必须同时具备有效用、有利润、可持续。企业则依靠发现市场机会、内部组织效率和共同知识生存，并在长期中平衡用户价值、商业价值、社会责任与制度约束。", "argument_flow": ["三方价值交换", "用户行为机制", "主观用户价值", "产品效用组合", "企业效率与持续", "广义交易"], "sections": [{"title": "用户是需求集合，并具有五种属性", "detail": "自然人统计会掩盖需求份额。书中按异质性、情境性、可塑性、自利性和有限理性理解用户；同一个人在不同场景可能属于不同产品。行为由情境刺激调用认知与偏好，经感知、解读、选择集合、模拟推演、价值判断形成预期效用，结果又反过来修正认知。", "excerpts": [{"text": "用户不是自然人，而是需求的集合", "anchor": "PDF p. 43"}], "anchors": ["PDF p. 43-50"]}, {"title": "用户价值是主观效用，并随认知、情境和经验演化", "detail": "价值由使用者的主观效用评价定义，不由产品物理属性直接决定。分析必须落到特定情境中的个体样本，再形成分布模型。相对价格变化会改变资源配置与行为；用户价值公式给出三条路径：增强新体验、选择旧体验更弱的参照、降低替换成本。", "excerpts": [], "anchors": ["PDF p. 51-56"]}, {"title": "产品是可交易的解决方案与效用组合", "detail": "企业外部和内部都可把交付物理解为产品。好产品要有效用、有利润、可持续；用户付出的不止钱，还包括时间、身体和心理成本、数据、态度与承诺。分析产品要追问利从何来、利往何去，而不是停在功能表面。", "excerpts": [{"text": "一个好产品应该有三个属性：有效用，有利润，可持续", "anchor": "PDF p. 58"}], "anchors": ["PDF p. 57-59"]}, {"title": "企业靠市场机会、组织效率和共同知识持续", "detail": "企业通过洞察、试错与偶然性发现获利机会，并以权威、专业知识和内部规则把组织生产效率提高到市场之上。共同目标、理念、知识和运行机制决定组织效率；发展创造新价值，生存则要求没有致命短板。企业做产品还积累认知、团队与无形资产。", "excerpts": [], "anchors": ["PDF p. 60-74"]}, {"title": "创造价值与交换价值必须在长期中统一", "detail": "使用价值让产品有用，交换价值使企业能获得回报。劳动、分工、交易、新技术和制度是五条价值创造路径；技术只有进入产品并形成交易才实现大规模价值。大型互联网企业还承担公共影响，伦理、外部规则和社会博弈成为可持续约束。", "excerpts": [], "anchors": ["PDF p. 69-81"]}, {"title": "将产品看作交易", "detail": "任何有意识行为都可理解为付出预期代价购买预期收益。用户侧要求效用大于直接成本与交易成本；企业侧要求广义收益大于生产成本与交易成本。双方都获益、且长期可持续，交换才会继续。", "excerpts": [], "anchors": ["PDF p. 82-86"]}], "takeaways": ["不要把用户等同于注册人数，要按需求份额和场景分析。", "用户价值与商业价值不是天平两端，而是可持续交易的两面。", "功能只是效用载体；企业真正设计的是价值创造和利益分配。"], "related_concepts": ["user-model", "user-value", "utility", "enterprise-transaction", "transaction-model"], "anchors": ["PDF p. 37-86"], "confidence": "high"}, {"id": "ch-06-transaction", "title": "交易：用效用、成本、边际与供需设计产品", "question": "怎样把抽象的价值交换拆成可分析、可设计的产品机制？", "role": "提供全书的经济学工具箱，并把交易模型落实到效用组合、交易成本与相对价格。", "mainline": "交易发生是因为双方都主观判断所得大于所失，因此交换创造价值。交易模型要同时设计利益创造与利益分配，使多边参与者的个体最优行为与系统可持续目标相容。产品经理可用效用识别用户真正购买的价值，用边际判断追加投入，用机会成本比较被放弃方案，用交易成本寻找阻断行为的摩擦，再用供需和相对价格解释需求变化。", "argument_flow": ["交换创造价值", "多边交易模型", "效用组合", "边际投入产出", "交易成本", "供需与相对价格"], "sections": [{"title": "交易不是等价交换，而是双方主观增益", "detail": "名义价格相等不代表主观价值相等。买方认为所得效用高于支付及机会成本，卖方认为收入高于直接成本与交易成本，交易才发生。交易模型由此回答利从何来、利往何去，并通过激励相容让个人选择支持整体目标。", "excerpts": [{"text": "交易创造价值", "anchor": "PDF p. 93"}], "anchors": ["PDF p. 89-101"]}, {"title": "效用是欲望的满足程度，并且多样、主观、无限", "detail": "用户购买的可能是货币、时间、身体、情绪、信念、认知、尊重或归属等效用。产品效用应区分底线需求、够用就好、越多越好和惊喜：守住一票否决项，把边际递减项做到合适，重点投入高回报效用。", "excerpts": [], "anchors": ["PDF p. 102-113"]}, {"title": "边际决定再多做一点是否划算", "detail": "边际效用会递减，边际成本可能先降后升，边际利润取决于新增一笔交易带来的收入与成本。固定成本高、边际成本低的业务和每单边际成本高的业务，增长、定价与供给策略完全不同。", "excerpts": [], "anchors": ["PDF p. 114-117"]}, {"title": "交易成本是双方付出却没有被对方收到的价值", "detail": "除直接价格与生产成本外，搜寻、度量、议价、决策、实施和保障都会消耗资源。信息不对称、不确定、不完整且有获取成本，是产品侧的主要来源。标准化、线上化、评价体系、确定性与可信承诺都可能降低交易成本并释放原本无法发生的交易。", "excerpts": [], "anchors": ["PDF p. 118-131"]}, {"title": "相对价格连接效用、直接成本与交易成本", "detail": "供需定律必须在其他条件不变时使用。书中进一步提出相对价格=(直接成本+交易成本)/效用组合：增加效用或降低任一成本都会降低相对价格，从而扩大需求。成熟红海产品可围绕边际用户被哪种摩擦阻断来寻找增长。", "excerpts": [{"text": "相对价格=（直接成本+交易成本）/效用组合", "anchor": "PDF p. 134"}], "anchors": ["PDF p. 132-135"]}], "takeaways": ["先定义交换各方、所得、所失和机会成本，再讨论功能。", "降低交易成本既能替代旧交易，也能创造原来不成立的新交易。", "增长可以来自新增效用，也可以来自降低用户完成交易的相对价格。"], "related_concepts": ["transaction-model", "utility", "transaction-cost", "relative-price", "enterprise-transaction"], "anchors": ["PDF p. 87-135"], "confidence": "high"}, {"id": "ch-07-decision", "title": "决策：从理性信念到可落地的权衡", "question": "在信息不全、用户冲突和未来不确定时，产品经理怎样提高决策质量？", "role": "把前述用户模型和交易工具用于真实选择，并展示平台规则的多方权衡。", "mainline": "理性决策不只是在既定目标下找方案，而要先反思自己对世界的认知，再检验目标是否仍然理性，最后才选择行动。产品经理要列出可能性、模拟推演结果、比较跨效用与跨期价值，并警惕数据局限和认知偏误。决策只有被组织接受并实施才产生业务价值；滴滴案例进一步说明，真实产品问题往往是公平、效率、安全、成本和多方权利之间的动态平衡。", "argument_flow": ["反思信念", "校准目标", "生成备选", "价值与概率权衡", "识别偏误", "推动落地", "用结果反馈迭代"], "sections": [{"title": "理性决策的三要素：信念、目标、行动", "detail": "人受信息搜寻成本、处理能力、禀赋偏好和环境不确定性限制。决策先问认知有多完整、可能有何偏误，再问目标是否仍应追求，最后才在可行方案中找最优行动。产品经理的核心是权衡系统，而不是堆方案或创意。", "excerpts": [{"text": "产品经理是做权衡的", "anchor": "PDF p. 141"}], "anchors": ["PDF p. 138-147"]}, {"title": "三类决策方法各有适用题型", "detail": "数据适合低成本重复实验，却可能受指标和历史样本限制；逻辑决策要在对方认知结构内建立论证；主观判断用于缺少数据的复杂问题，需要提取关键变量，调用用户模型与交易模型进行模拟推演。", "excerpts": [], "anchors": ["PDF p. 148-152"]}, {"title": "认知偏误与具体决策人", "detail": "归因、锚定、损失厌恶、选择性注意、刻板印象、自我中心、信念和决策类偏误会系统性扭曲判断。分析组织决定时要回到真实决策人、流程、偏好、信息和情境，而不是把“公司”或“用户群体”当作单一人格。", "excerpts": [], "anchors": ["PDF p. 152-162"]}, {"title": "推动能力决定判断能否产生价值", "detail": "影响他人可以依靠合法性、理性说服、鼓舞、商议、交换、关系、逢迎、施压和联盟。更根本的来源是为他人创造价值或造成损失的能力。议程设置可改变组织关注顺序，但只应服务于已充分验证的目标。", "excerpts": [{"text": "能落地的决策才有价值", "anchor": "PDF p. 163"}], "anchors": ["PDF p. 163-165"]}, {"title": "案例揭示多方权衡没有静态答案", "detail": "动态调价与排队要权衡公平和效率；醉酒乘车要同时看安全、服务与权利保护；拼车分配随供需状态改变；失物、改目的地和纠纷判责需要标准化规则、上游治理与平台承担。约束变化后，原来的最优机制也要重算。", "excerpts": [], "anchors": ["PDF p. 166-182"]}], "takeaways": ["先检查信念和目标，再优化行动。", "用预期效用比较收益、成本与概率，同时纳入外部性和时间尺度。", "把冲突问题从道德口号改写为角色、权利、成本和机制设计。"], "related_concepts": ["rational-decision", "user-model", "transaction-model", "transaction-cost"], "anchors": ["PDF p. 136-182"], "confidence": "high"}, {"id": "ch-08-growth", "title": "产品经理的选拔与成长：让人岗交易持续增值", "question": "怎样选择、培养和配置产品经理，使个人成长与企业需求互惠？", "role": "把全书方法用于产品经理自身，解释能力、岗位、环境和职业选择。", "mainline": "产品经理是非标准化职业，好坏必须相对企业需求和岗位情境判断。选拔不能只看职级、名企和结果，而要拆分个人、团队与环境的贡献，考察批判性思维、同理心、用户模型、产品基础和成长潜力。成长依靠优质实践机会：先建立用户模型，再掌握交易模型；以科学方法、人文关怀、实践精神和批判性思维提高决策质量。前五年补齐多类实践，五年后再按专业、管理、业务、新产品或出海方向选择。", "argument_flow": ["岗位匹配", "识别潜力", "实践培养", "用户与交易模型", "五年前补基础", "五年后选路径", "环境与职业交易"], "sections": [{"title": "选拔标准必须服务于企业阶段", "detail": "职级受能力、绩效、岗位规模、资历和博弈等多因素影响，不能直接代表产品能力。面试应深挖候选人做过的事和陌生问题的拆解方式，区分个人贡献、团队支持与环境红利，并预测岗位匹配度、成长空间和留存。", "excerpts": [], "anchors": ["PDF p. 183-210"]}, {"title": "成长的两座里程碑与三种能力", "detail": "用户模型靠大量案例、反馈、数据和迭代形成；交易模型靠理解多边利益和交易成本形成。理想能力还包括科学方法、人文关怀和实践精神，批判性思维则负责检查证据、逻辑、假设、替代方案和利益相关者。", "excerpts": [], "anchors": ["PDF p. 211-216"]}, {"title": "前五年要争取六类实践", "detail": "新人应进入能快速迭代、有产品心的小团队，在阅读、思考、实践中积累。随后补齐从0到1、做深做透、做宽做杂、大用户量、商业闭环、团队建设六类经历。管理不宜过早挤占建立一线用户模型的时间。", "excerpts": [], "anchors": ["PDF p. 217-224"]}, {"title": "五年后用比较优势选择路线", "detail": "专业路线深化权衡与交易模型；管理路线通过识人用人和优先级扩大产出；业务路线积累领域与平台知识；新产品和创业以高风险换高收益；出海利用成熟市场能力。选择取决于天赋、机会成本、业务阶段和风险偏好。", "excerpts": [], "anchors": ["PDF p. 224-230"]}, {"title": "环境塑造决策质量", "detail": "有利环境鼓励逻辑、同理心、经验、异见和数据；不利环境包括短期导向、个人崇拜、内斗、分工过细、迭代慢和缺乏竞争。工作选择可用岗位价值=事情价值×团队成功率×成功后回报，并分别考虑短、中、长期目标。", "excerpts": [], "anchors": ["PDF p. 230-248"]}], "takeaways": ["好产品经理首先是与具体企业和岗位匹配。", "没有充分思考的经历不等于经验，实践反馈必须改变认知。", "产品经理的市场价格还取决于价值被认知和能力稀缺性。"], "related_concepts": ["product-manager-value", "product-manager-growth", "user-model", "transaction-model", "rational-decision"], "anchors": ["PDF p. 183-248"], "confidence": "high"}, {"id": "ch-09-appendix", "title": "附录：从用户体验十二条到价值交换方法论", "question": "俞军的产品认知怎样在搜索实践、组织管理和滴滴复杂交易中逐步扩展？", "role": "用历史材料展示正文观点的实践来源、演化轨迹和重复验证。", "mainline": "附录从早期搜索文章和“产品经理十二条”开始，呈现以用户为中心、完整体验、效果导向和快速迭代的经验原则；随后的人才讲座强调授权、试错、自我否定和产品心；用户体验文章把体验定义为让用户付出更小成本完成需求，并强调过程、个体与时间变化；后期访谈则把这些经验抽象为用户价值公式、用户样本量、交易模型、批判性思维与五级能力模型。附录证明方法论不是一次写成，而是在不同产品与组织中持续修正。", "argument_flow": ["搜索实践", "用户体验原则", "人才与组织", "用户价值公式", "用户模型", "交易与权衡", "能力模型"], "sections": [{"title": "早期材料：从用户视角与效果出发", "detail": "求职信、搜索文章目录和十二条展示了长期研究单一领域、完整看用户过程、发现需求、决定不做什么、快速上线再改进的工作方式。", "excerpts": [{"text": "决定不做什么往往比决定做什么更重要", "anchor": "PDF p. 256"}], "anchors": ["PDF p. 249-256"]}, {"title": "选用育留：授权、试错与事实导向", "detail": "人才选择重潜力、投入和价值观；培养依靠充分授权、平等讨论、允许犯错和复盘；组织结论应来自发现更多不足，而不是向上汇报和推销观点。", "excerpts": [], "anchors": ["PDF p. 257-263"]}, {"title": "用户体验是完整过程，并且因人因时变化", "detail": "静态页面评测会遗漏下载、定位、输入、翻页和替代方案等成本。搜索案例说明体验必须放在真实任务全过程中，且用户获得与流失、用户结构和外部内容供给变化都会改写体验标准。", "excerpts": [{"text": "让用户付出最小成本满足需求", "anchor": "PDF p. 264"}], "anchors": ["PDF p. 264-270"]}, {"title": "后期访谈把经验上升为可迁移框架", "detail": "演讲和访谈反复强调用户价值、用户样本量、怀疑精神、确定性与可行性，随后扩展到用户模型、交易模型、逻辑、同理心、异见和数据，以及可行性、创造、权衡、变迁、方法论五级能力。", "excerpts": [], "anchors": ["PDF p. 271-311"]}, {"title": "终点仍是学习、思考与实践", "detail": "离职感言回到产品心与终身学习。附录的不同年代文本有表述差异，但共同点是把产品判断放在真实用户、结果反馈和长期价值中持续校准。", "excerpts": [], "anchors": ["PDF p. 312"]}], "takeaways": ["正文的方法论来自长期产品实践的逐层抽象。", "经验原则只有解释了适用条件，才能升级为可迁移的方法。", "保持怀疑与反馈循环，是方法论不僵化的关键。"], "related_concepts": ["user-value", "user-model", "product-manager-growth", "rational-decision"], "anchors": ["PDF p. 249-312"], "confidence": "high"}], "concepts": [{"id": "user-value", "title": "用户价值", "one_line": "用户价值是新方案相对当前替代方案、扣除切换阻力后带来的净改善。", "explanation": "这里的价值不是产品团队声称有多少功能，也不是一次满意度评分。它存在于具体用户、具体任务和具体替代方案的比较中。只有当新体验带来的增益足以覆盖旧体验仍然提供的价值，以及学习、迁移、信任和失败风险等成本时，产品才更可能改变用户选择。", "factors": [{"name": "新体验增益", "detail": "新方案在效果、效率、情绪、身份或成本上带来的改善；改善必须对应用户在当下情境中的真实目标。", "anchors": ["PDF p. 5"]}, { "label": "进入", "explanation": "当选择涉及付款、注意力、数据或持续使用时，用户行为成为交易的一部分。"}], "excerpts": [], "anchors": ["PDF p. 5-10"], "voice": "editor", "confidence": "medium"}, {"id": "switching-cost", "title": "替换成本", "one_line": "替换成本是用户从现有方案迁移到新方案时承担的全部阻力与风险。", "explanation": "替换成本既包括显性的金钱和时间，也包括重新学习、迁移数据、打破习惯、改变协作关系、失去既有权益和承担失败后果。它往往隐藏在用户“觉得不错但没有换”的间隙中，因此是设计采用路径时必须单独识别的变量。", "factors": [{"name": "学习成本", "detail": "理解新规则、建立操作熟练度所需的时间和认知负荷。", "anchors": ["PDF p. 5"]}, {"name": "迁移成本", "detail": "数据、资产、账号、流程和关系从旧方案转移到新方案的工作量。", "anchors": ["PDF p. 5"]}, {"name": "信任与失败风险", "detail": "用户对稳定性、安全性和承诺兑现缺乏把握时，会为潜在损失预留更高成本。", "anchors": ["PDF p. 5-7"]}, {"name": "协同约束", "detail": "当方案需要同事、家人或上下游一起改变时，个人偏好不足以完成切换。", "anchors": ["PDF p. 7-10"]}], "effects": ["降低尝试率、激活率和从旧方案迁移的速度。", "让拥有网络、数据或流程沉淀的旧方案获得持续优势。"], "observables": ["首次使用需要几步、多久、多少新信息。", "用户需要迁移哪些数据、关系和既有成果。", "退出新方案后能否无损回到旧方案。"], "boundary": "降低替换成本不能替代核心价值；如果新体验没有实质增益，再顺滑的迁移也难以形成长期留存。", "relations": [{"target_id": "user-value", "label": "扣减", "explanation": "它是用户价值公式中的减项。"}, {"target_id": "user-choice", "label": "阻滞", "explanation": "它解释偏好与采用行为之间的落差。"}], "excerpts": [{"text": "用户价值=新体验-旧体验-替换成本", "anchor": "PDF p. 5"}], "anchors": ["PDF p. 5-7"], "voice": "author", "confidence": "high"}, {"id": "enterprise-transaction", "title": "企业交易", "one_line": "企业通过产品与用户交换价值，并在持续供给产品的成本与回报之间作出选择。", "explanation": "企业以产品承载有交换价值的使用价值，换取金钱、时间、注意力、数据、承诺或未来信任。企业愿意持续交易的前提是广义收益覆盖生产成本与交易成本，同时用户获得的效用也高于其全部成本。", "factors": [{"name": "用户愿意交换的资源", "detail": "可能是金钱、时间、注意力、数据、传播或持续使用；必须明确实际交换的是什么。", "anchors": ["PDF p. 8-10"]}, {"name": "企业获得的回报", "detail": "包括现金收入，也包括品牌、社会声望、政府关系、用户数据与增加未来交易可能性的信任。", "anchors": ["PDF p. 68-69", "PDF p. 85-86"]}, {"name": "供给成本与约束", "detail": "研发、运营、服务、渠道和组织协作成本决定交换能否持续。", "anchors": ["PDF p. 7-10"]}, {"name": "双方价值的持续性", "detail": "一次采用不足以证明模型成立，需要观察留存、复购、成本和长期结果。", "anchors": ["PDF p. 8-10"]}], "effects": ["影响企业是否继续投入、扩大供给或调整产品。", "为需求优先级增加商业与资源约束。", "把用户采用、留存、付费与企业成本放进同一决策框架。"], "observables": ["用户实际投入了什么，企业实际获得了什么。", 等级", "detail": "领域用户、市场、政策、供给与组织知识的积累。", "anchors": ["PDF p. 203-205"]}, {"name": "平台匹配度", "detail": "与团队、制度、业务和协作网络形成的共同知识。", "anchors": ["PDF p. 203-205"]}, {"name": "智慧等级", "detail": "在新环境中更快更深发现关键变量与迁移方法的能力。", "anchors": ["PDF p. 203-205"]}], "effects": ["影响岗位匹配、授权范围、薪酬和迁移成功率。", "决定团队能否在复杂问题上形成更优选择。"], "observables": ["同等资源与环境下的判断质量。", "跨领域后学习和校准速度。", "是否把决策真正推动落地。"], "boundary": "产品结果由个人、团队与环境共同决定，不能用成功产品简单归因个人能力。", "relations": [{"target_id": "rational-decision", "label": "主要体现为", "explanation": "核心竞争力是输出决策的质量。"}, {"target_id": "product-manager-growth", "label": "随成长变化", "explanation": "实践与反思扩展经验、模型和智慧。"}, {"target_id": "division-value", "label": "源于", "explanation": "岗位只有改善分工与企业收益才有价值。"}], "excerpts": [{"text": "产品经理的价值=经验等级*平台匹配度*智慧等级", "anchor": "PDF p. 204"}], "anchors": ["PDF p. 183-210", "PDF p. 239-245"], "voice": "author", "confidence": "high"}, {"id": "product-manager-growth", "title": "产品经理成长", "one_line": "通过高质量实践、反馈和反思，把用户样本与交易认知转化为更可靠的决策能力。", "explanation": "成长不是累计工龄。前五年需要建立用户模型、补齐多类产品实践；之后根据天赋与机会选择专业、管理、业务或创业路径。科学方法、人文关怀、实践精神和批判性思维共同决定经验能否上升为方法。", "factors": [{"name": "实践机会", "detail": "快速迭代、大用户量、复杂利益关系和商业闭环提供高密度反馈。", "anchors": ["PDF p. 211-230"]}, {"name": "团队文化", "detail": "逻辑、同理心、异见、数据和产品心提高学习效率。", "anchors": ["PDF p. 230-234"]}, {"name": "自省与批判性思维", "detail": "发现并承认短处，才能学习、合作、雇用或回避。", "anchors": ["PDF p. 208-216"]}], "effects": ["提高用户模型、交易模型和复杂权衡能力。", "扩大可承担的产品范围与组织责任。"], "observables": ["经历是否改变了下一次预判。", "能否说明方法适用边界。", "是否积累完整反馈而非只做汇报材料。"], "boundary": "天赋、环境与机遇共同限制速度和上限；培训不能替代一线实践。", "relations": [{"target_id": "user-model", "label": "先建立", "explanation": "合格线是理解并预判领域用户。"}, {"target_id": "transaction-model", "label": "再深化", "explanation": "进阶能力是设计可持续多边交易。"}, {"target_id": "product-manager-value", "label": "提升", "explanation": "成长最终要转化为对具体企业的价值。"}], "excerpts": [{"text": "没有充分思考过的经历只是经历，不等于经验", "anchor": "PDF p. 217"}], "anchors": ["PDF p. 199-248", "PDF p. 271-311"], "voice": "author", "confidence": "high"}], "formulations": [{"text": "用户价值=新体验-旧体验-替换成本", "commentary": "它迫使产品经理同时看见收益、用户已经拥有的东西和迁移阻力。它是决策提示，不是可以直接代入数值的精确公式。", "anchors": ["PDF p. 5"], "verbatim": false}, {"text": "产品是约束条件下的效用组合", "commentary": "产品方案不是无限增加功能，而是在资源、技术、时间、用户能力和商业目标之间安排效用。", "anchors": ["PDF p. 7"], "verbatim": true}, {"text": "企业以产品为媒介，与用户进行价值交换", "commentary": "这句话把用户价值与企业目标接到同一条主线上，后续效用、成本、边际和机制设计都从这里展开。", "anchors": ["PDF p. 9"], "verbatim": true}, {"text": "用户不是自然人，而是需求的集合", "commentary": "分析单位从人口数转向特定情境中的需求份额，能避免把注册人数误当成真实用户价值。", "anchors": ["PDF p. 43"], "verbatim": true}, {"text": "世界上不存在等价交换", "commentary": "一次自愿交易之所以发生，是因为双方都按自己的主观效用判断所得高于所失。", "anchors": ["PDF p. 91"], "verbatim": true}, {"text": "产品经理是做权衡的", "commentary": "产品经理的核心产出是多方约束中的选择与优先级，而不是方案数量或界面表达。", "anchors": ["PDF p. 141"], "verbatim": true}, {"text": "没有充分思考过的经历只是经历，不等于经验", "commentary": "成长来自阅读、实践、反馈和反思的闭环，工龄本身不会自动转化成判断力。", "anchors": ["PDF p. 217"], "verbatim": true}], "critique": [{"title": "价值公式有启发性，但不能掩盖测量困难", "analysis": "新体验、旧体验和替换成本可能来自不同维度，无法天然换算成同一数字。实际使用时应把公式拆成可观察假设，分别寻找行为证据，避免用一个主观总分制造精确感。", "anchors": ["PDF p. 5-7"], "voice": "editor"}, {"title": "职业史是一种解释框架，不是唯一因果史", "analysis": "把岗位演化归因于时代的主要稀缺资源很有解释力，但岗位同样受组织规模、治理模式、监管、公司能力和历史路径影响。书中承认分工会自我强化，却仍主要从价值创造角度解释职业变化。", "anchors": ["PDF p. 17-24"], "voice": "editor"}, {"title": "快速迭代有伦理和外部性边界", "analysis": "出行产品的实验可能影响司机生计和乘客行程。因此低发布成本只描述企业能力，不能免除对公平、安全和不可逆影响的判断。", "anchors": ["PDF p. 11-12", "PDF p. 24"], "voice": "editor"}, {"title": "经济学框架提高可解释性，也可能把不可度量价值压扁", "analysis": "全书擅长用效用、成本和交易重写产品问题，但公平、尊严、安全、权利和公共责任并不总能被稳定换算为同一效用尺度。滴滴案例实际依赖价值观和平台责任补足这一缺口。", "anchors": ["PDF p. 69-72", "PDF p. 166-182"], "voice": "editor"}, {"title": "部分人才分类是经验性启发，不宜当作确定测评", "analysis": "ABC分类、人格分布和年限判断便于组织快速讨论，但作者也承认分类准确率有限。实际选拔仍应回到岗位任务、行为证据、实践机会和长期跟踪。", "anchors": ["PDF p. 192-210"], "voice": "editor"}], "reality": [{"question": "用户说“产品不错”却没有采用，真正卡在哪一层？", "application": "沿着用户选择节点逐项检查：真实替代方案、感知增益、旧方案价值、学习与迁移成本、信任风险、时间预算和协同权限。", "anchors": ["PDF p. 5-10"]}, {"question": "当前团队最稀缺的是生产能力、需求理解、分发能力还是高质量决策？", "application": "用真实项目的延期、返工、用户流失和商业结果定位最大损失，再据此界定产品经理应承担的核心工作。", "anchors": ["PDF p. 17-24"]}, {"question": "用户价值改善是否真的形成了可持续交易？", "application": "同时观察采用、留存、付费、服务成本和长期用户结果，避免只用单一增长指标代表双方价值。", "anchors": ["PDF p. 8-10"]}], "actions": [{"title": "画出一次完整的用户选择链", "trigger": "团队知道用户有需求，但产品采用或留存仍然偏低时。", "steps": ["写出用户要完成的任务和当前实际使用的旧方案。", "列出新体验增益、旧体验仍保留的价值和各类替换成本。", "记录用户在知道、相信、尝试、迁移、持续使用各阶段的退出点。", "为最可能改变选择的一项假设设计可观察证据。"], "signal": "团队能解释用户在哪一步、因为什么约束没有完成切换。", "review": "改善后的净价值是否转化成真实采用和留存，而不只是口头好评？"}, {"title": "做一次双边价值交换审计", "trigger": "团队争论功能优先级，但用户价值与企业价值被混在一起时。", "steps": ["写出用户投入与获得的价值。", "写出企业投入、承担的风险和获得的回报。", "标出双方价值中证据最弱、但最可能推翻方案的一项假设。", "设定上线后同时反映用户结果与企业结果的指标。"], "signal": "优先级讨论能够同时引用用户行为、交易结果和供给成本。", "review": "短期结果是否以损害长期用户价值或增加不可持续成本为代价？"}], "glossary": [{"term": "效用", "definition": "特定个体在特定情境中对欲望满足程度的主观评价，产品以效用组合而非功能清单被用户感知。", "anchors": ["PDF p. 102-113"]}, {"term": "替换成本", "definition": "用户从旧方案迁移到新方案时承担的学习、操作、迁移、信任、关系、风险和机会成本。", "anchors": ["PDF p. 5"]}, {"term": "交易模型", "definition": "解释多方如何创造和分配利益、承担成本与风险，并通过激励相容维持可持续行为的机制。", "anchors": ["PDF p. 89-101"]}], "notes": ["本页已覆盖全书317页；覆盖范围、提取质量和图片页处理情况记录在 coverage_map。", "原文只保留短引并附页码；章节主线、概念机制和关系说明均按全书相应段落重构。", "PDF正文可提取，推荐语和少量扫描截图存在字体错位；这些页面不承担核心概念的唯一证据。"]}</script>
<script>
const D=JSON.parse(document.getElementById('book-data').textContent);let mode='read';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const arr=v=>Array.isArray(v)?v:[],anchors=v=>arr(v).map(x=>`<span class="tag anchor">原文 ${esc(x)}</span>`).join('');
const voice=v=>v==='editor'?'<span class="tag editor">编者分析</span>':v==='external'?'<span class="tag">外部资料</span>':'';
const list=(items,cls='detail-list')=>arr(items).length?`<ul class="${cls}">${arr(items).map(x=>`<li>${esc(typeof x==='string'?x:x.detail||x.name)}</li>`).join('')}</ul>`:'';
const excerpts=items=>arr(items).map(x=>`<blockquote class="excerpt">“${esc(x.text)}”<br><span class="tag anchor">原文 ${esc(x.anchor)}</span></blockquote>`).join('');
const card=(x,body='')=>`<article class="card searchable"><h3>${esc(x.title||x.question||x.term)}</h3>${body}${voice(x.voice)}${anchors(x.anchors)}</article>`;
const section=(id,kicker,title,sub,body,m,open=false)=>`<section id="${id}" data-mode-section="${m}" class="mode-section"><button class="section-toggle" aria-expanded="${open}" aria-controls="${id}-body"><span class="section-heading"><span class="section-kicker">${kicker}</span><span class="section-title">${title}</span><span class="section-sub">${sub}</span></span><span class="chevron" aria-hidden="true">＋</span></button><div class="section-body" id="${id}-body" ${open?'':'hidden'}>${body||'<p class="empty">本书未设置此部分。</p>'}</div></section>`;
function relationButtons(ids){return `<div class="relation-list">${arr(ids).map(id=>{const c=arr(D.concepts).find(x=>x.id===id);return c?`<button class="concept-link" data-concept-target="${esc(id)}">${esc(c.title)}</button>`:''}).join('')}</div>`}
function chapter(x,i){const parts=arr(x.sections).map(s=>`<div class="subargument searchable"><h4>${esc(s.title)}</h4><p>${esc(s.detail)}</p>${excerpts(s.excerpts)}${anchors(s.anchors)}</div>`).join('');const flow=arr(x.argument_flow).length?`<div class="argument-flow">${x.argument_flow.map((s,j)=>`${j?'<span class="flow-arrow">→</span>':''}<span class="flow-step">${esc(s)}</span>`).join('')}</div>`:'';return `<article class="fold chapter searchable" id="${esc(x.id)}"><button class="fold-toggle" aria-expanded="${i===0}" aria-controls="${esc(x.id)}-body"><span class="fold-no">${String(i+1).padStart(2,'0')}</span><span><span class="fold-title">${esc(x.title)}</span><span class="fold-role">${esc(x.role)}</span></span><span class="chevron" aria-hidden="true">＋</span></button><div class="fold-body" id="${esc(x.id)}-body" ${i===0?'':'hidden'}>${x.question?`<p class="chapter-question"><b>本章回答：</b>${esc(x.question)}</p>`:''}<p class="mainline"><b>本章主线：</b>${esc(x.mainline||x.summary)}</p>${flow}${parts}${arr(x.takeaways).length?`<h4>读完应留下什么</h4>${list(x.takeaways)}`:''}${arr(x.related_concepts).length?`<div class="concept-block"><h4>相关概念</h4>${relationButtons(x.related_concepts)}</div>`:''}<span class="confidence">置信度：${esc(x.confidence||'未标注')}</span>${anchors(x.anchors)}</div></article>`}
function concept(x){const factors=arr(x.factors).map(f=>`<li><b>${esc(f.name)}：</b>${esc(f.detail)} ${anchors(f.anchors)}</li>`).join('');const relations=arr(x.relations).map(r=>{const t=arr(D.concepts).find(c=>c.id===r.target_id);return `<div><button class="concept-link" data-concept-target="${esc(r.target_id)}">${esc(r.label||'关联')}：${esc(t?.title||r.target_id)}</button><p>${esc(r.explanation)}</p></div>`}).join('');return `<article class="card concept searchable" id="concept-${esc(x.id)}"><button class="fold-toggle" aria-expanded="false" aria-controls="concept-${esc(x.id)}-body"><span><span class="fold-title">${esc(x.title)}</span><span class="fold-role">${esc(x.one_line)}</span></span><span class="chevron" aria-hidden="true">＋</span></button><div class="fold-body" id="concept-${esc(x.id)}-body" hidden><p>${esc(x.explanation)}</p>${factors?`<div class="concept-block"><h4>影响因素</h4><ul>${factors}</ul></div>`:''}${arr(x.effects).length?`<div class="concept-block"><h4>它会影响什么</h4>${list(x.effects)}</div>`:''}${arr(x.observables).length?`<div class="concept-block"><h4>如何观察或使用</h4>${list(x.observables)}</div>`:''}${x.boundary?`<div class="concept-block"><h4>边界</h4><p>${esc(x.boundary)}</p></div>`:''}${relations?`<div class="concept-block"><h4>概念关系</h4>${relations}</div>`:x.connection?`<div class="concept-block"><h4>概念关系</h4><p>${esc(x.connection)}</p></div>`:''}${excerpts(x.excerpts)}${voice(x.voice)}${anchors(x.anchors)}<div class="confidence">置信度：${esc(x.confidence||'未标注')}</div></div></article>`}
function render(){
document.documentElement.style.setProperty('--accent',D.meta?.theme?.accent||'#9E2A24');
$('#bookMeta').innerHTML=`<h1>${esc(D.meta.title)}</h1><p>${esc(D.meta.author)}${D.meta.edition?' · '+esc(D.meta.edition):''}</p><span class="coverage">${D.meta.coverage==='complete'?'完整覆盖':'部分覆盖'}</span>`;
const o=D.orientation||{};let html=`<div class="hero searchable"><div class="eyebrow">${esc(o.eyebrow||`${D.meta.author} · 深度蒸馏`)}</div><h2>${esc(D.meta.title)}</h2><p class="lead">${esc(o.thesis)}</p><div class="orientation-grid"><article><b>本书解决什么问题</b><p>${esc(o.problem)}</p></article><article><b>适合谁与如何阅读</b><p>${esc(o.reader||'希望建立完整知识骨架的读者')}</p><p>${esc(o.how_to_read||'先顺序阅读，再进入深度探究。')}</p></article></div></div>`;
html+=section('overview','阅读','全书速览','点击标题展开或收起完整知识骨架。',`<div class="card-grid">${arr(D.overview).map(x=>card(x,`<p><b>${esc(x.summary)}</b></p>${list(x.details)}${arr(x.related_concepts).length?relationButtons(x.related_concepts):''}`)).join('')}</div>`,'read',true);
html+=section('chapters','阅读','逐章解读','每章可独立展开，查看问题、主线、论证步骤、例证与结论。',arr(D.chapters).map(chapter).join(''),'read',true);
html+=section('concepts','深度探究','核心概念','展开概念查看定义、影响因素、结果、边界和可跳转关系。',`<div class="card-grid">${arr(D.concepts).map(concept).join('')}</div>`,'explore',true);
html+=section('formulations','深度探究','金句与关键表述','短引文保留作者措辞，同时提供语境解释和出处。',`<div class="card-grid">${arr(D.formulations).map(x=>card({title:x.verbatim?'原文短引':'关键表述',anchors:x.anchors},`<p class="quote">${esc(x.text)}</p><p>${esc(x.commentary)}</p>`)).join('')}</div>`,'explore');
html+=section('critique','深度探究','批判与评价','检验论证、边界与隐含前提。',`<div class="card-grid">${arr(D.critique).map(x=>card(x,`<p>${esc(x.analysis)}</p>`)).join('')}</div>`,'explore');
html+=section('reality','深度探究','现实问题','把书中的洞见转成可观察的问题。',`<div class="card-grid">${arr(D.reality).map(x=>card(x,`<p>${esc(x.application)}</p>`)).join('')}</div>`,'explore');
html+=section('actions','深度探究','行动清单','从理解走向实践，并留下复盘信号。',`<div class="card-grid">${arr(D.actions).map(x=>card(x,`<p><b>触发：</b>${esc(x.trigger)}</p><ol>${arr(x.steps).map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p><b>观察信号：</b>${esc(x.signal)}</p><p><b>复盘：</b>${esc(x.review)}</p>`)).join('')}</div>`,'explore');
html+=section('glossary','深度探究','术语表','按本书语境解释关键词。',`<div class="card-grid">${arr(D.glossary).map(x=>card(x,`<p>${esc(x.definition)}</p>`)).join('')}</div>`,'explore');
html+=`<div class="footer"><b>覆盖说明：</b>${esc(D.meta.coverage_note||'未提供')}<br>${arr(D.notes).map(esc).join('<br>')}</div>`;$('#content').innerHTML=html;bindAccordions();bindConceptLinks();setMode(mode)}
function toggle(button,open){button.setAttribute('aria-expanded',String(open));const body=document.getElementById(button.getAttribute('aria-controls'));if(body)body.hidden=!open}
function bindAccordions(){document.querySelectorAll('.section-toggle,.fold-toggle').forEach(b=>b.onclick=()=>toggle(b,b.getAttribute('aria-expanded')!=='true'))}
function setMode(next){mode=next;document.querySelectorAll('[data-mode-button]').forEach(x=>x.classList.toggle('active',x.dataset.modeButton===mode));document.querySelectorAll('[data-mode-section]').forEach(x=>x.classList.toggle('hidden',x.dataset.modeSection!==mode));buildNav()}
function openAncestors(el){const sectionEl=el.closest('.mode-section');if(sectionEl){const b=sectionEl.querySelector(':scope > .section-toggle');toggle(b,true)}const fold=el.closest('.fold');if(fold){const b=fold.querySelector(':scope > .fold-toggle');toggle(b,true)}if(el.classList.contains('concept')){const b=el.querySelector(':scope > .fold-toggle');toggle(b,true)}}
function goConcept(id){setMode('explore');const target=document.getElementById(`concept-${id}`);if(!target)return;openAncestors(target);target.classList.add('search-hit');target.scrollIntoView({block:'center'});setTimeout(()=>target.classList.remove('search-hit'),1500)}
function bindConceptLinks(){document.querySelectorAll('[data-concept-target]').forEach(b=>b.onclick=e=>{e.stopPropagation();goConcept(b.dataset.conceptTarget)})}
function buildNav(){const items=[...document.querySelectorAll(`.mode-section[data-mode-section="${mode}"]`)];$('#nav').innerHTML=`<div class="nav-group"><p class="nav-label">${mode==='read'?'顺序阅读':'跳转探究'}</p>${items.map(x=>`<button class="nav-link" data-target="${x.id}">${esc(x.querySelector('.section-title').textContent)}</button>`).join('')}</div>`;document.querySelectorAll('.nav-link').forEach(b=>b.onclick=()=>{const s=document.getElementById(b.dataset.target);toggle(s.querySelector(':scope > .section-toggle'),true);s.scrollIntoView()})}
document.querySelectorAll('[data-mode-button]').forEach(b=>b.onclick=()=>setMode(b.dataset.modeButton));
$('#expandAll').onclick=()=>document.querySelectorAll('.mode-section:not(.hidden) .section-toggle,.mode-section:not(.hidden) .fold-toggle').forEach(b=>toggle(b,true));
$('#collapseAll').onclick=()=>document.querySelectorAll('.mode-section:not(.hidden) .section-toggle,.mode-section:not(.hidden) .fold-toggle').forEach(b=>toggle(b,false));
$('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.searchable').forEach(x=>x.classList.remove('search-hit'));if(!q)return;let hit=[...document.querySelectorAll('.searchable')].find(x=>x.textContent.toLowerCase().includes(q));if(hit){const sectionEl=hit.closest('.mode-section');if(sectionEl&&sectionEl.dataset.modeSection!==mode)setMode(sectionEl.dataset.modeSection);openAncestors(hit);hit.classList.add('search-hit');hit.scrollIntoView({block:'center'})}});
window.addEventListener('scroll',()=>{$('#progress').style.width=(100*scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight))+'%'});$('#toTop').onclick=()=>scrollTo({top:0,behavior:'smooth'});render();
</script></body></html>
