tle": "组装、自有品牌、自主设计是不同阶段", "detail": "BH01先采购散件组装，品牌与服务由自己组织；当散件断供后，BH03再逐步把电路与软件掌握在内部。控制散件减少部分代理限制，却需要更大批量采购和现金周转。自主研发并非一个瞬间的决定，而是供应控制能力逐级变化。", "anchors": ["PDF p. 26–29"], "excerpts": []}, {"title": "没有技术，先创造人才愿意加入的机会", "detail": "通过高校合作、郭平与郑宝用等人的加入，团队从一款产品走向容量、集成度与成本不同的系列产品。作者把任正非的作用解释为连接人才、市场与经营条件，而不是个人掌握每项技术。具体型号与年代中存在OCR误识，详见原页，不以未校数字作精确推论。", "anchors": ["PDF p. 29–31"], "excerpts": []}, {"title": "文化中的机会、回报与过劳不能混为一谈", "detail": "按贡献认可人才、提供食宿和明确目标，构成作者记忆中的积极氛围；同段也记载长期在公司过夜及工程师健康受损。分析应保留这两面，不能把伤害健康的工作强度提炼为成功公式。“床垫文化”在这里首先是特定创业环境中的叙述。", "anchors": ["PDF p. 31–33"], "excerpts": []}, {"title": "做先驱不做先烈：量力推进而非一次押满", "detail": "研发从已有需求和低端产品开始，保持代理与自研并行，成功销售后再扩系列。创业者承担项目、市场、人才和资金协调，使研发不被孤立。章末强调先理解产品生态与供应链，再消化细节、形成创新；这与后文不得不背水一战的风险存在需要保留的张力。", "anchors": ["PDF p. 33–35"], "excerpts": []}], "argument_flow": ["挫折与生存：创业首先面对现实约束", "先做交易：第一桶金同时积累客户网络", "市场为先：服务是无技术差异时的竞争手段", "真诚与备件支持：把代理商变成长期伙伴", "组装、自有品牌、自主设计是不同阶段", "没有技术，先创造人才愿意加入的机会", "文化中的机会、回报与过劳不能混为一谈", "做先驱不做先烈：量力推进而非一次押满"], "takeaways": ["把客户需求、供货能力、资金与研发学习连成同一条经营链。", "从小范围取得可重复的交付能力，不把苦干、低价或冒险单独当成成功解释。"], "related_concepts": ["survival", "market-orientation", "service", "supply-control", "capability", "talent", "culture", "timing"], "anchors": ["PDF p. 17–35"], "confidence": "medium", "voice": "editor", "part": "创业篇"}, {"id": "ch-02", "title": "第2章 初尝败绩", "question": "用户机成功后，为何局用交换机刚推出便失去市场？", "role": "用JK1000失败解释技术路线、竞争与可靠性判断为什么必须提前。", "mainline": "向电信运营商供货扩大了潜在订单，却同时抬高技术、质量与销售门槛。华为按已有能力研发模拟空分局用机JK1000，但行业转向数字交换、竞争者推动建设升级，旧路线迅速失去需求。现场故障暴露电信级品质缺口；客户服务与失败经验被保存，另行启动的数字交换机项目成为下一步机会。", "sections": [{"title": "活下来之后的扩张改变了整个经营条件", "detail": "单位用户机面向分散机构，局用机面向数量较少但容量大的运营商。进入新市场不仅是放大旧产品，还需要新的客户通道、技术能力与资金。作者把继续投入描述为战略突破，也记录它重新把公司推入生存危机。", "anchors": ["PDF p. 36–38"], "excerpts": []}, {"title": "技术可做，不代表上市时仍值得买", "detail": "JK1000基于团队当时较熟悉的模拟空分路线；作者认为团队低估了数字技术的成熟速度与客户升级意愿。新品获得入网资格、市场通道逐步打开，也不能抵消路线过时。书中市场数字和因果解释属2009年前的回顾，不作为今天的行业事实。", "anchors": ["PDF p. 38–40"], "excerpts": []}, {"title": "满足需求与“说服市场接受旧路线”不同", "detail": "团队尝试宣传分阶段建设、让客户继续选空分产品，但行业采购已被数字化与“一步到位”思路重塑。教训不是永远不能引导需求，而是不能把沉没投入转化为要求客户迁就自己的理由；竞争者也会影响客户的选择标准。", "anchors": ["PDF p. 40–41"], "excerpts": []}, {"title": "电信级品质不能靠服务热情补齐", "detail": "雷击、起火与中断等记载，显示局用设备故障影响远大于单位用户机。作者由此引出可靠性应在设计前、开发中就分析验证，而不是出事故后再处理。服务队伍能缓解问题，却不能成为降低验证标准的理由。", "anchors": ["PDF p. 41–42、45"], "excerpts": []}, {"title": "装机与服务把失败经验转为后续能力", "detail": "现场队伍奔赴偏远地区，承担培训、维护与沟通；免费升级、备件中心和技术支持网络逐渐成为差异。JK1000商业失败不意味着全部积累清零，工程经验、用户情境和服务口碑可支持下一产品，但这需要主动整理，不能自动发生。", "anchors": ["PDF p. 41–43"], "excerpts": []}, {"title": "对手、路线与产品规划需要持续跟踪", "detail": "作者强调竞争不是静止的参数：国际厂商既更新技术，也影响运营商建设标准。后来团队加强公开资料研究与超前规划，不再只销售孤立的当前产品。本页“5G”等文字存在识别疑点，不作当时具体宣传代际的依据。", "anchors": ["PDF p. 43–44"], "excerpts": []}, {"title": "从“像赌博”到承认需要体系化", "detail": "一成一败让团队认识到靠干劲不能稳定控制研发结果，后续改革的动机由此出现。质量管理、可靠性与规范开始进入组织议程；作者同时倡导承受挫折和学习，但失败并非天然会转成能力，关键在机制变化。", "anchors": ["PDF p. 44–46"], "excerpts": []}, {"title": "保留另一条技术路径与敢于任用人才", "detail": "曹贻安提出数字交换方向，郑宝用等继续组织数字机研发，使公司没有完全被模拟路线锁住。作者用“救命毫毛”比喻人才在危机中的作用；不因一次失败否定团队，保住了可迁移的技术学习。", "anchors": ["PDF p. 46–47"], "excerpts": []}, {"title": "把单个项目放回通信产业竞争中理解", "detail": "章末回顾“七国八制”、国内数字交换企业与中兴、思科的起步，说明进入行业时对手、制度和市场已存在。它们是作者用来比较的历史背景；其股价、排名与市场占比不应离开时间语境直接引用。", "anchors": ["PDF p. 48–50"], "excerpts": []}], "argument_flow": ["活下来之后的扩张改变了整个经营条件", "技术可做，不代表上市时仍值得买", "满足需求与“说服市场接受旧路线”不同", "电信级品质不能靠服务热情补齐", "装机与服务把失败经验转为后续能力", "对手、路线与产品规划需要持续跟踪", "从“像赌博”到承认需要体系化", "保留另一条技术路径与敢于任用人才", "把单个项目放回通信产业竞争中理解"], "takeaways": ["区别“能做出来”“获得资格”“客户还需要”三个不同判断。", "失败之后要留下人才、知识和具体改进，不将持续投入本身等同于正确。"], "related_concepts": ["market-orientation", "timing", "competition", "reliability", "service", "learning", "portfolio", "layered-planning"], "anchors": ["PDF p. 36–50"], "confidence": "medium", "voice": "editor", "part": "创业篇"}, {"id": "ch-03", "title": "第3章 首个里程碑", "question": "能力不足且资金紧张时，C&C08如何获得首批实际应用？", "role": "把技术突破、首局验证、人才授权与交付风险放在同一现场。", "mainline": "C&C08不是一次顺利的实验室研发。团队边招人边学习标准，义乌首局在大量现场修复中运行，随后万门机通过新架构与邳州试点进入更大市场。年轻人才被快速授权，失败得到支持；与此同时，未充分成熟就交付、临时重启与超前承诺让客户和工程承担代价，不能只保留英雄叙事。", "sections": [{"title": "竞争窗口使研发速度具有经济后果", "detail": "作者把通信产品比作海鲜：换代慢一步，已有产品价值会骤降。团队人数快速变化，组织与任务频繁调整，资金集中于下一代产品。这里说明上市窗口压力，也揭示缺少稳定组织和风险余量的脆弱性。", "anchors": ["PDF p. 51–53"], "excerpts": []}, {"title": "共同规范支撑边学边干", "detail": "跨专业新人借助程控交换规范这本“红宝书”理解系统，郑宝用与团队反复讨论总体设计。没有经验不等于无需专业知识；资料、标准、工具和集体学习帮助把未知分解成可实现问题，不能简单总结为“无知者更能创新”。", "anchors": ["PDF p. 53–54"], "excerpts": []}, {"title": "人心与基本生活条件也是研发约束", "detail": "半薪到账、离职结算、户籍证件与居住治安构成当时团队的现实压力。作者认为明确事业与公司信誉帮助留人，但这些条件并不浪漫。人才管理必须看到承诺兑现和基本保障，而非只用使命替代具体待遇。", "anchors": ["PDF p. 54–55"], "excerpts": []}, {"title": "义乌首局：客户反馈进入真实设计", "detail": "佛堂支局暴露呼损、断线、死机等问题，工程团队驻场修复；中文操作、计费、维护统计与远端需求又提供本地价值。首局的意义是把技术放进真实环境继续学习，不是证明未经成熟验证就上线具有普遍合理性。", "anchors": ["PDF p. 55–58"], "excerpts": []}, {"title": "万门机：技术方案与人才授权同时升级", "detail": "为突破容量，团队比较总线与光纤模块连接，李一男因专业见解迅速获得责任。作者借此强调按能力和贡献而非年龄排位；方案选择仍经历试错，不能把年轻或学历背景当成技术正确性的保证。", "anchors": ["PDF p. 58–60"], "excerpts": []}, {"title": "试错成本要有人承担，也要形成工程学习", "detail": "订购不适用的开发工具造成损失，管理者协商挽回并支持工程师；关键仪器与快速制板则得到投入。作者赞许容错与聚焦，但这些故事同时说明架构验证、采购承诺和方案成熟度需要联动，而不只是在失败后安慰团队。", "anchors": ["PDF p. 61–62"], "excerpts": []}, {"title": "邳州试点：现场环境暴露实验室遗漏", "detail": "接地错误、信令与时隙释放缺陷等影响开通。夜间重启只是临时缓解，后续多个版本才消除问题。这个案例适合检验环境覆盖、资源泄漏与回归测试，不应把中断用户服务当成值得复制的敏捷技巧。", "anchors": ["PDF p. 63–65"], "excerpts": []}, {"title": "超前承诺与验收争议应作为治理问题", "detail": "宣传容量超过当时已实现能力，后续研发需要兑现；察右前旗验收报告与客户关系争议又显示信息透明和责任接口的压力。作者叙述重视竞争影响，编者则要求同时看到真实缺陷记录、客户知情和承诺一致性的价值，不能从故事提炼隐瞒问题的做法。", "anchors": ["PDF p. 65–67"], "excerpts": []}], "argument_flow": ["竞争窗口使研发速度具有经济后果", "共同规范支撑边学边干", "人心与基本生活条件也是研发约束", "义乌首局：客户反馈进入真实设计", "万门机：技术方案与人才授权同时升级", "试错成本要有人承担，也要形成工程学习", "邳州试点：现场环境暴露实验室遗漏", "超前承诺与验收争议应作为治理问题"], "takeaways": ["首局不仅验证技术，也暴露环境、操作和服务要求。", "技术突破需要容错；交付仍需真实记录缺陷、管理承诺并保护用户。"], "related_concepts": ["timing", "standards", "pilot", "talent", "learning", "reliability", "requirements", "industrialization"], "anchors": ["PDF p. 51–67"], "confidence": "medium", "voice": "editor", "part": "创业篇"}, {"id": "ch-04", "title": "第4章 毕业歌", "question": "一个成功产品怎样成为后续技术、人才与管理体系的基础？", "role": "区分产品获得市场认可与组织真正具备持续研发能力。", "mainline": "C&C08在作者叙述中既是收入来源，也是可扩展的平台和培养管理人才的工程。容量、兼容与本地成本优势帮助从农村进入城市；相较一些竞争者的利益冲突，作者强调长期投入与分配机制。章末却承认游击式研发问题严重，产品“毕业”不等于研发体系“毕业”，需要进一步制度化。", "sections": [{"title": "成功的意义与人才获得的机会", "detail": "工程师在信任、资金支持与有挑战的任务中获得成就感，项目经验反过来培养组织骨干。作者写得充满认同和情感，这能解释参与者的动机，却不能独立证明管理方式对全部员工同样有效。", "anchors": ["PDF p. 68–69"], "excerpts": []}, {"title": "从单产品走向容量扩展的平台", "detail": "2000门、万门及后续模块系列，把不同规模网络的需要串起来。光纤连接、中央控制与模块升级支持容量演进，后续智能、数据和移动产品又复用既有基础。具体容量与型号以原页为准；重点是架构可演进，而非记住一串最大参数。", "anchors": ["PDF p. 70–71"], "excerpts": []}, {"title": "自主能力与兼容升级共同降低客户负担", "detail": "作者把国产核心技术与通信成本下降相联系，并强调升级时可只改部分单板或软件，保护客户原有投入。这个机制比单纯低售价更重要；但宏观资费下降涉及多重因素，不能只由一个企业成功案例证明全部因果。", "anchors": ["PDF p. 71–72"], "excerpts": []}, {"title": "大项目是人才训练场，也需处理合作边界", "detail": "C&C08培养了后续研发、生产、市场与管理骨干；招募来自高校、科研院所、同行与同学推荐。作者也直述合作后吸纳对方人才引发的戒心。学习点应是项目经验与职业机会，不是把侵蚀伙伴信任当成高效合作。", "anchors": ["PDF p. 72–74"], "excerpts": []}, {"title": "“首个毕业证”包含不能忽略的验收失真", "detail": "展会、试验局与鉴定使产品取得认可，但作者还记述通过改变测试安排和显示数据来改善验收表象。此处必须明确：这属于书中的高风险历史记载，不是证明产品成熟的可信方法；分析不提供其操作步骤，主张可复现、真实和独立的验证。", "anchors": ["PDF p. 74–76"], "excerpts": []}, {"title": "从农村进城：定位、时间和客户总成本相连", "detail": "先在竞争较弱、服务需求高的区域站稳，再以容量和性能进入城市。表4-1从机柜、能耗、维护人员、收益与投资回收比较价值，说明销售不只报设备价。表中比例是当时的宣传比较，缺少共同基线与验证数据，不能当作普遍节省承诺。", "anchors": ["PDF p. 76–78"], "excerpts": []}, {"title": "对手比较的重点是机制，不是所有制标签", "detail": "作者把巨龙等困境解释为多方分配、经营权和持续投入问题，同时记录中兴通过产权与经营安排获得发展。更稳妥的跨案例理解是：权责清楚、利益协调与长期投入影响演进，不能由有限案例推导某种所有制必然成功或失败。", "anchors": ["PDF p. 79–81、83–84"], "excerpts": []}, {"title": "游击式研发的后果推动下一轮制度建设", "detail": "现场临时版本、特性与地域考虑不足、工艺遗漏、救火者受崇拜等，使规模扩大后质量与知识传递失控。作者承认C&C08的成功不能证明组织已成熟，并将后续IPD与习惯形成视为研发体系的重要转折。", "anchors": ["PDF p. 82–84"], "excerpts": []}], "argument_flow": ["成功的意义与人才获得的机会", "从单产品走向容量扩展的平台", "自主能力与兼容升级共同降低客户负担", "大项目是人才训练场，也需处理合作边界", "“首个毕业证”包含不能忽略的验收失真", "从农村进城：定位、时间和客户总成本相连", "对手比较的重点是机制，不是所有制标签", "游击式研发的后果推动下一轮制度建设"], "takeaways": ["产品、平台、人才和组织能力应分别评估，不能用销量替代全部成熟度。", "保留真实质量证据，才有可能把一次突破转成可持续体系。"], "related_concepts": ["platform", "reuse", "customer-value", "talent", "governance", "configuration", "ipd", "learning"], "anchors": ["PDF p. 68–84"], "confidence": "medium", "voice": "editor", "part": "创业篇"}, {"id": "ch-05", "title": "第5章 白条变股份", "question": "早期企业怎样吸引知识人才，又怎样将贡献、回报与长期发展相连？", "role": "揭示人才不是单一招聘问题，而是事业、评价、分配和组织环境的组合。", "mainline": "作者将任正非的领导力解释为组织人才共同做事的能力。高薪、股份、荣誉、住房与事业机会，既给人才回报，也把资金重新投入企业。知识贡献不应只由最初资本占有者获得收益，是全章的重要立场；同段所记述的欠薪转股、借款购股和不愿参与的压力，也显示利益绑定可能向员工集中风险。", "sections": [{"title": "企业家首先组织别人，而非只靠自己冲锋", "detail": "“企业家也是政治家”在本章是组织动员的比喻：以事业方向、资源和制度让不同人才协作。通过高校、同行、内部推荐等渠道找人，只是入口；真正让人留下的，是工作能发挥、贡献被承认以及成果可分享。不能把这种比喻简化为个人魅力或操控人心。", "anchors": ["PDF p. 87–91"], "excerpts": []}, {"title": "高薪与承诺兑现共同形成信任", "detail": "刘平等人的薪资跃迁、面试和安家支持，用来说明公司如何把“重视人才”变成可感知的待遇。但当时现金不足，部分工资先记账，后来转换为内部股份。这里须区分承诺收入、实际现金和投资权益，不能用后来成功替早期安排消除不确定性。", "anchors": ["PDF p. 91–93"], "excerpts": []}, {"title": "从白条转股到再投资：激励与融资重合", "detail": "后续内部购股将奖金及借款重新留在公司，按才能、责任、贡献等分配机会。作者强调与企业共同成长，也直接写到离职成本、不参与的压力以及公司失败会损失投入。可学习的是价值分享的设计问题，不是把欠薪、个人加杠杆或被迫投资写成通行做法。", "anchors": ["PDF p. 93–95"], "excerpts": []}, {"title": "“知本”要解决新贡献者如何进入分配", "detail": "劳动、知识、经营管理与资本共同创造收益，若只按最初资本分配，后加入人才难获得相称回报。作者用贡献转权益解释动态分配，并提出外部市场、内部机会公平、共同标准及实际结果四类评价依据。书中的法律表述和股权变迁仅保留为当时叙述，未作现行规则认定。", "anchors": ["PDF p. 96–99"], "excerpts": [{"text": "机会牵引人才，人才牵引技术，技术牵引产品，产品牵引更大的机会。", "anchor": "PDF p. 99"}]}, {"title": "任用重实践与贡献，不能只看资历", "detail": "快速提拔年轻人、从普通岗位成长、实习与高校培养，是按能力组织人才的例子。学历不会自动变成实践能力，但也不能据此否认知识训练的价值。公平被作者解释为机会与贡献对应，而不是每人的收入一样；这进一步要求评价透明。", "anchors": ["PDF p. 99–101"], "excerpts": []}, {"title": "荣誉、成就感与物质回报相互补充", "detail": "公开认可个人贡献、将社会奖项交给技术骨干，配合从小模块到大产品的共同目标，让工程师看到工作意义。所谓“修教堂”是把日常任务连接到可见结果；若没有实际资源、认可和回报，口号不能替代激励机制。", "anchors": ["PDF p. 101–103"], "excerpts": []}, {"title": "生活支持要随成长调整，也有失败案例", "detail": "宿舍、食堂、迁居安置帮助新人降低进入成本；集体购房遇到产权问题并退房，又说明福利项目需要清楚承诺和边界。作者记述的领导与员工生活交织也可能减少私人空间，不能只保留温情一面。", "anchors": ["PDF p. 104–105"], "excerpts": []}, {"title": "职业选择应观察组织如何让人创造价值", "detail": "刘平的回忆强调团队不互相甩责、共同调试、成果成为实际产品以及个人成长。它是一位受益者的亲历，不是所有人都应选择同类企业的证明。读者可据此考察领导、机制、学习机会和自身承受能力，而非只看高薪与成功故事。", "anchors": ["PDF p. 106–109"], "excerpts": []}], "argument_flow": ["企业家首先组织别人，而非只靠自己冲锋", "高薪与承诺兑现共同形成信任", "从白条转股到再投资：激励与融资重合", "“知本”要解决新贡献者如何进入分配", "任用重实践与贡献，不能只看资历", "荣誉、成就感与物质回报相互补充", "生活支持要随成长调整，也有失败案例", "职业选择应观察组织如何让人创造价值"], "takeaways": ["将工资、实际现金、风险权益与长期机会区分清楚。", "事业机会、协作环境和公平回报共同影响人才作用，不能只复制其中一项。"], "related_concepts": ["talent", "incentives", "value-distribution", "knowledge-capital", "culture", "learning"], "anchors": ["PDF p. 87–109"], "confidence": "medium", "voice": "editor", "part": "人才和资金篇"}, {"id": "ch-06", "title": "第6章 谁给华为做风险投资", "question": "长研发、慢回款的公司，如何让资金不断链并扩大市场通道？", "role": "把研发放回现金转换、融资和战略伙伴的经营系统。", "mainline": "研发支出先发生，产品形成收入与款项到账却较晚，早期华为因此不断面临现金压力。作者依次介绍技术转让、莫贝克平台、业务出售、区域合资、买方信贷和代理权等做法，强调资金提供者也可能提供市场资源。章节主要使用公开的《华为人》材料；其中的成功评价需要与治理风险、未实现计划和数据口径分开理解。", "sections": [{"title": "融资与研发、市场同样影响生存", "detail": "双线研发、硬件采购、工资、安装与售后，使公司即使看到市场也可能先耗尽现金。书中强烈的危机语言是历史叙述，不作为经营压力的正常化表达。章末要求负责人盯住现金流，意味着不能把资金问题全推给财务部门。", "anchors": ["PDF p. 110–111、130"], "excerpts": [{"text": "一把手的首要职责是盯着现金流，解决资金问题。", "anchor": "PDF p. 130"}]}, {"title": "技术换市场：把能力变成可交换资源", "detail": "电源技术转让包含资料、工艺、培训与生产支持，最初回收现金的效果有限，后来逐渐与合资生产、市场扩展结合。它说明技术资产可能有多种经营方式；同样要看到知识边界、持续支持和伙伴责任，不是只有一笔转让费。", "anchors": ["PDF p. 111–112"], "excerpts": []}, {"title": "买方参与的融资平台同时打开市场", "detail": "作者以当时外资与地方邮电合资为背景，介绍华为与邮电系统、科研机构等筹建莫贝克。参与方既持资金又有客户渠道，技术方负责经营，缓解资本与销售两种约束。“风险投资”在书中是较宽的风险共担比喻，不等同于今天专业VC的制度定义。", "anchors": ["PDF p. 112–118"], "excerpts": []}, {"title": "共同出资不等于自动产生订单与高效率", "detail": "股东支持进入地区市场，但作者也承认其他厂家有类似安排，最终还要比较技术、销售与服务。委托经营、产业定位、管理责任和后续独立化是平台运作的重要部分。采购方兼具投资者角色形成利益交叉，需要与一般渠道合作区分，不推导其在今天当然适当。", "anchors": ["PDF p. 119–122"], "excerpts": []}, {"title": "出售盈利业务可以重新聚焦，但不是没有代价", "detail": "电源业务独立、上市计划未兑现，随后转为安圣并出售给艾默生。作者列出资源聚焦、业务发展空间和融资需要等原因，详述准备资料、评估买方与谈判。这里的估值推算包含简化及OCR缺失，分析只提炼战略取舍与信息准备，不照抄收益或折现公式。", "anchors": ["PDF p. 123–125"], "excerpts": []}, {"title": "区域合资：资源整合依赖具体权责", "detail": "各地合作将技术、人才、资金与市场相接，帮助缓解扩张所需投入。作者把它归入利益共同体战略，但地域合作也可能增加协调与利益冲突。应考察能贡献什么、谁经营、谁承担风险，而不是把公司数量当作成功原因。", "anchors": ["PDF p. 125–126"], "excerpts": []}, {"title": "买方信贷：改变收款节奏，而不是凭空消除风险", "detail": "从元器件支出到安装验收、客户付款之间存在较长间隔。书中记述银行向买方提供信贷，供应商可较早取得款项，让客户建设资金与卖方周转需求衔接。其启示是识别现金转换链；这里不提供当前贷款、担保或信用条件建议。", "anchors": ["PDF p. 126–127"], "excerpts": []}, {"title": "代理权与利益共同体：共享资源先要有内涵", "detail": "行业、地区代理把部分市场拓展交给伙伴，也形成新的现金来源。章末《华为基本法》材料强调先有技术、营销和管理实力，再做资本经营，优先选择有互补能力的伙伴。若只看“利益绑定”而忽略真正可交付的价值，合作无法持续。", "anchors": ["PDF p. 128–130"], "excerpts": []}], "argument_flow": ["融资与研发、市场同样影响生存", "技术换市场：把能力变成可交换资源", "买方参与的融资平台同时打开市场", "共同出资不等于自动产生订单与高效率", "出售盈利业务可以重新聚焦，但不是没有代价", "区域合资：资源整合依赖具体权责", "买方信贷：改变收款节奏，而不是凭空消除风险", "代理权与利益共同体：共享资源先要有内涵"], "takeaways": ["区分利润、销售额与到账现金，识别研发到回款之间的时间差。", "合作资金的价值可能不止钱；同样必须明确风险与决策独立性。"], "related_concepts": ["cash-cycle", "ecosystem", "governance", "pressure-principle", "customer-value", "capability"], "anchors": ["PDF p. 110–130"], "confidence": "medium", "voice": "editor", "part": "人才和资金篇"}, {"id": "ch-07", "title": "第7章 中央研究部", "question": "怎样从一次产品攻关，发展为持续、多产品的研发能力？", "role": "说明中央技术支撑、分层组织与属地扩展之间的关系。", "mainline": "早期研发附在制造部，数字机复杂度提高后转为总体规划与项目执行分层，随后集中为中研部。按业务发展产品，同时建设技术、人才、设备和方法的公共支持，使新业务不必每次重新起步。作者强调权力下放与分层控制同时发生；本章PDF143页损坏，相关缺口保留，不声称已读这一页。", "sections": [{"title": "组织必须随技术复杂度变化", "detail": "六七人的项目可由负责人兼顾研发制造，但数字机的多模块与更大团队超出旧方式。总体组管方案、技术评价与协调，项目经理管人员、进度和目标，把个人全能要求转成组织分工。", "anchors": ["PDF p. 133–136"], "excerpts": []}, {"title": "中央研究部整合新业务，也向外输送能力", "detail": "产品形成后，技术骨干流向生产、采购、市场，带着产品知识支持交付；多种新业务又需要独立的研发组织。中研部既对业务部提供支持，又为未来各地研究所准备管理与技术基础，不只是把人集中到同一栋楼。", "anchors": ["PDF p. 136–137"], "excerpts": []}, {"title": "业务单位和公共平台承担不同责任", "detail": "交换、智能、无线与新业务推进产品，基础研究等面向内部提供共性能力；总体办、干部部、计划处分别处理规划、人才与研发物资。公共职能要减少重复与浪费，业务单位又须保留贴近领域的研发判断。", "anchors": ["PDF p. 137–140"], "excerpts": [{"text": "谁最清楚的事情，谁就应该有较大的发言权。", "anchor": "PDF p. 140"}]}, {"title": "放权与分层控制不是互相取消", "detail": "作者概括“谁最清楚谁有发言权”、规划管理执行分层以及组织线条清晰。它的意思不是全部事情都等总部决定，也不是业务部完全独立；需要确定哪些决定属于总体、产品或项目，并提供专业支持。", "anchors": ["PDF p. 140"], "excerpts": []}, {"title": "文化与组织变革共同推进", "detail": "本章大量使用“军队”“党代表”等组织比喻，强调方向、团结、干部培养、反腐和工作作风。变革要求先立后破、协调改良，避免制度真空。比喻帮助理解作者叙事，不能替代具体权责设计，也不能据此推导现实企业的所有管理形式。", "anchors": ["PDF p. 140–142"], "excerpts": []}, {"title": "缺损说明与新业务的可读后续", "detail": "PDF143页、纸质128页为严重横纹，不能辨认，不据目录补写。下一页可读内容记述早期新业务受挫、整合为多媒体业务，并加强硬件平台、内外部协作；传输业务通过借鉴既有光接口和专家资源逐步形成新盈利点。这里只依据PDF144–145页说明后续。", "anchors": ["PDF p. 143–145"], "excerpts": []}, {"title": "公共技术部门沉淀跨产品的能力", "detail": "总体规划、可靠性测试、中试、硬件、软件、对外合作、标准及工程师培养，组成分层支撑。它们解决同一错误重复发生、同一功能反复开发和部门知识隔绝，使产品之间有继承性，而不是只增加汇报层级。", "anchors": ["PDF p. 146–147"], "excerpts": []}, {"title": "各地研究所先承接成熟经验，再独立发展", "detail": "管理人员、项目和流程由总部输出，外地项目需要时回到总部完成关键产品化，稳定后再返回。作者用此解释扩张不等于简单招更多人。章末把思科的收购路线作对照，提示自研之外还存在能力获取方式，其效果仍依赖消化整合。", "anchors": ["PDF p. 147–150"], "excerpts": []}], "argument_flow": ["组织必须随技术复杂度变化", "中央研究部整合新业务，也向外输送能力", "业务单位和公共平台承担不同责任", "放权与分层控制不是互相取消", "文化与组织变革共同推进", "缺损说明与新业务的可读后续", "公共技术部门沉淀跨产品的能力", "各地研究所先承接成熟经验，再独立发展"], "takeaways": ["中央支撑的价值是让各产品与各地团队更能做成事。", "一页原始扫描损坏已明示；其余论述不得被用来猜补缺页。"], "related_concepts": ["layered-planning", "matrix", "platform", "capability", "talent", "culture", "learning"], "anchors": ["PDF p. 133–150"], "confidence": "medium", "voice": "editor", "part": "研发管理篇"}, {"id": "ch-08", "title": "第8章 新手也能做研发", "question": "复杂产品为什么不能只依赖少数高手？", "role": "展开总体规划、矩阵权责、公共平台与人才成长的实际机制。", "mainline": "本章把“新手也能做”建立在组织支撑之上：总体人员分解难题，产品线交付结果，专业线培养人员并积累技术；重大任务再以跨部门项目组织资源。矩阵并非天然有效，高层责任、统一计划、考核与合作文化都需配套。后半章转向芯片和价值链，说明成本、性能与供应自主同技术深度的关系。", "sections": [{"title": "拆解复杂性，需要专职总体工作", "detail": "“满汉全席”比喻先拆核心技术点，再分模块实验与集成；总体办关注跨产品与前瞻规划，业务总体组关注版本和领域方案。兼职总体组因时间不足、评审粗疏而让方案反复，是作者用来说明专职能力的重要反例。", "anchors": ["PDF p. 151–154"], "excerpts": []}, {"title": "大矩阵：业务线拿结果，支撑线建能力", "detail": "业务部面对市场、产品、进度与生产需求，公共职能负责规划、人、物、技术与流程。平台聚合不同产品的共性问题，输出专家、模块和器件经验，降低每个新产品独自求解的负担。横竖方向是书中图示的命名，不是矩阵的唯一画法。", "anchors": ["PDF p. 154–156"], "excerpts": []}, {"title": "小矩阵：同类技术在产品间共同演进", "detail": "同一业务部内又按产品与操作系统、呼叫、信令等专业交叉。工程师的当前任务与专业成长有不同管理来源，项目评价与专业晋升并存；修复一个产品的问题，应让相似产品及时知道，避免错误再次扩散。", "anchors": ["PDF p. 156–158"], "excerpts": []}, {"title": "跨部门项目要能处理既有产品利益冲突", "detail": "接入网与交换机远端模块存在竞争，资源一度不保。跨业务项目组集中骨干，统一安排工作与技术资料，依托各部门技术形成完整方案。这个案例说明内部“各自最优”可能损害新机会，需要公司层面的取舍与资源保证。", "anchors": ["PDF p. 158–161"], "excerpts": []}, {"title": "矩阵的矛盾靠权责、计划与考核化解", "detail": "项目组若只有责任没有人员设备支配权，就会陷入双重指挥。高于职能部门的负责人承担最终协调，统一项目与日常计划及优先级，单列项目考核与奖励，再用合作行为记录辅助评价。作者也承认这些措施无法消灭全部矛盾。", "anchors": ["PDF p. 161–163"], "excerpts": []}, {"title": "成本优势应看全链路，不只看制造工资", "detail": "作者认为当时主要差异来自工程人才、组织效率与核心技术深度，继而讨论自主芯片对成本、集成、性能与供应风险的作用。有关中外工时、工资倍数和芯片节省金额是时代化的估算，不能直接复用于今天，更不能把超时工作当作无代价优势。", "anchors": ["PDF p. 164–168"], "excerpts": []}, {"title": "设计芯片与制造芯片不是同一层能力", "detail": "内部设计、外部专业加工的分工，使团队能针对系统要求优化；它减少对某款外购芯片的限制，却仍依赖制造与工艺伙伴，不能等同于整个产业链完全自主。供应、停产、价格与性能的控制点，要按实际依赖逐项判断。", "anchors": ["PDF p. 165–167"], "excerpts": []}, {"title": "从会原理到可量产，需要长期环境验证", "detail": "孙洪军的学习案例贯穿资料、内部用户、仿真、投片与系统测试。低概率故障可能经过长期捕捉才定位；有的设计失败，有的成功但未量产。新人成长依靠知识、指导、工具、试验和容错，而不是只凭年轻与勤奋。", "anchors": ["PDF p. 168–171"], "excerpts": []}, {"title": "组织模式还需适应经营责任", "detail": "章末用中兴的系统、测试、开发分工及产品总经理作对照，突出总体规划、独立测试和资源责任。作者把研发定位为创造经营价值的活动；这不等于每个基础技术团队都应直接考核当期销售，否则会削弱平台积累。", "anchors": ["PDF p. 171–172"], "excerpts": []}], "argument_flow": ["拆解复杂性，需要专职总体工作", "大矩阵：业务线拿结果，支撑线建能力", "小矩阵：同类技术在产品间共同演进", "跨部门项目要能处理既有产品利益冲突", "矩阵的矛盾靠权责、计划与考核化解", "成本优势应看全链路，不只看制造工资", "设计芯片与制造芯片不是同一层能力", "从会原理到可量产，需要长期环境验证", "组织模式还需适应经营责任"], "takeaways": ["新手能做成复杂工作，前提是组织把专业知识、分解与支持送到任务现场。", "矩阵需要可执行的资源权限与冲突处理，不能只画组织图。"], "related_concepts": ["layered-planning", "matrix", "resource-authority", "platform", "reuse", "reliability", "core-control", "professional-growth"], "anchors": ["PDF p. 151–172"], "confidence": "medium", "voice": "editor", "part": "研发管理篇"}, {"id": "ch-09", "title": "第9章 失败的教训", "question": "为什么技术复杂度更低的产品也会失败，失败后该改什么？", "role": "用多类反例检查平台、市场、伙伴、政策配套和决策治理。", "mainline": "作者不把失败归为工程师不努力，而区分终端渠道与质量、合作方失控、闭门研发、测试及频段配套、竞争低估、知识产权与领导决策等问题。许多项目损失很大，团队经验却被留下；组织随后补足平台规划、立项评审、伙伴管理、知识产权和集体投资决定。全章因此既谈容错，也谈不能重复的制度缺口。", 、开发、中试以及复用合作构成的研发系统。", "mainline": "本章将研发组织分成决定做什么、组织做出来、使其成熟的不同责任，再补以预研、平台、合作、资源与知识共享。目标是让方向、实现与商品化分别有人负责，减少同一项目承担全部未知。标题的“不是赌博”应理解为风险更可管理，不是流程能保证所有研发成功。", "sections": [{"title": "完整体系比只有软硬件和进度更重要", "detail": "没有立项论证和技术管理时，市场与研发可能各自认为对方拖后腿。战略规划、中研和中试并行承担方向、研制与成熟度的职责，减少把项目经理推到没有支持与权限的位置。作者将不同层次的经费比例作为经验叙述，不宜跨口径相加。", "anchors": ["PDF p. 204–208"], "excerpts": []}, {"title": "预研把不确定技术与产品承诺分开", "detail": "跟踪未来核心技术、合作伙伴和标准，成熟结果再交总体规划、产品立项与业务组织。预研转化率过高可能太保守，过低可能离需求太远，是本书重要限定；70%–80%等数值为作者经验目标，不是普适创新KPI。", "anchors": ["PDF p. 208–209"], "excerpts": []}, {"title": "中试检验“能演示”以外的成熟度", "detail": "试制、软硬件测试、实验室、工艺、装备、物料质量和文件等工作，解决批产效率、老化、安装与配套。前期选择未经验证器件，后期可能引发大规模报废与重做；测试能力本身也需要专业人员和工程投入。", "anchors": ["PDF p. 209–212"], "excerpts": []}, {"title": "BOM与技术文件连接整个交付链", "detail": "清单影响采购、成本、报价、生产和装配，不能当成开发结束后随手补的表。频繁无序改动会让多个部门同步返工；专人审查、版本规则与变更责任使信息更稳定。中试不是替研发收拾一切，而是共同提高成熟度。", "anchors": ["PDF p. 211–212"], "excerpts": []}, {"title": "平台“搭积木”：快来自以前已经做好的工作", "detail": "传输、智能平台、接入网和接入服务器等，继承已有架构、接口和维护经验，再围绕新的需求调整。共享平台持续优化，可让多个产品同时受益；相邻实验室与人员交流帮助真正复用，而不是只有代码目录可访问。", "anchors": ["PDF p. 213–215"], "excerpts": []}, {"title": "外部合作与自主掌握并不必然矛盾", "detail": "联合实验室、购买许可与技术、吸收外部方案，让公司不必重复所有基础工作。对外合作部门要具备技术、财务和计划判断，并将取得的能力整理成内部平台。第9章的失败已说明，合作必须有质量、资料、支持及权利边界。", "anchors": ["PDF p. 215–217"], "excerpts": [{"text": "新开发量高于30%不叫创新，叫浪费", "anchor": "PDF p. 217"}]}, {"title": "“新开发不高于30%”是特定经营约束", "detail": "书中强调70%利用已有成熟或可取得技术，反对为原创而重复劳动。这不能套用到所有基础研究、技术代际或新领域，也不能把不经授权复制解释成“拿来”。比例背后的问题是：哪些未知确实需要自己承担，哪些可以可靠复用或合作取得。", "anchors": ["PDF p. 217–219"], "excerpts": []}, {"title": "共享必须进入日常职责与组织安排", "detail": "技术协会、经验总结、轮训、导师和平台访问让交流不再完全依赖个人热心。新员工带回技术并用在其他产品，体现能力传播的链条。规划、执行与专业支持共同存在，比只要求每个人加倍努力更有持续性。", "anchors": ["PDF p. 219–220"], "excerpts": []}], "argument_flow": ["完整体系比只有软硬件和进度更重要", "预研把不确定技术与产品承诺分开", "中试检验“能演示”以外的成熟度", "BOM与技术文件连接整个交付链", "平台“搭积木”：快来自以前已经做好的工作", "外部合作与自主掌握并不必然矛盾", "“新开发不高于30%”是特定经营约束", "共享必须进入日常职责与组织安排"], "takeaways": ["将方向风险、技术风险与成熟度风险分开组织处理。", "新产品的速度，往往来自长期平台、人才和验证资产，而非当前项目少做检查。"], " 。编者建议将标准解释、证据反馈、复核渠道和过渡成本同时纳入评价，避免以“新鞋夹脚”合理化可以预防的损害。", "anchors": ["PDF p. 235–236"], "excerpts": []}], "argument_flow": ["软件能力把市场需求转为产品差异", "测试提前并行，规范减少后期不可接续", "成熟度方法帮助从个人经验走向组织过程", "技术管理是专门工作，需要懂行的人承担", "文档与项目管理靠例行机制落地", "绩效包括短期结果与长期能力", "岗位标准与关键事例提高评价可讨论性", "制度推行也要看到纠错成本由谁承担"], "takeaways": ["用规则、证据与专业支持改善协作，不以管理活动数量充当效果。", "既承认业务结果，也承认长期技术、人员与过程能力。"], "related_concepts": ["software-engineering", "validation", "configuration", "process", "professional-growth", "performance", "knowledge-sharing", "change-management"], "anchors": ["PDF p. 221–236"], "confidence": "medium", "voice": "editor", "part": "研发管理篇"}, {"id": "ch-13", "title": "第13章 花了波音的钱买的不是飞机", "question": "内部技术管理已有基础，为什么还需要全公司的产品开发变革？", "role": "完整说明从研发中心视角转向生命周期投资与跨部门产品责任。", "mainline": "产品多、需求杂、规模迅速扩大后，研发内部的矩阵仍不能解决采购、维护、制造与市场事后返工。IPD把产品开发看成投资，由跨部门PDT提出业务计划、IPMT决定与配置资源，将需求和可交付性前置。咨询的价值还在试点、权责调整、模板、IT、培训与支持习惯；不是买一本流程手册就会改变组织。", "sections": [{"title": "旧模式的瓶颈是总流程，而不只是写代码慢", "detail": "新版本常为追补零散要求，前后不兼容、功能未稳又继续加，物料与可维护需求较晚才出现。新人规模增长使单次“反幼稚”讨论难以覆盖，问题反复。快速推出版本不一定代表整体交付更快，可能是在偿还先前缺少设计的代价。", "anchors": ["PDF p. 237–239"], "excerpts": []}, {"title": "向IBM学习的是规模化后的经营管理", "detail": "作者以IBM危机与整合经验作镜子，说明缩小规模可能失去竞争力，扩大又可能官僚化。这里的历史和效果数字并未独立核验；学习重点是跨职能、投资评审和资源流程，不是把另一个公司的成功公式全盘当作事实保证。", "anchors": ["PDF p. 239–242"], "excerpts": []}, {"title": "PDT把产品责任移出研发单一部门", "detail": "每个团队由市场、研发、财务、采购、服务、制造和品质等代表组成。产品经理向产品线管理团队负责，研发不再独自决定做什么。其他职能早期拥有专业发言权，不表示任何单一销售请求都能直接变成规格。", "anchors": ["PDF p. 242–243"], "excerpts": []}, {"title": "变革先诊断、培训沟通，再试点", "detail": "项目围绕需求、项目、系统工程、结构化流程、团队、技术、IT、管道和能力培养查找问题。内部骨干与有实践经验的顾问专职参与；高层承诺提供资源。书中惩罚缺席、降级等事例属于强制推进方式，不能省略其对参与安全感的影响。", "anchors": ["PDF p. 243–245"], "excerpts": []}, {"title": "产品开发是一项跨部门共同论证的投资", "detail": "市场代表识别需求与规模，研发提出方案和资源估算，财务分析生命周期收益与成本，服务、制造、采购及品质提出约束。业务计划提交IPMT，后者批准并提供资源、跟踪进展。与第8章研发内部矩阵相比，范围扩展到全公司产品经营。", "anchors": ["PDF p. 245–247"], "excerpts": []}, {"title": "前置需求会延长前段，却可能减少总返工", "detail": "维护、物料和制造要求设计时就出现，避免到生产或客户现场再推翻方案。作者报告成本与周期改善，但样本、基线与独立对照不详；90%设计、10%开发等说法不宜机械转成排期比例。核心是比较总周期与真实交付质量。", "anchors": ["PDF p. 247–248"], "excerpts": []}, {"title": "推广改变了部门权力与利益分配", "detail": "从特区试点到更大范围，原有控制者与新参与者的权责重排，引发明争与不配合。高层支持、岗位调整与版本迭代让流程逐步落实；清除阻力不能替代分析异议是否指出资源或设计上的真实缺陷。", "anchors": ["PDF p. 248–249"], "excerpts": []}, {"title": "固化是例行化、规范化与IT化共同发生", "detail": "把应有步骤变成明确流程，用模板表达输入输出，再以系统承载评审、记录和流转。工具并不自动纠正低质量内容；作者也强调可用性要逐点打磨，依靠反复整理、培训和真实工作习惯，而非一夜完成改革。", "anchors": ["PDF p. 249–251"], "excerpts": []}, {"title": "知识支持从找熟人变成有组织的服务", "detail": "值班专家、专家组和供应商支持构成逐级升级渠道，常见问题又沉淀成共享经验。系统的价值在回答及时有效、有维护者，并能让新员工使用，不是上传文件后宣布知识管理已经完成。", "anchors": ["PDF p. 251–252"], "excerpts": []}, {"title": "市场驱动与投资治理最终接到经营结果", "detail": "概念与计划阶段研究不同层次客户、产品收益和交付条件，短消息产品的例子显示先验证再设计能减少牵牛来却要马的错配。资料开发与产品同步；咨询投入应包含内部人员和IT，书末明确5000万美元为多年综合成本，不能一律标成单笔顾问费。", "anchors": ["PDF p. 253–256"], "excerpts": []}], "argument_flow": ["旧模式的瓶颈是总流程，而不只是写代码慢", "向IBM学习的是规模化后的经营管理", "PDT把产品责任移出研发单一部门", "变革先诊断、培训沟通，再试点", "产品开发是一项跨部门共同论证的投资", "前置需求会延长前段，却可能减少总返工", "推广改变了部门权力与利益分配", "固化是例行化、规范化与IT化共同发生", "知识支持从找熟人变成有组织的服务", "市场驱动与投资治理最终接到经营结果"], "takeaways": ["衡量从需求到可生产、可销售、可维护的总周期，不能只压缩编码时间。", "PDT推进完整产品，IPMT决定资源与投资；流程、评价和系统必须配套。"], "related_concepts": ["ipd", "pdt", "investment-review", "requirements", "lifecycle-cost", "parallel-development", "change-management", "process", "knowledge-sharing", "customer-value"], "anchors": ["PDF p. 237–256"], "confidence": "medium", "voice": "editor", "part": "研发管理篇"}, {"id": "ch-14", "title": "第14章 剑挑霸王龙", "question": "后来者怎样在强势技术、品牌和渠道面前找到进入点？", "role": "将前面的平台、市场、合作与软件工程放进一条竞争路径检验。", "mainline": "北京研究所先经历ISDN失利与基础协议积累，随后A8010借助广东电信共同定义、本地需求与既有交换技术切入市场；路由器又把关注点转到运营可管理性、计费与客户经营。后期通过合资和伙伴渠道扩大范围。作者把它概括为三次出招，但来源不清的软件与知识产权争议必须保留，不能被“拿来主义”遮住。", "sections": [{"title": "先积累可复用能力，不代表每次都能赶上市场", "detail": "简陋研究所、人才难招与ISDN终端不成熟导致首发受挫；增加人员、改善环境和研究通信协议，为下一机会保留基础。这里与第1章“先生存后投入”并不完全同一阶段，应按资源条件理解，不把未确定产品就大量招人当作通用建议。", "anchors": ["PDF p. 259–262"], "excerpts": []}, {"title": "A8010：客户共同定义让模糊机会具体化", "detail": "接入服务器最初因市场与规格不明被否决，广东电信提出大容量、七号信令需要后，联合团队形成更明确规格。交换技术、协议软件及跨部门人员结合，上海等试点再完善功能。这个过程展示评审可以随新证据改变，不只是挡住想法的门。", "anchors": ["PDF p. 262–265"], "excerpts": []}, {"title": "压强原则聚焦的是可形成差异的突破口", "detail": "资源有限时集中到一个能利用已有能力的机会，再逐步扩展；不是所有产品同时平均分配。A8010的本地容量和接续需要在书中构成差异；市场占比、网速提高等数字缺少独立对照，不以它们证明某一做法必然有效。", "anchors": ["PDF p. 263–265"], "excerpts": []}, {"title": "路由平台与软件质量：写得多不等于做得好", "detail": "VRP平台支持路由器系列，但早期大量救火显示协议拼接和快速编码不等于可维护软件。印度合作与CMM学习使团队重新关注质量和整体过程。代码行数的对话是案例，不是应设定的人均产出基准。", "anchors": ["PDF p. 265–269"], "excerpts": []}, {"title": "来源不清的代码是本章必须正视的反例", "detail": "作者记述购买所谓对手源码，并承认当时无法确定其真实性，还讨论仿照编号和命令格式。购买、公开可下载、内部咨询都不能自动证明拥有使用权；本分析不复述取得或绕过手段，不以作者辩护代替事实审查，更不把和解当作无侵权证明。", "anchors": ["PDF p. 266–268、271"], "excerpts": []}, {"title": "改变比较维度：从设备参数到运营结果", "detail": "宽窄带一体化、综合管理和计费等，把已有窄带能力与数据设备结合，回应运营商投资与管理压力。IPD让市场、维护和研发共同确认规格，竞争不只剩“同样功能更便宜”，而成为谁能提供完整可经营的网络方案。", "anchors": ["PDF p. 269–271"], "excerpts": []}, {"title": "渠道联盟扩大能力边界，也要求整合治理", "detail": "与3COM等合作将技术与资金、品牌和企业渠道组合，其他区域伙伴也提供不同市场入口。作者对思科几乎只靠收购、不做研发等描述过于绝对，应当作其竞争解释；评估联盟要看可贡献能力、权责与后续支持，不只看一次交易估值。", "anchors": ["PDF p. 271–274"], "excerpts": []}], "argument_flow": ["先积累可复用能力，不代表每次都能赶上市场", "A8010：客户共同定义让模糊机会具体化", "压强原则聚焦的是可形成差异的突破口", "路由平台与软件质量：写得多不等于做得好", "来源不清的代码是本章必须正视的反例", "改变比较维度：从设备参数到运营结果", "渠道联盟扩大能力边界，也要求整合治理"], "takeaways": ["找到与实际客户相连的差异点，再用平台和组织兑现。", "技术可取得、代码可读与权利可使用必须分别判断。"], "related_concepts": ["competition", "differentiation", "pressure-principle", "pilot", "platform", "software-engineering", "partnership", "ecosystem", "customer-value"], "anchors": ["PDF p. 259–274"], "confidence": "medium", "voice": "editor", "part": "竞争篇"}, {"id": "ch-15", "title": "第15章 暗战、暗合与谍战", "question": "竞争对手为何既施加压力，也可能共同改善产业条件？", "role": "将企业竞争扩展到人才、供应链、行业可信度与边界。", "mainline": "作者用华为与中兴的同城竞争，讨论领导风格、产品切入、技术深度、海外渠道和薪酬如何相互影响。双方共享供应与人才环境，客户又希望有多个可靠选择，所以竞争不只是一家赢另一家灭。章节还包含谍战、泄密与员工监控的强烈指控，应保留来源与伦理边界，不能转为采纳建议。", "sections": [{"title": "“狼”与“牛”是叙事比喻，不是测量模型", "detail": "任正非和侯为贵的风格被作者分别概括为战略动员与谨慎实干；文化确会影响组织，但个人性格不能穷尽公司能力。销售比较图反映当时阶段，不代表今天的地位，也不能单凭图表证明全部成功原因。", "anchors": ["PDF p. 275–276"], "excerpts": []}, {"title": "跟随、深耕与差异化交替发生", "detail": "双方在交换、接入、视频、无线和智能网有先后不同，海外经验和管理方法也相互学习。作者一方面肯定深入核心技术，另一方面记录过度跟随会错过新机会；竞争分析应追问哪些能力、渠道和客户不同，而不是只看谁先发。", "anchors": ["PDF p. 277–279"], "excerpts": []}, {"title": "产业聚集使对手也处在共同生态中", "detail": "供应商、外包加工、工程师与配套企业围绕同城需求集聚，竞争增加供给与人才选择。但供应商接触多家客户不意味着可转交任何对方技术资料，人才流动也不能自动等同于知识产权可带走；这是对书中“暗合”叙述的边界补充。", "anchors": ["PDF p. 278–280"], "excerpts": []}, {"title": "多家可靠供应商可能增强客户信任", "detail": "客户希望避免单一来源，不同中国企业都能达到要求，也可能降低外部客户对新供方的疑虑。员工薪酬与职业机会受到竞争牵引，产业本身也会成长；这些是作者提出的协同解释，不意味着对手间存在正式共谋。", "anchors": ["PDF p. 279–281"], "excerpts": []}, {"title": "谍战指控不能替代证据与适当程序", "detail": "正文记述窃取资料、监听、邮件检查、配偶名单与限制晋升等做法，部分明确以“据说”呈现。仅凭本书不能认定具体事件真实，也不能把员工家庭关系视为有罪证据。本页只提炼资料边界与可核查治理的需求，不推荐侵入式手段。", "anchors": ["PDF p. 281–282"], "excerpts": []}, {"title": "把对手当学习压力，竞争回到客户与产品", "detail": "最后强调对手促使企业改进，不能因一时领先而失去警觉。章末将成本领先、差异化和目标聚焦列作战略方向。与其复制战争语言，更应观察产品价值、总成本、资源分配和行业健康的具体变化。", "anchors": ["PDF p. 282–284"], "excerpts": [{"text": "企业之间的竞争应回到对市场、对顾客、对产品、对行业本身的分析和掌控上", "anchor": "PDF p. 284"}]}], "argument_flow": ["“狼”与“牛”是叙事比喻，不是测量模型", "跟随、深耕与差异化交替发生", "产业聚集使对手也处在共同生态中", "多家可靠供应商可能增强客户信任", "谍战指控不能替代证据与适当程序", "把对手当学习压力，竞争回到客户与产品"], "takeaways": ["竞争与共同生态可以同时存在，但不等于可以越过资料、人员与客户边界。", "让比较回到用户结果与可持续能力，不把伤害对手本身当目标。"], "related_concepts": ["competition", "ecosystem", "differentiation", "talent", "knowledge-sharing", "governance", "service"], "anchors": ["PDF p. 275–284"], "confidence": "medium", "voice": "editor", "part": "竞争篇"}], "concepts": [{"id": "survival", "title": "生存约束与阶段选择", "one_line": "按现金、能力与市场阶段安排投入。", "explanation": "初创先通过代理形成收入、渠道和需求认识，再逐步进入自研；后来规模与竞争变化又迫使公司加大投入。作者反复强调“活下来”，它不是永远保守，而是使每个阶段的承诺与资源相称。", "factors": [{"name": "资源条件", "detail": "同样的研发决定，在可周转资金与人员不同的公司风险不同。", "anchors": ["PDF p. 17–35、110–111"]}, {"name": "市场时机", "detail": "等待也有失去窗口的成本，不能只比较当期支出。", "anchors": ["PDF p. 17–35、110–111"]}], "effects": ["影响投入先后与扩张速度。"], "observables": ["列出从当前投入到实际回款之间需要跨越的条件。", "区分已有能力、可取得能力与尚无验证的假设。"], "boundary": "最终成功不能证明当初孤注一掷总是合理。", "relations  p. 287", "pdf_page": 287, "printed_page": 272, "status": "read", "kind": "致谢", "notes": "阅读亲历回忆、前同事与公开资料等来源背景，不视为独立核验。"}, {"range": "PDF p. 288", "pdf_page": 288, "printed_page": 273, "status": "read", "kind": "致谢", "notes": "阅读亲历回忆、前同事与公开资料等来源背景，不视为独立核验。"}], "overview": [{"title": "一条主线：从卖设备到建设研发体系", "summary": "研发成功由经营条件与工程机制共同支撑。", "details": ["代理和服务带来现金、客户与需求认识；受制于供货后，组装与自研逐步改变能力边界。", "人才与回报、技术与资金、市场与交付互相牵引，任何一项孤立领先都不足以保证成功。", "全书后半部把关注点从一次攻关转到共用平台、可靠性、中试、流程和产品投资。"], "anchors": ["PDF p. 17–35、110–130、204–256"], "voice": "editor", "related_concepts": ["survival", "capability", "cash-cycle"]}, {"title": "创业篇｜第1—4章", "summary": "从机会到产品，中间隔着路线选择和真实交付。", "details": ["第一桶金不是纯粹自研神话，而是先交易、先服务，再逐步掌握产品。", "JK1000失利提示：技术能做出来，不代表市场窗口、竞争条件和客户选择仍然成立。", "数字交换机攻关与早期现场磨合，区分了功能实现、稳定运行和长期服务。验收失真及过劳需作为问题看待。"], "anchors": ["PDF p. 17–84"], "voice": "editor", "related_concepts": ["market-orientation", "timing", "validation", "reliability"]}, {"title": "人才和资金篇｜第5—6章", "summary": "让人才愿意投入，也要让公司有钱持续兑现。", "details": ["作者用股权、价值分配、高薪与机会解释人才聚集，分配依据必须能被理解并持续评价。", "技术合作、合资、转让、代理及信贷分别改变现金链不同环节，并非一种神奇融资方法。", "员工借款、延期支付与客户持股也使风险和利益交叉，不能因后来的结果正向就省略参与者负担。"], "anchors": ["PDF p. 87–130"], "voice": "editor", "related_concepts": ["value-distribution", "incentives", "cash-cycle", "governance"]}, {"title": "研发管理篇前半｜第7—9章", "summary": "组织的价值在于降低对少数能人的依赖。", "details": ["总体规划、项目执行与公共支撑分层，让多条产品线共享技术和专业资源。", "矩阵把项目进度和专业能力交叉起来，也要求处理调配、计划与考核的冲突。", "失败案例暴露单人决断、市场误判、合作质量和工程验证不足；损坏的PDF143页保留缺口。"], "anchors": ["PDF p. 133–193"], "voice": "editor", "related_concepts": ["layered-planning", "matrix", "platform", "learning"]}, {"title": "研发管理篇后半｜第10—12章", "summary": "研究、开发、产品化与管理需要不同工作。", "details": ["海外学习的意义是吸收研发理念和管理方法，而非把出访当作能力成果。", "预研探索未知，开发把路线做成产品，中试检验可重复制造与交付；继承和复用减少重复劳动。", "软件工程、专家网络、任职资格与绩效分配，让质量和成长有可持续的制度载体。"], "anchors": ["PDF p. 194–236"], "voice": "editor", "related_concepts": ["pre-research", "industrialization", "reuse", "software-engineering", "professional-growth"]}, {"title": "第13章｜IPD把开发变成产品经营", "summary": "跨部门共同判断什么值得做，以及怎样交付。", "details": ["PDT整合市场、研发、制造、采购、财务、服务等职能，IPMT侧重产品投资与组合取舍。", "把需求、生命周期成本、阶段评价和并行参与联系起来，减少部门各自最优造成的整体损失。", "咨询、培训、试点、推广、流程与IT共同支撑变革；投入金额不能直接等同于一笔咨询费。"], "anchors": ["PDF p. 237–256"], "voice": "editor", "related_concepts": ["ipd", "pdt", "investment-review", "requirements", "lifecycle-cost"]}, {"title": "竞争篇｜第14—15章", "summary": "竞争推动学习，产业生态也可能共同成长。", "details": ["把竞争拆为客户价值、核心能力、软件与成本、渠道伙伴及进入市场的时机。", "华为和中兴被作者描述为互相施压，也共享人才、供应与行业可信度。", "战争比喻、诉讼和谍战叙述不自动构成事实裁定；不能从商业成就推出侵犯资料或人员边界的合理性。"], "anchors": ["PDF p. 259–284"], "voice": "editor", "related_concepts": ["competition", "differentiation", "partnership", "ecosystem", "governance"]}, {"title": "怎么带走方法，而非只记故事", "summary": "把每个结论转成条件、证据和可观察信号。", "details": ["对一个项目同时检查客户问题、技术未知、现金节点、交付条件与责任归属。", "对一项制度同时检查解决什么旧问题、带来什么新成本，以及员工和客户能否反馈。", "作者回忆、公开材料与观点不是同一种证据；本页的管理框架是有出处的编者重构。"], "anchors": ["PDF p. 5–8、173–193、285–288"], "voice": "editor", "related_concepts": ["validation", "learning", "governance"]}], "formulations": [{"text": "机会牵引人才，人才牵引技术，技术牵引产品，产品牵引更大的机会。", "verbatim": true, "anchors": ["PDF p. 99"], "commentary": "它描述机会、人才与产品之间的循环。不能只做招聘或只加研发预算，而不管客户与资源；循环能否成立仍需具体证据。", "context": "第5章人才与机会的联系；为书中转述的企业观点。", "voice": "author", "verification": "目视核对扫描页；空格与标点规范化。"}, {"text": "一把手的首要职责是盯着现金流，解决资金问题。", "verbatim": true, "anchors": ["PDF p. 130"], "commentary": "语境是研发型企业的资金困境，强调经营者不能只盯技术或订单；“首要”是作者的强调，不宜解释为负责人可以不管质量与客户。", "context": "第6章小结。", "voice": "author", "verification": "目视核对扫描页；空格与标点规范化。"}, {"text": "谁最清楚的事情，谁就应该有较大的发言权。", "verbatim": true, "anchors": ["PDF p. 140"], "commentary": "与分层控制、线条清晰并列。专业判断应进入决策，但仍需明确责任与复核，不能把“最清楚”变成不受质疑的身份。", "context": "第7章，书中引述郑宝用对中研部架构的总结。", "voice": "author", "verification": "目视核对扫描页；空格与标点规范化。"}, {"text": "只有理念一流、管理一流，才能有一流的研发。", "verbatim": true, "anchors": ["PDF p. 203"], "commentary": "作者在海外学习小结中反对把差距仅归因于人员素质。它是管理立场；具体改进仍应落到需求、验证、协作与学习机制。", "context": "第10章小结，跨原行合并，未改写措辞。", "voice": "author", "verification": "目视核对扫描页；空格与标点规范化。"}, {"text": "新开发量高于30%不叫创新，叫浪费", "verbatim": true, "anchors": ["PDF p. 217"], "commentary": "标题及正文用于强调成熟技术继承、合作与购买。它具有阶段和对象限制，“新开发量”的计算口径也未展开，不能当作一般创新定律。", "context": "第11章小标题；书中归于任正非的主张。", "voice": "author", "verification": "目视核对扫描页；空格与标点规范化。"}, {"text": "贵在管理，管理又贵在细节", "verbatim": true, "anchors": ["PDF p. 235"], "commentary": "这里讨论从小团队到大规模研发的基础管理、任职资格与实际执行。细节不是事事加审批，而是让责任、规则与反馈真能工作。", "context": "第12章末尾，截取连续原文短语。", "voice": "author", "verification": "目视核对扫描页；空格与标点规范化。"}, {"text": "企业之间的竞争应回到对市场、对顾客、对产品、对行业本身的分析和掌控上", "verbatim": true, "anchors": ["PDF p. 284"], "commentary": "章末将竞争回到经营问题，有助于约束前文的战争比喻。本文将“掌控”理解为分析和能力建设，不引申为对客户或行业的支配权。", "context": "第15章小结，连续短引。", "voice": "author", "verification": "目视核对扫描页；空格与标点规范化。"}], "critique": [{"title": "亲历叙述的长处与局限", "analysis": "作者接近早期研发现场，能够解释组织、人物与项目细节；同时写作目的带有认同和励志倾向，回忆与成功后的解释可能选择性强调某些因素。本页保留其叙事来源，不把单一公司史当成普适因果证明。", "anchors": ["PDF p. 5–8、285–288"], "related_concepts": ["learning", "validation"], "voice": "editor", "confidence": "medium"}, {"title": "成功后的故事可能掩盖相同做法的失败条件", "analysis": "冒险、集中投入、强人决断和高强度工作都曾与成功同时出现，但第2、9章也提供误判与失败。判断方法需要比较何时有效、何时失效，不能只从最后活下来的公司归纳。", "anchors": ["PDF p. 36–50、173–193"], "related_concepts": ["timing", "portfolio", "validation"], "voice": "editor", "confidence": "medium"}, {"title": "市场导向与引导需求之间需要一条验证链", "analysis": "作者既强调先有市场，也强调技术突破与引导需求。这并非天然冲突：可以先识别问题，再用技术试探潜在价值；若用“引导”拒绝实际反馈，就会回到JK1000式路线风险。", "anchors": ["PDF p. 22–24、38–45、253–254"], "related_concepts": ["market-orientation", "requirements", "pre-research"], "voice": "editor", "confidence": "medium"}, {"title": "自主研发与复用不是二选一", "analysis": "掌握关键设计、外购器件、合作开发和成熟技术复用可以同存。应说明关键依赖与权利条件，再比较自建和获取的总成本，不能把自主等同于全部重写，也不能把可下载等同于可使用。", "anchors": ["PDF p. 165–168、213–220、268–274"], "related_concepts": ["core-control", "reuse", "partnership"], "voice": "editor", "confidence": "medium"}, {"title": "人才激励叙事需要补上风险承担者", "analysis": "书中白条、员工投入、借款与股权常被成功回报解释。参与者承担的流动性、集中风险和工作压力应与回报一起描述；高薪也不能自动抵偿健康损失或使非自愿安排合理。", "anchors": ["PDF p. 31–33、87–109、120–126"], "related_concepts": ["incentives", "value-distribution", "governance"], "voice": "editor", "confidence": "medium"}, {"title": "验收和测试的可信度必须区别于过关", "analysis": "第4章有操作验收结果的叙述，后文则强调测试与质量。不能将前者作为创业机智传播；受控测试、如实记录和独立复核，才使后文的工程管理结论成立。", "anchors": ["PDF p. 75、169–170、209–212"], "related_concepts": ["validation", "reliability", "governance"], "voice": "editor", "confidence": "medium"}, {"title": "增长率和投入金额都要保留口径", "analysis": "第6章列出若干年度销售额后又作较笼统的增长率概括，二者并不宜直接互证。第13章先突出咨询费用，后在PDF255页把多年投入解释为咨询、内部人员与IT等总投入。本页不把这些数字提炼成未经核查的投资回报公式。", "anchors": ["PDF p. 118、237–240、255"], "related_concepts": ["cash-cycle", "investment-review", "validation"], "voice": "editor", "confidence": "medium"}, {"title": "百分比不是普适处方", "analysis": "研究投入、总体规划投入与新开发比例分别讨论不同对象和分母。书中10%、30%、70%等数字不能混成固定配方；更合理的迁移是先分类工作、识别未知与复用条件，再设自己的验证目标。", "anchors": ["PDF p. 134–140、208–209、217–218"], "related_concepts": ["pre-research", "reuse", "layered-planning"], "voice": "editor", "confidence": "medium"}, {"title": "IPD不能简化为一次咨询或几张表", "analysis": "第13章包含市场观、投资治理、PDT、需求、并行开发、流程、任职与IT的配套。照搬模板却不改变资源承诺和决策依据，可能只增加文件。书中强制推行的经验也需评估反馈、纠错和员工负担。", "anchors": ["PDF p. 242–256"], "related_concepts": ["ipd", "change-management", "resource-authority"], "voice": "editor", "confidence": "medium"}, {"title": "竞争指控与和解都不是本页可以裁决的事实", "analysis": "知识产权争议、泄密、监听等内容有作者立场，部分以传闻呈现。和解本身不能证明某方全对或全错，商业成就也不能验证每一项指控。这里只分析治理与合作边界，不给出案件结论。", "anchors": ["PDF p. 259–262、268–274、281–282"], "related_concepts": ["governance", "partnership", "competition"], "voice": "editor", "confidence": "medium"}, {"title": "历史行业经验不能直接当作今天的标准", "analysis": "正文涉及通信设备、当时市场紧缺、早期企业融资及成熟度体系。软件服务、AI产品和小团队的成本结构不同；本页不声称旧版CMM/CMMI用语等同于现行标准，也不将历史融资方式写成当前操作建议。", "anchors": ["PDF p. 20–24、110–130、224–226"], "related_concepts": ["software-engineering", "lifecycle-cost", "open-learning"], "voice": "editor", "confidence": "medium"}], "reality": [{"title": "销售拿到订单，产品却交不稳", "anchors": ["PDF p. 22–29、68–84、209–212"], "related_concepts": ["service", "industrialization", "configuration"], "voice": "editor", "confidence": "  {"term": "CMM／CMMI", "definition": "书中涉及的软件过程成熟度相关称谓，正文用语有所混杂。本页按历史材料记录，不将其当作现行认证指南。", "anchors": ["PDF p. 224–226"], "voice": "editor", "related_concepts": ["software-engineering"]}, {"term": "压强原则", "definition": "以集中有限资源形成局部突破的比喻。仍需市场依据、配套能力与退出条件。", "anchors": ["PDF p. 142、263–264"], "voice": "editor", "related_concepts": ["pressure-principle"]}, {"term": "知识资本化", "definition": "作者对知识贡献获得持续收益与组织留存的一种解释；不等于知识可以无条件精确估价，具体制度有参与和风险问题。", "anchors": ["PDF p. 87–109"], "voice": "editor", "related_concepts": ["knowledge-capital"]}], "notes": ["唯一内容来源为用户提供的本地《02-华为研发(jb51.net).pdf》，未借用网络摘要代替正文阅读。书名《华为研发》，张利华著，机械工业出版社，2009年10月第1版第1次印刷。", "扫描PDF288页，15章。PDF1—15为封面、版权、前言和目录等；PDF16起纸质页码＝PDF页序−15。原文按钮使用PDF页序，不将纸质页码直接放入链接。", "PDF143／纸质128页存在严重横纹损坏，原始嵌入图像与PDFium、Poppler渲染均相同。该页正文不可读，故coverage=partial。目录所列小标题只能说明结构位置，不能推导缺页论证。", "其余可读正文、前言、后记与致谢已经阅读并纳入结构。PDF85、131、257为无实质正文的空白过渡页。封面、封底推荐语和目录均不单独用作经营成效证据。", "本页逐章解读、概念、关系、现实问题与行动清单均为编者依据原书重构，不是原书全文，也不声称作者逐字提出了这些框架。仅标有“原文短引”的7项保留原措辞，另附语境和PDF定位。", "OCR可能把型号、年份、金额、相近字和百分比识错。短引已回看扫描图；其余内容优先用可辨认的论证释义，疑点保留边界，不静默编造精确数据。", "作者亲历、同事回忆、转引讲话、公开材料、评论和传闻具有不同证据强度。企业增长、员工回报、竞争指控等未获独立核验，分析中的中等置信度表示出处可定位，非事实已被外部审计。", "第6章增长概括与年度数字口径需复核；第13章多年总投入含咨询、内部人员和IT，不能一概称单笔顾问费；研究、规划与新开发比例也采用不同对象。", "正文中多处使用战争、动物和领导者比喻，并有过劳、验收失真、员工融资与侵入式监控等叙述。本页保留相关问题，既不回避也不改写成推荐做法。", "法律、融资、劳动关系、竞争争议与软件过程成熟度均按2009年书中语境分析，不构成现行规范结论。涉及AI产品的对照仅属编者迁移提示，需要单独验证。", "HTML正文、样式、脚本与书籍数据全部内嵌，无自动联网资源。原文按钮需要保留相邻的源PDF；复制HTML后仍能阅读分析，但PDF跳转需要一起携带并维持相对路径。", "搜索会打开命中的章节和子论证，回车跳下一处、Shift+回车上一处；各大板块、章节与子论证均可收起。概念按钮可跨阅读模式跳转，返回按钮保留原阅读位置。打印会展开两种模式内容。"], "framework": [{"title": "看清机会与未知", "detail": "客户问题、市场时机、预研与路线选择", "ids": ["market-orientation", "pre-research", "timing"]}, {"title": "作出投资承诺", "detail": "现金约束、组合取舍与产品团队", "ids": ["cash-cycle", "investment-review", "pdt"]}, {"title": "形成可交付产品", "detail": "平台复用、版本一致、中试与验证", "ids": ["platform", "configuration", "industrialization", "validation"]}, {"title": "交付、反馈与再投入", "detail": "服务、共享、评价与能力循环", "ids": ["service", "knowledge-sharing", "performance", "capability"]}]}</script>
<script>
const D=JSON.parse(document.getElementById('book-data').textContent);let mode='read',readPosition=0;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const sourceHref=a=>{const m=String(a).match(/PDF p\.\s*(\d+)/);return m?`${D.meta.source_file}#page=${m[1]}`:null};
const arr=v=>Array.isArray(v)?v:[],anchors=v=>arr(v).map(x=>sourceHref(x)?`<a class="tag anchor" target="_blank" rel="noopener" href="${esc(sourceHref(x))}">原文 ${esc(x)} ↗</a>`:`<span class="tag anchor">${esc(x)}</span>`).join('');
const voice=v=>v==='editor'?'<span class="tag editor">编者分析</span>':v==='external'?'<span class="tag">外部资料</span>':'';
const list=(items,cls='detail-list')=>arr(items).length?`<ul class="${cls}">${arr(items).map(x=>`<li>${esc(typeof x==='string'?x:x.detail||x.name)}</li>`).join('')}</ul>`:'';
const excerpts=items=>arr(items).map(x=>`<blockquote class="excerpt">“${esc(x.text)}”<br>${anchors([x.anchor])}</blockquote>`).join('');
const card=(x,body='')=>`<article class="card searchable"><h3>${esc(x.title||x.question||x.term)}</h3>${body}${arr(x.related_concepts).length?relationButtons(x.related_concepts):''}${voice(x.voice)}${anchors(x.anchors)}</article>`;
const section=(id,kicker,title,sub,body,m,open=false)=>`<section id="${id}" data-mode-section="${m}" class="mode-section"><button class="section-toggle" aria-expanded="${open}" aria-controls="${id}-body"><span class="section-heading"><span class="section-kicker">${kicker}</span><span class="section-title">${title}</span><span class="section-sub">${sub}</span></span><span class="chevron" aria-hidden="true">＋</span></button><div class="section-body" id="${id}-body" ${open?'':'hidden'}>${body||'<p class="empty">本书未设置此部分。</p>'}</div></section>`;
function relationButtons(ids){return `<div class="relation-list">${arr(ids).map(id=>{const c=arr(D.concepts).find(x=>x.id===id);return c?`<button class="concept-link" data-concept-target="${esc(id)}">${esc(c.title)}</button>`:''}).join('')}</div>`}
function chapter(x,i){const parts=arr(x.sections).map(s=>`<details class="subargument searchable"><summary>${esc(s.title)}</summary><div class="subargument-content"><p>${esc(s.detail)}</p>${excerpts(s.excerpts)}${anchors(s.anchors)}<div class="source-note">依据原书释义 · 非全文转载</div></div></details>`).join('');const flow=arr(x.argument_flow).length?`<div class="argument-flow">${x.argument_flow.map((s,j)=>`${j?'<span class="flow-arrow">→</span>':''}<span class="flow-step">${esc(s)}</span>`).join('')}</div>`:'';return `<article class="fold chapter searchable" id="${esc(x.id)}"><button class="fold-toggle" aria-expanded="${i===0}" aria-controls="${esc(x.id)}-body"><span class="fold-no">${String(i+1).padStart(2,'0')}</span><span><span class="fold-title">${esc(x.title)}</span><span class="fold-role">${esc(x.role)}</span></span><span class="chevron" aria-hidden="true">＋</span></button><div class="fold-body" id="${esc(x.id)}-body" ${i===0?'':'hidden'}>${x.question?`<p class="chapter-question"><b>本章回答：</b>${esc(x.question)}</p>`:''}<p class="mainline"><b>本章主线：</b>${esc(x.mainline||x.summary)}</p>${flow}${parts}${arr(x.takeaways).length?`<h4>读完应留下什么</h4>${list(x.takeaways)}`:''}${arr(x.related_concepts).length?`<div class="concept-block"><h4>相关概念</h4>${relationButtons(x.related_concepts)}</div>`:''}<span class="tag editor">依据原书重构</span><span class="confidence">依据强度：${esc(x.confidence||'未标注')}</span>${anchors(x.anchors)}</div></article>`}
function concept(x){const factors=arr(x.factors).map(f=>`<li><b>${esc(f.name)}：</b>${esc(f.detail)} ${anchors(f.anchors)}</li>`).join('');const relations=arr(x.relations).map(r=>{const t=arr(D.concepts).find(c=>c.id===r.target_id);return `<div><button class="concept-link" data-concept-target="${esc(r.target_id)}">${esc(r.label||'关联')}：${esc(t?.title||r.target_id)}</button><p>${esc(r.explanation)}</p></div>`}).join('');return `<article class="card concept searchable" id="concept-${esc(x.id)}"><button class="fold-toggle" aria-expanded="false" aria-controls="concept-${esc(x.id)}-body"><span><span class="fold-title">${esc(x.title)}</span><span class="fold-role">${esc(x.one_line)}</span></span><span class="chevron" aria-hidden="true">＋</span></button><div class="fold-body" id="concept-${esc(x.id)}-body" hidden><p>${esc(x.explanation)}</p>${factors?`<div class="concept-block"><h4>影响因素</h4><ul>${factors}</ul></div>`:''}${arr(x.effects).length?`<div class="concept-block"><h4>它会影响什么</h4>${list(x.effects)}</div>`:''}${arr(x.observables).length?`<div class="concept-block"><h4>如何观察或使用</h4>${list(x.observables)}</div>`:''}${x.boundary?`<div class="concept-block"><h4>边界</h4><p>${esc(x.boundary)}</p></div>`:''}${relations?`<div class="concept-block"><h4>概念关系</h4>${relations}</div>`:x.connection?`<div class="concept-block"><h4>概念关系</h4><p>${esc(x.connection)}</p></div>`:''}${excerpts(x.excerpts)}${voice(x.voice)}${anchors(x.anchors)}<div class="confidence">置信度：${esc(x.confidence||'未标注')}</div></div></article>`}
function render(){
document.documentElement.style.setProperty('--accent',D.meta?.theme?.accent||'#9E2A24');
$('#bookMeta').innerHTML=`<h1>${esc(D.meta.title)}</h1><p>${esc(D.meta.author)}${D.meta.edition?' · '+esc(D.meta.edition):''}</p><span class="coverage">${D.meta.coverage==='complete'?'完整覆盖':'部分覆盖'}</span>`;
const o=D.orientation||{};let html=`<div class="scope-notice"><strong>15章可读正文已分析 · 1页源文件损坏</strong><p>288页扫描本逐页处理。PDF143页（纸质128页）不可读，已保留缺口；其余可读内容均已分析。</p><p><a class="source-link" href="#coverage" id="scopeLink">查看版本与逐页覆盖 ↓</a></p></div>`;html+=`<div class="hero searchable"><div class="eyebrow">${esc(o.eyebrow||`${D.meta.author} · 深度蒸馏`)}</div><h2>${esc(D.meta.title)}</h2><p class="lead">${esc(o.thesis)}</p><div class="orientation-grid"><article><b>本书解决什么问题</b><p>${esc(o.problem)}</p></article><article><b>适合谁与如何阅读</b><p>${esc(o.reader||'希望建立完整知识骨架的读者')}</p><p>${esc(o.how_to_read||'先顺序阅读，再进入深度探究。')}</p></article></div></div>`;
html+=section('coverage','阅读','版本与阅读覆盖','逐页处理记录与文本质量说明。',`<p>${esc(D.meta.coverage_note)}</p><div class="stats"><span class="stat">${D.meta.source_pages}页已处理</span><span class="stat">${D.chapters.length}章</span><span class="stat">${D.chapters.reduce((n,c)=>n+arr(c.sections).length,0)}个细分论证</span><span class="stat">${D.concepts.length}个概念</span><span class="stat">${D.concepts.reduce((n,c)=>n+arr(c.relations).length,0)}条概念关系</span></div><p>2009年10月第1版。正文纸质页码＝PDF页序−15；原文链接均使用PDF页序。损坏页不据目录补写，点击台账可核对。</p><details><summary>展开288页处理台账</summary><div class="table-wrap"><table class="scope-table"><thead><tr><th>PDF出处</th><th>状态</th><th>说明</th></tr></thead><tbody>${arr(D.coverage_map).map(r=>`<tr><td>${anchors([r.range])}</td><td>${esc(({read:'已处理',excluded:'空白／不作论证证据',unreadable:'源文件损坏·不可读'})[r.status]||r.status)}</td><td>${r.printed_page!=null?`纸质${r.printed_page}页 · `:""}${esc(r.kind)}：${esc(r.notes)}</td></tr>`).join('')}</tbody></table></div></details>`,'read');
html+=section('overview','阅读','全书速览','点击标题展开或收起完整知识骨架。',`<div class="framework"><h3>从机会到组织能力：一条可回看的研发链</h3><p>编者综合重构 · 实际工作存在反馈与反复，并非机械串行。</p><div class="framework-grid">${D.framework.map((s,i)=>`<article><span class="step-index">0${i+1}</span><h4>${esc(s.title)}</h4><p>${esc(s.detail)}</p>${relationButtons(s.ids)}</article>`).join('')}</div>${anchors(['PDF p. 17–35','PDF p. 204–256'])}</div><div class="card-grid">${arr(D.overview).map(x=>card(x,`<p><b>${esc(x.summary)}</b></p>${list(x.details)}`)).join('')}</div>`,'read',true);

html+=section('formulations','深度探究','金句与关键表述','短引文保留作者措辞，同时提供语境解释和出处。',`<div class="card-grid">${arr(D.formulations).map(x=>card({title:x.verbatim?'原文短引':'关键表述',anchors:x.anchors},`<p class="quote">${esc(x.text)}</p><p>${esc(x.commentary)}</p>`)).join('')}</div>`,'explore');
html+=section('critique','深度探究','批判与评价','检验论证、边界与隐含前提。',`<div class="card-grid">${arr(D.critique).map(x=>card(x,`<p>${esc(x.analysis)}</p>`)).join('')}</div>`,'explore');

html+=section('actions','深度探究','行动清单','从理解走向实践，并留下复盘信号。',`<div class="card-grid">${arr(D.actions).map(x=>card(x,`<p><b>触发：</b>${esc(x.trigger)}</p><ol>${arr(x.steps).map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p><b>观察信号：</b>${esc(x.signal)}</p><p><b>复盘：</b>${esc(x.review)}</p>`)).join('')}</div>`,'explore');

function toggle(button,open){button.setAttribute('aria-expanded',String(open));const body=document.getElementById(button.getAttribute('aria-controls'));if(body)body.hidden=!open}
function bindAccordions(){document.querySelectorAll('.section-toggle,.fold-toggle').forEach(b=>b.onclick=()=>toggle(b,b.getAttribute('aria-expanded')!=='true'))}
function setMode(next){if(mode==='read'&&next!=='read')readPosition=scrollY;mode=next;$('#backRead').hidden=mode==='read';document.querySelectorAll('[data-mode-button]').forEach(x=>{x.classList.toggle('active',x.dataset.modeButton===mode);x.setAttribute('aria-selected',String(x.dataset.modeButton===mode))});document.querySelectorAll('[data-mode-section]').forEach(x=>x.classList.toggle('hidden',x.dataset.modeSection!==mode));buildNav()}
function openAncestors(el){let ancestor=el;while(ancestor){if(ancestor.tagName==='DETAILS')ancestor.open=true;ancestor=ancestor.parentElement}const sectionEl=el.closest('.mode-section');if(sectionEl){const b=sectionEl.querySelector(':scope > .section-toggle');toggle(b,true)}const fold=el.closest('.fold');if(fold){const b=fold.querySelector(':scope > .fold-toggle');toggle(b,true)}if(el.classList.contains('concept')){const b=el.querySelector(':scope > .fold-toggle');toggle(b,true)}}
function goConcept(id){setMode('explore');const target=document.getElementById(`concept-${id}`);if(!target)return;openAncestors(target);target.classList.add('search-hit');target.scrollIntoView({block:'start',behavior:'instant'});setTimeout(()=>target.classList.remove('search-hit'),1500)}
function bindConceptLinks(){document.querySelectorAll('[data-concept-target]').forEach(b=>b.onclick=e=>{e.stopPropagation();goConcept(b.dataset.conceptTarget)})}
function buildNav(){const items=[...document.querySelectorAll(`.mode-section[data-mode-section="${mode}"]`)];$('#nav').innerHTML=`<div class="nav-group"><p class="nav-label">${mode==='read'?'顺序阅读':'跳转探究'}</p>${items.map(x=>`<button class="nav-link" data-target="${x.id}">${esc(x.querySelector('.section-title').textContent)}</button>${x.id==='chapters'?D.chapters.map(c=>`<button class="nav-link unit-link" data-target="${esc(c.id)}">${esc(c.title)}</button>`).join(''):''}`).join('')}</div>`;document.querySelectorAll('.nav-link').forEach(b=>b.onclick=()=>{const s=document.getElementById(b.dataset.target);{const b=s.querySelector(':scope > .section-toggle');if(b)toggle(b,true);openAncestors(s)};s.scrollIntoView()})}
document.querySelectorAll('[data-mode-button]').forEach(b=>b.onclick=()=>{const next=b.dataset.modeButton;setMode(next);scrollTo({top:next==='read'?readPosition:0,behavior:'instant'})});
$('#backRead').onclick=()=>{setMode('read');scrollTo({top:readPosition,behavior:'instant'})};
$('#expandAll').onclick=()=>{document.querySelectorAll('.mode-section:not(.hidden) .section-toggle,.mode-section:not(.hidden) .fold-toggle').forEach(b=>toggle(b,true));document.querySelectorAll('.mode-section:not(.hidden) details').forEach(x=>x.open=true)};
$('#collapseAll').onclick=()=>{document.querySelectorAll('.mode-section:not(.hidden) .section-toggle,.mode-section:not(.hidden) .fold-toggle').forEach(b=>toggle(b,false));document.querySelectorAll('.mode-section:not(.hidden) details').forEach(x=>x.open=false)};
let searchHits=[],searchIndex=0;
function revealSearchHit(){document.querySelectorAll('.search-hit').forEach(x=>x.classList.remove('search-hit'));if(!searchHits.length)return;const hit=searchHits[searchIndex];const sectionEl=hit.closest('.mode-section');if(sectionEl&&sectionEl.dataset.modeSection!==mode)setMode(sectionEl.dataset.modeSection);openAncestors(hit);hit.classList.add('search-hit');hit.scrollIntoView({block:'start',behavior:'instant'});$('#searchStatus').textContent=`${searchIndex+1}/${searchHits.length}处 · 回车下一处`}
$('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.search-hit').forEach(x=>x.classList.remove('search-hit'));searchHits=[];searchIndex=0;if(!q){$('#searchStatus').textContent='';return;}searchHits=[...document.querySelectorAll('.subargument,.concept,.card:not(.concept),.mainline,.chapter-question,.chapter > .fold-toggle,.hero')].filter(x=>x.textContent.toLowerCase().includes(q));if(searchHits.length)revealSearchHit();else $('#searchStatus').textContent='未找到匹配内容';});
$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'&&searchHits.length){e.preventDefault();searchIndex=(searchIndex+(e.shiftKey?-1:1)+searchHits.length)%searchHits.length;revealSearchHit();}});
window.addEventListener('beforeprint',()=>document.querySelectorAll('details').forEach(x=>{x.dataset.printOpen=String(x.open);x.open=true}));window.addEventListener('afterprint',()=>document.querySelectorAll('details').forEach(x=>{x.open=x.dataset.printOpen==='true'}));
window.addEventListener('scroll',()=>{$('#progress').style.width=(100*scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight))+'%'});$('#toTop').onclick=()=>scrollTo({top:0,behavior:'smooth'});render();const headerObserver=new ResizeObserver(()=>document.documentElement.style.setProperty('--header-height',$('.topbar').getBoundingClientRect().height+'px'));headerObserver.observe($('.topbar'));window.addEventListener('scroll',()=>$('#toTop').classList.toggle('shown',scrollY>500));
</script></body></html>
