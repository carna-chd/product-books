些是模拟，避免把演示顺滑当作生产完成。", "anchors": ["PDF p. 39、543–545、764–766"], "related_concepts": ["prototype", "requirements", "tradeoff"], "voice": "editor"}, {"question": "系统过载，可以牺牲什么？", "application": "先明确关键承诺和禁止牺牲的正确性，再检查排队、取消、资源池、低精度或延迟更新。给用户可理解反馈，并验证恢复后状态一致。", "anchors": ["PDF p. 527–528、536–540、660–661、768–769"], "related_concepts": ["queue", "pool", "degradation"], "voice": "editor"}], "actions": [{"title": "需求技术对齐页", "trigger": "立项、变更或估工分歧时", "steps": ["写用户、任务、价值与成功证据。", "补成功、失败、中断、恢复的状态。", "列已有能力、依赖、未验证项和验收。"], "signal": "双方能用同一例子解释完成范围。", "review": "哪些遗漏造成了返工？下一次怎样提前发现？", "anchors": ["PDF p. 28–39、505–507"], "related_concepts": ["requirements", "collaboration", "interface"], "voice": "editor"}, {"title": "端到端性能时间线", "trigger": "首屏慢、网络慢或动画卡时", "steps": ["确定观察起止点和用户条件。", "标记解析、连接、传输、处理、布局绘制与等待。", "只对最大可改变瓶颈设计一个方案，并测结果及成本。"], "signal": "体验与分段数据的变化能相互解释。", "review": "优化是真实节省，还是把等待和资源转移了？", "anchors": ["PDF p. 222–314、497–498、546–548"], "related_concepts": ["performance", "rendering", "tradeoff"], "voice": "editor"}, {"title": "状态与资源寿命表", "trigger": "做下载、页面、登录或长任务时", "steps": ["列对象、资源、创建者和使用者。", "写暂停、取消、销毁、超时及迟到结果的处理。", "反复进退、切网和重启，观察是否重复或泄漏。"], "signal": "任务与界面能在异常后恢复一致。", "review": "哪些资源没有明确拥有者或归还路径？", "anchors": ["PDF p. 212–215、489–490、601–602、626–628"], "related_concepts": ["lifecycle", "async", "memory"], "voice": "editor"}, {"title": "数据契约与边界校验", "trigger": "新增字段、编号、接口或迁移时", "steps": ["说明字段含义、单位、值域、精度和空值。", "以极值、缺字段、旧版本和重复输入往返传输。", "检查存储、展示、日志和迁移结果是否保留含义。"], "signal": "同一业务数据在各环节一致。", "review": "规模增长会先突破哪一个约束？", "anchors": ["PDF p. 491、518–524、561–565、641、666–667"], "related_concepts": ["data-model", "serialization", "database"], "voice": "editor"}, {"title": "缓存与离线策略卡", "trigger": "用预取、本地保存或CDN优化时", "steps": ["写缓存对象、命中条件、容量和有效期。", "补首次、离线、陈旧、坏数据和撤回行为。", "测未被使用的预取成本及清理后的恢复。"], "signal": "快的路径和失败回退都可解释。", "review": "缓存省了多少重复工作，又产生多少陈旧或隐私风险？", "anchors": ["PDF p. 497–498、605、610–611、670"], "related_concepts": ["cache", "configuration", "tradeoff"], "voice": "editor"}, {"title": "第三方能力与信任图", "trigger": "集成SDK、云、支付或外部接口时", "steps": ["标出调用者、处理者、数据和授权。", "核对具体能力、版本、许可、失败与退出条件。", "用可观察证据检查实际行为，不凭接口名称下结论。"], "signal": "能说明每项数据为何离开设备及谁负责。", "review": "供应方变化或不可用时，哪些承诺仍能成立？", "anchors": ["PDF p. 465–469、593–594、648–649、701–702、715–717"], "related_concepts": ["interface", "privacy", "license"], "voice": "editor"}, {"title": "指标与实验预登记", "trigger": "评价新方案或商业入口时", "steps": ["写假设、分组单位、观察周期和主指标。", "同时列体验护栏、数据漏报与排除规则。", "保留原始口径、实验变更和最后决定的理由。"], "signal": "结果能被复核，负向结果也能改变决定。", "review": "结论来自方案，还是分组、时间与测量差异？", "anchors": ["PDF p. 54–65、705–710"], "related_concepts": ["metrics", "experiment", "configuration"], "voice": "editor"}, {"title": "媒体资产预算", "trigger": "图片、音视频或复杂动画上线前", "steps": ["区分源资产、传输编码、解码数据和最终显示。", "算像素、位深、码率、帧率与同时存活数量。", "在目标设备及弱网测试质量、内存、电量与取消。"], "signal": "体积、运行占用和体验指标都有样本。", "review": "能否先给足够信息，再让用户选择更多细节？", "anchors": ["PDF p. 620–625、670、675–676、711、731"], "related_concepts": ["media", "display", "compression"], "voice": "editor"}, {"title": "发布与回归证据包", "trigger": "上线、热更新、配置变更或迁移前", "steps": ["保存代码、依赖、配置与产物版本。", "验证关键路径、历史数据与中断恢复。", "明确灰度范围、观察信号、停止及回退条件。"], "signal": "失败时能定位到具体输入并安全恢复。", "review": "是否有不可回退的数据变化尚未说明？", "anchors": ["PDF p. 472–488、586–588、666–667"], "related_concepts": ["release", "version-control", "build"], "voice": "editor"}, {"title": "受限条件下的柔性方案", "trigger": "弱网、容量或电量压力明显时", "steps": ["排序核心任务与可降低项，写禁止损害的正确性。", "定义降低精度、延期、排队或拒绝的触发条件。", "提供真实反馈，测试压力解除后的恢复。"], "signal": "关键任务在受限场景仍能完成或明确失败。", "review": "省下的资源是否对应用户真正不在意的部分？", "anchors": ["PDF p. 536–540、660–661、768–769"], "related_concepts": ["degradation", "queue", "performance"], "voice": "editor"}, {"title": "一词一例技术学习卡", "trigger": "遇到不懂的技术或评审术语时", "steps": ["写它接收什么、产生什么、解决什么问题。", "找到一篇源文和一个业务例子。", "记录影响因素、可观察证据、适用边界和未核验项。"], "signal": "能够不用该术语解释它为什么影响产品。", "review": "哪些认识仍只是类比或作者猜想？", "anchors": ["PDF p. 1、688–689、722–724"], "related_concepts": ["learning", "observability", "requirements"], "voice": "editor"}], "glossary": [{"term": "协作与职责", "definition": "围绕同一目标交换可用信息、作出承诺并及时反馈。 沟通次数多不等于共识，权力压制和职业刻板印象会遮住真正问题。", "anchors": ["PDF p. 25–27", "PDF p. 28–30"], "related_concepts": ["collaboration"], "voice": "editor"}, {"term": "需求与验收", "definition": "把用户目标转成有状态、条件和结果的可验证约定。 需求明确不意味着永不变化，变化需要显式评估影响。", "anchors": ["PDF p. 28–30", "PDF p. 31–33"], "related_concepts": ["requirements"], "voice": "editor"}, {"term": "时间、空间与体验取舍", "definition": "在有限资源下明确保住什么、付出什么。 “一切皆成本”不能替代授权和关键正确性。", "anchors": ["PDF p. 28–30", "PDF p. 39–39"], "related_concepts": ["tradeoff"], "voice": "editor"}, {"term": "架构与模块责任", "definition": "决定系统怎样分工、连接和承担质量要求。 抽象并不允许忽略具体运行约束；层次更多不保证更好。", "anchors": ["PDF p. 25–27", "PDF p. 67–67"], "related_concepts": ["architecture"], "voice": "editor"}, {"term": "接口、API与SDK", "definition": "接口约定可调用能力，SDK把一组能力与工具包装交付。 公开接口不等于无限授权，同名接口也不保证行为相同。", "anchors": ["PDF p. 110–111", "PDF p. 123–124"], "related_concepts": ["interface"], "voice": "editor"}, {"term": "复用与能力积累", "definition": "使用已有实现减少重复建设，同时管理其适用条件。 原型能复用不证明生产可用，能够下载不等于允许使用。", "anchors": ["PDF p. 31–33", "PDF p. 162–164"], "related_concepts": ["reuse"], "voice": "editor"}, {"term": "配置、默认值与云端开关", "definition": "让部分行为由数据规则决定，并定义读取和失效过程。 配置也需要验证、权限与回滚，不应将普通开关与未授权后门混同。", "anchors": ["PDF p. 62–63", "PDF p. 104–105"], "related_concepts": ["configuration"], "voice": "editor"}, {"term": "生命周期与资源回收", "definition": "对象、页面、任务和凭据都有创建、使用与结束条件。 Activity不是整个应用，退出页面不保证所有回调或进程同时结束。", "anchors": ["PDF p. 79–79", "PDF p. 101–101"], "related_concepts": ["lifecycle"], "voice": "editor"}, {"term": "状态与状态转换", "definition": "用明确条件描述系统从一种有效状态进入另一种状态。 对象多态不是状态机；画了状态图也需确保真实实现遵守。", "anchors": ["PDF p. 34–35", "PDF p. 36–38"], "related_concepts": ["state-machine"], "voice": "editor"}, {"term": "调试、日志与可观察证据", "definition": "把表面问题连接到可复现条件与运行现场。 最后崩溃位置不一定是根因，日志本身也应避免暴露敏感数据。", "anchors": ["PDF p. 60–62", "PDF p. 94–95"], "related_concepts": ["observability"], "voice": "editor"}, {"term": "构建、发布与兼容", "definition": "把一次修改变成可验证、可分发、可回退的交付。 兼容不是永远无代价，不能随意删旧表或将测试时间挤到零。", "anchors": ["PDF p. 31–33", "PDF p. 39–39"], "related_concepts": ["release"], "voice": "editor"}, {"term": "数据模型与类型", "definition": "为业务对象、关系、取值和空缺选择明确表示。 不能按CPU位数推断所有语言类型，空判断跳过不一定业务正确。", "anchors": ["PDF p. 50–51", "PDF p. 54–55"], "related_concepts": ["data-model"], "voice": "editor"}, {"term": "数据库、SQL与NoSQL", "definition": "按约定持久保存和检索业务数据。 有数据库不等于数据可信，NoSQL也不是不需要数据模型。", "anchors": ["PDF p. 40–40", "PDF p. 42–42"], "related_concepts": ["database"], "voice": "editor"}, {"term": "事务与多步业务正确性", "definition": "让相关操作按明确的整体结果约束执行。 本书支付案例不是完整上线规范，客户端确认不能替代服务端核对。", "anchors": ["PDF p. 48–49", "PDF p. 614–615"], "related_concepts": ["transaction"], "voice": "editor"}, {"term": "索引、倒排与候选检索", "definition": "先组织可查路径，减少每次搜索全部数据的工作。 不是任意条件加索引都快，多词并集与交集不能混淆。", "anchors": ["PDF p. 48–49", "PDF p. 52–53"], "related_concepts": ["index"], "voice": "editor"}, {"term": "哈希、摘要与感知特征", "definition": "用映射生成便于定位或比较的表示，具体目标必须分清。 MD5不是绝对唯一，摘要相同也不独立证明来源可信。", "anchors": ["PDF p. 127–128", "PDF p. 132–133"], "related_concepts": ["hash"], "voice": "editor"}, {"term": "存储、文件系统与备份", "definition": "保存数据，并组织其位置、访问和恢复。 云端一份副本不保证永不丢失，格式化和覆盖需先保护原数据。", "anchors": ["PDF p. 41–41", "PDF p. 75–77"], "related_concepts": ["storage"], "voice": "editor"}, {"term": "内存、引用与泄漏", "definition": "运行时可快速访问的资源，需要明确对象何时不再需要。 占用高不一定泄漏，强引用与循环引用都不能脱离可达性判断。", "anchors": ["PDF p. 219–220", "PDF p. 489–490"], "related_concepts": ["memory"], "voice": "editor"}, {"term": "CPU与计算工作", "definition": "执行指令的处理资源，速度由任务与系统共同决定。 线程更多不等于按比例分到更多CPU，型号或主频不能单独排名体验。", "anchors": ["PDF p. 66–66", "PDF p. 67–67"], "related_concepts": ["cpu"], "voice": "editor"}, {"term": "GPU与图形加速", "definition": "适合许多可并行图形或数值任务的计算资源。 不是所有动画都只用GPU，GPU更强也不保证整个应用不卡。", "anchors": ["PDF p. 69–70", "PDF p. 118–118"], "related_concepts": ["gpu"], "voice": "editor"}, {"term": "性能、时延与吞吐", "definition": "性能必须对应某个任务和明确指标。 平均值会遮住极慢个案，感知快不等于真实耗时下降。", "anchors": ["PDF p. 52–53", "PDF p. 66–66"], "related_concepts": ["performance"], "voice": "editor"}, {"term": "进程、线程、并发与并行", "definition": "并发组织多个未完成任务，并行才是同一时刻实际执行。 多线程不保证快，不应把并发、异步和并行当同义词。", "anchors": ["PDF p. 69–70", "PDF p. 191–192"], "related_concepts": ["concurrency"], "voice": "editor"}, {"term": "同步、异步与回调", "definition": "异步允许发起后先继续，结果随后按约定交付。 异步不等于计算消失，也不等于必须创建新线程。", "anchors": ["PDF p. 168–168", "PDF p. 212–214"], "related_concepts": ["async"], "voice": "editor"}, {"term": "栈、队列与排队", "definition": "队列常按先进先出，栈按后进先出组织取放。 队列不是无限缓冲，技术栈与调用栈不能直接按业务队列理解。", "anchors": ["PDF p. 308–309", "PDF p. 440–441"], "related_concepts": ["queue"], "voice": "editor"}, {"term": "线程池、对象池与连接池", "definition": "保留可重用资源，同时限制使用规模。 书中不同Linux线程上限例子不能当普遍常数，池越大并非越好。", "anchors": ["PDF p. 527–528", "PDF p. 660–661"], "related_concepts": ["pool"], "voice": "editor"}, {"term": "流水线与背压", "definition": "让不同阶段重叠处理，同时尊重最慢阶段的能力。 阶段数量不是加速倍数，书中15/15/30分钟例子的总时长需校准。", "anchors": ["PDF p. 58–59", "PDF p. 60–62"], "related_concepts": ["pipeline"], "voice": "editor"}, {"term": "锁、死锁与共享更新", "definition": "锁限制资源的同时修改，死锁则让相互等待无法自行前进。 慢不一定是死锁，加一把客户端锁不自动解决分布式一致性。", "anchors": ["PDF p. 614–615", "PDF p. 616–618"], "related_concepts": ["lock"], "voice": "editor"}, {"term": "操作系统与运行环境", "definition": "管理硬件资源，并为应用提供运行和调用条件。 界面只是系统一部分，虚拟内存也不创造无限物理资源。", "anchors": ["PDF p. 226–227", "PDF p. 472–474"], "related_concepts": ["os"], "voice": "editor"}, {"term": "编译、链接与运行", "definition": "把代码与依赖生成产物，再在适当环境执行。 不能把所有语言归为完全相同流水线，也不能凭“解释型”断言必慢。", "anchors": ["PDF p. 104–105", "PDF p. 125–126"], "related_concepts": ["build"], "voice": "editor"}, {"term": "二进制、字符集与编码", "definition": "让同一组字节按共同规则解释成数据或文字。 编码不是加密，字符数、字节数和像素不能混算。", "anchors": ["PDF p. 335–335", "PDF p. 354–355"], "related_concepts": ["encoding"], "voice": "editor"}, {"term": "JSON与序列化", "definition": "将结构化数据转为可保存或传输的表示，再按规则恢复。 JSON不是key=value语法，方法和对象全部行为不会自动随数据传输。", "anchors": ["PDF p. 42–42", "PDF p. 387–387"], "related_concepts": ["serialization"], "voice": "editor"}, {"term": "有损、无损与压缩成本", "definition": "减少表示长度，并明确是否允许丢弃信息。 不保证所有输入更小，减色后再无损保存不等于原图完全无损。", "anchors": ["PDF p. 80–81", "PDF p. 203–204"], "related_concepts": ["compression"], "voice": "editor"}, {"term": "图片、音频与视频", "definition": "把感知内容表示为可计算、存储和传输的数据。 MP4不自动等于清晰，数字接口或无损标签不保证全部体验更好。", "anchors": ["PDF p. 73–74", "PDF p. 80–81"], "related_concepts": ["media"], "voice": "editor"}, {"term": "渲染与帧预算", "definition": "把结构、数据和图形描述计算成可呈现的画面。 60帧不是所有设备唯一目标，也非所有图形系统每帧完整走相同三步。", "anchors": ["PDF p. 78–78", "PDF p. 118–118"], "related_concepts": ["rendering"], "voice": "editor"}, {"term": "动画、缓动与交互", "definition": "用连续变化表达状态、关系和操作反馈。 动画可改善反馈，不会自动加速后台，更不应遮住真实失败。", "anchors": ["PDF p. 101–101", "PDF p. 505–507"], "related_concepts": ["animation"], "voice": "editor"}, {"term": "像素、密度与颜色", "definition": "区分图像采样、显示尺寸和色彩表示。 原文dp换算和1920×1080图片占用有误；不能把色数当作全部画质。", "anchors": ["PDF p. 73–74", "PDF p. 78–78"], "related_concepts": ["display"], "voice": "editor"}, {"term": "平台适配与兼容", "definition": "在不同宿主、版本和设备下维持约定能力。 跨平台不等于一次编写无需验证，兼容也不保证任何历史问题都能无代价解决。", "anchors": ["PDF p. 71–72", "PDF p. 86–86"], "related_concepts": ["platform"], "voice": "editor"}, {"term": "网络、地址与传输条件", "definition": "多层设施协同把数据从一方送到另一方。 “有信号”不等于目标服务可用，理论速率不等于真实下载速度。", "anchors": ["PDF p. 87–88", "PDF p. 89–91"], "related_concepts": ["network"], "voice": "editor"}, {"term": "域名、DNS与解析", "definition": "把可识别名称连接到网络目标及相关记录。 持有域名不证明内容可信，也不等于获得同名商标或任何IP永久绑定。", "anchors": ["PDF p. 251–252", "PDF p. 254–254"], "related_concepts": ["dns"], "voice": "editor"}, {"term": "URL、路径与深度链接", "definition": "用地址表达资源位置或交互入口。 地址可被猜到或复制，不应仅靠“别人不知道URL”保护内容。", "anchors": ["PDF p. 215–216", "PDF p. 291–292"], "related_concepts": ["url"], "voice": "editor"}, {"term": "HTTP、请求与页面通信", "definition": "以约定的消息表达资源操作和业务交换。 HTTP能传二进制，不必每次新建连接；用了POST也不自动防CSRF。", "anchors": ["PDF p. 243–244", "PDF p. 255–256"], "related_concepts": ["http"], "voice": "editor"}, {"term": "连接、端口与长连接", "definition": "建立和维护通信通道，并把数据交给相应端点。 Socket不天然等于长连接，HTTP也不天然等于短连接。", "anchors": ["PDF p. 112–113", "PDF p. 149–151"], "related_concepts": ["connection"], "voice": "editor"}, {"term": "TCP、UDP与交付语义", "definition": "不同传输机制对顺序、可靠和开销作出不同安排。 UDP不等于应用一定不可靠，TCP也不保证业务只执行一次。", "anchors": ["PDF p. 239–240", "PDF p. 241–242"], "related_concepts": ["tcp-udp"], "voice": "editor"}, {"term": "CDN、分发与就近访问", "definition": "把可分发内容放到离请求更合适的位置。 不是所有动态和私密内容都能直接缓存，节点更多也不自动更快。", "anchors": ["PDF p. 89–91", "PDF p. 92–93"], "related_concepts": ["cdn"], "voice": "editor"}, {"term": "代理、NAT与中间层", "definition": "在通信双方之间转发或转换，改变可见路径。 代理、VPN和NAT目标不同，不自动提供保密或授权，映射失效也不必然意味着外网IP改变。", "anchors": ["PDF p. 230–231", "PDF p. 249–250"], "related_concepts": ["proxy"], "voice": "editor"}, {"term": "安全与信任边界", "definition": "让系统只在合适证据与权限下执行操作、披露信息。 没有单一开关能保证安全，技术上可做不等于有权做。", "anchors": ["PDF p. 89–91", "PDF p. 110–111"], "related_concepts": ["security"], "voice": "editor"}, {"term": "加密、签名、证书与混淆", "definition": "区分保密、来源验证、内容校验与提高理解难度。 原文把“私钥加密”等同签名、把MD5加盐等同安全的说法不能直接采用。", "anchors": ["PDF p. 104–105", "PDF p. 193–193"], "related_concepts": ["crypto"], "voice": "editor"}, {"term": "身份、认证与授权", "definition": "先确定谁在请求，再判断允许执行什么。 能识别设备不等于识别自然人，公开API也不代表用户同意。", "anchors": ["PDF p. 102–103", "PDF p. 116–117"], "related_concepts": ["identity"], "voice": "editor"}, {"term": "票据、会话与Cookie", "definition": "用有范围和寿命的凭据承接已经建立的信任。 本地有票据不证明仍有效，删除本地文件不总能撤销服务端会话。", "anchors": ["PDF p. 116–117", "PDF p. 127–128"], "related_concepts": ["token"], "voice": "editor"}, {"term": "权限、隐私与第三方数据", "definition": "在明确目的与授权下限制采集、使用和留存。 文中对某SDK或平台内部行为的推测不能当实证；日志和剪贴板也可能含敏感内容。", "anchors": ["PDF p. 102–103", "PDF p. 144–146"], "related_concepts": ["privacy"], "voice": "editor"}, {"term": "指标、埋点与数据质量", "definition": "用清楚口径把行为转成可解释的记录。 数字大不保证价值大，真实点击也可能是有偿或误操作。", "anchors": ["PDF p. 58–59", "PDF p. 60–62"], "related_concepts": ["metrics"], "voice": "editor"}, {"term": "A/B实验与灰度", "definition": "实验比较方案效果，灰度控制变更暴露范围。 用户数不同不等于任何比例都不能比较，不能随看随挑有利结论。", "anchors": ["PDF p. 705–708"], "related_concepts": ["experiment"], "voice": "editor"}, {"term": "脚本、自动化与测试", "definition": "把明确规则交给程序重复执行，并核对结果。 能自动点击不证明测试有效，需求不稳也不表示所有逻辑都不值得自动检查。", "anchors": ["PDF p. 157–158", "PDF p. 395–396"], "related_concepts": ["automation"], "voice": "editor"}, {"term": "版本控制与回归定位", "definition": "保存变更及其上下文，让差异可以被追踪和比较。 找到某次提交不等于全部责任属于提交者，依赖或配置也可能变化。", "anchors": ["PDF p. 477–478", "PDF p. 486–486"], "related_concepts": ["version-control"], "voice": "editor"}, {"term": "抽象、对象与行为契约", "definition": "提取任务相关共性，让具体实现可被共同方式使用。 不要仅为少写几行建立继承，面向对象也不会消灭流程与函数。", "anchors": ["PDF p. 56–57", "PDF p. 64–65"], "related_concepts": ["abstraction"], "voice": "editor"}, {"term": "耦合、观察者与重构", "definition": "管理依赖，使一处变化不必引起无关改动。 解耦不是零关联，重构不等于重写，也不保证运行更快。", "anchors": ["PDF p. 502–504", "PDF p. 509–510"], "related_concepts": ["coupling"], "voice": "editor"}, {"term": "模式、组件、框架与引擎", "definition": "分别组织经验、局部能力和一类系统的运行骨架。 使用框架不保证业务、安全和性能自动正确，引擎名字也不证明先进。", "anchors": ["PDF p. 579–581", "PDF p. 595–595"], "related_concepts": ["framework"], "voice": "editor"}, {"term": "更新、插件与热更新", "definition": "把变化以代码、模块、资源或配置等不同形式交付。 历史平台规则不等于现行许可，灵活交付不能绕过用户与平台授权。", "anchors": ["PDF p. 123–124", "PDF p. 125–126"], "related_concepts": ["hot-update"], "voice": "editor"}, {"term": "原生、Web与宿主桥接", "definition": "在不同执行与展示环境之间组织产品能力。 方案没有绝对高低，小程序早期猜想不能作内部实现证明。", "anchors": ["PDF p. 165–167", "PDF p. 332–333"], "related_concepts": ["hybrid"], "voice": "editor"}, {"term": "HTML、CSS、DOM与布局", "definition": "把内容结构、外观规则和运行中的页面树区分开。 页面树不是图片，虚拟DOM也不保证所有场景最快。", "anchors": ["PDF p. 315–317", "PDF p. 323–325"], "related_concepts": ["dom"], "voice": "editor"}, {"term": "JavaScript、脚本与前端行为", "definition": "以程序逻辑处理页面数据、事件与调用。 同为JavaScript不表示各环境API相同，Node也不是唯一服务端渲染路径。", "anchors": ["PDF p. 315–317", "PDF p. 318–320"], "related_concepts": ["javascript"], "voice": "editor"}, {"term": "同源、跨域与请求信任", "definition": "浏览器限制不同来源之间的部分交互，服务端仍要验证意愿与权限。 跨域可访问不等于授权成立，POST也不天然防跨站请求伪造。", "anchors": ["PDF p. 358–360", "PDF p. 363–365"], "related_concepts": ["same-origin"], "voice": "editor"}, {"term": "浏览器缓存与离线代理", "definition": "在受约束的浏览器生命周期中管理部分资源请求。 早期AppCache描述不能直接作为当前实现建议，缓存命中也不证明内容新鲜。", "anchors": ["PDF p. 321–322", "PDF p. 326–327"], "related_concepts": ["service-worker"], "voice": "editor"}, {"term": "缓存、预取与失效", "definition": "保存可能再次使用的结果，减少重复取得或计算。 缓存不是免费加速，含私密或未授权内容的缓存还会扩大披露范围。", "anchors": ["PDF p. 75–77", "PDF p. 85–85"], "related_concepts": ["cache"], "voice": "editor"}, {"term": "搜索、爬虫与相关性", "definition": "取得内容、组织候选，再按任务判断有用程度。 一个简单倒排或感知哈希示例不代表完整商业搜索引擎。", "anchors": ["PDF p. 194–196", "PDF p. 376–377"], "related_concepts": ["search"], "voice": "editor"}, {"term": "推荐、协同过滤与冷启动", "definition": "从可供给内容与行为信号推测下一步可能有用的选择。 更多数据不自动更好，基于内容也不必然命中率最低。", "anchors": ["PDF p. 677–678"], "related_concepts": ["recommendation"], "voice": "editor"}, {"term": "机器学习与深度学习", "definition": "由训练经验影响模型，再对新输入输出结果。 本书属于当时的入门科普，不能据它推定当前大模型能力或仅靠加数据必然改进。", "anchors": ["PDF p. 494–496", "PDF p. 677–678"], "related_concepts": ["machine-learning"], "voice": "editor"}, {"term": "定位、GeoHash与附近检索", "definition": "获取有精度和时间的坐标，再缩小空间候选。 本文不能证明微信内部采用何种完整实现；位置权限不等于允许持续追踪。", "anchors": ["PDF p. 94–95", "PDF p. 129–131"], "related_concepts": ["location"], "voice": "editor"}, {"term": "传感器与生物特征", "definition": "把环境或身体信号转成程序可用数据。 理论原理不证明戴手套等所有场景可用，调接口也不证明已经采集或上传。", "anchors": ["PDF p. 79–79", "PDF p. 92–93"], "related_concepts": ["sensor"], "voice": "editor"}, {"term": "AR、VR与空间体验", "definition": "AR关联真实环境，VR构造用户沉浸的虚拟环境。 不能用头盔或手机外观作唯一定义，更不能据演示视频断言内部光学实现。", "anchors": ["PDF p. 651–654", "PDF p. 693–695"], "related_concepts": ["ar-vr"], "voice": "editor"}, {"term": "二维码、纠错与入口", "definition": "把可解释数据转为摄像头可识读的图形。 纠错不是任意遮挡都可恢复，二维码可读也不等于收款方可信。", "anchors": ["PDF p. 732–733", "PDF p. 750–751"], "related_concepts": ["qr"], "voice": "editor"}, {"term": "开源许可与使用边界", "definition": "公开源代码仍有使用、修改和分发的条件。 原文“GPL禁止商业发布”等结论不可直接采用；本页不是许可法律意见。", "anchors": ["PDF p. 550–552", "PDF p. 648–649"], "related_concepts": ["license"], "voice": "editor"}, {"term": "时间戳、时区与同步", "definition": "区分事件时间、数值表示和设备时钟。 Unix时间不必总是正数，原文偏移公式出现未定义变量。", "anchors": ["PDF p. 448–449", "PDF p. 637–638"], "related_concepts": ["clock"], "voice": "editor"}, {"term": "原型、Demo与验证目标", "definition": "以最小足够的实现回答当前不确定问题。 高保真、可安装或二十分钟案例都不能作为其他项目交付承诺。", "anchors": ["PDF p. 543–545", "PDF p. 764–767"], "related_concepts": ["prototype"], "voice": "editor"}, {"term": "柔性、有损设计与降级", "definition": "根据条件降低非关键能力，守住核心任务。 支付正确、授权和重要数据完整性不能随意降低，假进度不能掩盖失败。", "anchors": ["PDF p. 768–769"], "related_concepts": ["degradation"], "voice": "editor"}, {"term": "技术学习与问题思考", "definition": "围绕实际任务建立可解释、可核查的知识。 碎片学习不证明系统教材无用，招聘热词也不保证未来趋势。", "anchors": ["PDF p. 688–689", "PDF p. 722–724"], "related_concepts": ["learning"], "voice": "editor"}, {"term": "技术愿景与成熟度", "definition": "把原理、演示、可交付和商业成立分层判断。 实验室峰值、融资和演示不独立证明产品可用，本页不替历史文章补写当前状态。", "anchors": ["PDF p. 589–590", "PDF p. 671–672"], "related_concepts": ["innovation"], "voice": "editor"}, {"term": "分布式、负载均衡与云", "definition": "把工作和责任分配到多个运行节点或服务。 CDN是分发的一种安排，不等于所有分布式系统；采用云也不免除应用和数据责任。", "anchors": ["PDF p. 43–44", "PDF p. 249–250"], "related_concepts": ["distributed"], "voice": "editor"}, {"term": "数组、链表与访问方式", "definition": "数据如何组织会改变不同操作的代价。 不能仅凭列表外观选结构，链表并非任何插入都快，数组也不一定总占更多空间。", "anchors": ["PDF p. 521–524", "PDF p. 525–526"], "related_concepts": ["data-structure"], "voice": "editor"}, {"term": "随机数与过程公平", "definition": "随机输出只是公平流程中的一个环节。 真随机源也不能独自保证公平，单个未中奖经历不能证明作弊。", "anchors": ["PDF p. 709–710"], "related_concepts": ["randomness"], "voice": "editor"}, {"term": "视图树与界面层级", "definition": "用父子结构组织界面元素及其位置、可见与交互关系。 原生视图树与网页DOM有相似结构思想，但不是同一套对象或API，不能互相直接替代。", "anchors": ["PDF p. 114–115", "PDF p. 140–141"], "related_concepts": ["view-tree"], "voice": "editor"}, {"term": "API", "definition": "公开可调用的能力约定；应包括输入、输出、错误与权限，不只是函数名。", "anchors": ["PDF p. 593–594、658–659"], "related_concepts": ["interface"], "voice": "editor"}, {"term": "SDK", "definition": "用于集成某平台或领域能力的工具与代码集合；内含API等，但不替代业务验收。", "anchors": ["PDF p. 593–594"], "related_concepts": ["interface"], "voice": "editor"}, {"term": "RPC", "definition": "远程调用抽象；背后仍需定位服务、序列化与网络通信，失败特性不同于本地调用。", "anchors": ["PDF p. 534–535"], "related_concepts": ["interface"], "voice": "editor"}, {"term": "DOM", "definition": "网页运行时的文档对象结构，脚本可以通过它读写页面节点。", "anchors": ["PDF p. 315–431"], "related_concepts": ["dom"], "voice": "editor"}, {"term": "JS Bridge", "definition": "网页与原生宿主之间的调用桥，能力和授权取决于宿主协议。", "anchors": ["PDF p. 315–431"], "related_concepts": ["hybrid"], "voice": "editor"}, {"term": "MVC", "definition": "以Model、View、Controller安排数据、展示与协调的设计方式；契约仍连接各部分。", "anchors": ["PDF p. 553–554"], "related_concepts": ["coupling"], "voice": "editor"}, {"term": "观察者", "definition": "事件来源按约定通知已注册响应者；仍需处理订阅取消、顺序与失败。", "anchors": ["PDF p. 502–504、509–510"], "related_concepts": ["coupling"], "voice": "editor"}, {"term": "多态", "definition": "通过共同接口调用不同实现，语义与前置条件也须能相互替换。", "anchors": ["PDF p. 571–573"], "related_concepts": ["abstraction"], "voice": "editor"}, {"term": "继承", "definition": "用父子类型表达共同特征与扩展；不应只为省重复代码强建关系。", "anchors": ["PDF p. 574–575"], "related_concepts": ["abstraction"], "voice": "editor"}, {"term": "反射", "definition": "运行期间查看类型和成员等信息并按机制调用；不是任意越过所有权限。", "anchors": ["PDF p. 508"], "related_concepts": ["abstraction"], "voice": "editor"}, {"term": "Hook", "definition": "在既有消息或调用路径中设置介入点；可用于扩展观察，也需要明确授权与范围。", "anchors": ["PDF p. 609"], "related_concepts": ["interface"], "voice": "editor"}, {"term": "进程", "definition": "系统组织程序一次运行及其资源、隔离的单位；一个应用可能涉及多个进程。", "anchors": ["PDF p. 623"], "related_concepts": ["concurrency"], "voice": "editor"}, {"term": "线程", "definition": "进程内的执行路径，通常共享所在进程的部分资源，因此有竞争和协调。", "anchors": ["PDF p. 582–583、623"], "related_concepts": ["concurrency"], "voice": "editor"}, {"term": "回调", "definition": "预先交出的处理入口，在约定条件到来时被调用；不只用于异步。", "anchors": ["PDF p. 626–628"], "related_concepts": ["async"], "voice": "editor"}, {"term": "死锁", "definition": "执行者各持部分资源又等待对方，形成无法自行前进的等待关系。", "anchors": ["PDF p. 616–618"], "related_concepts": ["lock"], "voice": "editor"}, {"term": "调用栈", "definition": "运行时函数调用的层叠关系及相关现场；报错最后一层不一定是最初根因。", "anchors": ["PDF p. 639–640"], "related_concepts": ["observability"], "voice": "editor"}, {"term": "大O", "definition": "比较规模增长时操作量或额外空间的增长关系，不是固定秒数，也不只允许最坏情况。", "anchors": ["PDF p. 612–613"], "related_concepts": ["performance"], "voice": "editor"}, {"term": "背压", "definition": "下游处理不过来时约束上游继续生产，队列不能替代长期容量平衡。", "anchors": ["PDF p. 536–540"], "related_concepts": ["pipeline"], "voice": "editor"}, {"term": "Base64", "definition": "把字节映射为文本字符的一种编码，通常体积增加，不是加密或压缩。", "anchors": ["PDF p. 529–533"], "related_concepts": ["encoding"], "voice": "editor"}, {"term": "UTF-8与Unicode", "definition": "Unicode编号和UTF字节编码应分层理解，字体显示又是下一层。", "anchors": ["PDF p. 541–542、565"], "related_concepts": ["encoding"], "voice": "editor"}, {"term": "JSON", "definition": "结构化数据交换格式；成员用冒号、字符串用双引号，不携带对象全部行为。", "anchors": ["PDF p. 641"], "related_concepts": ["serialization"], "voice": "editor"}, {"term": "MD5", "definition": "有限长度内容摘要，不能保证绝对唯一，也不能独立证明文件来源可信。", "anchors": ["PDF p. 637–638"], "related_concepts": ["hash"], "voice": "editor"}, {"term": "GUID", "definition": "用于生成标识的机制，标识不等于用户真实性或授权证明。", "anchors": ["PDF p. 638"], "related_concepts": ["identity"], "voice": "editor"}, {"term": "Cookie", "definition": "浏览器保存并按条件随请求携带信息的机制，不必直接存密码或搜索内容。", "anchors": ["PDF p. 363、761–762"], "related_concepts": ["token"], "voice": "editor"}, {"term": "OAuth", "definition": "围绕第三方授权的相关机制；登录、身份与资源权限需在具体流程中分别说明。", "anchors": ["PDF p. 101–221"], "related_concepts": ["identity"], "voice": "editor"}, {"term": "NAT", "definition": "对网络地址和端口等作转换映射，中间状态与超时会影响连接。", "anchors": ["PDF p. 253"], "related_concepts": ["proxy"], "voice": "editor"}, {"term": "TLS与证书", "definition": "加密通道还要验证通信对象，只有公钥本身并不完成身份确认。", "anchors": ["PDF p. 261–262、460–464"], "related_concepts": ["crypto"], "voice": "editor"}, {"term": "HTTP Keep-Alive", "definition": "复用连接的相关机制；HTTP并非每次请求都必须重新连接。", "anchors": ["PDF p. 257"], "related_concepts": ["http"], "voice": "editor"}, {"term": "GeoHash", "definition": "空间分区编码，可缩小候选范围；需要检查邻区、精确距离与坐标时效。", "anchors": ["PDF p. 720–721"], "related_concepts": ["location"], "voice": "editor"}, {"term": "HLS与M3U8", "definition": "播放列表组织媒体分片并通过HTTP分发；所述TS链路是当时示例而非所有实现的唯一形式。", "anchors": ["PDF p. 711"], "related_concepts": ["media"], "voice": "editor"}, {"term": "DLNA", "definition": "区分媒体服务、控制与渲染等角色的局域网共享方案；支持角色与格式需要具体协商。", "anchors": ["PDF p. 712"], "related_concepts": ["media"], "voice": "editor"}, {"term": "MIDI", "definition": "表达音符、力度和时序等控制事件，更像乐谱，最终由音源或合成器产生声音。", "anchors": ["PDF p. 728–729"], "related_concepts": ["media"], "voice": "editor"}, {"term": "HDR", "definition": "保留更宽动态范围信息的目标，文中多帧合成是实现例子，不保证运动场景总有收益。", "anchors": ["PDF p. 662–663"], "related_concepts": ["media"], "voice": "editor"}, {"term": "贝塞尔曲线", "definition": "由控制点定义的曲线，可描述几何路径或时间到进度映射，二者要分清。", "anchors": ["PDF p. 679–683"], "related_concepts": ["animation"], "voice": "editor"}, {"term": "响应式设计", "definition": "同一页面随可用空间改变布局和资源；并非只维护两个固定宽度的版本。", "anchors": ["PDF p. 664–665"], "related_concepts": ["platform"], "voice": "editor"}, {"term": "渐进式图片", "definition": "先显示整体再逐渐补细节，有助感知；并不自动减少全部下载量或改变最终像素尺寸。", "anchors": ["PDF p. 670"], "related_concepts": ["media"], "voice": "editor"}, {"term": "OpenGL", "definition": "通过图形接口与状态组织绘制；接口跨平台仍受版本、驱动和硬件约束。", "anchors": ["PDF p. 642–644"], "related_concepts": ["gpu"], "voice": "editor"}, {"term": "Unity与运行时", "definition": "引擎和编辑器复用图形及内容能力，底层仍需适配；源文Mono叙述不能覆盖所有当前实现。", "anchors": ["PDF p. 579–581、667–669"], "related_concepts": ["framework"], "voice": "editor"}, {"term": "RSS与Atom", "definition": "用结构化订阅源组织更新；原文混用二者与feed/entry，不能直接据此编写解析器。", "anchors": ["PDF p. 763"], "related_concepts": ["automation"], "voice": "editor"}, {"term": "IaaS／PaaS／SaaS", "definition": "分别关注基础资源、开发运行平台与软件服务；要按实际责任边界区分，不能只看厂商或包装名称。", "anchors": ["PDF p. 701–702"], "related_concepts": ["distributed"], "voice": "editor"}], "notes": ["覆盖范围：完整处理当前本地769页文件，不推断它是某一出版物或公众号的全部历史文章。11个专题、354篇逐题解读；没有用目录代替未见正文。", "书目信息：正文常署“果果”和pm_teacher，但未见可靠版权页、出版社、ISBN与出版日期。文件转换元数据不作为出版证据。", "页码：所有来源按钮使用PDF页序，并可跳到本地原PDF；范围链接定位其起始页。交界页如同时包含前篇末尾和后篇开头，可能被两个条目共同引用。", "阅读方式：阅读区保留原目录顺序，概念区按跨篇机制重组。此处“逐章”对应11个专题，“逐篇”对应354篇原文标题，不虚构标准教材章节。", "声音区分：逐篇解读、专题主线、概念、评价、现实问题与清单均为依据原文的编者重构；只有标为“原文短引”的6条是直接引文。作者猜测不改写成确定事实。", "文字与图像：保留工作目录原始逐页文本；常见抽取异体“ᨀ/᧿”在释义中规范为“提/描”。代表性页面和文字空页做图像核对。12页仅页眉，84页和723页实质图片已阅读。", "代码与图表：为理解原理阅读，不执行书中命令，不声称逐行审计或验证所有代码可运行。Base64长载荷和大量示例代码不在阅读页复刻。", "历史边界：技术、服务价格、平台规则、厂商行为和市场预测按当时文章语境理解。本次未调用外部资料补全，也不声称已经更新为2026年的标准与方案。", "引文策略：以6条短引保留关键措辞，避免长段复制。每篇详细解读与相关概念都有原文入口，便于你自行返回上下文。", "复用与安全：有技术能力不表示有使用授权；许可、第三方数据与安全章节的原文误述已指出。恶意软件、刷票、刷量与绕过付费案例仅作机制和防护分析，未生成攻击执行步骤。", "交互说明：专题、文章和主要板块独立折叠；可按专题或原题选择、全局搜索并用回车切换匹配。点击概念进入探究，再返回原阅读位置。打印会展开全部内容。", "使用场景：阅读页和数据均保存在源文件旁，离线运行，无外部字体、CDN、追踪或自动网络请求。分享单个HTML可阅读分析；若还希望原文按钮可用，应同时保留原PDF的相对位置。"]}</script>
<script>
const D=JSON.parse(document.getElementById('book-data').textContent);let mode='read',readPosition=0;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const sourceHref=a=>{const m=String(a).match(/PDF p\.\s*(\d+)/);return m?`${D.meta.source_file}#page=${m[1]}`:null};
const arr=v=>Array.isArray(v)?v:[],anchors=v=>arr(v).map(x=>sourceHref(x)?`<a class="tag anchor" target="_blank" rel="noopener" href="${esc(sourceHref(x))}">原文 ${esc(x)} ↗</a>`:`<span class="tag anchor">${esc(x)}</span>`).join('');
const voice=v=>v==='editor'?'<span class="tag editor">编者分析</span>':v==='external'?'<span class="tag">外部资料</span>':'';
const list=(items,cls='detail-list')=>arr(items).length?`<ul class="${cls}">${arr(items).map(x=>`<li>${esc(typeof x==='string'?x:x.detail||x.name)}</li>`).join('')}</ul>`:'';
const excerpts=items=>arr(items).map(x=>`<blockquote class="excerpt">“${esc(x.text)}”<br>${anchors([x.anchor])}</blockquote>`).join('');
const card=(x,body='')=>`<article class="card searchable"><h3>${esc(x.title||x.question||x.term)}</h3>${body}${arr(x.related_concepts).length?relationButtons(x.related_concepts):''}${voice(x.voice)}${anchors(x.anchors)}</article>`;
const section=(id,kicker,title,sub,body,m,open=false)=>`<section id="${id}" data-mode-section="${m}" class="mode-section"><button class="section-toggle" aria-expanded="${open}" aria-controls="${id}-body"><span class="section-heading"><span class="section-kicker">${kicker}</span><span class="section-title">${title}</span><span class="section-sub">${sub}</span></span><span class="chevron" aria-hidden="true">＋</span></button><div class="section-body" id="${id}-body" ${open?'':'hidden'}>${body||'<p class="empty">本书未设置此部分。</p>'}</div></section>`;
function relationButtons(ids){return `<div class="relation-list">${arr(ids).map(id=>{const c=arr(D.concepts).find(x=>x.id===id);return c?`<button class="concept-link" data-concept-target="${esc(id)}">${esc(c.title)}</button>`:''}).join('')}</div>`}
const inlineTerms={'生命周期':'lifecycle','垃圾回收':'memory','内存泄漏':'memory','线程池':'pool','连接池':'pool','对象池':'pool','回调':'async','异步':'async','并发':'concurrency','并行':'concurrency','流水线':'pipeline','死锁':'lock','队列':'queue','序列化':'serialization','JSON':'serialization','Base64':'encoding','Unicode':'encoding','UTF-8':'encoding','MD5':'hash','GeoHash':'location','数据库':'database','倒排索引':'index','索引':'index','数据模型':'data-model','缓存':'cache','票据':'token','Cookie':'token','身份':'identity','权限':'identity','加密':'crypto','签名':'crypto','生命周期':'lifecycle','SDK':'interface','API':'interface','接口':'interface','CPU':'cpu','GPU':'gpu','内存':'memory','渲染':'rendering','贝塞尔曲线':'animation','二维码':'qr','响应式':'platform','热更新':'hot-update','A/B':'experiment','原型':'prototype','压缩':'compression'};
function linkedText(value,skip){const raw=String(value||''),terms=Object.keys(inlineTerms).sort((a,b)=>b.length-a.length);let pos=0,result='',count=0;const used=new Set();while(pos<raw.length){let best=-1,key='';for(const t of terms){if(used.has(t)||inlineTerms[t]===skip)continue;const at=raw.indexOf(t,pos);if(at>=0&&(best<0||at<best)){best=at;key=t}}if(best<0||count>=8){result+=esc(raw.slice(pos));break}result+=esc(raw.slice(pos,best))+`<button class="inline-concept" data-concept-target="${inlineTerms[key]}" title="查看${esc(key)}的解释">${esc(key)}</button>`;pos=best+key.length;used.add(key);count++}return result}
function chapter(x,i){const parts=arr(x.sections).map(s=>`<details class="subargument searchable" id="${esc(s.id)}"><summary>${esc(s.title)}</summary><div class="subargument-content"><p>${linkedText(s.detail)}</p>${excerpts(s.excerpts)}${relationButtons(s.related_concepts)}${anchors(s.anchors)}<div class="source-note">编者解读 · 原文主张与校准一并说明 · 非全文转载</div></div></details>`).join('');const flow=arr(x.argument_flow).length?`<div class="argument-flow">${x.argument_flow.map((s,j)=>`${j?'<span class="flow-arrow">→</span>':''}<span class="flow-step">${esc(s)}</span>`).join('')}</div>`:'';return `<article class="fold chapter searchable" id="${esc(x.id)}"><button class="fold-toggle" aria-expanded="${i===0}" aria-controls="${esc(x.id)}-body"><span class="fold-no">${String(i+1).padStart(2,'0')}</span><span><span class="fold-title">${esc(x.title)}</span><span class="fold-role">${esc(x.role)}</span></span><span class="chevron" aria-hidden="true">＋</span></button><div class="fold-body" id="${esc(x.id)}-body" ${i===0?'':'hidden'}>${x.question?`<p class="chapter-question"><b>本专题回答：</b>${esc(x.question)}</p>`:''}<p class="mainline"><b>本专题主线：</b>${esc(x.mainline||x.summary)}</p>${flow}${parts}${arr(x.takeaways).length?`<h4>读完应留下什么</h4>${list(x.takeaways)}`:''}${arr(x.related_concepts).length?`<div class="concept-block"><h4>相关概念</h4>${relationButtons(x.related_concepts)}</div>`:''}<span class="tag editor">依据原书重构</span><span class="confidence">依据强度：${esc(x.confidence||'未标注')}</span>${anchors(x.anchors)}</div></article>`}
function concept(x){const factors=arr(x.factors).map(f=>`<li><b>${esc(f.name)}：</b>${esc(f.detail)} ${anchors(f.anchors)}</li>`).join('');const relations=arr(x.relations).map(r=>{const t=arr(D.concepts).find(c=>c.id===r.target_id);return `<div><button class="concept-link" data-concept-target="${esc(r.target_id)}">${esc(r.label||'关联')}：${esc(t?.title||r.target_id)}</button><p>${esc(r.explanation)}</p></div>`}).join('');return `<article class="card concept searchable" id="concept-${esc(x.id)}"><button class="fold-toggle" aria-expanded="false" aria-controls="concept-${esc(x.id)}-body"><span><span class="fold-title">${esc(x.title)}</span><span class="fold-role">${esc(x.one_line)}</span></span><span class="chevron" aria-hidden="true">＋</span></button><div class="fold-body" id="concept-${esc(x.id)}-body" hidden><p>${linkedText(x.explanation,x.id)}</p>${factors?`<div class="concept-block"><h4>影响因素</h4><ul>${factors}</ul></div>`:''}${arr(x.effects).length?`<div class="concept-block"><h4>它会影响什么</h4>${list(x.effects)}</div>`:''}${arr(x.observables).length?`<div class="concept-block"><h4>如何观察或使用</h4>${list(x.observables)}</div>`:''}${x.boundary?`<div class="concept-block"><h4>边界</h4><p>${esc(x.boundary)}</p></div>`:''}${relations?`<div class="concept-block"><h4>概念关系</h4>${relations}</div>`:x.connection?`<div class="concept-block"><h4>概念关系</h4><p>${esc(x.connection)}</p></div>`:''}${excerpts(x.excerpts)}${articleReferences(x)}${voice(x.voice)}${anchors(x.anchors)}<div class="confidence">置信度：${esc(x.confidence||'未标注')}</div></div></article>`}
function articleReferences(x){const sources=arr(x.source_articles).map(id=>D.chapters.flatMap(c=>c.sections).find(a=>a.id===id)).filter(Boolean);if(!sources.length)return '';return `<details class="article-references"><summary>回到原题解读 · ${sources.length}篇</summary><div class="relation-list">${sources.map(a=>`<button class="article-link" data-article-target="${esc(a.id)}">${esc(a.title)} · PDF ${a.pdf_start}</button>`).join('')}</div></details>`}
function goArticle(id){const target=document.getElementById(id);if(!target)return;setMode('read');openAncestors(target);target.classList.add('search-hit');target.scrollIntoView({block:'start',behavior:'instant'});setTimeout(()=>target.classList.remove('search-hit'),1500)}
function render(){
document.documentElement.style.setProperty('--accent',D.meta?.theme?.accent||'#9E2A24');
$('#bookMeta').innerHTML=`<h1>${esc(D.meta.title)}</h1><p>${esc(D.meta.author)}${D.meta.edition?' · '+esc(D.meta.edition):''}</p><span class="coverage">${D.meta.coverage==='complete'?'完整覆盖':'部分覆盖'}</span>`;
const o=D.orientation||{};let html=`<div class="scope-notice"><strong>${esc(D.meta.scope_title)}</strong><p>${esc(D.meta.scope_summary)}</p><p><a class="source-link" href="#coverage" id="scopeLink">查看版本与逐页覆盖 ↓</a></p></div>`;html+=`<div class="hero searchable"><div class="eyebrow">${esc(o.eyebrow||`${D.meta.author} · 深度蒸馏`)}</div><h2>${esc(D.meta.title)}</h2><p class="lead">${esc(o.thesis)}</p><div class="orientation-grid"><article><b>本书解决什么问题</b><p>${esc(o.problem)}</p></article><article><b>适合谁与如何阅读</b><p>${esc(o.reader||'希望建立完整知识骨架的读者')}</p><p>${esc(o.how_to_read||'先顺序阅读，再进入深度探究。')}</p></article></div></div>`;
html+=section('coverage','阅读','版本与阅读覆盖','逐页处理记录与文本质量说明。',`<p>${esc(D.meta.coverage_note)}</p><div class="stats"><span class="stat">${D.meta.source_pages}页已处理</span><span class="stat">${D.chapters.length}个专题</span><span class="stat">${D.chapters.reduce((n,c)=>n+arr(c.sections).length,0)}篇文章</span><span class="stat">${D.concepts.length}个概念</span><span class="stat">${D.concepts.reduce((n,c)=>n+arr(c.relations).length,0)}条概念关系</span></div><p>${esc(D.meta.edition_note)}</p><details><summary>展开${D.meta.source_pages}页处理台账</summary><div class="table-wrap"><table class="scope-table"><thead><tr><th>PDF出处</th><th>状态</th><th>说明</th></tr></thead><tbody>${arr(D.coverage_map).map(r=>`<tr><td>${anchors([r.range])}</td><td>${esc(({read:'已处理',excluded:'空白／不作论证证据',unreadable:'源文件损坏·不可读'})[r.status]||r.status)}</td><td>${r.printed_page!=null?`纸质${r.printed_page}页 · `:""}${esc(r.kind)}：${esc(r.notes)}</td></tr>`).join('')}</tbody></table></div></details>`,'read');
html+=section('overview','阅读','全书速览','点击标题展开或收起完整知识骨架。',`<div class="framework"><h3>把技术知识用在产品判断上</h3><p>编者综合重构 · 实际工作存在反馈与反复，并非机械串行。</p><div class="framework-grid">${D.framework.map((s,i)=>`<article><span class="step-index">0${i+1}</span><h4>${esc(s.title)}</h4><p>${linkedText(s.detail)}</p>${relationButtons(s.ids)}</article>`).join('')}</div>${anchors(['PDF p. 25–39','PDF p. 688–689','PDF p. 722–724','PDF p. 768–769'])}</div><div class="card-grid">${arr(D.overview).map(x=>card(x,`<p><b>${esc(x.summary)}</b></p>${list(x.details)}`)).join('')}</div>`,'read',true);
html+=section('chapters','阅读','逐章解读','按原目录保留11个专题与354篇文章。专题与每篇独立折叠；选择原题可直接定位。',`<label class="chapter-picker">选择专题 <select id="chapterJump" aria-label="选择专题"><option value="">选择专题…</option>${D.chapters.map(c=>`<option value="${esc(c.id)}">${esc(c.part)} · ${esc(c.title)}</option>`).join('')}</select></label><label class="chapter-picker">选择原题 <select id="articleJump" aria-label="选择原文文章"><option value="">选择354篇文章之一…</option>${D.chapters.map(c=>`<optgroup label="${esc(c.title)}">${c.sections.map(a=>`<option value="${esc(a.id)}">${a.pdf_start} · ${esc(a.title)}</option>`).join('')}</optgroup>`).join('')}</select></label>`+arr(D.chapters).map(chapter).join(''),'read',true);
html+=section('concepts','深度探究','核心概念','展开概念查看定义、影响因素、结果、边界和可跳转关系。',`<div class="card-grid">${arr(D.concepts).map(concept).join('')}</div>`,'explore',true);
html+=section('formulations','深度探究','金句与关键表述','短引文保留作者措辞，同时提供语境解释和出处。',`<div class="card-grid">${arr(D.formulations).map(x=>card({title:x.verbatim?'原文短引':'关键表述',anchors:x.anchors},`<p class="quote">${esc(x.text)}</p><p>${esc(x.commentary)}</p>`)).join('')}</div>`,'explore');
html+=section('critique','深度探究','批判与评价','检验论证、边界与隐含前提。',`<div class="card-grid">${arr(D.critique).map(x=>card(x,`<p>${esc(x.analysis)}</p>`)).join('')}</div>`,'explore');
html+=section('reality','深度探究','现实问题','把书中的洞见转成可观察的问题。',`<div class="card-grid">${arr(D.reality).map(x=>card(x,`<p>${esc(x.application)}</p>`)).join('')}</div>`,'explore');
html+=section('actions','深度探究','行动清单','从理解走向实践，并留下复盘信号。',`<div class="card-grid">${arr(D.actions).map(x=>card(x,`<p><b>触发：</b>${esc(x.trigger)}</p><ol>${arr(x.steps).map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p><b>观察信号：</b>${esc(x.signal)}</p><p><b>复盘：</b>${esc(x.review)}</p>`)).join('')}</div>`,'explore');
html+=section('glossary','深度探究','术语表','按本书语境解释关键词。',`<div class="card-grid">${arr(D.glossary).map(x=>card(x,`<p>${esc(x.definition)}</p>`)).join('')}</div>`,'explore');
html+=section('notes','阅读','来源与编者说明','版本、引文、文本问题与声音区分。',list(D.notes),'read');html+=`<div class="footer">本地离线阅读 · 以原书为据，保留独立思考</div>`;$('#content').innerHTML=html;bindAccordions();bindConceptLinks();setMode(mode);document.querySelectorAll('[data-article-target]').forEach(b=>b.onclick=e=>{e.stopPropagation();goArticle(b.dataset.articleTarget)});$('#articleJump').onchange=e=>goArticle(e.target.value);$('#chapterJump').onchange=e=>{const target=document.getElementById(e.target.value);if(target){openAncestors(target);target.scrollIntoView({block:'start',behavior:'instant'})}};$('#scopeLink').onclick=e=>{e.preventDefault();setMode('read');const s=$('#coverage');toggle(s.querySelector('.section-toggle'),true);s.scrollIntoView({block:'start'})}}
function toggle(button,open){button.setAttribute('aria-expanded',String(open));const body=document.getElementById(button.getAttribute('aria-controls'));if(body)body.hidden=!open}
function bindAccordions(){document.querySelectorAll('.section-toggle,.fold-toggle').forEach(b=>b.onclick=()=>toggle(b,b.getAttribute('aria-expanded')!=='true'))}
function setMode(next){if(mode==='read'&&next!=='read')readPosition=scrollY;mode=next;$('#backRead').hidden=mode==='read';document.querySelectorAll('[data-mode-button]').forEach(x=>{x.classList.toggle('active',x.dataset.modeButton===mode);x.setAttribute('aria-selected',String(x.dataset.modeButton===mode))});document.querySelectorAll('[data-mode-section]').forEach(x=>x.classList.toggle('hidden',x.dataset.modeSection!==mode));buildNav()}
function openAncestors(el){let ancestor=el;while(ancestor){if(ancestor.tagName==='DETAILS')ancestor.open=true;ancestor=ancestor.parentElement}const sectionEl=el.closest('.mode-section');if(sectionEl){const b=sectionEl.querySelector(':scope > .section-toggle');toggle(b,true)}const fold=el.closest('.fold');if(fold){const b=fold.querySelector(':scope > .fold-toggle');toggle(b,true)}if(el.classList.contains('concept')){const b=el.querySelector(':scope > .fold-toggle');toggle(b,true)}}
function goConcept(id){setMode('explore');const target=document.getElementById(`concept-${id}`);if(!target)return;openAncestors(target);target.classList.add('search-hit');target.scrollIntoView({block:'start',behavior:'instant'});setTimeout(()=>target.classList.remove('search-hit'),1500)}
function bindConceptLinks(){document.querySelectorAll('[data-concept-target]').forEach(b=>b.onclick=e=>{e.stopPropagation();goConcept(b.dataset.conceptTarget)})}
function buildNav(){const items=[...document.querySelectorAll(`.mode-section[data-mode-section="${mode}"]`)];$('#nav').innerHTML=`<div class="nav-group"><p class="nav-label">${mode==='read'?'顺序阅读':'跳转探究'}</p>${items.map(x=>`<button class="nav-link" data-target="${x.id}">${esc(x.querySelector('.section-title').textContent)}</button>${x.id==='chapters'?D.chapters.map(c=>`<button class="nav-link unit-link" data-target="${esc(c.id)}">${esc(c.title)}</button>`).join(''):''}`).join('')}</div>`;document.querySelectorAll('.nav-link').forEach(b=>b.onclick=()=>{const s=document.getElementById(b.dataset.target);{const b=s.querySelector(':scope > .section-toggle');if(b)toggle(b,true);openAncestors(s)};s.scrollIntoView()})}
document.querySelectorAll('[data-mode-button]').forEach(b=>b.onclick=()=>{const next=b.dataset.modeButton;setMode(next);scrollTo({top:next==='read'?readPosition:0,behavior:'instant'})});
$('#backRead').onclick=()=>{setMode('read');scrollTo({top:readPosition,behavior:'instant'})};
$('#expandAll').onclick=()=>{document.querySelectorAll('.mode-section:not(.hidden) .section-toggle,.mode-section:not(.hidden) .fold-toggle').forEach(b=>toggle(b,true));document.querySelectorAll('.mode-section:not(.hidden) details').forEach(x=>x.open=true)};
$('#collapseAll').onclick=()=>{document.querySelectorAll('.mode-section:not(.hidden) .section-toggle,.mode-section:not(.hidden) .fold-toggle').forEach(b=>toggle(b,false));document.querySelectorAll('.mode-section:not(.hidden) details').forEach(x=>x.open=false)};
let searchHits=[],searchIndex=0;
function revealSearchHit(){document.querySelectorAll('.search-hit').forEach(x=>x.classList.remove('search-hit'));if(!searchHits.length)return;const hit=searchHits[searchIndex];const sectionEl=hit.closest('.mode-section');if(sectionEl&&sectionEl.dataset.modeSection!==mode)setMode(sectionEl.dataset.modeSection);openAncestors(hit);hit.classList.add('search-hit');hit.scrollIntoView({block:'start',behavior:'instant'});$('#searchStatus').textContent=`${searchIndex+1}/${searchHits.length}处 · 回车下一处`}
$('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.search-hit').forEach(x=>x.classList.remove('search-hit'));searchHits=[];searchIndex=0;if(!q){$('#searchStatus').textContent='';return;}searchHits=[...document.querySelectorAll('.subargument,.concept,.card:not(.concept),.mainline,.chapter-question,.chapter > .fold-toggle,.hero')].filter(x=>x.textContent.toLowerCase().includes(q));if(searchHits.length)revealSearchHit();else $('#searchStatus').textContent='未找到匹配内容';});
$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'&&searchHits.length){e.preventDefault();searchIndex=(searchIndex+(e.shiftKey?-1:1)+searchHits.length)%searchHits.length;revealSearchHit();}});
window.addEventListener('beforeprint',()=>document.querySelectorAll('details').forEach(x=>{x.dataset.printOpen=String(x.open);x.open=true}));window.addEventListener('afterprint',()=>document.querySelectorAll('details').forEach(x=>{x.open=x.dataset.printOpen==='true'}));
window.addEventListener('scroll',()=>{$('#progress').style.width=(100*scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight))+'%'});$('#toTop').onclick=()=>scrollTo({top:0,behavior:'smooth'});render();const headerObserver=new ResizeObserver(()=>document.documentElement.style.setProperty('--header-height',$('.topbar').getBoundingClientRect().height+'px'));headerObserver.observe($('.topbar'));window.addEventListener('scroll',()=>$('#toTop').classList.toggle('shown',scrollY>500));
</script></body></html>
