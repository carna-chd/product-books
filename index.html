face", "architecture"], "excerpts": []}, {"id": "article-511", "title": "大年初四，让我们一起来动手撸代码吧", "detail": "作者通过一个小型C程序串起源文件、预处理、编译、汇编、链接、可执行文件到加载运行的路径，并以代码区、数据区、堆与栈介绍进程中的存储分工。它把“写代码”和“程序正在运行”这两个阶段分开，帮助定位编译错误、依赖缺失与运行异常。示例是特定语言和工具链的说明，不能据此认定所有语言都有完全相同的流水线，或所有平台都以main作为操作系统直接进入的位置。", "anchors": ["PDF p. 511–513"], "pdf_start": 511, "pdf_end": 513, "voice": "editor", "related_concepts": ["build", "concurrency", "memory"], "excerpts": []}, {"id": "article-514", "title": "当你向程序员说有个 bug 时，他会干些什么？", "detail": "收到bug后，开发者首先需要稳定复现与缩小范围，再借助断点查看现场变量、日志还原过程、内存分析寻找异常持有。不同工具回答不同问题：断点适合观察某一时刻，日志适合追踪时序，内存工具适合资源变化。产品反馈应包含操作步骤、设备版本、预期与实际、出现频率及时间。崩溃位置不一定是根因，断点或日志也可能改变并发时序，不能以“看一眼代码”作为通用修复时限。", "anchors": ["PDF p. 514–515"], "pdf_start": 514, "pdf_end": 515, "voice": "editor", "related_concepts": ["observability", "collaboration"], "excerpts": []}, {"id": "article-516", "title": "当我们谈论动画的时候，我们在谈论什么", "detail": "动画是连续状态变化被及时呈现，文中以约60帧和每帧约16毫秒说明：一帧内的计算、布局与绘制赶不上预算，用户就会看到卡顿。定时播放与随手势变化的动画在输入控制上不同，系统接口能减少基础实现成本。要把帧率目标与实际设备、动画复杂度一起测试；不能把所有动画都视作只在GPU上运行，也不能据“只是几个参数”忽略主线程和布局的开销。", "anchors": ["PDF p. 516–517"], "pdf_start": 516, "pdf_end": 517, "voice": "editor", "related_concepts": ["animation", "rendering"], "excerpts": []}, {"id": "article-518", "title": "动手写代码：程序中的数据", "detail": "通过常量、变量、数值、字符、字符串和数组，作者说明程序首先要用适当形式表示业务信息，然后才能计算或传递。类型会影响可存取的值、运算方式和内存使用，空值还需要与零、空字符串等业务状态区分。书中的C风格例子有助入门，但“整数都是固定范围”“字符串都以同一种数组形式存在”等推断必须受语言约束，不能把示例实现变成普遍规则。", "anchors": ["PDF p. 518–520"], "pdf_start": 518, "pdf_end": 520, "voice": "editor", "related_concepts": ["data-model", "encoding", "build", "requirements"], "excerpts": []}, {"id": "article-521", "title": "动手写代码：数据的结构", "detail": "文章比较顺序存放的数组与由节点连接的链表：数组可以通过位置较直接访问，但中间插入可能移动后续元素；链表通过连接关系表达顺序，调整已知位置的连接较方便，却可能需要先遍历查找。产品场景中的列表体验并不能直接决定底层结构，要看查询、插入、删除频率与规模。不能只比较插入动作而忽略定位节点，也不能把数组描述成总是比链表多占空间。", "anchors": ["PDF p. 521–524"], "pdf_start": 521, "pdf_end": 524, "voice": "editor", "related_concepts": ["data-structure", "index", "performance"], "excerpts": []}, {"id": "article-525", "title": "动手写代码：栈与队列", "detail": "队列把先进先出的顺序用于任务和下载排队，栈把后进先出的顺序用于返回路径等后退场景。两者先定义的是取放规则，底层可以由不同数据结构实现。文章帮助把“先来先服务”与“先退最近一步”写进产品状态设计。页面返回栈、函数调用栈和技术栈不是同一个对象；栈溢出也不能笼统等同于所有形式的内存不足。", "anchors": ["PDF p. 525–526"], "pdf_start": 525, "pdf_end": 526, "voice": "editor", "related_concepts": ["queue", "data-structure", "lifecycle"], "excerpts": []}, {"id": "article-527", "title": "复用的艺术：线程池", "detail": "线程池把可重复使用的工作线程保留下来，让任务进入队列后由空闲线程执行，减少反复创建销毁线程的开销。它也给同时处理的数量设上限，避免过多线程占用内存和切换成本。产品上的收益是批量任务更可控，而非无条件更快。文中提到的线程数量限制不能当作所有Linux环境的固定常数；池大小、队列长度、超时和拒绝策略仍需共同设计。", "anchors": ["PDF p. 527–528"], "pdf_start": 527, "pdf_end": 528, "voice": "editor", "related_concepts": ["pool", "concurrency", "queue", "performance"], "excerpts": []}, {"id": "article-529", "title": "嘿，我用字符画了一张图，你能认出来吗？", "detail": "Base64将三字节拆成四个六位组，再映射成可传输字符，不足部分用填充符补齐；图片可以因此嵌入文本或页面。它解决特定传输载体不便携带原始二进制的问题，代价通常是体积增加，不能当成压缩或保密。长串样例不必照搬。文中关于ASCII位数及字母A的二进制示例存在混淆，需与PDF541的字符编码说明对照；概念上应分清字节、编码表与字符显示。", "anchors": ["PDF p. 529–533"], "pdf_start": 529, "pdf_end": 533, "voice": "editor", "related_concepts": ["encoding", "media", "performance", "security"], "excerpts": []}, {"id": "article-534", "title": "后台到底是干啥的？谈谈 RPC 框架", "detail": "RPC框架让一个模块以类似调用函数的形式向远端服务提出请求，背后仍需要寻找服务、序列化参数、通过协议传输并处理结果。作者从后台职责说明框架还能整合路由、监控等重复工作。接口看起来像本地调用，不表示失败特性也相同：网络超时后，远端可能已经执行。Protobuf主要解决数据表示和序列化，不能单独当作包含所有通信治理能力的完整RPC框架。", "anchors": ["PDF p. 534–535"], "pdf_start": 534, "pdf_end": 535, "voice": "editor", "related_concepts": ["interface", "serialization", "distributed"], "excerpts": []}, {"id": "article-536", "title": "技术进阶：生产者与消费者模式", "detail": "生产者生成任务或数据，消费者按自己的速度处理，二者通过缓冲队列衔接；作者用下单派单与图片下载、解码、显示解释分工。队列吸收短时间的速度差，但容量有限时生产者仍需等待、降速或拒绝继续进入。应区分阻塞等待与持续空转检查，明确积压可见性、取消和失败重试。拆成多个角色不会自动消除瓶颈，长期生产速度大于消费速度仍会造成积压。", "anchors": ["PDF p. 536–538"], "pdf_start": 536, "pdf_end": 538, "voice": "editor", "related_concepts": ["queue", "pipeline", "concurrency"], "excerpts": []}, {"id": "article-539", "title": "技术源于生活之流水线", "detail": "流水线让不同阶段在不同项目上重叠工作，提高连续产出数量，但单件仍需经历各阶段。CPU执行与图像处理的类比共同说明：吞吐量、单件时延、阶段耗时和资源冲突应分别计算。书中15、15、30分钟的三阶段例子若每阶段只能同时处理一件，三件完成应到第120分钟，不能直接得到文中的1.5小时；第三阶段的瓶颈要画时间轴校验，而不是只数有几个阶段。", "anchors": ["PDF p. 539–540"], "pdf_start": 539, "pdf_end": 540, "voice": "editor", "related_concepts": ["pipeline", "performance", "concurrency"], "excerpts": []}, {"id": "article-541", "title": "乱码导致的悲剧告白", "detail": "从ASCII的字符编号到中文字符集，再到Unicode与UTF系列编码，作者说明同一段字节只有按约定解释才能成为文字。字符编号、编号如何落到字节、最终用什么字形显示，是三个相关但不同的问题。文章适合解释乱码为何常发生在跨系统传输。示例字符数量带有当时背景，不应作为当前全集大小；GBK不是Unicode的简单压缩小字典，UTF-8也不是独立于Unicode的另一套语义编号。", "anchors": ["PDF p. 541–542"], "pdf_start": 541, "pdf_end": 542, "voice": "editor", "related_concepts": ["encoding", "data-model", "serialization"], "excerpts": []}, {"id": "article-543", "title": "你了解敏捷式开发和瀑布式开发吗？", "detail": "瀑布式按阶段推进，敏捷式通过较短周期交付与用户反馈逐步调整。作者用客户早看到结果的好处说明：需求不确定时，长时间只按最初文档前进，可能把误解积累到末期。关键比较应是反馈周期、变更代价、协调与验证方式。不能把瀑布说成绝不反馈，也不能把敏捷理解为不要计划或文档；需求稳定、合规审查与探索任务可以采用不同节奏或组合方式。", "anchors": ["PDF p. 543–545"], "pdf_start": 543, "pdf_end": 545, "voice": "editor", "related_concepts": ["prototype", "requirements", "collaboration"], "excerpts": []}, {"id": "article-546", "title": "加载等待的艺术", "detail": "加载等待的体验既取决于真实耗时，也取决于界面是否及时反馈。作者建议把耗时工作从界面流程拆开，并用入口动画等已存在的时间重叠处理，减少用户面对空白的时刻。异步不代表工作消失，后台任务也可能争用CPU、内存和IO；动画更不是全部由GPU无成本完成。验收应同时看首个反馈、内容可用时间、卡顿、取消和失败提示，不能用遮挡等待代替真正优化。", "anchors": ["PDF p. 546–548"], "pdf_start": 546, "pdf_end": 548, "voice": "editor", "related_concepts": ["async", "rendering", "performance"], "excerpts": []}, {"id": "article-549", "title": "耦合与解耦", "detail": "支付模块调用扫码模块后，如果扫码实现直接反过来认识某个支付页面，模块迁移到别处就要连带修改。通过约定接口、结果回传或事件，可以把可复用能力与具体业务入口隔开。解耦减少的是不必要的内部依赖，不是让所有模块互相毫无联系。是否拆分要结合复用机会、变化频率和测试成本，避免仅为想象中的未来抽出过多层。", "anchors": ["PDF p. 549–550"], "pdf_start": 549, "pdf_end": 550, "voice": "editor", "related_concepts": ["coupling", "interface", "architecture", "reuse"], "excerpts": []}, {"id": "article-550", "title": "如何做一个代码搬运工", "detail": "文章比较公开代码复用与从已有程序理解其结构，指出编译后仍可能暴露一部分实现信息，混淆只能增加理解难度。对产品经理，更有用的问题是现成组件能解决什么、许可是否允许、更新与安全由谁维护。能够看到或技术上能够复制，不等于获得使用授权。这里保留原理与边界，不提供窃取他人代码的操作路径，也不以“到处都有代码”推断研发工作可以直接省略。", "anchors": ["PDF p. 550–552"], "pdf_start": 550, "pdf_end": 552, "voice": "editor", "related_concepts": ["reuse", "license", "security", "build"], "excerpts": []}, {"id": "article-553", "title": "软件架构中的三权分立：MVC 模式", "detail": "注册场景被拆成负责数据的Model、展示与交互的View、协调流程的Controller，目的是让业务逻辑与界面细节的变化少互相牵动。作者借三权分立说明分工，真正连接它们的仍是数据与行为约定。改数据库或验证规则可能改变契约，并非采用MVC后任何一层都可无成本替换。评审应明确状态存放、校验位置、错误如何反馈，而不是只检查文件是否分成三类。", "anchors": ["PDF p. 553–554"], "pdf_start": 553, "pdf_end": 554, "voice": "editor", "related_concepts": ["coupling", "architecture", "data-model"], "excerpts": []}, {"id": "article-555", "title": "什么是代码混淆", "detail": "代码混淆改变名称或结构的可读性，在保持预期行为的前提下提高逆向理解成本。它与压缩、编译和加密有交集场景，但概念不能互换，也不能保证秘密永远无法提取。源文带有以混淆掩饰重复交付的调侃，应剥离为不透明交付的反例：产品验收应核对实际能力、可维护性和授权，而非因安装包名称不同就认定是独立研发成果。", "anchors": ["PDF p. 555–557"], "pdf_start": 555, "pdf_end": 557, "voice": "editor", "related_concepts": ["crypto", "security", "build"], "excerpts": []}, {"id": "article-558", "title": "说说并行计算", "detail": "并行把能够独立进行的计算分到多个处理单元，流水线则让不同阶段处理不同项目。文中用分组求和说明依赖关系如何决定可以同时做哪一步，结果合并也有成本。多核存在并不意味着原有串行代码自动成倍加速，数据搬运、任务拆分、同步和不可并行部分都会限制收益。MPI与OpenMP是并行编程的相关接口或机制，不宜简单列为与通用语言同层级的独立语言。", "anchors": ["PDF p. 558–559"], "pdf_start": 558, "pdf_end": 559, "voice": "editor", "related_concepts": ["concurrency", "cpu", "performance", "pipeline"], "excerpts": []}, {"id": "article-560", "title": "说说进程间通信", "detail": "进程有相对独立的运行空间，需要通过文件、管道、共享内存、信号、套接字等机制交换信息。不同机制在数据量、时效、权限、同步和资源寿命上各有代价。产品跨应用或跨模块协作时，应问清发送方、接收方、消息格式和失败责任。共享内存不等于无需同步；RPC是一种调用抽象，也不能把所有进程通信都缩成一种套接字实现。", "anchors": ["PDF p. 560–560"], "pdf_start": 560, "pdf_end": 560, "voice": "editor", "related_concepts": ["concurrency", "interface", "security"], "excerpts": []}, {"id": "article-561", "title": "说一说数据类型转换的坑", "detail": "数据类型转换可能改变可表达的范围与精度。作者用不断增长的渠道编号说明：小类型曾经足够，不代表长期写入或跨系统转换后仍能保留原值。需要检查存储、接口、日志和前端展示是否共享同一范围约定。不能仅按处理器位数推断所有整数类型宽度；符号扩展、浮点精度与整数截断也不是同一种规则，“转成更大类型”不自动保证所有信息都能保留。", "anchors": ["PDF p. 561–562"], "pdf_start": 561, "pdf_end": 562, "voice": "editor", "related_concepts": ["data-model", "requirements", "platform"], "excerpts": []}, {"id": "article-563", "title": "搜索引擎的基石－倒排索引", "detail": "倒排索引先把文档拆成词项，再记录每个词出现在哪些文档中，查询时可先找到候选集合，避免逐篇扫描全文。核心从“文档到词”转为“词到文档”，还需决定多词查询如何组合及排序。书中what、is、it例子对并集与交集的结果存在混淆：按示例词表，并集还应包含只含部分词的文档；不能把候选检索与最终相关性排名当作同一步骤。", "anchors": ["PDF p. 563–564"], "pdf_start": 563, "pdf_end": 564, "voice": "editor", "related_concepts": ["index", "search", "data-structure"], "excerpts": []}, {"id": "article-565", "title": "为啥我们会看到乱码", "detail": "乱码不是文字自动变坏，而常是写入和读取使用了不同的字节解释约定。作者把中英文编码历史与跨平台显示联系起来，说明修复应追踪生成、存储、传输到解码的整个链条。也要区分编码错配、字体缺字与原始数据已被覆盖。文中把旧字符集理解成Unicode的压缩子集不够准确；不要反复试编码后保存覆盖唯一原件，以免让可恢复的信息真正丢失。", "anchors": ["PDF p. 565–565"], "pdf_start": 565, "pdf_end": 565, "voice": "editor", "related_concepts": ["encoding", "serialization", "observability"], "excerpts": []}, {"id": "article-566", "title": "为啥有些 BUG 不能改？", "detail": "有些小问题位于历史复杂、依赖不清的模块，直接修改可能引入更大故障；发布前验证不足时，暂缓修改也可能是风险选择。作者强调的是改动影响与收益一起评估，而不是“程序员不愿改就不改”。应记录用户影响、触发条件、替代路径、验证成本、负责人及重新处理时点，让暂缓决定可复查。不可把遗留代码的困难当作无限期不解决的理由。", "anchors": ["PDF p. 566–566"], "pdf_start": 566, "pdf_end": 566, "voice": "editor", "related_concepts": ["release", "observability", "tradeoff"], "excerpts": []}, {"id": "article-567", "title": "为什么你的程序「挂了」？", "detail": "程序“挂了”可能由非法访问、未处理异常、资源不足或系统行为触发，崩溃通常只是某条失败路径最终暴露的结果。文章试图把表面体验与运行现场联系起来。定位需要设备系统、应用版本、具体输入、调用链和资源信息；进程被系统终止、界面无响应和语言异常要分别判断，不能一律归咎于系统bug，也不能因重启恢复就认定根因消失。", "anchors": ["PDF p. 567–568"], "pdf_start": 567, "pdf_end": 568, "voice": "editor", "related_concepts": ["observability"], "excerpts": []}, {"id": "article-569", "title": "五分钟理解什么是面向对象", "detail": "面向对象把相关数据与能力组织为对象，通过对象之间的约定协作，而不是把所有程序写成互不相关的过程。文章通过日常对象说明，分类的价值在于让业务职责与代码结构较好对应。对象并不取消函数或流程，接口拥有同名方法也不表示实际能力完全一致。模型应保留状态与操作的前置条件，避免为了贴近生活比喻而制造违反业务规则的继承体系。", "anchors": ["PDF p. 569–571"], "pdf_start": 569, "pdf_end": 571, "voice": "editor", "related_concepts": ["abstraction", "interface"], "excerpts": []}, {"id": "article-571", "title": "五分钟理解技术名词：多态", "detail": "多态让调用方使用共同接口，而实际对象执行各自实现。快递员等例子说明，新增一个符合约定的实现，通常不必让使用者逐一识别所有具体类型。这里的“多态”是同一调用约定对应不同实现，不能与用户界面的多种状态混为一谈。可替换性还要求行为语义、错误与前提相容，只有方法名相同并不足以证明可以安全替换。", "anchors": ["PDF p. 571–573"], "pdf_start": 571, "pdf_end": 573, "voice": "editor", "related_concepts": ["abstraction", "interface"], "excerpts": []}, {"id": "article-574", "title": "五分钟理解技术名词：继承", "detail": "继承通过父类与子类表达共同特征与扩展，文章同时区分类、对象和实例。它适合“是一种”的关系，但“拥有某能力”也可能通过组合表达。继承不仅带来代码复用，也把子类与父类行为绑定，父类变化可能传播到多处。产品领域的分类应先检查含义是否成立，不能仅因为两段代码相似就强行建立父子关系。", "anchors": ["PDF p. 574–575"], "pdf_start": 574, "pdf_end": 575, "voice": "editor", "related_concepts": ["abstraction", "coupling"], "excerpts": []}, {"id": "article-576", "title": "五分钟理解技术名词：重构", "detail": "重构在保持既定外部行为的前提下调整内部组织，降低后续理解、修改和验证的成本。作者用房屋结构类比说明内部质量为何影响长期交付。重构不是功能重写的同义词，也不保证每次都提高运行速度。应明确行为基线、回归检查、渐进拆分和可观察收益，把维护能力改善与当期功能目标一起规划；类比不能直接当作真实建筑施工建议。", "anchors": ["PDF p. 576–578"], "pdf_start": 576, "pdf_end": 578, "voice": "editor", "related_concepts": ["coupling", "tradeoff", "release"], "excerpts": []}, {"id": "article-579", "title": "想搞 VR？先来学学 Untiy 吧", "detail": "Unity以编辑器、资源组织及可复用引擎能力，减少从底层图形接口逐项实现灯光、特效和交互的工作；跨平台来自底层为不同系统提供适配，并非平台差异消失。源文以Mono解释当时的一种运行路径，不能据此认定所有Unity项目或当前所有平台都逐行解释执行。原型容易起步，不等于完整VR产品只需拖拽素材；内容制作、输入、性能与眩晕等体验约束仍要验证。", "anchors": ["PDF p. 579–581"], "pdf_start": 579, "pdf_end": 581, "voice": "editor", "related_concepts": ["framework", "platform", "os", "rendering"], "excerpts": []}, {"id": "article-582", "title": "学好技术干百度，今天讲讲多线程", "detail": "主线程承担界面等关键工作，耗时任务可交给工作线程，避免界面流程被长时间阻塞。多线程让任务在时间上交错或在多核上并行，但要承担同步、切换和资源竞争。文中把线程增多近似理解成按比例多拿CPU时间，不宜直接采用；单线程也可以用异步IO处理多个未完成请求。是否有效要看瓶颈和运行环境，而不是只比较线程个数。", "anchors": ["PDF p. 582–583"], "pdf_start": 582, "pdf_end": 583, "voice": "editor", "related_concepts": ["concurrency", "async", "performance"], "excerpts": []}, {"id": "article-584", "title": "应用续命大法之异常捕获", "detail": "异常捕获让程序在预料到的失败分支中记录现场、回退或给予用户可恢复的提示，某些非关键能力失败时可以继续主流程。源文用读取设备信息的失败说明为何不能让局部问题直接终止应用。但“捕获后什么也不做”可能把崩溃改成静默错误或错误数据。应区分可恢复、必须中止与需要重试的情况，保留必要证据；崩溃率下降不能单独证明业务结果正确。", "anchors": ["PDF p. 584–585"], "pdf_start": 584, "pdf_end": 585, "voice": "editor", "related_concepts": ["observability", "requirements"], "excerpts": []}, {"id": "article-586", "title": "怎么就「编不过」？", "detail": "“编不过”发生在生成可执行产物的过程中，可能涉及语法、类型、依赖、工具链或平台配置；即使之前能编译，环境或依赖变化后也可能失败。作者通过原生代码与JVM字节码介绍编译和运行的区别。不能把bug限定为只在运行时发生，也不能用解释执行的入门类比推断某语言必然慢。处理应先读取具体错误、确认改动及环境，再确定责任与修复范围。", "anchors": ["PDF p. 586–587"], "pdf_start": 586, "pdf_end": 587, "voice": "editor", "related_concepts": ["build", "os", "observability"], "excerpts": []}, {"id": "article-588", "title": "知道空指针，你也能改 bug 了", "detail": "空指针问题意味着程序在某处需要对象，却拿到了表示没有对象的引用。文章通过增加判断展示一种避免直接崩溃的办法，更深的问题是这个对象为何缺失、业务是否允许缺失。零、空字符串、空集合和没有对象应分别建模。简单跳过后续代码可能留下未完成交易或界面状态，因此需要明确默认值、恢复路径和错误提示，而非把所有空值都吞掉。", "anchors": ["PDF p. 588–588"], "pdf_start": 588, "pdf_end": 588, "voice": "editor", "related_concepts": ["data-model", "requirements", "observability"], "excerpts": []}], "takeaways": ["这一专题共有44篇。逐篇保留原题和顺序；点击概念可继续追问机制、条件与边界。", "具体算法、平台与内部实现的限制放在相应条目中，概念层提供跨专题连接。"], "related_concepts": ["memory", "concurrency", "queue", "pipeline", "abstraction", "coupling"], "anchors": ["PDF p. 489–588"], "confidence": "源文释义与编者综合；历史主张未作外部核实"}, {"id": "ch-10", "title": "名词解释 · 44篇", "part": "专题10", "question": "经常被混用的术语各回答哪一层问题？", "role": "将前面散见的术语重新对齐，避免同一个词在不同语境下误导决策。", "mainline": "这一组文章围绕能力封装、运行机制、数据表示与视觉呈现做交叉解释。SDK、API、控件、组件、模式、框架、架构和引擎讨论不同层次的复用；程序、进程、线程、锁、死锁与池化讨论运行时资源；JSON、编码、摘要与时间戳讨论信息如何表示和识别；RGB、渲染、矢量图、HDR和响应式讨论显示效果如何产生。读法应是每遇一个名词就确认输入、输出、依赖和边界，再通过概念链接回到应用场景。这里不是标准定义的权威词典，MD5唯一性、许可证、图片内存等原文错误尤其不能直接采用。", "argument_flow": ["分清抽象与实例", "区分能力与组织", "解释运行和等待", "对齐数据表示", "理解显示与媒介", "核对兼容及许可"], "sections": [{"id": "article-589", "title": "4D 打印是啥意思？", "detail": "4D打印在三维形态之外引入随时间和刺激条件变化的材料行为，文章用可变空间和球鞋想象帮助读者理解“材料也可被设计成响应环境”。这些未来场景是愿景，不是已具备量产能力的证据。原文把它直接说成“没有打印机”过于绝对，技术成熟度曲线也不能保证某年必然成熟。产品判断应分开材料能否变化、变化能否控制、能否反复使用及成本是否可接受。", "anchors": ["PDF p. 589–590"], "pdf_start": 589, "pdf_end": 590, "voice": "editor", "related_concepts": ["innovation", "sensor", "tradeoff"], "excerpts": []}, {"id": "article-591", "title": "抽象、封装、类、实例、对象", "detail": "作者给出抽象、封装、类与对象的递进：先从具体事物提取共同属性和行为，再把数据与操作组织成类型，由类型创建具体实例。化妆包例子让“定义一种结构”与“真正存在的一个对象”区分开。页面会保留这条解释链，但不把生活中动词相同自动视作有效软件抽象；抽象必须服务当前任务，封装还涉及隐藏细节和控制访问，而不仅是把代码装进盒子。", "anchors": ["PDF p. 591–592"], "pdf_start": 591, "pdf_end": 592, "voice": "editor", "related_concepts": ["abstraction", "interface"], "excerpts": []}, {"id": "article-593", "title": "名词解释：SDK、API 和架构", "detail": "SDK是可供开发者集成的工具与能力集合，API是对外调用某项能力的约定，架构则安排系统各模块及相互关系。视频SDK例子说明复用成熟能力可减少从头实现的工作。三者处于不同层次，不能互相替代。源文“公有API随便用”需要补上权限、用途、配额及平台规则等条件；公开可调用并不表示自动得到用户授权，集成SDK也不免除数据和版本依赖的责任。", "anchors": ["PDF p. 593–594"], "pdf_start": 593, "pdf_end": 594, "voice": "editor", "related_concepts": ["interface", "architecture", "privacy"], "excerpts": []}, {"id": "article-595", "title": "名词解释：控件、组件、框架", "detail": "控件、组件与框架被作者作为复用粒度逐步扩大的例子：输入框或按钮承担局部交互，组合组件承接较完整行为，框架安排一类应用的协作方式。这个比较有助说明“已有一个按钮”与“已有一套完整业务能力”的差别。不同团队对控件和组件的叫法有交叉，不能当作不可更改的严格等级；LAMP等技术组合也不宜与所有程序框架完全等同。", "anchors": ["PDF p. 595–595"], "pdf_start": 595, "pdf_end": 595, "voice": "editor", "related_concepts": ["framework", "reuse", "abstraction"], "excerpts": []}, {"id": "article-596", "title": "程序员别唬我系列之：二进制文件", "detail": "从π的文本表示和数值表示出发，作者说明文件底层都由字节组成，“文本”意味着这些字节按字符规则可读，“二进制格式”则按特定数据结构解释。数字存储有时更紧凑，但不保证任何数据都更小或更快。原文ASCII数字映射有误，浮点还涉及精度；二进制也需要格式规则，并非随意写入。最重要的边界是：难以用记事本阅读不等于加密，更不等于防篡改。", "anchors": ["PDF p. 596–597"], "pdf_start": 596, "pdf_end": 597, "voice": "editor", "related_concepts": ["serialization", "encoding", "security"], "excerpts": []}, {"id": "article-598", "title": "程序员别唬我系列之：脚本", "detail": "脚本像可执行的剧本，按语言规则描述一组操作，由相应运行环境解释或执行。批处理、网页脚本、数据处理和自动化测试的例子，说明它的共同价值是让重复流程可复现、可批量完成。脚本并不全是Windows批处理，也不保证所有实现都逐行解释；工具和环境同样决定能做什么。把“能跑一个脚本”转为交付条件时，还需明确输入、权限、失败记录和重复执行结果。", "anchors": ["PDF p. 598–600"], "pdf_start": 598, "pdf_end": 600, "voice": "editor", "related_concepts": ["automation", "os"], "excerpts": []}, {"id": "article-601", "title": "程序员别唬我系列之：内存泄漏", "detail": "借钱不归还的类比解释内存泄漏：程序占住已经不再需要的内存，使可用资源随使用过程减少，最终可能带来卡顿或失败。诊断重点是反复进入退出、长时间运行后的占用趋势及对象持有关系，而非看到一次内存高就宣布泄漏。物理内存、进程地址空间和虚拟内存并非同一个上限；有自动回收的语言同样可能因仍被引用而长期保留无用对象。", "anchors": ["PDF p. 601–602"], "pdf_start": 601, "pdf_end": 602, "voice": "editor", "related_concepts": ["memory", "lifecycle", "observability"], "excerpts": []}, {"id": "article-603", "title": "程序员别唬我系列之：中间件", "detail": "中间件把重复的专业能力放在可复用的软件层中，使上层不必逐次接触所有底层细节。作者用代办机构与统一文件读写能力解释便利、专业分工和维护成本的集中。其用词范围较宽，甚至把普通功能封装也归入中间件。阅读时应追问它到底负责通信、存储还是运行环境，如何部署和失效；不能因为位于两个模块之间，就认为任何辅助函数都必然是行业所说的中间件。", "anchors": ["PDF p. 603–604"], "pdf_start": 603, "pdf_end": 604, "voice": "editor", "related_concepts": ["framework", "reuse", "architecture"], "excerpts": []}, {"id": "article-605", "title": "程序员常讲的「写死」是什么鬼", "detail": "“写死”意味着某项选择随程序版本交付，“可配置”则让行为在后续读取配置时改变。资讯频道例子把两者结合：首次启动或断网先显示本地默认内容，请求成功后更新并保存，下一次优先使用已获取的数据。主线是稳定底线与运营灵活性共同设计。云端可控还要交代版本兼容、有效期、校验、失败回退及撤回，不能只画一个配置后台就认定所有客户端都立即生效。", "anchors": ["PDF p. 605–605"], "pdf_start": 605, "pdf_end": 605, "voice": "editor", "related_concepts": ["configuration", "cache", "platform", "release"], "excerpts": []}, {"id": "article-606", "title": "程序员常说的「变量」是什么", "detail": "变量给运行中的数据命名，函数使用或改变这些值；成员变量表达对象状态，局部变量保存一次操作所需的中间结果。作者用公有、私有说明哪些内部数据允许外部接触。排查bug常需比较实际状态与预期，再追踪值从哪里来。变量不是现实对象本身，也不总是数学里可任意变化的数；产品规则要明确状态归属、允许取值、何时更新和谁可修改。", "anchors": ["PDF p. 606–606"], "pdf_start": 606, "pdf_end": 606, "voice": "editor", "related_concepts": ["data-model", "abstraction", "observability"], "excerpts": []}, {"id": "article-607", "title": "程序员常说的「哈希表」是个什么鬼", "detail": "哈希表用键经过映射找到存放位置，减少顺序遍历的成本；按姓名首字母定位的例子很快引出多个姓名映射同一位置的冲突。冲突处理、容量和数据分布影响实际效率，因此“一次查找”是入门理想化叙述，不能保证每次固定一步。哈希表的散列函数也不等于安全密码摘要；良好的分布与可重复映射比简单追求“随机”更准确，冲突处理应保留原有数据而非默许丢失。", "anchors": ["PDF p. 607–608"], "pdf_start": 607, "pdf_end": 608, "voice": "editor", "related_concepts": ["hash", "data-structure", "performance"], "excerpts": []}, {"id": "article-609", "title": "程序员常说的钩子(Hook)是啥意思？", "detail": "Hook在既有调用或事件路径中提供介入点，使某段处理可在原流程前后执行，作者从Windows消息解释“挂一个钩子”的含义。它可以支持扩展、观察与测试，也可能被用于绕过校验。此处保留流程原理与信任边界，不展开绕过签名等操作；能拦截本地返回值不证明拥有服务端授权，也不说明所有平台和进程都能任意介入。", "anchors": ["PDF p. 609–609"], "pdf_start": 609, "pdf_end": 609, "voice": "editor", "related_concepts": ["interface", "security"], "excerpts": []}, {"id": "article-610", "title": "程序员常说的配置文件是啥意思？", "detail": "配置文件把部分参数与行为规则从主体代码中分开，例子包括运行内存、引导文案、功能阈值和运营折扣。修改文件能否影响当前运行，取决于程序何时加载、是否支持刷新及如何验证，而非文件存在就能实时生效。类比说明书只适合帮助入门，配置文件还必须有机器可识别的结构。错误配置同样会导致故障，应说明默认值、权限、版本与回滚。", "anchors": ["PDF p. 610–611"], "pdf_start": 610, "pdf_end": 611, "voice": "editor", "related_concepts": ["configuration", "os", "release"], "excerpts": []}, {"id": "article-612", "title": "程序员常说的算法复杂度是什么？", "detail": "时间复杂度比较输入规模增长时操作量如何变化：遍历约随n增长，具有相应索引的定位可近似常数，逐一配对可能随n²增长。空间复杂度比较额外存储随规模的变化，缓存体现资源之间的交换。大O不是固定秒数，也不只允许描述最坏情况；哈希查找还受冲突等条件影响。评审应同时问数据量、增长速度、典型与极端场景，再用实测验证，而不是听见O(n²)就断定任何规模都不可用。", "anchors": ["PDF p. 612–613"], "pdf_start": 612, "pdf_end": 613, "voice": "editor", "related_concepts": ["performance", "data-structure", "tradeoff"], "excerpts": []}, {"id": "article-614", "title": "两张图，让你理解代码中的「锁」", "detail": "两笔转账先后读到同一个旧余额，再各自写回，就可能覆盖其中一笔更新。作者用锁把关键读改写过程包住，使同一资源上的修改按受控顺序进行，保住结果但可能增加等待。这里真正的问题是并发共享可变数据，不是“异步天然错误”。还需考虑锁的作用范围、异常释放和数据库事务等条件；只锁某一行界面代码不等于跨进程的余额更新已经正确。", "anchors": ["PDF p. 614–615"], "pdf_start": 614, "pdf_end": 615, "voice": "editor", "related_concepts": ["lock", "concurrency", "transaction"], "excerpts": []}, {"id": "article-616", "title": "程序猿常讲的「死锁」是什么鬼？", "detail": "两个执行者各持一部分资源，同时等待对方持有的资源，便可能形成无法自行前进的等待环。两把锁不同获取顺序的转账例子，让“仍在运行的系统为什么永远等不到结果”可视化。要区分死锁与暂时排队、慢查询和超时。原文最后留作思考，编辑可据例提出统一获取顺序、缩小持有范围及故障后释放的评审问题，但不能宣称单一做法适用于所有系统。", "anchors": ["PDF p. 616–618"], "pdf_start": 616, "pdf_end": 618, "voice": "editor", "related_concepts": ["lock", "concurrency"], "excerpts": []}, {"id": "article-619", "title": "当程序员说模板的时候，他在说什么？", "detail": "模板把相对稳定的展示结构和变化的数据分开，再由模板引擎按约定替换占位部分。日期示例说明“看起来相同的一页”为什么可以持续显示新内容。模板可以用于文本、结构化数据或不同页面环境，不限于某种大括号语法。替换时还要区分纯文本与可执行标记，避免把不可信输入直接变成页面指令；有模板也不等于前后端从此不必约定字段。", "anchors": ["PDF p. 619–619"], "pdf_start": 619, "pdf_end": 619, "voice": "editor", "related_concepts": ["dom", "rendering", "data-model"], "excerpts": []}, {"id": "article-620", "title": "给你点儿「颜色」瞧瞧-RGB 通识", "detail": "RGB用不同强度的红绿蓝光组合颜色，位深决定每个像素用多少位表达，Alpha补充透明信息。文章把颜色与图片内存联系起来，说明设计资产会影响运行资源。计算需校准：1920×1080×4为8,294,400字节，约7.91MiB，而非原文4Mb。某些系统使用ARGB顺序，不能不加区分套用到所有CSS颜色写法；支持颜色数量、色域和实际视觉质量也不是同一指标。", "anchors": ["PDF p. 620–622"], "pdf_start": 620, "pdf_end": 622, "voice": "editor", "related_concepts": ["display", "memory", "media"], "excerpts": []}, {"id": "article-623", "title": "讲讲应用程序、进程和线程。", "detail": "应用程序是存储的代码与资源，进程是其被系统组织起来的一次运行环境，线程是其中执行工作的路径。计划书、筹委会与工作组的类比，帮助把文件、运行实例与内部任务分清。一个应用可以涉及多个进程，线程通常共享所在进程的部分资源，因而有协作与竞争。不能只凭安装包后缀判断所有程序形态，也不能把线程视为拥有一整套独立进程资源的缩小应用。", "anchors": ["PDF p. 623–623"], "pdf_start": 623, "pdf_end": 623, "voice": "editor", "related_concepts": ["concurrency", "os", "lifecycle"], "excerpts": []}, {"id": "article-624", "title": "看完你就懂「视频」了", "detail": "扩展名、容器与编码格式各回答不同问题：文件名怎样标记，音视频字幕怎样组织，画面怎样表示与压缩。MP4或MKV本身不能决定清晰度，播放器还要支持容器内的编码。H.265相对H.264节约体积是条件性比较，不保证任何片源都恰好减半；换后缀也不能保证所有播放器识别。编辑将分辨率、码率、帧率与兼容性连起来，避免“换成高清格式”这种不完整需求。", "anchors": ["PDF p. 624–625"], "pdf_start": 624, "pdf_end": 625, "voice": "editor", "related_concepts": ["media", "compression"], "excerpts": []}, {"id": "article-626", "title": "聊聊同步、异步和回调", "detail": "订酒店等待答复的例子区分同步等待与先继续其他事情、完成后通知；回调是预先交出可调用的处理方式，在相应条件到来时执行。作者把它连接到下载与界面响应，但将异步等同于必须新建线程过于简化，单个线程也能组织异步IO。同步阻塞某条执行路径不等于整个CPU停止工作。真正需要写清的是完成信号、超时、取消、回调次数及页面已经退出时如何处理。", "anchors": ["PDF p. 626–628"], "pdf_start": 626, "pdf_end": 628, "voice": "editor", "related_concepts": ["async", "concurrency"], "excerpts": []}, {"id": "article-629", "title": "名词解释：设计模式、框架、架构", "detail": "设计模式总结一类局部问题的处理关系，框架提供组织一类程序的骨架，架构决定更整体的职责、连接和质量取舍。作者用公司成长的故事说明局部能跑与长期能维护之间的差别。其人员分层是叙事，不应用来按职称评判能力；架构也不能脱离实际约束。采用框架减少重复设计，但不保证业务、安全和扩展自动正确，更不能把if/else本身当作代码质量差的证据。", "anchors": ["PDF p. 629–629"], "pdf_start": 629, "pdf_end": 629, "voice": "editor", "related_concepts": ["framework", "architecture"], "excerpts": []}, {"id": "article-630", "title": "撩妹技术三部曲之「设计模式」", "detail": "文章以虚构的搭讪故事引出“反复验证过的处理方式”，再把它映射到需求变化后难以维护的代码。技术要点是先识别问题中稳定与变化的部分，选有适用条件的设计模式，减少修改连锁影响。生活故事不构成技术效果证据，也不应照搬为人际行为方案；学习模式应理解动机、结构和代价，而不是背完23个名称就套用。", "anchors": ["PDF p. 630–632"], "pdf_start": 630, "pdf_end": 632, "voice": "editor", "related_concepts": ["framework", "abstraction", "coupling"], "excerpts": []}, {"id": "article-633", "title": "撩妹技术三部曲之「框架」", "detail": "SDK像被应用主动调用的能力集合，框架则往往先规定生命周期和扩展位置，由业务代码嵌入其中。树干与叶子的比喻说明控制组织方式的反转。成熟框架可以集中处理部分基础设施，但也会带来约束、升级和依赖；“接上框架只写业务就不会出问题”仍是夸张。自建与引入应按团队能力、稳定性要求、维护和迁移成本比较，不能把自建过程一律当作成长捷径。", "anchors": ["PDF p. 633–635"], "pdf_start": 633, "pdf_end": 635, "voice": "editor", "related_concepts": ["framework", "interface", "reuse"], "excerpts": []}, {"id": "article-636", "title": "撩妹技术三部曲之「架构」", "detail": "作者进一步把思想与实体分开：模式和架构都可表现为设计决策，框架则是可被实际采用的一套组织与代码。架构可以通过框架体现，但并不只存在于框架里。文章最后仍借生活故事类比，技术阅读应回到组件职责、通信、数据与质量要求。避免形成固定的“模式小、框架中、架构大”尺寸排名；不同语境的范围会重叠，关键是这次决策在解决什么问题。", "anchors": ["PDF p. 636–636"], "pdf_start": 636, "pdf_end": 636, "voice": "editor", "related_concepts": ["architecture", "framework"], "excerpts": []}, {"id": "article-637", "title": "名词解释：时间戳、MD5、GUID", "detail": "时间戳标记事件发生时间，可用于排序和筛选；摘要表示内容特征，GUID帮助多个系统生成标识。三者并不能互换。原文声称MD5绝对唯一有误：有限长度摘要必然可能碰撞，仅比较摘要也不能独立证明来源可信。GUID也需按生成方法和碰撞处理理解，不是用户身份真实性证明。事件时间还要区分客户端、服务端与时区，标识符不可凭唯一外观自动承担认证责任。", "anchors": ["PDF p. 637–638"], "pdf_start": 637, "pdf_end": 638, "voice": "editor", "related_concepts": ["clock", "hash", "identity"], "excerpts": []}, {"id": "article-639", "title": "你常听说的「栈」，有下面几种含义", "detail": "“栈”有多个语境：后进先出的数据结构、调用过程中使用的存储区域、记录调用链的栈信息，以及描述能力组合的技术栈。文章用层叠这个共同意象帮助记忆，意义在于先问对方正在说哪一种。堆栈分配与回收的具体责任随语言和运行环境不同；调用链中的最后一行也不必然是最早根因。全栈不能理解成一个人自动精通所有领域或不再需要团队协作。", "anchors": ["PDF p. 639–640"], "pdf_start": 639, "pdf_end": 640, "voice": "editor", "related_concepts": ["queue", "memory", "observability"], "excerpts": []}, {"id": "article-641", "title": "你真的了解 JSON 么？", "detail": "JSON把结构化数据表达成可交换文本，发送与接收端据此序列化、解析并恢复所需字段。文章用文章对象包含标题、作者和正文解释数据结构为何需要约定。源文以key=value描述只是口头类比，严格JSON成员用冒号且字符串用双引号；对象方法也不会随JSON自动传过去。HTTP可以传输二进制，不是只能用字符串，数组也并非在所有语言中都限定同类元素。", "anchors": ["PDF p. 641–641"], "pdf_start": 641, "pdf_end": 641, "voice": "editor", "related_concepts": ["serialization", "data-model", "http"], "excerpts": []}, {"id": "article-642", "title": "三分钟理解 OpenGL", "detail": "OpenGL通过图形接口组织绘制状态和流程，把图形工作交给相应实现与硬件执行；几何、位置、光照到像素的路径帮助理解画面产生的成本。跨平台接口减少上层差异，但仍有版本、扩展、驱动和设备限制。游戏性能并非只靠显卡、CPU只是配角；图形接口也不能简单等同于Java虚拟机。本文作为当时的图形入门，不宣称所有当前移动系统仍采用相同底层路径。", "anchors": ["PDF p. 642–644"], "pdf_start": 642, "pdf_end": 644, "voice": "editor", "related_concepts": ["gpu", "rendering", "interface", "platform"], "excerpts": []}, {"id": "article-645", "title": "什么是「引擎」？", "detail": "“引擎”通常指支撑某类产品的核心能力集合：渲染、搜索、检测或调度各自解决不同任务，可被界面和业务组织成完整产品。作者试图去掉这个词的神秘感，提醒读者问清实际输入与输出。名称本身不证明能力先进、范围完整或可复用；浏览器渲染与脚本执行也不宜混成单一步骤，更不是每个软件都必须有一个被命名为调度引擎的中心模块。", "anchors": ["PDF p. 645–646"], "pdf_start": 645, "pdf_end": 646, "voice": "editor", "related_concepts": ["framework", "architecture"], "excerpts": []}, {"id": "article-647", "title": "什么是 PAC 文件？", "detail": "PAC通过规则为不同URL或主机选择代理或直连，文章由每次手工切换的麻烦解释自动代理配置。它决定请求走哪条路径，不等于加密、身份认证或访问授权；客户端选择直连也不能保证绕开所有网络控制。分析保留规则配置与故障定位的作用，不把擅改组织配置作为常规建议。需要明确配置来源、覆盖范围、更新、失败回退以及所选代理能接触哪些数据。", "anchors": ["PDF p. 647–647"], "pdf_start": 647, "pdf_end": 647, "voice": "editor", "related_concepts": ["proxy", "configuration", "url"], "excerpts": []}, {"id": "article-648", "title": "什么是开源许可证？", "detail": "开源许可规定可查看、修改、分发和集成代码时的权利与条件，作者比较GPL、LGPL、BSD、MIT等以说明“公开源码不等于不受约束”。但具体比较包含重要误述，例如把GPL说成禁止商业发布、把LGPL说成不能修改，这些不能作为项目选型依据。此页只据原文建立许可意识，具体义务列为待核对许可证原文与实际分发方式的事项，不提供未经核验的法律结论。", "anchors": ["PDF p. 648–649"], "pdf_start": 648, "pdf_end": 649, "voice": "editor", "related_concepts": ["license", "reuse", "collaboration"], "excerpts": []}, {"id": "article-650", "title": "什么是渲染？", "detail": "作者把画家先定大小、位置、再上色的过程映射成测量、布局与绘制，说明界面从结构和数据变成像素需要计算。排查展示慢时，应检查哪一步工作过多，以及主线程、图像处理和显示如何衔接。三步模型是帮助入门的抽象，不能把所有图形系统都认定为逐帧完整走同样三步；部分更新或合成复用也可能减少工作。体验验收应量化卡顿与首次可见，而非只说“渲染优化一下”。", "anchors": ["PDF p. 650–650"], "pdf_start": 650, "pdf_end": 650, "voice": "editor", "related_concepts": ["rendering"], "excerpts": []}, {"id": "article-651", "title": "AR、VR 技术简介", "detail": "VR试图构造用户沉浸其中的虚拟环境，AR把数字信息叠加并关联到真实环境；三维内容、追踪和计算机视觉分别支撑不同环节。文章借当时的游戏热潮介绍两者，设备形态只是例子，不能用“大头盔一定VR、拿手机一定AR”作定义。成熟度、市场方向与地区可用性是当时判断；真正产品评估应围绕定位与追踪稳定性、虚实配准、延迟、交互和使用场景展开。", "anchors": ["PDF p. 651–654"], "pdf_start": 651, "pdf_end": 654, "voice": "editor", "related_concepts": ["ar-vr", "sensor", "rendering"], "excerpts": []}, {"id": "article-655", "title": "五分钟读懂 WLAN、Wi-Fi 与 802.11", "detail": "WLAN指无线局域网这一网络范围，802.11是一组相关通信标准，Wi-Fi与基于该技术的互操作生态及认证相关。文章用频段和演进说明名词不同层次。原文把4GB按1Gbit/s算作约4秒，混淆字节和比特，理想传输也约需32秒；5GHz不等于第五代蜂窝网络。标准普及预测与版本速率带有历史性，不能据此决定当前采购或把理论峰值当作真实吞吐量。", "anchors": ["PDF p. 655–655"], "pdf_start": 655, "pdf_end": 655, "voice": "editor", "related_concepts": ["network", "performance"], "excerpts": []}, {"id": "article-656", "title": "五分钟理解技术名词：位图与矢量图", "detail": "位图以像素网格记录图像，放大不会凭空增加原有细节；矢量用几何描述形状，可在目标尺寸重新计算并栅格化。照片、图标与标志因此可能选择不同资源方案。矢量不是任何复杂照片都适合转换的万能高清形式，几何复杂度也会带来计算成本。原文关于平台支持的判断属于当时环境；选型时要分辨源资产、导出资源、最终显示像素及缩放需求。", "anchors": ["PDF p. 656–657"], "pdf_start": 656, "pdf_end": 657, "voice": "editor", "related_concepts": ["media", "display", "rendering"], "excerpts": []}, {"id": "article-658", "title": "五分钟理解什么是接口", "detail": "接口是向调用方暴露能力的约定，定义与实现可以分离。USB、后台天气查询和面向对象中的门，分别说明物理规范、服务能力与行为契约。调用方通常不必知道全部内部过程，但必须知道输入、输出、前置条件、权限和失败方式。相同插头或同名函数不自动意味着所有能力兼容；“后台给个接口”也不能省去业务语义和联调验收。", "anchors": ["PDF p. 658–659"], "pdf_start": 658, "pdf_end": 659, "voice": "editor", "related_concepts": ["interface", "abstraction", "coupling"], "excerpts": []}, {"id": "article-660", "title": "线程池、对象池、连接池都是什么？", "detail": "池化保存并反复使用已经创建的线程、对象或连接，摊薄创建成本，同时给并发资源设边界。线程池20个工人的例子说明第21个任务如何等待，旺季扩容又说明容量要随负载评估。原文另一篇说Linux上限1024，这篇又说380多，都不能当作普遍系统限制。池化不是越大越快，空闲资源、排队、失效检查和资源归还也是成本，且不是所有廉价对象都值得放进池中。", "anchors": ["PDF p. 660–661"], "pdf_start": 660, "pdf_end": 661, "voice": "editor", "related_concepts": ["pool", "queue", "tradeoff"], "excerpts": []}, {"id": "article-662", "title": "相机的 HDR 模式是什么？", "detail": "HDR试图保留高亮与暗部的更多信息，文中用不同曝光图像合成说明某些手机相机的实现方式。收益与场景有关：逆光等高反差画面可能获益，运动中多帧难以对齐则可能产生重影。HDR是更宽动态范围的处理目标，不等于总能让任何照片更好；传感器、算法、显示和拍摄耗时都会影响最终结果，不能把多帧合成视为所有实现唯一的路径。", "anchors": ["PDF p. 662–663"], "pdf_start": 662, "pdf_end": 663, "voice": "editor", "related_concepts": ["media", "sensor", "tradeoff"], "excerpts": []}, {"id": "article-664", "title": "响应式设计是啥？", "detail": "响应式设计让同一页面根据可用空间调整布局、模块与资源，而不是只维护两个固定网址。移动优先和渐进增强帮助先解决较窄场景，再安排宽屏信息密度。它可以降低重复维护，但仍需设计断点、内容优先级、触控与键盘操作。媒体查询不保证浏览器只下载一种资源，后端识别设备也不是必需条件；要用实际请求和可读性检查，不能仅凭窗口缩放看起来整齐就通过验收。", "anchors": ["PDF p. 664–665"], "pdf_start": 664, "pdf_end": 665, "voice": "editor", "related_concepts": ["platform", "rendering"], "excerpts": []}, {"id": "article-666", "title": "向前兼容、向后兼容", "detail": "版本更新后保存旧数据，需要设计结构迁移、验证和失败恢复；新增、删除或改变字段都可能影响历史记录。文章提出默认与扩展设计要为现实变化留余地，同时反对过度预测未来。应校准其绝对措辞：兼容性受成本、旧缺陷与信息是否仍存在等条件限制，并非任何老版本都能无代价兼容；迁移也不必都采用“建新表、复制、删旧表”，必须确认完整与可恢复后再切换。", "anchors": ["PDF p. 666–667"], "pdf_start": 666, "pdf_end": 667, "voice": "editor", "related_concepts": ["platform", "data-model", "release"], "excerpts": []}, {"id": "article-667", "title": "游戏引擎是干啥的？", "detail": "游戏引擎集中提供光影、动画、物理与渲染等基础能力，让开发者不必为每个游戏重新定义整套底层机制。资源加载、碰撞检测与逐帧输出说明它既是工具又承担运行时工作。可复用引擎降低基础实现成本，却不能替代内容生产、玩法设计、调优和测试。某一引擎融资或知名游戏采用只能说明历史案例，不能单凭品牌证明当前需求一定适配。", "anchors": ["PDF p. 667–669"], "pdf_start": 667, "pdf_end": 669, "voice": "editor", "related_concepts": ["framework", "rendering", "reuse"], "excerpts": []}, {"id": "article-670", "title": "什么是渐进式图片", "detail": "渐进式图像让用户先看到整体轮廓，再随数据到达补足细节，改善等待时对内容是否值得继续看的判断。要区分感知更快、文件更小和可中断传输三个目标，它们不会自动同时成立。原文以小波变换解释渐进式JPEG不准确，不能照搬为算法定义；最终分辨率通常并非随扫描逐步改变，而是同尺寸图像逐渐细化。是否节约流量还取决于实际下载与取消策略。", "anchors": ["PDF p. 670–670"], "pdf_start": 670, "pdf_end": 670, "voice": "editor", "related_concepts": ["media", "compression", "performance"], "excerpts": []}, {"id": "article-671", "title": "知道 LiFi 是什么吗？", "detail": "LiFi用光信号的变化承载信息，文中以灯光明暗说明编码与接收，再讨论上行、距离和环境光等约束。实验室峰值、物理频率范围与用户实际速率是不同指标；技术愿景不能直接变成商业可用承诺。可见光本身也是电磁波，“没有电磁干扰”要在具体干扰类型和设备条件下理解；空间受限可能有助控制传播，但不等于天然完成认证和保密。", "anchors": ["PDF p. 671–672"], "pdf_start": 671, "pdf_end": 672, "voice": "editor", "related_concepts": ["innovation", "performance", "network"], "excerpts": []}], "takeaways": ["这一专题共有44篇。逐篇保留原题和顺序；点击概念可继续追问机制、条件与边界。", "具体算法、平台与内部实现的限制放在相应条目中，概念层提供跨专题连接。"], "related_concepts": ["interface", "framework", "serialization", "encoding", "rendering"], "anchors": ["PDF p. 589–672"], "confidence": "源文释义与编者综合；历史主张未作外部核实"}, {"id": "ch-11", "title": "其它 · 46篇", "part": "专题11", "question": "怎样把技术机制组合成可验证、可交付的产品方案？", "role": "用搜索、推荐、支付、实验与原型把全书重新接回真实任务。", "mainline": "搜索和推荐把内容、索引、特征与行为数据连起来；音视频、跨屏与二维码把媒体编码和分发连起来；支付和登录把身份、票据、确认与状态连起来。测试、A/B实验和原型说明如何以不同成本取得证据，云和备份提醒责任不会因为服务被外包就消失。文章最后回到学习与取舍：技术知识的用途是识别约束、降低误解并对结果负责，必要时降低非关键精度、先保障关键路径。许多公司内部实现、趋势和成效判断只是作者推测或历史观察；本页把它们与机制例子分开，不借精彩案例补造未经证明的事实。", "argument_flow": ["内容与匹配", "媒介与分发", "身份和交易", "实验与自动化", "能力和原型", "学习及柔性取舍"], "sections": [{"id": "article-673", "title": "百度和它的搜索引擎", "detail": "网络爬虫从起始网页取得链接、选择继续抓取的页面，并考虑何时重访、怎样避免站点过载和如何协同。它提供搜索的原料，后续还需要分析、索引和排序。作者对百度商业行为的批评是立场表达，不能用来证明某种抓取算法本身好坏；网页能访问也不意味着可以任意采集和再分发。产品应把抓取范围、更新及时性、资源预算和内容来源分开要求。", "anchors": ["PDF p. 673–674"], "pdf_start": 673, "pdf_end": 674, "voice": "editor", "related_concepts": ["search", "index"], "excerpts": []}, {"id": "article-675", "title": "充个绿钻值不值？关于无损压缩的音乐", "detail": "声音经采样、量化和编码进入数字世界，无损压缩保留的是给定数字源数据，有损压缩则允许舍弃部分信息以减小体积。文章用五分钟双声道音频的大小说明品质与带宽的交换。无损不等于重建全部自然声场，WAV也不是只允许一种采样参数的固定音质等级。耳机、音源、环境和人的分辨能力共同影响体验，不能仅凭文件名或价格判断付费价值；文中的购买结论只作为当时个人意见。", "anchors": ["PDF p. 675–676"], "pdf_start": 675, "pdf_end": 676, "voice": "editor", "related_concepts": ["media", "compression"], "excerpts": []}, {"id": "article-677", "title": "懂你的推荐算法，你懂的", "detail": "推荐需要可供选择的内容，以及能反映用户偏好的行为。基于用户的协同过滤寻找偏好相近的人，基于物品的方法寻找共同被喜欢的物品；缺少历史行为时，可借内容特征等先起步。看完、收藏和评分被转为可计算信号，但不天然等于真实喜欢。文中说数据越多越详细越好、基于内容命中率最低都过于绝对，应同时考虑授权、噪声、覆盖、多样性与目标，不能只优化点击。", "anchors": ["PDF p. 677–678"], "pdf_start": 677, "pdf_end": 678, "voice": "editor", "related_concepts": ["recommendation", "metrics", "machine-learning"], "excerpts": []}, {"id": "article-679", "title": "给产品经理讲设计：贝塞尔曲线", "detail": "贝塞尔曲线通过控制点构造形状，可用于路径、粘连轮廓和动画进度变化。文章先从画曲线讲到矢量图，再把曲线用于动效的轻重缓急，连接设计语言与实现参数。要区分空间轨迹与“时间到进度”的映射；缓动曲线的横纵轴需明确，不能只凭过山车图的陡缓就断言具体速度。交付可以给出控制点、时长、起止状态和可操作样例，再比较实际手感。", "anchors": ["PDF p. 679–683"], "pdf_start": 679, "pdf_end": 683, "voice": "editor", "related_concepts": ["animation", "media"], "excerpts": []}, {"id": "article-684", "title": "国庆出游，你离不开的 APP 和相关技术", "detail": "旅途中的导航、团购、拍照、播放、浏览和打车把技术放回用户任务：定位、推荐、编解码和浏览器能力共同支撑一个看似简单的流程。其价值是从体验反推技术依赖，而非让产品经理记住一张APP采购清单。市场格局、价格、应用推荐及“黑科技”评价属于当时背景，不能当作当前事实；“免费网络”也应核对授权和信任，不以便利替代隐私与安全判断。", "anchors": ["PDF p. 684–685"], "pdf_start": 684, "pdf_end": 685, "voice": "editor", "related_concepts": ["requirements", "location", "media", "platform"], "excerpts": []}, {"id": "article-686", "title": "聊聊自动化测试", "detail": "自动化测试先规定前置条件、输入、操作和预期，再由程序准备环境、执行动作、观察结果并报告差异。框架把共性流程复用，测试人员填具体用例；重复回归、性能与长期稳定性因此更可持续。自动化不能自动知道业务该怎样，也不等于单纯模拟点击。频繁变化的界面会增加维护成本，但不意味着所有测试都应放弃自动化，应优先选稳定且高风险的边界与逻辑。", "anchors": ["PDF p. 686–687"], "pdf_start": 686, "pdf_end": 687, "voice": "editor", "related_concepts": ["automation", "requirements"], "excerpts": []}, {"id": "article-688", "title": "论思考的技术", "detail": "作者提出从调查现状与规律、追问原因、区分偶发变化与环境变化，再找到核心点并设计解法的思考路径。产品、设计、测试与开发虽交付物不同，都需要这条推理链。文中的时间比例和返工概率是个人经验性表达，没有独立统计证明。迁移时把它作为可检查的问题清单：事实是什么、解释有哪些、还缺什么证据，而不是认为思考充分就不需要小步试验和反馈。", "anchors": ["PDF p. 688–689"], "pdf_start": 688, "pdf_end": 689, "voice": "editor", "related_concepts": ["learning", "requirements"], "excerpts": []}, {"id": "article-690", "title": "没有网盘的日子怎么过？", "detail": "网盘关闭的情境说明重要资料不仅要方便访问，还要能持续保存、导出与恢复。U盘、移动硬盘、NAS和云服务分别交换便携、容量、成本与远程使用能力。原文对国外服务“不会随便跑路”的保证没有依据，不能据厂商地区推导永久可靠。资料保护应区分同步与备份、单一副本与独立副本，并核实恢复能力；文中的容量、价格和可用性不作当前购买建议。", "anchors": ["PDF p. 690–691"], "pdf_start": 690, "pdf_end": 691, "voice": "editor", "related_concepts": ["storage"], "excerpts": []}, {"id": "article-692", "title": "声音传文件是怎么回事", "detail": "用声音“传文件”的体验可能只通过声音传递短标识，真正文件先上传服务端，再由接收方根据标识下载。这个拆解说明用户感受到的媒介未必承担全部数据传输，短链把长地址映射成更紧凑的入口。文章给出的是一种实现路线，不能保证所有声音传输产品如此工作，固定六位长度和耗时也不是普遍常数。服务可用性、标识泄露、有效期和访问权限仍决定文件能否安全取得。", "anchors": ["PDF p. 692–692"], "pdf_start": 692, "pdf_end": 692, "voice": "editor", "related_concepts": ["encoding", "url", "storage"], "excerpts": []}, {"id": "article-693", "title": "那几个牛逼的 AR 公司到底在干啥", "detail": "虚拟试戴、维修叠加信息和空间交互展示AR可能服务的任务；文章比较当时几家公司的演示，把数字内容与现实对齐视为新交互机会。关于Magic Leap光学路径等内容作者自己表明“不知道真假”，必须保留为猜测。演示、可用原型、可量产产品与商业成功是不同证据层级，“一定成为下一代平台”只是当时预测。页面将侧重任务价值与追踪、显示、舒适性等验证条件。", "anchors": ["PDF p. 693–695"], "pdf_start": 693, "pdf_end": 695, "voice": "editor", "related_concepts": ["ar-vr", "innovation", "sensor"], "excerpts": []}, {"id": "article-696", "title": "那些充满情怀的项目之：Project Loon", "detail": "Project Loon尝试把通信设施放到高空气球上，以高度控制、供能和运营商协作扩展连接覆盖。案例说明基础设施创新既有算法和设备问题，也有运维、气候与商业合作问题。文中一处称“热气球”，后文又明确描述氦气，概念不应混用。漂浮时长或演示成功不能单独证明商业化成熟，“今年将商用”也仅是文章写作时的说法，本分析不作项目当前状态断言。", "anchors": ["PDF p. 696–698"], "pdf_start": 696, "pdf_end": 698, "voice": "editor", "related_concepts": ["innovation", "distributed", "network"], "excerpts": []}, {"id": "article-699", "title": "那些刷票软件是如何工作的？", "detail": "文章从投票页面背后的请求与计数关系，说明界面点击并不能直接证明真人意愿，单一IP或账号限制也可能与真实参与人数不同。分析将其转为防作弊问题：哪些证据可证明资格、如何处理重复请求与异常增长、如何保留可复核记录。原文涉及伪装与规模刷票的实施细节不作为操作清单提供。可见接口不代表允许自动投票，票数上升也不自动代表用户支持增加。", "anchors": ["PDF p. 699–700"], "pdf_start": 699, "pdf_end": 700, "voice": "editor", "related_concepts": ["security", "http", "identity"], "excerpts": []}, {"id": "article-701", "title": "那些说在做云计算的企业都在干啥", "detail": "IaaS、PaaS和SaaS分别从基础资源、开发运行平台到可使用的软件能力讨论分工，云服务使团队不必每次从购置和托管服务器开始。源文把“租到装好系统的服务器”归为PaaS有层级混淆，不能只看厂商名称判断服务类型。采用云也不代表不再关心安全、故障、攻击或备份；必须按实际服务边界重新分配配置、数据、应用和恢复责任，比较总成本与迁出条件。", "anchors": ["PDF p. 701–702"], "pdf_start": 701, "pdf_end": 702, "voice": "editor", "related_concepts": ["distributed", "tradeoff"], "excerpts": []}, {"id": "article-703", "title": "你了解计算机时间吗？小心肾 6 变砖 6", "detail": "Unix时间与NTP把日期显示、数值表示、时区和时钟同步连接起来。文章借特定iPhone故障提醒时间边界也会影响系统，但其根因叙述是当时推测，不能当作已核实复盘。Unix时间不必一律为正数，原文偏移公式还出现未定义的T4，不能照抄计算。应分别验证时间来源、精度、范围、时区转换和时钟跳变，尤其关注排序、有效期与重试，而非复现故障或篡改他人时间。", "anchors": ["PDF p. 703–704"], "pdf_start": 703, "pdf_end": 704, "voice": "editor", "related_concepts": ["clock", "network", "requirements"], "excerpts": []}, {"id": "article-705", "title": "你一定不知道，城里人这样做 A/B 测试", "detail": "更换商业入口可能增加收入却伤害体验，文章比较直接全量上线、问卷、历史同期对比和并行实验的差别，并介绍通过远端变量配置避免为每组单独打包。实验平台减少操作成本，不能凭创始人背景或“科学算法”宣传自动保证结论可靠。用户量不同也不意味着所有比例指标无法比较；分组、样本量、同时期外部变化、观察周期与护栏指标仍需明确。灰度控制发布风险，随机对照帮助回答因果，二者可配合。", "anchors": ["PDF p. 705–708"], "pdf_start": 705, "pdf_end": 708, "voice": "editor", "related_concepts": ["experiment", "configuration", "metrics"], "excerpts": []}, {"id": "article-709", "title": "年会又没中奖？一起来 review 抽奖代码！", "detail": "抽奖把随机输出映射到合资格名单，伪随机序列可由算法与种子产生，文章由此讨论预测与操控的可能。相同种子会产生可重复的序列，不表示正常连续取数每次都返回同一个人；是否公平还取决于映射方式、名单、重复中奖规则和过程是否可篡改。真随机来源也不能单独保证完整流程公平。验收应针对概率分配和审计记录，而不是只问用了哪一个随机接口。", "anchors": ["PDF p. 709–710"], "pdf_start": 709, "pdf_end": 710, "voice": "editor", "related_concepts": ["randomness", "requirements"], "excerpts": []}, {"id": "article-711", "title": "年入千万就指望它了，视频直播背后的技术", "detail": "文章用HLS解释采集、编码、分片、播放列表与HTTP/CDN分发的整条链，M3U8描述片段地址和时长，播放器据此持续取得内容。复用分发基础设施可以降低部署门槛，但分片和缓冲会影响端到端时延。作者明确说没有从事该领域开发，应按入门介绍理解；所述TS路径是当时示例，不是所有HLS只能使用一种封装，更不能以切得小就保证实时或网络差时始终清晰。", "anchors": ["PDF p. 711–711"], "pdf_start": 711, "pdf_end": 711, "voice": "editor", "related_concepts": ["media", "cdn"], "excerpts": []}, {"id": "article-712", "title": "平民化跨屏互联解决方案——DLNA 简介", "detail": "DLNA把媒体来源、播放渲染和控制角色区分，通过局域网发现及能力协商把手机选择的内容交给电视。它解释投屏不一定是实时复制手机屏幕，也可能是交出地址让电视自行获取。发现设备、支持格式和能否访问资源都要分别验证，不能把所有设备必须具备全部角色作为前提。开源项目可以帮助原型，不足以支持原文“一天或半天必能完成”的估工承诺。", "anchors": ["PDF p. 712–712"], "pdf_start": 712, "pdf_end": 712, "voice": "editor", "related_concepts": ["network", "media"], "excerpts": []}, {"id": "article-713", "title": "普通人也能写的小程序 IFTTT", "detail": "IFTTT把触发条件和行动组合，使非开发者也能利用已有服务完成简单自动化。天气低于阈值发提醒的例子说明事件、规则和动作如何连接。无需写传统代码不代表没有系统边界：服务是否提供能力、授权是否有效、触发是否延迟和动作失败后怎样处理，都影响结果。文中列举的平台、功能和可用性属于历史材料，不能当作当前功能目录或替用户发布消息的授权。", "anchors": ["PDF p. 713–715"], "pdf_start": 713, "pdf_end": 715, "voice": "editor", "related_concepts": ["automation", "coupling", "interface"], "excerpts": []}, {"id": "article-715", "title": "钱都去哪儿了？——说说微信支付的业务流程", "detail": "支付流程中，商户先向支付平台登记订单，得到与此次预支付关联的标识，客户端再调起支付界面，由平台校验相关信息并取得用户确认。这个例子说明业务标识可以连接多方流程，避免到处传完整订单。用户点击确认、客户端显示成功与商户最终确认到账不能不加区分；书中未完整展开服务端通知、查询、对账、失败与退款，不能直接当作可上线支付规范，具体接口也有版本限制。", "anchors": ["PDF p. 715–717"], "pdf_start": 715, "pdf_end": 717, "voice": "editor", "related_concepts": ["transaction", "token"], "excerpts": []}, {"id": "article-718", "title": "人工智能微课堂——机器学习及相关概念简介", "detail": "机器学习用训练数据影响模型，使其对未见输入给出分类或其他输出；苹果与梨子的例子帮助区分训练阶段和应用阶段。文中把模式识别一概排除学习能力、把深度学习进化为卷积网络的叙述不准确，也不能保证仅增加数据量就持续提高正确率。数据代表性、标签、任务、评价集与错误代价应共同定义。该文是历史入门，不足以覆盖当前AI系统的完整知识。", "anchors": ["PDF p. 718–719"], "pdf_start": 718, "pdf_end": 719, "voice": "editor", "related_concepts": ["machine-learning", "data-model", "metrics"], "excerpts": []}, {"id": "article-720", "title": "如何查找附近的人？", "detail": "GeoHash把空间逐级分区并编码，相近前缀对应较大的共同区域，可先缩小候选范围，减少对所有用户逐一计算距离。产品要点是候选检索与最终距离筛选分开。只查同一格会漏掉边界另一侧实际更近的人，通常还需要处理相邻区域、精确距离、坐标与更新时间。文中把微信速度完全归因于GeoHash没有实现证据；位置授权、可见范围和隐私也不能被检索效率盖过。", "anchors": ["PDF p. 720–721"], "pdf_start": 720, "pdf_end": 721, "voice": "editor", "related_concepts": ["location", "index"], "excerpts": []}, {"id": "article-722", "title": "如何自学互联网技术", "detail": "作者把产品思维与责任心放在技术名词之前，建议从自己业务和招聘要求中的术语出发，理解它们解决什么任务，再逐步加深。PDF723的岗位分类图横跨后端、移动、前端、测试、运维、数据库和硬件等，只是当时的领域地图。反对一开始啃所有厚教材是学习策略，不是证明系统知识无用；招聘热词也不能保证未来趋势。应围绕实际问题积累概念、证据和能解释的方案。", "anchors": ["PDF p. 722–724"], "pdf_start": 722, "pdf_end": 724, "voice": "editor", "related_concepts": ["learning", "collaboration", "requirements"], "excerpts": []}, {"id": "article-725", "title": "设计师别唬我之高斯模糊", "detail": "高斯模糊用邻近像素的加权平均减弱局部细节，离中心越近通常权重越高；半径越大，参与范围和视觉影响越大。作者把常见设计效果连接到图像计算，帮助讨论背景虚化的成本。模糊不自动成为可靠脱敏，颜色和大轮廓仍可能暴露信息；半径、分辨率、更新频率和实现方式决定性能，不能只凭效果“看起来简单”判断工作量。", "anchors": ["PDF p. 725–727"], "pdf_start": 725, "pdf_end": 727, "voice": "editor", "related_concepts": ["media", "rendering", "performance"], "excerpts": []}, {"id": "article-728", "title": "数字音频格式中的「另类」——MIDI", "detail": "MIDI记录音符、力度和时序等控制事件，更像乐谱，而MP3等通常表示经过编码的声音数据。播放端依据音源和合成实现生成声音，因此同一控制数据在不同设备或音色库上可能有不同效果。不能把所有MIDI信息都理解成一种音频文件固定头部，也不能把效果只归因于声卡硬件。理解“指令”与“采样结果”的差别，有助选择编辑、存储和跨设备一致性的方案。", "anchors": ["PDF p. 728–729"], "pdf_start": 728, "pdf_end": 729, "voice": "editor", "related_concepts": ["media", "encoding", "framework"], "excerpts": []}, {"id": "article-730", "title": "说说「养眼」的动画", "detail": "“养眼”并非只能靠口头感觉调整，作者建议从实物运动与基本变换出发，把平移、缩放、旋转和透明度组合，借弹性或缓动塑造关联。产品可给出运动目标、状态对应、时长与中断规则，设计与开发据此沟通。物理类比有帮助但不是所有动画唯一标准；等待动画不增加真实加载速度，源文关于心理感受也不是普遍实验结论，帧动画同样受资源和帧率限制。", "anchors": ["PDF p. 730–730"], "pdf_start": 730, "pdf_end": 730, "voice": "editor", "related_concepts": ["animation", "requirements"], "excerpts": []}, {"id": "article-731", "title": "说说常见的图片格式", "detail": "JPG、PNG、GIF和WebP在压缩、颜色、透明和动画等能力上存在不同取舍。文章的有用主线是按内容与传播成本选择格式，而非只凭后缀看品质。重要校准：PNG不只限于调色板，“无损压缩后一般仍有损”混淆了预先减色与编码本身；Live Photo也不能简单定义为GIF加声音。最终应分别检查源图、导出参数、传输字节与解码内存，不能认为文件小就一定低内存。", "anchors": ["PDF p. 731–732"], "pdf_start": 731, "pdf_end": 732, "voice": "editor", "related_concepts": ["media", "compression", "display"], "excerpts": []}, {"id": "article-732", "title": "说说二维码的应用", "detail": "二维码是把数据交给摄像头读取的一种入口，URL可以把纸面连到网页，也可通过中间页面尝试连接已安装应用，未安装时仍给替代路径。支付二维码可能承载短期业务凭据，能识别文字不意味着有权执行支付。文章对安全处理的试探不能证明完整保护机制。需求应写清入口类型、有效期、扫码环境、授权和失败回退，不向客户端提前交付本来不应可见的秘密。", "anchors": ["PDF p. 732–733"], "pdf_start": 732, "pdf_end": 733, "voice": "editor", "related_concepts": ["qr", "url", "identity"], "excerpts": []}, {"id": "article-734", "title": "图像键盘，然并卵？", "detail": "图像键盘让输入法与应用协商支持的内容类型，把图片等富内容送入可接收的编辑位置。文章区分emoji文本与图片，也指出图文混排能力和实际产品选择并非同一回事。关于剪贴板读取“所有应用默认开放”和平台支持范围的描述属于当时环境，不能套到当前系统；还需验证URI权限、内容生命周期与发送前确认，不因技术上能取到地址就认定可以读取或上传其内容。", "anchors": ["PDF p. 734–734"], "pdf_start": 734, "pdf_end": 734, "voice": "editor", "related_concepts": ["automation", "framework", "privacy"], "excerpts": []}, {"id": "article-735", "title": "VR 来临后，我们这样看片......", "detail": "VR需要虚拟环境、立体显示、运动追踪、开发工具和数据同步共同工作，画面真实性与计算响应之间会有取舍。文章把内容生态和制作成本引入技术讨论，有助理解设备性能并不单独决定产品成立。成本翻倍、流量占比等说法缺少可核对口径，不提炼成结论。评估应回到目标任务、延迟、追踪、舒适性和可持续内容供给，避免用某类内容热度推导所有市场方向。", "anchors": ["PDF p. 735–736"], "pdf_start": 735, "pdf_end": 736, "voice": "editor", "related_concepts": ["ar-vr", "rendering", "interface"], "excerpts": []}, {"id": "article-737", "title": "微信红包照片，不给钱怎么看", "detail": "红包照片案例讨论把清晰内容先交给客户端、再只在界面模糊，会让可见性控制依赖不可信的本地环境。分析保留这个架构教训，不提供绕过付费查看的操作步骤。作者把设计说成综合取舍甚至传播策略，但没有内部决策证据；网络费用也不一定恰好翻倍。云端开关可以开启预置功能，但不能因此断言某应用所有版本都已存在同样代码或协议。", "anchors": ["PDF p. 737–738"], "pdf_start": 737, "pdf_end": 738, "voice": "editor", "related_concepts": ["security", "cache", "configuration"], "excerpts": []}, {"id": "article-739", "title": "微信红包照片事件后记", "detail": "后记重新用“漏洞”描述未付费可取到内容，与前篇“不算漏洞”的措辞形成张力。真正需要分开的，是设计缺陷、加密、用户授权和受控配置。正常功能开关不应无差别称为后门；若能绕过授权或被未授权方控制，才涉及另一种信任问题。作者关于平台早知漏洞、预埋修复及测试服务器压力的推断没有证据，页面明确标注，不把事后解释当作官方复盘。", "anchors": ["PDF p. 739–740"], "pdf_start": 739, "pdf_end": 740, "voice": "editor", "related_concepts": ["security", "identity", "configuration"], "excerpts": []}, {"id": "article-740", "title": "微信刷量原理", "detail": "真人有偿点击与自动化行为都可能制造看似增长的阅读量。文章揭示“计数发生”与“真实关注或商业价值”之间的差别，提醒指标本身会成为被操控的目标。这里转为数据质量与反作弊问题，不提供伪造身份、设备参数或批量刷量脚本。验收应对照独立业务结果、参与成本与异常模式，且不能把任何短期增长直接认定为作弊或仅凭一次阈值规则剔除所有用户。", "anchors": ["PDF p. 740–743"], "pdf_start": 740, "pdf_end": 743, "voice": "editor", "related_concepts": ["security", "metrics", "automation"], "excerpts": []}, {"id": "article-744", "title": "文件系统知多少", "detail": "文件系统在设备上组织数据块、路径和访问规则，让应用不必直接安排每个物理位置。不同实现影响单文件大小、恢复、权限与跨设备支持。文中FAT32等举例解释“大文件为什么放不进去”，但其系统默认列表带有年代限制，也不是当前格式化的完整选型指南。兼容性不只看系统名称，应验证实际设备、读写能力、大小边界与备份恢复；格式化会改变原数据，不能照文章随意执行。", "anchors": ["PDF p. 744–744"], "pdf_start": 744, "pdf_end": 744, "voice": "editor", "related_concepts": ["storage", "platform"], "excerpts": []}, {"id": "article-745", "title": "小米的黑科技？-超声波指纹识别技术原理", "detail": "电容式与超声波指纹识别用不同物理信号获取纹理特征，后者在特定实现中可以隔着材料工作，影响外观、密封和结构设计。文章把三维信息与可靠性联系，但“不会受油污水痕干扰”及手套使用的推断过于绝对。识别率、误接受、拒绝、延迟与可用材料需要具体测试；厂商首发和商业表现也是历史主张，不能用原理新颖直接证明安全或体验一定更好。", "anchors": ["PDF p. 745–746"], "pdf_start": 745, "pdf_end": 746, "voice": "editor", "related_concepts": ["sensor", "identity", "innovation"], "excerpts": []}, {"id": "article-747", "title": "新一代的 iPhone 蓄势待发，你的耳机准备好了吗？", "detail": "3.5毫米模拟音频与Lightning数字连接的差异，主要改变数字到模拟转换发生的位置及配套方式，而非从此不再需要转换。源文有把数字转模拟描述成采样的方向混淆；数字耳机最终驱动声学器件仍需要相应转换。不能只因改用数字接口就保证音质提高，应一起看转换器、放大、耳机、供电、兼容和充电使用冲突。文末购买建议只作为当时观点。", "anchors": ["PDF p. 747–747"], "pdf_start": 747, "pdf_end": 747, "voice": "editor", "related_concepts": ["media", "interface", "platform"], "excerpts": []}, {"id": "article-748", "title": "压缩算法浅析", "detail": "有损压缩允许丢弃某些信息，无损压缩必须可还原给定输入，常通过冗余和统计结构减少表示长度。重复短语用字典替代的例子说明“需要规则才能还原”，同时要把字典本身计入成本。原文13次与14次及字节算式不一致，Unicode也不是所有编码固定两字节。压缩不保证任何文件都变小，已经压缩或近似随机的数据可能几乎无收益，归档和压缩也应区分。", "anchors": ["PDF p. 748–749"], "pdf_start": 748, "pdf_end": 749, "voice": "editor", "related_concepts": ["compression", "encoding", "tradeoff"], "excerpts": []}, {"id": "article-750", "title": "二维码技术浅析", "detail": "二维码含定位、格式、数据和纠错等结构，内容长度和纠错级别影响密度与读取条件。短地址可以减少承载信息，但新增重定向服务依赖。原文说四角定位不准确，标准QR码主要三个角的位置探测图形；纠错比例也不能简单理解成任意遮挡同等面积都能恢复。不能一律选最高级别后随意放Logo，要在实际印刷尺寸、留白、距离、光照和目标设备上测试识读。", "anchors": ["PDF p. 750–751"], "pdf_start": 750, "pdf_end": 751, "voice": "editor", "related_concepts": ["qr", "encoding", "requirements"], "excerpts": []}, {"id": "article-752", "title": "移动,您还记得那年动感地带的无限流量卡吗？", "detail": "早期cmwap与cmnet接入的例子说明运营商配置、代理和协议支持会改变应用可达性与费用体验。技术路径与套餐规则共同影响产品，不能只看屏幕上是否有信号。原文把WAP概念说成中国独有、资源一定存运营商内部等有过度概括，历史套餐价格与限制更不能当作当前规则。保留可达性、代理兼容和共享带宽的思路，实际计费及条款需要另查当前官方资料。", "anchors": ["PDF p. 752–753"], "pdf_start": 752, "pdf_end": 753, "voice": "editor", "related_concepts": ["network", "proxy", "performance"], "excerpts": []}, {"id": "article-754", "title": "以图搜图是怎么回事儿", "detail": "以图搜图先要定义相似性。文章以缩小、灰度、与均值比较生成短特征，再用位差比较图片的办法说明感知哈希能容忍部分尺寸或格式差异。它与用于内容完全一致校验的摘要不同，也不等于识别人物身份或判断内容语义。8×8像素与灰度等级没有必然相等关系；算法可能误匹配，也会受裁剪、旋转等改变影响，不能仅靠它完成内容安全分类或溯源事实确认。", "anchors": ["PDF p. 754–756"], "pdf_start": 754, "pdf_end": 756, "voice": "editor", "related_concepts": ["hash", "search", "media"], "excerpts": []}, {"id": "article-757", "title": "域名注册那些事", "detail": "域名把易识别名称与网络资源入口连接，注册、续费与解析是不同工作。文章用顶级域名和子域说明名称结构，商标风格的类比帮助理解用户记忆与信任。注册价格、交易金额与公开联系人范围属于当时信息，不当作当前建议；持有域名也不意味着获得同名商标权或内容可信。产品上线还要管理账号、续费责任、解析变更、证书和迁移，不能只问名字好不好听。", "anchors": ["PDF p. 757–758"], "pdf_start": 757, "pdf_end": 758, "voice": "editor", "related_concepts": ["dns", "url", "identity"], "excerpts": []}, {"id": "article-759", "title": "原来你可以更美的", "detail": "美颜流程可以拆成人脸与关键点检测、几何变换、肤色区域处理和保留边缘的平滑，作者由此把“大眼、瘦脸、磨皮”等效果对应到像素和特征操作。它是简化说明，不能据此认定所有算法只依赖灰度或肤色。不同光照、肤色、遮挡和多张脸会影响效果与公平性，过度平滑还会丢失细节。采集和处理面部信息的目的、授权与留存需要单独说明。", "anchors": ["PDF p. 759–760"], "pdf_start": 759, "pdf_end": 760, "voice": "editor", "related_concepts": ["media", "machine-learning", "rendering"], "excerpts": []}, {"id": "article-761", "title": "账号登陆的三个问题", "detail": "登录后客户端保存票据，后续请求使用票据，过期时可能用刷新票据换新票据，从而减少重复输入密码。文章区分界面看起来已登录与发起验证的时点，但本地有票据并不能证明服务端仍认可，票据也可能被撤销。退出时只删本地票据未必结束其他会话；过期时长和刷新方式不是普遍常数。需求要覆盖续期失败、账号状态变化、多端与丢失设备，不能只优化自动登录的顺畅。", "anchors": ["PDF p. 761–762"], "pdf_start": 761, "pdf_end": 762, "voice": "editor", "related_concepts": ["token", "identity"], "excerpts": []}, {"id": "article-763", "title": "逐渐消亡的工具-RSS 阅读器", "detail": "RSS类阅读器通过订阅源定期取得结构化更新，统一呈现多个站点的内容；订阅地址可迁移使读者较少依赖单一阅读器。文中混用了RSS与Atom，并把Atom的feed与entry层次说得不够准确，不能直接据示例编写解析器。标题中的“逐渐消亡”是当时观察，不是现在的事实结论。要分清轮询与实时推送、源的可用性与客户端能力，以及订阅条目是否包含全文。", "anchors": ["PDF p. 763–763"], "pdf_start": 763, "pdf_end": 763, "voice": "editor", "related_concepts": ["automation", "network", "storage"], "excerpts": []}, {"id": "article-764", "title": "做个 demo，非得求程序员吗？", "detail": "原型工具能用页面、交互连线和分享方式，让产品经理先表达方案并验证关键路径，减少要求开发赶制演示后反复推倒的成本。文章以把公众号整理成阅读文件的想法展示从意图到可操作流程。高保真或可安装原型仍不代表后台、性能、安全和异常处理已完成；二十分钟案例不应成为其他项目估工。先写希望验证什么，再决定用纸面、交互原型还是技术验证。", "anchors": ["PDF p. 764–767"], "pdf_start": 764, "pdf_end": 767, "voice": "editor", "related_concepts": ["prototype", "requirements", "tradeoff"], "excerpts": []}, {"id": "article-768", "title": "做一些有损柔性的设计", "detail": "面对有限计算、网络、电量和时间，降低非关键精度、减少位置更新频率、先给小图再由用户打开大图，可以保住更重要的体验。作者区分有损取舍与随环境调整的柔性，也明确20秒只是思路。页面将把这种方法连到缓存、异步与优先级：明确核心承诺和可降低项，并让用户理解状态。关于微信当时降级的归因是作者推测；不能用假进度掩盖失败，支付和授权等关键正确性也不应随意牺牲。", "anchors": ["PDF p. 768–769"], "pdf_start": 768, "pdf_end": 769, "voice": "editor", "related_concepts": ["degradation", "tradeoff", "performance"], "excerpts": []}], "takeaways": ["这一专题共有46篇。逐篇保留原题和顺序；点击概念可继续追问机制、条件与边界。", "具体算法、平台与内部实现的限制放在相应条目中，概念层提供跨专题连接。"], "related_concepts": ["search", "recommendation", "metrics", "identity", "prototype", "degradation"], "anchors": ["PDF p. 673–769"], "confidence": "源文释义与编者综合；历史主张未作外部核实"}], "concepts": [{"id": "collaboration", "title": "协作与职责", "one_line": "围绕同一目标交换可用信息、作出承诺并及时反馈。", "explanation": "一项体验常跨产品、设计、客户端、后台和测试。岗位划分只是组织工作的方法，故障责任要沿数据与操作路径判断，不能看到页面出错就只找前端。有效协作需要共同理解预期、变化与完成条件。", "factors": [{"name": "共同语义", "detail": "双方对同一术语和状态是否有一致理解", "anchors": ["PDF p. 25–27", "PDF p. 28–30"]}, {"name": "反馈节奏", "detail": "风险在承诺前还是临上线才暴露", "anchors": ["PDF p. 25–27", "PDF p. 28–30"]}], "effects": ["影响返工、风险发现速度和团队的信任。"], "observables": ["检查一个需求能否说清责任人、输入、依赖、输出和升级路径。"], "boundary": "沟通次数多不等于共识，权力压制和职业刻板印象会遮住真正问题。", "relations": [{"target_id": "requirements", "label": "继续理解", "explanation": "先明确要实现的行为，才有可讨论的承诺。"}, {"target_id": "observability", "label": "继续理解", "explanation": "共同可见的事实能减少凭印象归因。"}], "anchors": ["PDF p. 25–27", "PDF p. 28–30", "PDF p. 486–486", "PDF p. 648–649", "PDF p. 722–724"], "voice": "editor", "confidence": "据源文归纳并明确校准；非现行技术规范", "source_articles": ["article-25", "article-28", "article-39", "article-152", "article-207", "article-472", "article-477", "article-486", "article-487", "article-492", "article-514", "article-543", "article-648", "article-722"]}, {" 个值。抽奖还需把输出无偏地映射到合资格名单，说明重复中奖与过程修改规则。", "factors": [{"name": "生成与映射", "detail": "种子、范围与名单", "anchors": ["PDF p. 709–710"]}, {"name": "过程控制", "detail": "谁可修改、重抽和查看记录", "anchors": ["PDF p. 709–710"]}], "effects": ["影响结果分布、可预测性与参与者信任。"], "observables": ["核对名单、规则、输出分布及不可随意更改的操作记录。"], "boundary": "真随机源也不能独自保证公平，单个未中奖经历不能证明作弊。", "relations": [{"target_id": "metrics", "label": "继续理解", "explanation": "需要合适样本与口径检验分布。"}, {"target_id": "security", "label": "继续理解", "explanation": "可预测或可篡改的过程有不同风险。"}, {"target_id": "requirements", "label": "继续理解", "explanation": "验收先明确公平指哪项规则。"}], "anchors": ["PDF p. 709–710"], "voice": "editor", "confidence": "据源文归纳并明确校准；非现行技术规范", "source_articles": ["article-709"]}, {"id": "view-tree", "title": "视图树与界面层级", "one_line": "用父子结构组织界面元素及其位置、可见与交互关系。", "explanation": "一张页面不是只有平面图片，容器和子视图共同构成层级，测量、布局与绘制需要按关系处理。看不见的视图、过深层级或重复构建也可能仍有成本；叠加遮挡、输入和无障碍又与视觉外观不是同一件事。", "factors": [{"name": "层级与更新", "detail": "容器和子元素如何重新计算", "anchors": ["PDF p. 114–115", "PDF p. 140–141"]}, {"name": "生命周期", "detail": "何时创建、可见、复用和销毁", "anchors": ["PDF p. 114–115", "PDF p. 140–141"]}], "effects": ["影响布局成本、触摸响应及页面维护。"], "observables": ["检查实际视图结构，比较一次状态变化引起的测量和绘制工作。"], "boundary": "原生视图树与网页DOM有相似结构思想，但不是同一套对象或API，不能互相直接替代。", "relations": [{"target_id": "rendering", "label": "继续理解", "explanation": "层级变化进入具体呈现过程。"}, {"target_id": "lifecycle", "label": "继续理解", "explanation": "界面元素的资源需要跟随拥有者管理。"}, {"target_id": "dom", "label": "继续理解", "explanation": "网页用自身文档结构组织内容，可比较但不能混用。"}], "anchors": ["PDF p. 114–115", "PDF p. 140–141", "PDF p. 197–198", "PDF p. 221–221", "PDF p. 388–391"], "voice": "editor", "confidence": "据源文归纳并明确校准；非现行技术规范", "source_articles": ["article-114", "article-140", "article-159", "article-162", "article-197", "article-207", "article-217", "article-221", "article-388"]}], "overview": [{"id": "overview-01", "title": "沟通 · 6篇", "summary": "先建立共同的问题定义，随后所有技术知识都服务于这种沟通。", "details": ["这组文章先用岗位分工说明一个体验可能横跨前端、客户端和后台，再借冲突对话揭示需求边界、估工和决策权的误解。作者随后把“调用一个接口”拆成退出恢复、异常、线程与版本安排，说明看起来局部的改动为什么牵动完整流程。最后将延期追溯到需求、排期、风险和沟通，而非只责怪最后写代码的人。其可迁移的主线是：先把目标、状态和验收讲清，再让技术判断进入取舍；书中故意夸张的对话不应成为职业刻板印象。", "阅读顺序：分清职责与链路 → 看见表面需求背后的状态 → 共同估算成本 → 选择版本与复用机会 → 暴露风险并做减法"], "anchors": ["PDF p. 25–39"], "related_concepts": ["requirements", "collaboration", "tradeoff"], "voice": "editor"}, {"id": "overview-02", "title": "数据处理 · 14篇", "summary": "从看见信息转向理解数据结构与数据生产过程。", "details": ["专题先区分不同数据存储方式，再从表、字段、查询和索引解释后台为什么不能像打开一个文档那样随意改数据。索引改善特定查询，却增加存储与更新成本；不同数据关系也会影响怎样拆分和连接。埋点和统计把用户行为转成可分析记录，但采集、上报、去重和归因都有口径，屏幕上显示的数字不天然等于事实。读完应能把一个“查一下数据”的请求拆成业务定义、字段、产生时点、查询条件和质量检查，而不是只记SQL、NoSQL或索引的名称。", "阅读顺序：选择数据表示 → 理解表与查询 → 用索引缩小查找 → 追踪采集与上报 → 核对统计与归因"], "anchors": ["PDF p. 40–65"], "related_concepts": ["database", "data-model", "index", "metrics"], "voice": "editor"}, {"id": "overview-03", "title": "硬件知识 · 20篇", "summary": "为后面的客户端、图形和网络取舍建立资源底座。", "details": ["作者逐一介绍处理器、内存、存储、图形处理、屏幕与传感器，试图把宣传参数翻译成产品可以理解的能力。CPU与GPU擅长的任务不同，存储容量不等于内存，像素数量也不等于所有画质指标。数据移动、运算与无线活动都会消耗时间和能量，多个硬件参数需要放进完整使用路径才能判断体验。文章的价值在于建立资源有限且相互牵制的意识；型号、峰值和当时的先进技术属于历史例子，不能直接形成当前选购或性能排名。", "阅读顺序：区分计算与存储 → 辨认像素与密度 → 理解图形和传感器 → 追踪时间与电量 → 从参数回到任务"], "anchors": ["PDF p. 66–100"], "related_concepts": ["cpu", "gpu", "memory", "display", "sensor"], "voice": "editor"}, {"id": "overview-04", "title": "客户端技术 · 54篇", "summary": "把可见界面拆成运行状态与平台协作，是全书最大的应用专题之一。", "details": ["客户端文章围绕启动、页面、账号、消息、更新和多平台展开。系统提供权限与接口，应用组织视图树和生命周期，网络和后台再把数据送入这些状态；任一环节变化，都可能让相同按钮产生不同结果。缓存、插件、混合方案和热更新提高灵活性，同时带来失效、兼容、信任和回滚问题。屏幕适配与渲染部分把设计稿转成运行成本，提醒产品经理不能只交一张静态图。这里反复出现的因果链是：明确平台能力和用户状态，安排资源的创建与回收，再定义成功、退出、恢复与失败。原文部分缩放公式和平台机制解释有误，具体条目已保留校准。", "阅读顺序：系统接口与权限 → 页面和生命周期 → 账号与通知 → 更新和模块复用 → 屏幕与渲染 → 跨平台及兼容"], "anchors": ["PDF p. 101–221"], "related_concepts": ["platform", "lifecycle", "identity", "hot-update", "rendering"], "voice": "editor"}, {"id": "overview-05", "title": "计算机网络 · 46篇", "summary": "把前后端之间的黑箱打开，让网络问题可以逐层追问。", "details": ["作者从物理信号和地址讲到域名、路由、端口、连接及应用协议，再引入代理、NAT、负载均衡和CDN等中间层。域名解析解决去哪里，连接及传输机制处理数据怎样交付，HTTP等约定再表达业务请求；加密和身份验证则回答谁能看、与谁连接。弱网并非只缺带宽，往返时延、丢包、连接建立、服务端处理与缓存都影响等待。P2P、断点续传等案例说明可以换路径或减少重复工作，但每一种策略都有状态与一致性代价。部分文章介绍早期协议方案，不能把当时实现细节视为当前通用标准。", "阅读顺序：识别地址与解析 → 建立连接与传输 → 组织应用请求 → 通过中转扩展 → 保护通信身份 → 按证据定位瓶颈"], "anchors": ["PDF p. 222–314"], "related_concepts": ["network", "dns", "connection", "http", "cdn", "security"], "voice": "editor"}, {"id": "overview-06", "title": "前端 · 50篇", "summary": "承接网络进入界面，解释Web方案的灵活性及其边界。", "details": ["HTML描述内容结构，CSS组织外观与布局，JavaScript处理行为；浏览器解析、构建结构并渲染，异步请求再让部分内容更新而不必重载整页。DOM、模板、数据绑定和组件帮助管理变化，但也让状态与依赖必须更明确。跨域、Cookie、缓存和Service Worker显示浏览器并非无条件执行任何请求，宿主接口则连接网页与原生能力。服务端渲染、单页应用和混合开发是工作位置与组织方式的不同取舍，不是绝对先进程度的排名。文中多篇小程序分析写于早期猜想阶段，页面明确保留其推测性质。", "阅读顺序：结构样式行为分工 → 解析与渲染 → 请求与页面状态 → 缓存和宿主能力 → 组件及组织方式 → 可信边界与历史预测"], "anchors": ["PDF p. 315–431"], "related_concepts": ["dom", "javascript", "rendering", "http", "hybrid", "same-origin"], "voice": "editor"}, {"id": "overview-07", "title": "安全 · 22篇", "summary": "把技术可行性补成有授权、可验证的产品行为。", "details": ["安全专题从输入处理、脚本、请求和网络欺骗，到恶意软件、凭据、证书与第三方SDK，展示攻击常借助正常功能与信任关系发生。产品不能仅根据界面按钮、一个本地返回值或能否调用API来推断授权成立。加密保护数据内容，签名与证书涉及来源与身份，密码保存还需要适当的计算成本和凭据生命周期；这些目标互相相关却不能混为一谈。书中“黑产”写法包含夸张和操作细节，本页仅保留理解风险与设计防护所需的原理。防护建议和协议描述也有简化，不能把某一条输入限制或隐藏配置当作完整安全方案。", "阅读顺序：识别输入与执行边界 → 区分请求和意愿 → 认识资源耗尽 → 管理密码与凭据 → 理解加密和签名 → 核对SDK及权限证据"], "anchors": ["PDF p. 432–471"], "related_concepts": ["security", "crypto", "identity", "privacy"], "voice": "editor"}, {"id": "overview-08", "title": "开发工具 · 8篇", "summary": "从名词回到工程工作流，为理解开发机制做过渡。", "details": ["工具专题介绍编写代码、自动整理、构建、定位和版本管理等协作环节。工具能把重复步骤标准化，让团队保存变更并追踪差异，但不会自动理解产品目标或证明结果正确。版本控制特别说明：一次功能由多个修改叠加，定位回归需要找到可复现的正常与异常版本，再缩小区间；找到某次提交不代表责任就只有那个人。阅读时应问每个工具处理什么输入、输出什么证据、如何与团队约定衔接，而非把安装或熟练使用工具本身等同于研发成熟。", "阅读顺序：编辑与辅助开发 → 把代码变成产物 → 保留变更历史 → 定位正常与异常区间 → 协作和复核"], "anchors": ["PDF p. 472–488"], "related_concepts": ["build", "version-control", "observability", "automation"], "voice": "editor"}, {"id": "overview-09", "title": "开发技术 · 44篇", "summary": "揭开实现机制，把估工、性能和可维护性放到同一张图上。", "details": ["内存回收、类型、数据结构和编码先说明程序操作的对象是什么；线程池、队列、生产消费与流水线再说明工作如何分配、等待和重叠。随后观察者、接口、MVC、面向对象、继承与多态讨论变化如何传播，重构则在行为基线下改善内部组织。编译、调试和异常把“写出来”“能生成”“能运行”与“业务正确”分成不同验证阶段。这些机制共同反驳两种过度简单的判断：接口能调用不表示整个需求已完成，多开线程也不表示一定更快。专题中同时存在算法、类型和运行时的简化说法，逐篇解读给出适用条件与算术校验。", "阅读顺序：数据与寿命 → 任务与资源 → 流水线及吞吐 → 抽象与依赖 → 编译及运行 → 诊断异常与重构"], "anchors": ["PDF p. 489–588"], "related_concepts": ["memory", "concurrency", "queue", "pipeline", "abstraction", "coupling"], "voice": "editor"}, {"id": "overview-10", "title": "名词解释 · 44篇", "summary": "将前面散见的术语重新对齐，避免同一个词在不同语境下误导决策。", "details": ["这一组文章围绕能力封装、运行机制、数据表示与视觉呈现做交叉解释。SDK、API、控件、组件、模式、框架、架构和引擎讨论不同层次的复用；程序、进程、线程、锁、死锁与池化讨论运行时资源；JSON、编码、摘要与时间戳讨论信息如何表示和识别；RGB、渲染、矢量图、HDR和响应式讨论显示效果如何产生。读法应是每遇一个名词就确认输入、输出、依赖和边界，再通过概念链接回到应用场景。这里不是标准定义的权威词典，MD5唯一性、许可证、图片内存等原文错误尤其不能直接采用。", "阅读顺序：分清抽象与实例 → 区分能力与组织 → 解释运行和等待 → 对齐数据表示 → 理解显示与媒介 → 核对兼容及许可"], "anchors": ["PDF p. 589–672"], "related_concepts": ["interface", "framework", "serialization", "encoding", "rendering"], "voice": "editor"}, {"id": "overview-11", "title": "其它 · 46篇", "summary": "用搜索、推荐、支付、实验与原型把全书重新接回真实任务。", "details": ["搜索和推荐把内容、索引、特征与行为数据连起来；音视频、跨屏与二维码把媒体编码和分发连起来；支付和登录把身份、票据、确认与状态连起来。测试、A/B实验和原型说明如何以不同成本取得证据，云和备份提醒责任不会因为服务被外包就消失。文章最后回到学习与取舍：技术知识的用途是识别约束、降低误解并对结果负责，必要时降低非关键精度、先保障关键路径。许多公司内部实现、趋势和成效判断只是作者推测或历史观察；本页把它们与机制例子分开，不借精彩案例补造未经证明的事实。", "阅读顺序：内容与匹配 → 媒介与分发 → 身份和交易 → 实验与自动化 → 能力和原型 → 学习及柔性取舍"], "anchors": ["PDF p. 673–769"], "related_concepts": ["search", "recommendation", "metrics", "identity", "prototype", "degradation"], "voice": "editor"}], "framework": [{"title": "先定义任务与状态", "detail": "谁要在什么条件下完成什么？页面之外还有失败、取消、退出、重试与恢复。技术讨论先有共同验收对象。", "ids": ["requirements", "state-machine", "prototype"]}, {"title": "再追数据与执行路径", "detail": "从输入、字段、存储、查询到接口和页面；同时分清运行、等待、排队与并行，找到真正瓶颈。", "ids": ["data-model", "interface", "concurrency", "performance"]}, {"title": "检查资源与信任边界", "detail": "时间、内存、带宽和电量有限；每次跨模块、跨网络或接第三方，还要问谁有权操作、数据去了哪里。", "ids": ["tradeoff", "memory", "security", "privacy"]}, {"title": "最后验证、交付与反馈", "detail": "原型回答未知，测试检查预期，指标和实验观察真实效果；发布、回滚与降级让承诺在变化中仍能成立。", "ids": ["automation", "metrics", "release" 4、423、589–590、671–672、693–698、720–721、737–739、768"], "related_concepts": ["innovation", "prototype"], "voice": "editor"}, {"title": "用单位与算术先校验看起来专业的公式", "analysis": "PDF179–181的dp换算与同页320dpi例子矛盾；按该例应为px=dp×dpi/160，反算dp=px×160/dpi。PDF621的1920×1080×4是8,294,400字节，约7.91MiB，不是4Mb。PDF655的4GB按1Gbit/s理想传输约32秒，不能算4秒。PDF313还混用传播速度单位。先统一单位再比较，不把这些算例当作可直接复制的规格。", "anchors": ["PDF p. 179–183、313、620–622、655"], "related_concepts": ["display", "performance", "encoding"], "voice": "editor"}, {"title": "并发、异步、并行与流水线必须分开", "analysis": "PDF582按线程数推测CPU份额、PDF626–627把异步视作必然新建线程，都过于简单。流水线提高连续处理能力，不必降低单件时延；15/15/30分钟的三阶段若各只同时处理一件，三件完成到第120分钟。队列与线程池也受等待和资源限制；书中1024、380多的不同上限不是普遍Linux常数。", "anchors": ["PDF p. 255、527–528、536–540、558–560、582–583、626–628、660–661"], "related_concepts": ["concurrency", "pipeline", "pool"], "voice": "editor"}, {"title": "数据结构的“快”有输入条件", "analysis": "索引需要匹配查询并维护更新，哈希不是任何时候都一步定位，链表插入不能省略寻找节点。倒排检索示例混淆并集与交集，GeoHash同格搜索还会漏掉边界外的近邻。迁移时要写规模、访问模式和结果完整性，不能只记一个复杂度或数据结构名字。", "anchors": ["PDF p. 52–53、521–524、563–564、607–613、720–721"], "related_concepts": ["index", "hash", "location"], "voice": "editor"}, {"title": "编码、压缩、加密与校验不是同一个保护层", "analysis": "Base64通常增加体积，二进制格式需要自己的解释规则，混淆增加理解成本；三者都不能直接承担保密。PDF637把MD5说成绝对唯一有误，有限长度摘要必然存在碰撞，仅比较公开摘要也不能独立证明来源。密码加盐也不是自动安全的充分条件。", "anchors": ["PDF p. 452–453、529–533、541、555–557、596–597、637–638"], "related_concepts": ["encoding", "compression", "crypto", "hash"], "voice": "editor"}, {"title": "客户端显示与可信授权需要分开", "analysis": "本地有票据、清晰图片已经下载、扫码读出内容、相机接口被调用，都只证明链条中的某一步。是否仍有权限、是否真正上传、是否完成支付，要分别取证。红包照片两篇前后对漏洞的表述不同，所谓平台早有预谋的解释没有内部证据。", "anchors": ["PDF p. 465–469、715–717、732–739、761–762"], "related_concepts": ["identity", "token", "security"], "voice": "editor"}, {"title": "安全文章应服务风险识别，不能照搬局部处方", "analysis": "白名单、POST、隐藏SSID、MAC限制等不能各自代表完整防护。XSS、CSRF、ARP、TLS、签名和证书的部分说明含简化或分类混用，页面在对应条目标出。恶意软件和刷量只保留原理、影响与防护问题，不把原书调侃转为执行流程。", "anchors": ["PDF p. 261–262、432–469、699–700、740–743"], "related_concepts": ["security", "crypto", "metrics"], "voice": "editor"}, {"title": "媒体文件、解码数据与感知质量分层比较", "analysis": "图片文件小不表示解码内存小；PNG无损与预先减色不同；渐进式JPEG不应按文中小波变换解释。WAV不是固定一种采样率和位深，视频容器也不独立决定清晰度。数字耳机把转换位置外移，并未从物理播放链中消除数字到模拟转换。", "anchors": ["PDF p. 624–625、670、675–676、728–731、747–749"], "related_concepts": ["media", "compression", "display"], "voice": "editor"}, {"title": "跨平台、框架与云都不会消除责任", "analysis": "共同接口和成熟框架减少重复工作，不能保证兼容、安全和稳定。云服务也有责任边界，文中装好系统的云服务器不能只据描述直接归为PaaS。“只调几个API”“几分钟完成”“半天做Demo”等叙述必须与完整需求、集成和验证成本分开。", "anchors": ["PDF p. 226–227、332、505–507、579–581、633–636、701–702、712、764–766"], "related_concepts": ["reuse", "interface", "platform"], "voice": "editor"}, {"title": "开源许可章节包含不能采用的误述", "analysis": "PDF648把GPL说成禁止商业销售、把LGPL说成不允许修改，均不能作为项目行为依据。本页只保留选型前检查许可的要求。具体权利义务需要按实际许可证、版本及使用和分发方式另行核对；未引用现行法律或许可证原文，也不据本书代拟合规结论。", "anchors": ["PDF p. 648–649"], "related_concepts": ["license", "reuse"], "voice": "editor"}, {"title": "AI概念可以启蒙，但需要重新划清范围", "analysis": "把深度学习等同CNN、把模式识别排除学习、把更多数据等同更高正确率，都不足以支撑实际方案。应保留任务、训练经验、推断与评价的链条；关于当前LLM或AI产品的能力，本地书稿没有证据，本页不自行补成最新技术课程。", "anchors": ["PDF p. 494–496、677–678、718–719"], "related_concepts": ["machine-learning", "recommendation", "metrics"], "voice": "editor"}, {"title": "实验平台、随机源与数据量都不能替代验证设计", "analysis": "A/B平台减少操作门槛，不自动保证分组和指标正确；真随机也不独立保证名单、映射、重复规则和操作过程公平。广告式推荐与创始人背景不是效果证据，用户行为“越多越详细越好”也应受质量与授权限制。", "anchors": ["PDF p. 677–678、705–710"], "related_concepts": ["experiment", "metrics", "privacy"], "voice": "editor"}, {"title": "历史描述保留时代，不强行补写今天", "analysis": "硬件参数、Wi-Fi版本预测、厂商SDK、云盘价格和容量、接口及平台政策都可能随时间变化。这里分析本地文本的解释方法，不将旧文的最火、最新、将商用、逐渐消亡写成2026年的现状，也不自行给出购买建议。若需当前技术方案，应另行核验官方资料。", "anchors": ["PDF p. 66–100、228–229、655、690、696–698、734、745–747、752–753、763"], "related_concepts": ["platform", "network", "innovation"], "voice": "editor"}, {"title": "技术名词的用途是提出更好的问题", "analysis": "作者常以装懂、反忽悠和职业调侃吸引阅读，但最有价值的部分仍是解释约束、共同定义问题和保留反馈。不要将猜测说得更硬，也不要用大O、接口或架构压过他人的具体证据。技术素养应增加可核对的讨论，而非增加单方面命令。", "anchors": ["PDF p. 25–39、688–689、722–724、764–769"], "related_concepts": ["collaboration", "learning", "requirements"],
