指定技术、逼迫二选一、轻视实现劳动和用上级压人。核心是让价值、边界和成本共同接受讨论；文中对话有意夸张，不能据此把双方固定成对立角色。", "anchors": ["PDF p. 28–30"], "pdf_start": 28, "pdf_end": 30, "voice": "editor", "related_concepts": ["requirements", "tradeoff", "collaboration"], "excerpts": []}, {"id": "article-31", "title": "提需求的正确姿势是什么", "detail": "以调屏幕亮度说明：调用接口之外，还有退出恢复、返回状态、耗时和线程协调。需求应配合版本阶段，保留优化时间，检查已有平台及模块能力，提前准备设计测试资源。文中“减半”“翻倍”是粗略表达，不是估算公式。", "anchors": ["PDF p. 31–33"], "pdf_start": 31, "pdf_end": 33, "voice": "editor", "related_concepts": ["requirements", "release", "reuse"], "excerpts": []}, {"id": "article-34", "title": "程序员到底需要一份什么样的需求文档", "detail": "作者反对只堆自然语言、靠反复追问补充“如果”的需求文档，提倡共同梳理关键路径、交互图和边界，并作明确的版本取舍。应带走清晰表达和早期协作，而非照搬“只要流程图”：复杂业务规则、数据约束仍需另有说明。", "anchors": ["PDF p. 34–35"], "pdf_start": 34, "pdf_end": 35, "voice": "editor", "related_concepts": ["requirements", "state-machine"], "excerpts": []}, {"id": "article-36", "title": "产品经理应该这样提需求之「状态机」", "detail": "有限状态机用现态、次态、条件和动作描述转换，以待机、振铃、通话等状态举例。它让多状态交互的路径和遗漏更易被检查；关键是明确何时允许转换、由什么触发，而不只是画几个页面。图形能减少歧义，仍要与实际条件核对。", "anchors": ["PDF p. 36–38"], "pdf_start": 36, "pdf_end": 38, "voice": "editor", "related_concepts": ["state-machine", "requirements"], "excerpts": []}, {"id": "article-39", "title": "为什么项目会延期？", "detail": "延期被拆为需求不明确、排期和风险控制不足、沟通反馈不及时。复杂需求提前评估并拆分，长项目设里程碑，暴露风险后敢于减范围；原型可先检验想法。加班是书中提及的手段，不能替代修正不合理承诺和系统性问题。", "anchors": ["PDF p. 39–39"], "pdf_start": 39, "pdf_end": 39, "voice": "editor", "related_concepts": ["release", "collaboration", "tradeoff"], "excerpts": []}], "takeaways": ["这一专题共有6篇。逐篇保留原题和顺序；点击概念可继续追问机制、条件与边界。", "具体算法、平台与内部实现的限制放在相应条目中，概念层提供跨专题连接。"], "related_concepts": ["requirements", "collaboration", "tradeoff"], "anchors": ["PDF p. 25–39"], "confidence": "源文释义与编者综合；历史主张未作外部核实"}, {"id": "ch-02", "title": "数据处理 · 14篇", "part": "专题02", "question": "业务信息怎样被组织、查询、记录，并最终成为可用证据？", "role": "从看见信息转向理解数据结构与数据生产过程。", "mainline": "专题先区分不同数据存储方式，再从表、字段、查询和索引解释后台为什么不能像打开一个文档那样随意改数据。索引改善特定查询，却增加存储与更新成本；不同数据关系也会影响怎样拆分和连接。埋点和统计把用户行为转成可分析记录，但采集、上报、去重和归因都有口径，屏幕上显示的数字不天然等于事实。读完应能把一个“查一下数据”的请求拆成业务定义、字段、产生时点、查询条件和质量检查，而不是只记SQL、NoSQL或索引的名称。", "argument_flow": ["选择数据表示", "理解表与查询", "用索引缩小查找", "追踪采集与上报", "核对统计与归因"], "sections": [{"id": "article-40", "title": "NoSQL 数据库简介", "detail": "从关系型数据库的负载、字段调整与大数据处理引入NoSQL，强调按数据关系和查询场景选择。作者把若干产品优点概括为NoSQL整体特征，略显绝对；不能仅凭“非关系型”就断言更快、无关联或无需设计，应回到具体实现和工作负载。", "anchors": ["PDF p. 40–40"], "pdf_start": 40, "pdf_end": 40, "voice": "editor", "related_concepts": ["database", "tradeoff"], "excerpts": []}, {"id": "article-41", "title": "数据恢复原理", "detail": "区分介质物理损坏与逻辑删除，用索引区和数据区解释：删除目录信息后，内容可能尚未覆盖，所以恢复存在时间窗口。它提示产品要区分用户不可见、逻辑删除与真正消除；书中恢复和销毁做法有适用条件，不能据此保证所有介质都可恢复或彻底删除。", "anchors": ["PDF p. 41–41"], "pdf_start": 41, "pdf_end": 41, "voice": "editor", "related_concepts": ["storage"], "excerpts": []}, {"id": "article-42", "title": "非关系型数据库", "detail": "以手机号为键、JSON为值说明键值存储的简单访问和灵活字段，比较结构化表格与半结构化对象。示例帮助理解一种NoSQL模型，不代表NoSQL全都只能按键查询，也不证明其将全面替代关系型数据库；选择仍取决于业务关联和访问方式。", "anchors": ["PDF p. 42–42"], "pdf_start": 42, "pdf_end": 42, "voice": "editor", "related_concepts": ["database", "serialization"], "excerpts": []}, {"id": "article-43", "title": "分布式计算的基础：MapReduce", "detail": "用大量文件中的人名计数说明Map把独立任务分给机器、Reduce按相同键聚合结果。并行缩短重复任务处理时间，但文中机器数与耗时只作示意，没有完整计算通信、调度和不均衡成本；不能认为加机器总能等比例加速。", "anchors": ["PDF p. 43–44"], "pdf_start": 43, "pdf_end": 44, "voice": "editor", "related_concepts": ["distributed", "tradeoff"], "excerpts": []}, {"id": "article-45", "title": "学学写点 SQL 语句，好吗？", "detail": "通过员工表依次介绍SELECT、WHERE、多条件、LIKE、排序、指定列与聚合函数。应理解查询条件和返回字段如何改变结果，能与数据同学核对口径。示例属于入门演示，文中“SQL是唯一方法”的表述过宽，不应直接复制示意语法到生产环境。", "anchors": ["PDF p. 45–47"], "pdf_start": 45, "pdf_end": 47, "voice": "editor", "related_concepts": ["database"], "excerpts": []}, {"id": "article-48", "title": "天天鼓捣数据，你知道数据库长啥样吗？", "detail": "以仓库和Excel表格建立行、列、字段、记录的直观模型，再介绍增删改查、索引、事务、联合查询及连接管理。事务例子强调一组操作失败时回到一致状态；数据库并非真的只是一张表或单个文件，类比用于入门，不能代替具体系统设计。", "anchors": ["PDF p. 48–49"], "pdf_start": 48, "pdf_end": 49, "voice": "editor", "related_concepts": ["database", "transaction", "index"], "excerpts": []}, {"id": "article-50", "title": "天天鼓捣数据，你知道数据库长啥样吗？（续）", "detail": "朋友圈消息若重复保存用户昵称，会产生冗余和修改负担；拆成用户表与消息表后通过关联查询组织数据。再用建表、插入和查询说明模型如何落地。结构化信息与图片文件路径分工是示例方案，不意味着数据库无法保存非结构化数据。", "anchors": ["PDF p. 50–51"], "pdf_start": 50, "pdf_end": 51, "voice": "editor", "related_concepts": ["database", "data-model"], "excerpts": []}, {"id": "article-52", "title": "天天捣鼓数据库，知道什么是索引吗？", "detail": "从逐条扫描十万条使用时长，过渡到为属性建立有序索引及记录定位信息，解释查询加速与空间换时间。最大值或特定值可少读很多数据，但创建和维护索引也有代价；书中的排序和二分法是教学模型，不涵盖所有索引结构与查询计划。", "anchors": ["PDF p. 52–53"], "pdf_start": 52, "pdf_end": 53, "voice": "editor", "related_concepts": ["index", "performance", "tradeoff"], "excerpts": []}, {"id": "article-54", "title": "再谈数据库索引", "detail": "聚簇索引示例围绕数据排列组织，非聚簇索引另外保存有序键与定位信息，说明不同查询条件需要不同访问路径。应关注索引与查询是否匹配及空间、更新开销；“一张表一个聚簇索引”等结论要放在相应数据库模型中，不能无条件推广。", "anchors": ["PDF p. 54–55"], "pdf_start": 54, "pdf_end": 55, "voice": "editor", "related_concepts": ["index", "data-model"], "excerpts": []}, {"id": "article-56", "title": "捣鼓数据库，总有一天你会用到 ORM", "detail": "News对象的属性要拆成表字段，读取后再还原对象；ORM把这类重复映射封装为通用库。它减少手写适配代码，但不抹平关系、约束与复杂查询，遇到性能或语义问题仍需理解SQL和数据库，不能把封装当作底层成本消失。", "anchors": ["PDF p. 56–57"], "pdf_start": 56, "pdf_end": 57, "voice": "editor", "related_concepts": ["data-model", "database", "abstraction"], "excerpts": []}, {"id": "article-58", "title": "整天看用户埋点数据，知道数据是咋来的吗？", "detail": "完整链路为事件定义与埋点、批量上报、原始日志、离线计算入库、报表展示。次数、人数、留存并非同一原始值，还依赖身份与聚合口径。批量和离线处理节省资源却增加延迟；书中日志保留天数是例子，关键是留有可追溯证据。", "anchors": ["PDF p. 58–59"], "pdf_start": 58, "pdf_end": 59, "voice": "editor", "related_concepts": ["metrics", "pipeline"], "excerpts": []}, {"id": "article-60", "title": "统计数据出问题，产品经理应该怎么办？", "detail": "按报表为零、整体突降、个别突增、历史异常和漏斗断层分别调查客户端、日志、计算入库和展示，避免一股脑拉群。保留原始日志并及时反馈十分重要。文中部分“肯定是”只是排查经验，现实中应检验而非将症状直接当根因。", "anchors": ["PDF p. 60–62"], "pdf_start": 60, "pdf_end": 62, "voice": "editor", "related_concepts": ["metrics", "observability", "pipeline"], "excerpts": []}, {"id": "article-62", "title": "知道渠道号数据怎么统计的吗？", "detail": "渠道包通过配置文件保存不同渠道号，同一代码据此上报，实现自动化批量打包。升级可能覆盖包内配置，因此要区分当前安装渠道与最初来源，并把需要保留的归因信息放在适当持久位置；两类口径混用会误判推广效果。", "anchors": ["PDF p. 62–63"], "pdf_start": 62, "pdf_end": 63, "voice": "editor", "related_concepts": ["metrics", "configuration"], "excerpts": []}, {"id": "article-64", "title": "我的天呐~竟然可以这样埋点!", "detail": "可视化圈选与SDK自动采集把部分统计工作从逐点改业务代码转为配置报表，降低版本依赖。作者用GrowingIO演示，且明确承认部分底层流程是猜测；应区分产品体验与已证实实现。“无埋点”仍需采集能力，覆盖、准确性与数据范围要检查。", "anchors": ["PDF p. 64–65"], "pdf_start": 64, "pdf_end": 65, "voice": "editor", "related_concepts": ["metrics", "abstraction"], "excerpts": []}], "takeaways": ["这一专题共有14篇。逐篇保留原题和顺序；点击概念可继续追问机制、条件与边界。", "具体算法、平台与内部实现的限制放在相应条目中，概念层提供跨专题连接。"], "related_concepts": ["database", "data-model", "index", "metrics"], "anchors": ["PDF p. 40–65"], "confidence": "源文释义与编者综合；历史主张未作外部核实"}, {"id": "ch-03", "title": "硬件知识 · 20篇", "part": "专题03", "question": "性能、电量与显示体验受哪些物理资源限制？", "role": "为后面的客户端、图形和网络取舍建立资源底座。", "mainline": "作者逐一介绍处理器、内存、存储、图形处理、屏幕与传感器，试图把宣传参数翻译成产品可以理解的能力。CPU与GPU擅长的任务不同，存储容量不等于内存，像素数量也不等于所有画质指标。数据移动、运算与无线活动都会消耗时间和能量，多个硬件参数需要放进完整使用路径才能判断体验。文章的价值在于建立资源有限且相互牵制的意识；型号、峰值和当时的先进技术属于历史例子，不能直接形成当前选购或性能排名。", "argument_flow": ["区分计算与存储", "辨认像素与密度", "理解图形和传感器", "追踪时间与电量", "从参数回到任务"], "sections": [{"id": "article-66", "title": "咱都是 CPU，有啥不一样？", "detail": "用手机多核与PC处理器对比，提醒核心数不等于整体性能，还要看架构、软件利用、功耗和散热。文中将ARM与x86性能关系说得过于绝对，是当时设备背景下的判断；可迁移的是按任务和功耗预算比较，不能只按指令集名称判断优劣。", "anchors": ["PDF p. 66–66"], "pdf_start": 66, "pdf_end": 66, "voice": "editor", "related_concepts": ["cpu", "performance", "tradeoff"], "excerpts": []}, {"id": "article-67", "title": "ARM 被收购，我们也来聊聊 CPU 吧", "detail": "以餐厅菜谱比喻指令集，再介绍控制器、运算器、寄存器和缓存如何支持取指、运算与设备交互。文章用ARM当时的移动市场定位说明差异化路线。企业收购、市场地位和性能倍数属于历史叙述，不是今天的产品资料。", "anchors": ["PDF p. 67–67"], "pdf_start": 67, "pdf_end": 67, "voice": "editor", "related_concepts": ["cpu", "architecture"], "excerpts": []}, {"id": "article-68", "title": "简单说说精简指令集与复杂指令集", "detail": "CISC把较复杂操作表达为指令，RISC强调较规整、常用的指令设计，文章借此解释设备路线。理解重点是接口与执行方式，而非“精简必然低功耗、复杂必然更快”；作者也承认手机耗电由屏幕、无线与后台等多环节造成。", "anchors": ["PDF p. 68–68"], "pdf_start": 68, "pdf_end": 68, "voice": "editor", "related_concepts": ["cpu", "abstraction", "tradeoff"], "excerpts": []}, {"id": "article-69", "title": "GPU 与高性能计算", "detail": "GPU拥有大量适合相似任务的计算单元，因此不只加速画面，也能处理部分密集计算。文章以成像、机器学习等说明数据并行；选择前需看任务能否有效拆分和计算模式是否匹配，不能拿显卡单元数直接与CPU核心数或集群规模对比。", "anchors": ["PDF p. 69–70"], "pdf_start": 69, "pdf_end": 70, "voice": "editor", "related_concepts": ["gpu", "concurrency", "performance"], "excerpts": []}, {"id": "article-71", "title": "充电五分钟，真的可以通话两小时吗？", "detail": "快速充电不仅是充电器提高电压或电流，还依赖线材、手机电路、发热保护和系统耗电管理。省电模式减少非必要活动，使特定使用场景续航更长；“通话两小时”取决于条件。文中的型号、电流限制和续航判断有时代范围，不能当通用充电指南。", "anchors": ["PDF p. 71–72"], "pdf_start": 71, "pdf_end": 72, "voice": "editor", "related_concepts": ["performance", "tradeoff", "platform"], "excerpts": []}, {"id": "article-73", "title": "OLED 屏是啥玩意？", "detail": "LCD用背光与液晶控制透光，OLED像素主动发光，因此黑色、曲面、响应和寿命表现不同。作者同时讨论漏光与烧屏，说明技术选择涉及多指标。色域百分比、亮度与寿命不能脱离测量口径和具体面板，仅凭OLED或LCD标签无法裁定效果。", "anchors": ["PDF p. 73–74"], "pdf_start": 73, "pdf_end": 74, "voice": "editor", "related_concepts": ["display", "performance", "media"], "excerpts": []}, {"id": "article-75", "title": "大伙常见的存储设备简介", "detail": "依次比较机械盘、固态盘、闪存卡、ROM、RAM和高速缓存，说明容量、持久性、成本与访问速度的差异。CPU需要高速工作区，文件保存需要持久存储，两者用途不同；文中的价格倍数与速度例子是当时观察，不应作为当前采购依据。", "anchors": ["PDF p. 75–77"], "pdf_start": 75, "pdf_end": 77, "voice": "editor", "related_concepts": ["storage", "cache", "performance"], "excerpts": []}, {"id": "article-78", "title": "戴上 VR 眼镜晕？先得明白刷新率与帧率", "detail": "刷新率描述显示设备更新画面的节奏，帧率描述软件与图形系统生成画面的速度，二者一起限制流畅体验。VR例子提示还需同步与足够处理能力；文中的75Hz等不能视为保证不眩晕的阈值，个体差异和更多时延因素仍在模型之外。", "anchors": ["PDF p. 78–78"], "pdf_start": 78, "pdf_end": 78, "voice": "editor", "related_concepts": ["rendering", "display", "performance"], "excerpts": []}, {"id": "article-79", "title": "点亮屏幕的正确姿势", "detail": "抬起亮屏、光感和距离感应把传感数据映射为动作判断，后台监测又带来耗电、误判与进程存活问题。协处理器可以分担持续采样。产品设计要同时检查准确性、功耗和设备支持，不能因单一手机实现便认为普通应用都能同等做到。", "anchors": ["PDF p. 79–79"], "pdf_start": 79, "pdf_end": 79, "voice": "editor", "related_concepts": ["sensor", "performance", "lifecycle"], "excerpts": []}, {"id": "article-80", "title": "都说蓝牙耳机音质差，到底是为啥？", "detail": "音源解码、重新编码、蓝牙协议传输、接收端解码构成链路，带宽和有损编码可能改变音质。文章的价值在于拆开传输速率、音源码率和编码损失；涉及具体版本与A2DP带宽的数值不能概括所有蓝牙音频，也不宜推导蓝牙必然低音质。", "anchors": ["PDF p. 80–81"], "pdf_start": 80, "pdf_end": 81, "voice": "editor", "related_concepts": ["media", "performance", "compression"], "excerpts": []}, {"id": "article-82", "title": "分辨率越高就越清晰吗？", "detail": "分辨率表示像素数量，感知细腻程度还取决于屏幕尺寸、像素密度、观看距离与源素材。视网膜和马赛克例子说明参数必须连到实际观看场景；书中DPI、PPI措辞有所混用，不能把某个密度数字当作所有人、所有距离的清晰界限。", "anchors": ["PDF p. 82–84"], "pdf_start": 82, "pdf_end": 84, "voice": "editor", "related_concepts": ["display", "media", "tradeoff"], "excerpts": []}, {"id": "article-85", "title": "机器配置很好，为什么还是卡？", "detail": "即使CPU与内存有余量，磁盘、网络或设备共享仍可能阻塞任务。缓存预先保留数据，缓和不同访问速度和网络波动；音频打断、读写顺序还涉及协调。优化前需先定位等待发生在哪一层，不能只升级机器配置或把所有卡顿归因于计算慢。", "anchors": ["PDF p. 85–85"], "pdf_start": 85, "pdf_end": 85, "voice": "editor", "related_concepts": ["performance", "cache"], "excerpts": []}, {"id": "article-86", "title": "快速充电的原理", "detail": "以电压乘电流解释增加充电功率的方向，接着说明充电器、线材和手机需协同支持及协商回退。快充是一条端到端能力链，不能只换高标称功率充电器。文章品牌协议和数值为旧例，实际兼容与保护仍需按设备资料判断。", "anchors": ["PDF p. 86–86"], "pdf_start": 86, "pdf_end": 86, "voice": "editor", "related_concepts": ["performance", "platform"], "excerpts": []}, {"id": "article-87", "title": "如何让家里畅享 360 度无死角的 wifi 上网？", "detail": "从WAN、LAN、WLAN和DHCP分工讲起，再用有线扩展与电力载波连接远端接入点，解释覆盖不足怎样通过改变网络拓扑缓解。信号覆盖不等于外网带宽增加；书中关于独立拨号、带宽及电力猫距离的说法有条件，不能照搬成无死角保证。", "anchors": ["PDF p. 87–88"], "pdf_start": 87, "pdf_end": 88, "voice": "editor", "related_concepts": ["network", "architecture", "tradeoff"], "excerpts": []}, {"id": "article-89", "title": "说说 NFC 技术", "detail": "NFC以近距离无线链路支持快速接触式交互，区分主动产生场与被动响应，和蓝牙在距离、建立连接及用途上互补。近距离减少部分风险但不等于绝对安全，文章也提到标签克隆；产品要明确交互和认证，不能只凭“碰一下”判断身份。", "anchors": ["PDF p. 89–91"], "pdf_start": 89, "pdf_end": 91, "voice": "editor", "related_concepts": ["cdn", "network", "security"], "excerpts": []}, {"id": "article-92", "title": "水果公司的 iBeacon，你知道多少？", "detail": "iBeacon利用BLE广播携带UUID、Major、Minor等标识，客户端据此识别店铺或区域，再请求运营内容；信号强度用于估计距离。基站并非直接把优惠弹窗送进任意手机，应用扫描、配置及匹配共同完成体验，位置估计也不是精确坐标保证。", "anchors": ["PDF p. 92–93"], "pdf_start": 92, "pdf_end": 93, "voice": "editor", "related_concepts": ["cdn", "sensor", "metrics"], "excerpts": []}, {"id": "article-94", "title": "天朝 GPS 定位为啥不准？", "detail": "定位到河里示例说明坐标正确也可能因地图与定位数据采用不同坐标系而显示偏移。重点是明确WGS-84、GCJ-02等来源与转换边界，统一链路口径后再查定位精度；文章对法规和转换代码的评论不作为现行要求或任意使用许可。", "anchors": ["PDF p. 94–95"], "pdf_start": 94, "pdf_end": 95, "voice": "editor", "related_concepts": ["location", "network", "observability"], "excerpts": []}, {"id": "article-96", "title": "听说过蓝牙，但不一定听说过 BLE", "detail": "BLE围绕低功耗、广播发现和低速率数据交互设计，文章解释单模双模及中央、外围角色，并联系运动、医疗和家居。低功耗是以应用条件和数据模式为基础，具体速率、时延和兼容能力需按版本；不要把所有蓝牙设备当作同一协议组合。", "anchors": ["PDF p. 96–97"], "pdf_start": 96, "pdf_end": 97, "voice": "editor", "related_concepts": ["cdn", "performance", "network"], "excerpts": []}, {"id": "article-98", "title": "无线充电的原理", "detail": "发送与接收线圈通过电磁感应传递能量，标准协调设备互通；距离、对准、损耗和发热影响使用体验。作者预言无线充电是终极方式属于观点，文中效率和标准竞争是旧材料；便利、热管理与充电条件仍需分别验证。", "anchors": ["PDF p. 98–99"], "pdf_start": 98, "pdf_end": 99, "voice": "editor", "related_concepts": ["performance", "platform", "tradeoff"], "excerpts": []}, {"id": "article-100", "title": "最好的 iPhone 摄像头？", "detail": "从传感器采样、模数转换到图像信号处理与颜色输出拆解拍照链路，区分光学采集和后期处理。提升处理速度或数码放大不等于增加原始细节；产品应围绕成像效果和使用场景评估，文中关于质量上限的简化不能覆盖全部计算摄影情形。", "anchors": ["PDF p. 100–100"], "pdf_start": 100, "pdf_end": 100, "voice": "editor", "related_concepts": ["media", "sensor", "performance"], "excerpts": []}], "takeaways": ["这一专题共有20篇。逐篇保留原题和顺序；点击概念可继续追问机制、条件与边界。", "具体算法、平台与内部实现的限制放在相应条目中，概念层提供跨专题连接。"], "related_concepts": ["cpu", "gpu", "memory", "display", "sensor"], "anchors": ["PDF p. 66–100"], "confidence": "源文释义与编者综合；历史主张未作外部核实"}, {"id": "ch-04", "title": "客户端技术 · 54篇", "part": "专题04", "question": "一个手机功能为什么受生命周期、系统能力、资源和分发机制共同约束？", "role": "把可见界面拆成运行状态与平台协作，是全书最大的应用专题之一。", "mainline": "客户端文章围绕启动、页面、账号、消息、更新和多平台展开。系统提供权限与接口，应用组织视图树和生命周期，网络和后台再把数据送入这些状态；任一环节变化，都可能让相同按钮产生不同结果。缓存、插件、混合方案和热更新提高灵活性，同时带来失效、兼容、信任和回滚问题。屏幕适配与渲染部分把设计稿转成运行成本，提醒产品经理不能只交一张静态图。这里反复出现的因果链是：明确平台能力和用户状态，安排资源的创建与回收，再定义成功、退出、恢复与失败。原文部分缩放公式和平台机制解释有误，具体条目已保留校准。", "argument_flow": ["系统接口与权限", "页面和生命周期", "账号与通知", "更新和模块复用", "屏幕与渲染", "跨平台及兼容"], "sections": [{"id": "article-101", "title": "「骗人」的动画", "detail": "闪屏可遮住初始化，截图可模拟页面层叠动画，说明可见反馈与真实完成并不相同。它们能平滑体验，也可能掩盖启动欠账，出现“看得到却不能点”。设计应同时测可见时间和可操作时间，不能把视觉技巧当成实际性能改善。", "anchors": ["PDF p. 101–101"], "pdf_start": 101, "pdf_end": 101, "voice": "editor", "related_concepts": ["performance", "animation", "lifecycle"], "excerpts": []}, {"id": "article-102", "title": "「贴心」的广告追踪", "detail": "广告追踪需要跨浏览或跨应用关联标识，文章用Cookie、设备属性与共享状态解释关联路径，并讨论用户开关。此处应理解识别与授权的区别：技术上可连起来不等于用户同意；旧版平台接口及开关行为不能直接作为今天的追踪方案。", "anchors": ["PDF p. 102–103"], "pdf_start": 102, "pdf_end": 103, "voice": "editor", "related_concepts": ["privacy", "identity", "metrics"], "excerpts": []}, {"id": "article-104", "title": "APK 是怎样炼成的", "detail": "APK将清单、代码、图片布局、资源索引及签名打包，文章依次解释编译、转换、混淆和签名。成品是多种输入共同生成，并非代码压缩一下即可。签名用于识别与完整性判断，不能单凭有签名认定软件可信或没有漏洞。", "anchors": ["PDF p. 104–105"], "pdf_start": 104, "pdf_end": 105, "voice": "editor", "related_concepts": ["build", "crypto", "configuration"], "excerpts": []}, {"id": "article-106", "title": "Android N 来了，这次谷歌又在玩啥？", "detail": "以Android N预览版介绍分屏、通知交互、省电、流量控制、目录访问和编译运行环境变化。共同方向是系统统一能力与资源约束，会改变应用可实现范围。版本覆盖率、工具和接口限制均属于当时资料，本文按历史演进理解，不作当前配置指南。", "anchors": ["PDF p. 106–109"], "pdf_start": 106, "pdf_end": 109, "voice": "editor", "related_concepts": ["platform", "performance"], "excerpts": []}, {"id": "article-110", "title": "Android 神器 Xposed 的原理是什么？", "detail": "Xposed在运行调用路径中介入，改变输入、输出或替换实现，展示Hook框架如何使未改原包的行为发生变化。它依赖运行环境和高权限。理解重点是客户端行为可能被干预及权限边界，不把伪造位置、自动操作等例子转成绕过业务限制的操作教程。", "anchors": ["PDF p. 110–111"], "pdf_start": 110, "pdf_end": 111, "voice": "editor", "related_concepts": ["interface", "platform", "security"], "excerpts": []}, {"id": "article-112", "title": "Android 手机耗电、跑流量，谁是元凶？", "detail": "频繁心跳会唤醒CPU与无线模块，多应用独立通道和相互拉活使后台成本叠加。系统统一推送与批量调度试图减少这种浪费。衡量活跃度时应同时看耗电、流量与用户打扰；文章对厂商动机的概括是作者评论，不能据此认定每个后台活动都恶意。", "anchors": ["PDF p. 112–113"], "pdf_start": 112, "pdf_end": 113, "voice": "editor", "related_concepts": ["connection", "performance", "lifecycle"], "excerpts": []}, {"id": "article-114", "title": "Android 系统上看到的界面都是什么？", "detail": "窗口承担系统管理和生命周期边界，View承载具体内容，Dialog等与父窗口存在归属。相似外观可能来自不同结构，关闭和切换行为也因此不同。文章末尾冒充其他应用弹窗的设想应作为界面可信度风险，不作为增长手段。", "anchors": ["PDF p. 114–115"], "pdf_start": 114, "pdf_end": 115, "voice": "editor", "related_concepts": ["view-tree", "lifecycle", "platform"], "excerpts": []}, {"id": "article-116", "title": "Apple Pay 来了，苹果用了什么黑科技？", "detail": "以Apple Pay绑卡和支付说明设备标识、隔离安全环境、指纹授权及单次交易凭据的分工，减少反复暴露原始卡信息与重放风险。流程是入门简化，不能据此保证指纹不可伪造、设备破解后绝对安全或涵盖所有支付实现。", "anchors": ["PDF p. 116–117"], "pdf_start": 116, "pdf_end": 117, "voice": "editor", "related_concepts": ["identity", "token", "security"], "excerpts": []}, {"id": "article-118", "title": "GPU 加速游有用吗？", "detail": "GPU擅长重复绘图，但应用可能已启用加速，强制开关不一定再变快；部分绘制操作和旧环境存在兼容差异。加速可按区域配置，也会带来资源成本。先定位是否卡在绘制而非网络或主线程，再讨论加速，不能凭开关名称判断效果。", "anchors": ["PDF p. 118–118"], "pdf_start": 118, "pdf_end": 118, "voice": "editor", "related_concepts": ["gpu", "rendering", "platform"], "excerpts": []}, {"id": "article-119", "title": "扒一扒 Android 应用的续命大法", "detail": "系统广播、守护与应用间唤醒解释了旧版Android中“退出后又活着”的现象。后台通信对业务有价值，也占用用户CPU、内存、电量和流量。应从必要任务与系统支持设计生命周期，不把规避用户清理或强行常驻当作默认产品目标。", "anchors": ["PDF p. 119–120"], "pdf_start": 119, "pdf_end": 120, "voice": "editor", "related_concepts": ["lifecycle", "performance", "platform"], "excerpts": []}, {"id": "article-121", "title": "扒一扒手机传感器", "detail": "磁场、加速度、陀螺仪、距离、光线、气压等把物理变化变成数据，可用于方向、计步、亮屏与环境交互。测得信号与推断用户动作仍隔着算法和误差。文中若干器件原理与测量量是简化或推测，设备是否具备、结果是否稳定都需验证。", "anchors": ["PDF p. 121–122"], "pdf_start": 121, "pdf_end": 122, "voice": "editor", "related_concepts": ["sensor", "platform", "tradeoff"], "excerpts": []}, {"id": "article-123", "title": "插件，你好", "detail": "插件依赖宿主运行，宿主聚焦核心能力，向扩展者开放接口并制定规则。浏览器例子解释分工如何丰富功能及生态，也要求约束扩展能力。把外包或外挂比作插件是作者类比，不能混淆正式扩展接口、未经授权改动与商业合作。", "anchors": ["PDF p. 123–124"], "pdf_start": 123, "pdf_end": 124, "voice": "editor", "related_concepts": ["hot-update", "interface", "architecture"], "excerpts": []}, {"id": "article-125", "title": "产品后悔药来了，讲讲热补丁技术", "detail": "文章比较优先加载修复代码和介入执行路径两类旧Android热补丁思路，说明不完整升级也可能修复部分代码。它依赖运行环境，且不覆盖所有变化。所谓“后悔药”不能替代测试、灰度和回滚，也不能把“不知不觉更新”当作无需规则与授权。", "anchors": ["PDF p. 125–126"], "pdf_start": 125, "pdf_end": 126, "voice": "editor", "related_concepts": ["hot-update", "build", "release"], "excerpts": []}, {"id": "article-127", "title": "超级 APP 诞生记(一)", "detail": "登录先验证身份，再用有时效的票据访问，自动登录可保存票据而非反复提交密码。机票类比帮助区分长期凭据和会话凭据。文中客户端哈希、SD卡保存及内存安全说法较粗略；哈希不等于安全传输，凭据存储位置也不能仅凭方便决定。", "anchors": ["PDF p. 127–128"], "pdf_start": 127, "pdf_end": 128, "voice": "editor", "related_concepts": ["identity", "token", "hash"], "excerpts": []}, {"id": "article-129", "title": "超级 APP 诞生记(二)", "detail": "GPS、基站、Wi-Fi分别借助已知参考位置估计终端位置，平台接口把复杂实现包装成能力。产品仍需处理室内外、精度、耗时、权限与坐标口径。文中“出厂加偏芯片”和“几行代码即可”的断言未经本书充分证明，不能据此否认完整集成成本。", "anchors": ["PDF p. 129–131"], "pdf_start": 129, "pdf_end": 131, "voice": "editor", "related_concepts": ["location", "sensor", "network"], "excerpts": []}, {"id": "article-132", "title": "超级 App 诞生记(三)", "detail": "新旧包差分后，服务端按用户版本下发补丁，客户端结合旧包合成新包，并检查旧包、补丁和结果完整性。省流量以保留正确基线和生成多版本补丁为代价；哈希相符与发布者可信是不同问题，差分更新也仍可能需要正常安装步骤。", "anchors": ["PDF p. 132–133"], "pdf_start": 132, "pdf_end": 133, "voice": "editor", "related_concepts": ["hot-update", "hash", "release"], "excerpts": []}, {"id": "article-134", "title": "谷歌的「黑科技」：Instant App", "detail": "Instant App设想按链接加载独立功能，减少下载安装漏斗；代码模块化与体积控制成为前提。文章比较轻应用形态与原生能力。版本覆盖、大小限制与生态前景均是当时预告，不能把预测当成今天仍可直接采用的方案。", "anchors": ["PDF p. 134–135"], "pdf_start": 134, "pdf_end": 135, "voice": "editor", "related_concepts": ["hot-update", "platform", "requirements"], "excerpts": []}, {"id": "article-136", "title": "关于点 9 图，知其然还要知其所以然", "detail": "点9图用边缘标记定义可拉伸区和内容区，编译时把标记转换为图片内的元信息，运行时保留边框等不宜拉伸部分。聊天气泡例子说明素材规则如何减少逐尺寸出图；错误标记仍会失真，资源制作和构建处理需共同验证。", "anchors": ["PDF p. 136–139"], "pdf_start": 136, "pdf_end": 139, "voice": "editor", "related_concepts": ["media", "rendering", "platform"], "excerpts": []}, {"id": "article-140", "title": "国际化你的应用", "detail": "国际化把界面文字从代码抽成按键读取的资源，再按语言选择；翻译之后仍需检查长文本撑破布局和图片内嵌文字。原文对I18n数字的解释有误，不能照抄；本文重点是内容与展示分离、资源配置及逐语言验证，而非翻译完就算适配完成。", "anchors": ["PDF p. 140–141"], "pdf_start": 140, "pdf_end": 141, "voice": "editor", "related_concepts": ["configuration", "platform", "view-tree"], "excerpts": []}, {"id": "article-142", "title": "Android 系统的 65536", "detail": "DEX相关方法引用限制推动多DEX拆分，但旧运行环境中的额外加载与优化又可能影响首次启动。文章说明扩容方案会把成本转移到其他阶段。正文将限制归于odex的说法较简化；产品应关注构建、安装和首启链路，不能只看能否打包成功。", "anchors": ["PDF p. 142–143"], "pdf_start": 142, "pdf_end": 143, "voice": "editor", "related_concepts": ["build", "platform", "performance"], "excerpts": []}, {"id": "article-144", "title": "聊聊 Android 的系统权限", "detail": "文章按旧Android权限及百款应用样本介绍存储、身份、位置、唤醒、通讯录等能力，讨论从安装一揽子接受到运行时选择的变化。权限名不是业务必要性的证明；样本比例不能当作行业普查，申请了也不等于实际使用或合理使用。", "anchors": ["PDF p. 144–146"], "pdf_start": 144, "pdf_end": 146, "voice": "editor", "related_concepts": ["privacy", "platform"], "excerpts": []}, {"id": "article-147", "title": "聊聊客户端的增量更新", "detail": "把主体做成模块加载器、把可变功能拆开，有机会独立替换模块，减少整包更新依赖；后期才要求动态化可能需要重构。标题虽称增量更新，正文重点是模块动态更新，应与新旧安装包差分分开。模块兼容、可信来源与回退仍需设计。", "anchors": ["PDF p. 147–148"], "pdf_start": 147, "pdf_end": 148, "voice": "editor", "related_concepts": ["hot-update", "architecture"], "excerpts": []}, {"id": "article-149", "title": "没推送功能，你好意思叫 App 嘛?", "detail": "轮询反复询问，推送通过已有通道或平台服务传递更新通知；心跳、进程存活与系统调度决定到达及成本。统一通道可合并多应用开销。文中具体GCM/APNs和后台限制是旧语境，推送不等于必达，也不能以此忽视通知授权和打扰。", "anchors": ["PDF p. 149–151"], "pdf_start": 149, "pdf_end": 151, "voice": "editor", "related_concepts": ["connection", "performance"], "excerpts": []}, {"id": "article-152", "title": "你整天用，却并不了解的 adb", "detail": "adb以电脑端客户端、服务端和设备守护进程转发调试指令，可安装、传文件、查日志和状态。它让问题调查从猜测转向观察。端口和权限描述是书中环境的示例，不是所有连接方式；调试能力只应用于有权管理的设备。", "anchors": ["PDF p. 152–154"], "pdf_start": 152, "pdf_end": 154, "voice": "editor", "related_concepts": ["observability", "collaboration", "interface"], "excerpts": []}, {"id": "article-155", "title": "朋友圈中的图片缓存系统", "detail": "内存、磁盘和网络形成多级图片获取路径，容量上限与淘汰策略决定是否命中。通讯录快速查找可暂缓头像解码，新闻慢读则可能选择不同策略，说明优化要服务关键任务。文章是体验反推的示意，不等于已核验微信内部缓存实现。", "anchors": ["PDF p. 155–156"], "pdf_start": 155, "pdf_end": 156, "voice": "editor", "related_concepts": ["cache", "tradeoff", "rendering"], "excerpts": []}, {"id": "article-157", "title": "庖丁解牛：安卓平台三方市场的自动安装功能", "detail": "自动安装被区分为高权限执行与辅助功能模拟操作，两条路径依赖不同授权和系统支持。辅助功能还面临不同界面、按钮和ROM适配。便捷不能省略用户知情与可控，历史实现细节不应当作绕开安装确认的推荐方案。", "anchors": ["PDF p. 157–158"], "pdf_start": 157, "pdf_end": 158, "voice": "editor", "related_concepts": ["privacy", "automation", "platform"], "excerpts": []}, {"id": "article-159", "title": "庖丁解牛：Android Accessibility", "detail": "辅助服务读取获准界面结构与事件，再对可操作控件触发动作；读屏与辅助操作体现原有目的。文章也讨论自动安装和红包等挪用，提示此类能力触及敏感信息及操作权。分析保留机制和边界，不复现针对他人应用的自动化流程。", "anchors": ["PDF p. 159–161"], "pdf_start": 159, "pdf_end": 161, "voice": "editor", "related_concepts": ["privacy", "view-tree"], "excerpts": []}, {"id": "article-162", "title": "庖丁解牛：网易新闻客户端的 UI 结构", "detail": "从布局边界观察新闻客户端，解释父子控件、ScrollView和列表。长列表复用滑出屏幕的视图并绑定新数据，避免内容越长对象越多。结构复用不等于无需刷新状态，界面观察也不能完全证明底层具体实现。", "anchors": ["PDF p. 162–164"], "pdf_start": 162, "pdf_end": 164, "voice": "editor", "related_concepts": ["view-tree", "reuse", "performance"], "excerpts": []}, {"id": "article-165", "title": "庖丁解牛：别人的 Hybrid App", "detail": "原生界面与WebView混合，前者在示例中承担高频复杂交互，后者方便动态内容和多端复用。布局边界是作者用于推测结构的工具，不是绝对判据；选择应比较目标体验、设备能力、发布节奏与维护成本，而非认为某种技术永远更快。", "anchors": ["PDF p. 165–167"], "pdf_start": 165, "pdf_end": 167, "voice": "editor", "related_concepts": ["hybrid", "tradeoff", "release"], "excerpts": []}, {"id": "article-168", "title": "庖丁解牛：缓存的使用", "detail": "先异步读取本地缓存出首屏，再获取网络新数据并回填，可以减少等待、弱网空白和重复流量。旧内容与最新内容的先后呈现需让用户理解，失败也应可处理。案例中的刷新间隔是观察值，不能变成所有应用统一缓存期限。", "anchors": ["PDF p. 168–168"], "pdf_start": 168, "pdf_end": 168, "voice": "editor", "related_concepts": ["cache", "async", "performance"], "excerpts": []}, {"id": "article-169", "title": "庖丁解牛：来比比谁家的 app 更卡", "detail": "以每帧耗时图和过度绘制颜色观察流畅性，解释看不见的背景仍可能消耗绘图资源。60fps约对应16.7毫秒预算，是具体目标下的示意。柱状图与颜色提供线索，不足以直接给应用质量排名；应在同设备、场景与负载下比较。", "anchors": ["PDF p. 169–172"], "pdf_start": 169, "pdf_end": 172, "voice": "editor", "related_concepts": ["rendering", "observability"], "excerpts": []}, {"id": "article-173", "title": "如何抱上微信的大腿？——说说授权登录的那些事儿", "detail": "OAuth类授权用临时码换访问和刷新凭据，使第三方在不取得用户密码的情况下按授权访问资源。令牌类比解释时效与续期，但登录身份、授权范围和凭据保管仍需区分。书中有效期和好友数据范围是旧平台示例，不能照搬为当前接口合同。", "anchors": ["PDF p. 173–174"], "pdf_start": 173, "pdf_end": 174, "voice": "editor", "related_concepts": ["identity", "token"], "excerpts": []}, {"id": "article-175", "title": "如何获取安卓用户的 app 使用频率", "detail": "作者在不能直接读取系统统计时，用最近或运行任务列表的变化估计使用频率，比较采样频率、误差与功耗。它揭示观察代理指标不等于真实行为次数，也触及跨应用隐私。历史API可用性及单次测试结论不构成采集其他应用行为的通用授权。", "anchors": ["PDF p. 175–176"], "pdf_start": 175, "pdf_end": 176, "voice": "editor", "related_concepts": ["metrics", "privacy", "performance"], "excerpts": []}, {"id": "article-177", "title": "如何适配 Android 手机屏幕", "detail": "用物理像素、密度档位、dp和资源目录解释屏幕适配，再比较多套切图与统一基准缩放的包体、清晰度和内存成本。PDF179页dp公式与后文算例方向矛盾，xxxhdpi图片倍数也不一致，已单列校核；不能照抄错误公式或把分辨率直接等同于密度档。", "anchors": ["PDF p. 177–180"], "pdf_start": 177, "pdf_end": 180, "voice": "editor", "related_concepts": ["platform", "display", "configuration"], "excerpts": []}, {"id": "article-181", "title": "如何适配 iOS 屏幕", "detail": "先重述Android按密度换算的目的，再以iOS point、倍率资源和自动布局说明逻辑尺寸与实际像素的分离。iPhone6 Plus例子还包含渲染后缩放，不能把倍率等同于面板像素。本文继续出现前篇公式问题，末段算例亦需复核，旧机型适配方法不作现行规范。", "anchors": ["PDF p. 181–183"], "pdf_start": 181, "pdf_end": 183, "voice": "editor", "related_concepts": ["platform", "display", "configuration"], "excerpts": []}, {"id": "article-184", "title": "如何用安卓手机实现计步？", "detail": "有专用计步能力时读取累计值并维护每日数据；没有时分析加速度波形，处理姿态、噪声、滤波和动态阈值。两条路径的开发量、功耗与覆盖不同。重启、跨日和误计也属于产品口径，不能因接口返回了数字就直接当作当天真实步数。", "anchors": ["PDF p. 184–185"], "pdf_start": 184, "pdf_end": 185, "voice": "editor", "related_concepts": ["sensor", "metrics", "performance"], "excerpts": []}, {"id": "article-186", "title": "为什么有些应用删不掉？", "detail": "应用是否可卸载与系统预置、存放位置及权限有关，并非所有“系统应用”都天然不可替换。文章还讨论安装、运行代码与数据目录的差异及残留。目录与删除逻辑是旧实现示意；本页不建议修改系统文件，更不将可删除误读为删除后必然不受影响。", "anchors": ["PDF p. 186–186"], "pdf_start": 186, "pdf_end": 186, "voice": "editor", "related_concepts": ["privacy", "storage", "platform"], "excerpts": []}, {"id": "article-187", "title": "手机 app 开发中，关于图片资源不得不知的秘密", "detail": "图片像素与目标显示区域不匹配时需要缩放，插值能调整呈现却不能无条件恢复丢失细节；多密度资源可减少缩放。设计交付应同时明确尺寸、比例、密度和可裁切范围，不能仅把一张大图缩遍所有设备并保证视觉完全一致。", "anchors": ["PDF p. 187–188"], "pdf_start": 187, "pdf_end": 188, "voice": "editor", "related_concepts": ["media", "platform", "rendering"], "excerpts": []}, {"id": "article-189", "title": "为什么程序会「卡」？", "detail": "VSYNC协调CPU准备、GPU渲染与画面上屏，若未在下一时点准备好，就继续显示旧帧，产生停顿。工具中的帧耗时提供观察线索。60Hz模型帮助理解预算，并不意味着所有刷新率都用同一16毫秒标准，也不能据一次超时直接归因某段代码。", "anchors": ["PDF p. 189–190"], "pdf_start": 189, "pdf_end": 190, "voice": "editor", "related_concepts": ["rendering", "performance"], "excerpts": []}, {"id": "article-191", "title": "双重缓冲和三重缓冲", "detail": "双缓冲交替显示与绘制，避免部分新旧画面混杂；额外缓冲可在部分等待场景让CPU继续准备下一帧。书中25%提升来自特定图示，不是三缓冲统一收益。缓冲改善流水线利用，仍有内存与延迟代价，不能使无限慢的绘制自动达标。", "anchors": ["PDF p. 191–192"], "pdf_start": 191, "pdf_end": 192, "voice": "editor", "related_concepts": ["rendering", "concurrency", "tradeoff"], "excerpts": []}, {"id": "article-193", "title": "说说增量升级", "detail": "省流更新按基线版本与文件校验选择差分，终端合成并校验完整安装包后安装；动态更新替换运行模块，通常不走相同整包安装路径。这篇澄清了前文标题混用，需把网络节省、安装步骤和代码生效时机分别写进需求。", "anchors": ["PDF p. 193–193"], "pdf_start": 193, "pdf_end": 193, "voice": "editor", "related_concepts": ["hot-update", "crypto"], "excerpts": []}, {"id": "article-194", "title": "听歌识曲是怎么回事儿", "detail": "音频先标准化并转频谱，从稳定特征点提取多个乐纹，建立检索关系；录音按同样方式处理，再比较匹配顺序与时间间隔。关键是设计对噪声和截取片段有用的特征，而非逐字节比文件。它是示意方案，不等于所有识曲系统的完整算法。", "anchors": ["PDF p. 194–196"], "pdf_start": 194, "pdf_end": 196, "voice": "editor", "related_concepts": ["search", "media", "hash"], "excerpts": []}, {"id": "article-197", "title": "听说除夕跟红包助手更配哦", "detail": "View树让系统按控件描述辅助读屏与动作，红包助手挪用这条能力减少人工操作。文章同时提醒通知和验证码暴露风险。应理解授权后可见信息与可执行动作的广度，不把没有Root当成安全保证，也不复现其自动抢取流程。", "anchors": ["PDF p. 197–198"], "pdf_start": 197, "pdf_end": 198, "voice": "editor", "related_concepts": ["privacy", "view-tree", "security"], "excerpts": []}, {"id": "article-199", "title": "微信出品——Tinker 热更新方案", "detail": "Tinker通过理解DEX结构生成差分并合成可加载代码，比较旧方案在包体、兼容与性能上的折中。文中成功率含“据说”，不可作为定量评估。产品侧要问支持何种变化、生效时机、覆盖设备及失败回退，不能以“更完善”代替实际验证。", "anchors": ["PDF p. 199–201"], "pdf_start": 199, "pdf_end": 201, "voice": "editor", "related_concepts": ["hot-update", "platform"], "excerpts": []}, {"id": "article-202", "title": "为啥我的 Android 手机抢不到红包", "detail": "作者把抢红包的体感速度联系运行环境、系统响应和设备碎片化。但文中将iOS/Android架构层次直接解释为调度优先级，论据不足；“Java必然慢一拍”也不能推出胜负。此篇作为技术解释需要证据的反例，实际延迟应拆解触摸、界面、网络和服务端。", "anchors": ["PDF p. 202–202"], "pdf_start": 202, "pdf_end": 202, "voice": "editor", "related_concepts": ["performance", "platform", "observability"], "excerpts": []}, {"id": "article-203", "title": "为什么美颜 App 可以美颜？", "detail": "灰度、模糊、保边滤波及区域识别共同形成美颜效果，视频还需逐帧处理与算力预算。模糊皮肤时保留五官边界解释了算法组合的重要性。文中将双边滤波简称为高斯变种、断言CPU绝对不行较粗略，应按分辨率、帧率与效果验证。", "anchors": ["PDF p. 203–204"], "pdf_start": 203, "pdf_end": 204, "voice": "editor", "related_concepts": ["media", "gpu", "compression"], "excerpts": []}, {"id": "article-205", "title": "为什么我们总感觉安卓手机的电池不够用", "detail": "从容量与体积进入后台任务、唤醒、统一调度和省电策略，说明续航是硬件与系统、应用共同结果。作者最终按预算选择也提示多指标取舍。具体品牌和Doze默认状态的断言属旧文、且未充分举证，不将其当成当前系统对比结论。", "anchors": ["PDF p. 205–206"], "pdf_start": 205, "pdf_end": 206, "voice": "editor", "related_concepts": ["performance", "lifecycle", "tradeoff"], "excerpts": []}, {"id": "article-207", "title": "我们来调下界面吧", "detail": "反复调界面可能改变嵌套布局与关系，约束布局把位置、对齐和关联显式表达，使设计与开发更容易共享对象。可视化工具减少部分手工代码，并不意味着复杂交互、状态与适配会自动正确；仍需在实际设备检查。", "anchors": ["PDF p. 207–208"], "pdf_start": 207, "pdf_end": 208, "voice": "editor", "related_concepts": ["view-tree", "collaboration", "architecture"], "excerpts": []}, {"id": "article-209", "title": "应用市场是如何提示更新的", "detail": "安卓更新检查以包标识定位应用，再用机器可比较的版本号判断候选版本，展示名用于用户理解。客户端上报、服务器匹配、返回更新共同形成链路。原文对iOS“没有版本号”的概括不宜照录，也不能只凭同包名就认定升级包可信。", "anchors": ["PDF p. 209–211"], "pdf_start": 209, "pdf_end": 211, "voice": "editor", "related_concepts": ["release", "configuration", "identity"], "excerpts": []}, {"id": "article-212", "title": "应用的生命周期是什么", "detail": "创建、前台、暂停、不可见与销毁等节点由宿主通知，加载或释放资源放错时点会卡住出现和退出。要区分界面生命周期与整个应用、进程或产品生命周期，并处理返回和重建；书中用Activity代表应用是简化，不能保证销毁回调总会执行。", "anchors": ["PDF p. 212–214"], "pdf_start": 212, "pdf_end": 214, "voice": "editor", "related_concepts": ["lifecycle", "async", "state-machine"], "excerpts": []}, {"id": "article-215", "title": "应用之间是怎样交互的", "detail": "应用通过系统登记能力，利用Scheme和参数发起调用，并约定回调，登录与分享便能跨应用完成。相同Scheme竞争和回调参数也可能引发误路由或伪装。声明某协议不是身份认证，处理方应验证来源、参数与预期流程。", "anchors": ["PDF p. 215–216"], "pdf_start": 215, "pdf_end": 216, "voice": "editor", "related_concepts": ["url", "interface", "security"], "excerpts": []}, {"id": "article-217", "title": "如何优化客户端性能（一）", "detail": "启动资源分为必须、可延后和按需，优先缩小可操作前的工作；再用布局树和绘制工具寻找过深层级及无效背景。性能需求应定义到可操作，而不是闪屏出现。删层级或延后加载仍需检查业务完整性与后续峰值。", "anchors": ["PDF p. 217–218"], "pdf_start": 217, "pdf_end": 218, "voice": "editor", "related_concepts": ["performance", "async", "view-tree"], "excerpts": []}, {"id": "article-219", "title": "如何优化客户端性能（二）", "detail": "用堆占用和场景判断不该存活的对象，再用网络观察查后台请求的必要性与频率，合并请求减少重复开销。用久变慢只是泄漏线索，不是诊断结论；“同包头合并”的说法是简化，实际需按协议和业务设计批量传输。", "anchors": ["PDF p. 219–220"], "pdf_start": 219, "pdf_end": 220, "voice": "editor", "related_concepts": ["memory", "metrics", "performance"], "excerpts": []}, {"id": "article-221", "title": "做个按钮容易吗之按钮的「状态」", "detail": "按钮不只正常与按下，还可能禁用、聚焦、选中和悬停，每种状态需合理反馈及转换。作者把各种控件都抽象成按钮有教学意味，却不能抹去输入、文本和操作控件的语义区别。完整状态与可操作性应一起设计。", "anchors": ["PDF p. 221–221"], "pdf_start": 221, "pdf_end": 221, "voice": "editor", "related_concepts": ["state-machine", "privacy", "view-tree"], "excerpts": []}], "takeaways": ["这一专题共有54篇。逐篇保留原题和顺序；点击概念可继续追问机制、条件与边界。", "具体算法、平台与内部实现的限制放在相应条目中，概念层提供跨专题连接。"], "related_concepts": ["platform", "lifecycle", "identity", "hot-update", "rendering"], "anchors": ["PDF p. 101–221"], "confidence": "源文释义与编者综合；历史主张未作外部核实"}, {"id": "ch-05", "title": "计算机网络 · 46篇", "part": "专题05", "question": "一次请求如何经过地址、连接、传输和中转，为什么“有网”仍会失败？", "role": "把前后端之间的黑箱打开，让网络问题可以逐层追问。", "mainline": "作者从物理信号和地址讲到域名、路由、端口、连接及应用协议，再引入代理、NAT、负载均衡和CDN等中间层。域名解析解决去哪里，连接及传输机制处理数据怎样交付，HTTP等约定再表达业务请求；加密和身份验证则回答谁能看、与谁连接。弱网并非只缺带宽，往返时延、丢包、连接建立、服务端处理与缓存都影响等待。P2P、断点续传等案例说明可以换路径或减少重复工作，但每一种策略都有状态与一致性代价。部分文章介绍早期协议方案，不能把当时实现细节视为当前通用标准。", "argument_flow": ["识别地址与解析", "建立连接与传输", "组织应用请求", "通过中转扩展", "保护通信身份", "按证据定位瓶颈"], "sections": [{"id": "article-222", "title": "网络基础之协议栈", "detail": "应用、传输、寻址、链路和物理传送分层，使每层可在约定接口下演进，设备也能只处理所需层次。数据逐层封装再还原是主线。开头量子传送比喻并非物理学事实，不能据此学习量子通信；网络四层、五层是模型口径差异。", "anchors": ["PDF p. 222–224"], "pdf_start": 222, "pdf_end": 224, "voice": "editor", "related_concepts": ["network", "interface", "architecture"], "excerpts": []}, {"id": "article-225", "title": "互联网上一切皆下载", "detail": "网页、音视频和安装包都需获取数据，区别在接收后渲染、解码或保存；“流”把连续读取抽象成统一接口。标题“一切皆下载”用于解释共同链路，并非否认上传、双向通信、本地计算或服务端执行，不宜当成互联网的完整定义。", "anchors": ["PDF p. 225–225"], "pdf_start": 225, "pdf_end": 225, "voice": "editor", "related_concepts": ["pipeline", "performance", "network"], "excerpts": []}, {"id": "article-226", "title": "Docker 简介", "detail": "集装箱类比说明封装依赖、重复部署与应用隔离的价值，减少“换台机器就不运行”。但容器并不是完整虚拟机，隔离也非绝对，文章“完全不影响、无视配置”过度简化。迁移仍应检查宿主、资源、网络和数据依赖。", "anchors": ["PDF p. 226–227"], "pdf_start": 226, "pdf_end": 227, "voice": "editor", "related_concepts": ["os", "platform", "architecture"], "excerpts": []}, {"id": "article-228", "title": "Google 带来的互联网加速器", "detail": "早期QUIC尝试在UDP之上提供连接复用、恢复和网络切换能力，减少握手及等待成本。它说明传输层不提供的机制可以由上层设计补齐。文中向前纠错、命名及浏览器开关属于早期方案，不等同于后来标准或当前配置。", "anchors": ["PDF p. 228–229"], "pdf_start": 228, "pdf_end": 229, "voice": "editor", "related_concepts": ["network", "connection", "performance"], "excerpts": []}, {"id": "article-230", "title": "IP 地址枯竭的后悔药：网络地址转换（NAT）", "detail": "私网地址与外部看到的地址不同，NAT通过映射改写地址和端口，再把响应送回内部设备。静态、动态与端口复用有不同资源需求。它解决寻址与共享问题，不自动等同防火墙或身份认证，也不能据公网IP唯一识别人。", "anchors": ["PDF p. 230–231"], "pdf_start": 230, "pdf_end": 231, "voice": "editor", "related_concepts": ["proxy", "connection", "identity"], "excerpts": []}, {"id": "article-232", "title": "P2P 终结者的原理", "detail": "以ARP映射被伪造解释局域网流量可被错误引向中间设备，限速软件只是一个表象。应带走共享网络存在信任与完整性风险，而非照做流量劫持。文章提出的双向绑定有场景限制，不能当作覆盖所有局域网攻击的充分防护。", "anchors": ["PDF p. 232–232"], "pdf_start": 232, "pdf_end": 232, "voice": "editor", "related_concepts": ["security", "network"], "excerpts": []}, {"id": "article-233", "title": "Ping 和网关", "detail": "Ping和本机配置工具观察连通性、往返耗时、网关与回环地址，帮助区分本地和外部问题。网关是网络之间的转发角色，具体家庭拓扑只是例子。Ping不通不必然服务不可用，Ping通也不证明网页、认证或业务接口都正常。", "anchors": ["PDF p. 233–235"], "pdf_start": 233, "pdf_end": 235, "voice": "editor", "related_concepts": ["observability", "network", "performance"], "excerpts": []}, {"id": "article-236", "title": "Session 是用来干啥的", "detail": "HTTP请求本身不保存前后业务状态，服务端会话配合客户端携带的标识关联购物车等操作。Cookie只是常用载体，清除后可能失去原会话关联，并不必然删除服务器数据；把会话ID放URL也会扩大暴露面，不能照搬成推荐登录设计。", "anchors": ["PDF p. 236–237"], "pdf_start": 236, "pdf_end": 237, "voice": "editor", "related_concepts": ["token", "identity"], "excerpts": []}, {"id": "article-238", "title": "端口二三话", "detail": "物理接口连接硬件，网络端口标识传输端点，使同一网卡上的数据能交给对应程序。接收与业务处理分开能缓和阻塞，但把任务转交其他线程并不能无限消化流量；还要限制队列、并发和资源。文中的“虚拟端口”是通俗叫法。", "anchors": ["PDF p. 238–238"], "pdf_start": 238, "pdf_end": 238, "voice": "editor", "related_concepts": ["connection", "concurrency", "network"], "excerpts": []}, {"id": "article-239", "title": "不得不知的 TCP 和 UDP", "detail": "电话与短信类比分别解释TCP的连接、确认、有序性和UDP的数据报发送，再指出上层可补充校验与可靠机制。可靠不是永不失败，UDP也不是任何场景都快；选择需看时效、损失容忍、负载和应用协议，而非只凭两个标签。", "anchors": ["PDF p. 239–240"], "pdf_start": 239, "pdf_end": 240, "voice": "editor", "related_concepts": ["tcp-udp", "network", "tradeoff"], "excerpts": []}, {"id": "article-241", "title": "TCP 凭什么说自己可靠？", "detail": "顺序标识、确认和重传协同提供可靠字节传送，无法送达时也应反馈失败，而不是承诺物理网络永不出错。快递类比有助于分清可靠机制与绝对成功；正文把字节序号和数据包编号、定时器处理简化，不能据其直接实现TCP。", "anchors": ["PDF p. 241–242"], "pdf_start": 241, "pdf_end": 242, "voice": "editor", "related_concepts": ["tcp-udp", "connection", "performance"], "excerpts": []}, {"id": "article-243", "title": "HTTP/2 新一代网络协议", "detail": "HTTP/2用复用、二进制帧与头部压缩减少部分开销，并介绍当时的服务器推送。文中将HTTP/1.1概括为每次必须重建连接，与后文Keep-Alive相矛盾；旧HTTP也能传二进制内容，区别不能简化为文本和二进制文件的分界。", "anchors": ["PDF p. 243–244"], "pdf_start": 243, "pdf_end": 244, "voice": "editor", "related_concepts": ["http", "connection", "compression"], "excerpts": []}, {"id": "article-245", "title": "到底有多不靠谱？——再谈 UDP 协议", "detail": "某组跨地区UDP试验接收率较高，说明不保证可靠不等于实际总在丢包；应用仍可能需要顺序、丢失与时效处理。七小时、少数节点的观察不能证明所有网络接近百分之百，也不能用好网络的结果替代弱网验证。", "anchors": ["PDF p. 245–246"], "pdf_start": 245, "pdf_end": 246, "voice": "editor", "related_concepts": ["tcp-udp", "performance", "metrics"], "excerpts": []}, {"id": "article-247", "title": "常见的邮件协议", "detail": "POP偏向下载邮件，IMAP协调服务端邮件与状态，SMTP负责提交和转送，Exchange类同步还涉及日程等对象。选择关系到离线、多设备一致与删除语义。正文把POP下载后删除说得过于一概，实际行为需看协议交互和客户端配置。", "anchors": ["PDF p. 247–248"], "pdf_start": 247, "pdf_end": 248, "voice": "editor", "related_concepts": ["network", "pipeline", "lifecycle"], "excerpts": []}, {"id": "article-249", "title": "程序员别唬我系列之：反向代理", "detail": "反向代理统一接受客户端请求，将流量分发到后端，也可缓存资源、处理传输安全与访问控制。它代表服务集群，区别于代表客户端访问外部的代理。隐藏地址不等于整体安全；代理到后端的链路和代理自身的可用性仍要评估。", "anchors": ["PDF p. 249–250"], "pdf_start": 249, "pdf_end": 250, "voice": "editor", "related_concepts": ["proxy", "distributed", "cache"], "excerpts": []}, {"id": "article-251", "title": "程序员常说的 CDN 是什么？", "detail": "CDN把资源部署到多个节点，并通过调度让用户接入合适位置，减少中心服务压力和远距离访问。连锁门店类比拆开内容、分发与网络。就近不一定仅按地理距离，也要看负载与网络；分发更新和缓存一致性会影响看到哪个版本。", "anchors": ["PDF p. 251–252"], "pdf_start": 251, "pdf_end": 252, "voice": "editor", "related_concepts": ["cdn", "dns", "cache"], "excerpts": []}, {"id": "article-253", "title": "Push 数据包历险记（一）", "detail": "推送消息先由运营策略与事件生成，再进入已建立通道；心跳用于检测存活并维持某些中间网络状态。正文把NAT映射超时简单说成IP重置，需区别。消息生成、连接有效、终端收到与用户看到是不同指标，不能只统计发送成功。", "anchors": ["PDF p. 253–253"], "pdf_start": 253, "pdf_end": 253, "voice": "editor", "related_concepts": ["connection", "proxy"], "excerpts": []}, {"id": "article-254", "title": "Push 数据包历险记（二）——路由之路", "detail": "用数据包旅行解释路由器按目标网络选择下一跳，以及局域链路借助地址解析交付。文章把ARP获取下一跳MAC和创建路由表混在一起，不能照抄；确认到达也不等于消息已被业务处理或用户阅读。", "anchors": ["PDF p. 254–254"], "pdf_start": 254, "pdf_end": 254, "voice": "editor", "related_concepts": ["network", "dns", "performance"], "excerpts": []}, {"id": "article-255", "title": "断点续传的奥义", "detail": "Range请求部分内容，服务端用对应响应范围说明片段位置，支持在已有数据后继续及分段传输。需要服务端支持、文件未变化和正确合并。文中四线程只需四分之一时间的推论忽略共享瓶颈，实际加速不是线程数的倒数。", "anchors": ["PDF p. 255–256"], "pdf_start": 255, "pdf_end": 256, "voice": "editor", "related_concepts": ["connection", "http", "concurrency"], "excerpts": []}, {"id": "article-257", "title": "关于「长连接」你不得不知", "detail": "连接复用减少反复建立开销，长期通道也支持推送；心跳、并发数、带宽和失效检测共同影响成本与实时性。连接存在不是业务状态永久有效，HTTP Keep-Alive也不等于任意主动推送，需分清连接层与应用协议。", "anchors": ["PDF p. 257–258"], "pdf_start": 257, "pdf_end": 258, "voice": "editor", "related_concepts": ["connection", "tradeoff"], "excerpts": []}, {"id": "article-259", "title": "关于免费电话", "detail": "网络语音经历采集、采样、压缩、传输和播放，在音质、流量与时效之间取舍；连接传统电话还需网关与运营资源。免费指用户计费方式，并不消除系统成本。原文对传统网络和信号转换作简化，不能据此保证所有号码都可低成本接通。", "anchors": ["PDF p. 259–260"], "pdf_start": 259, "pdf_end": 260, "voice": "editor", "related_concepts": ["media", "performance", "tradeoff"], "excerpts": []}, {"id": "article-261", "title": "红包抢的好，钱包也要捂紧了——HTTPS 技术", "detail": "HTTPS在HTTP传输外提供加密、完整性与服务器身份验证，握手建立后使用会话密钥。正文只介绍一种简化交换过程，公钥本身不能单独证明身份，“私钥加密”等说法也易混淆签名。安全取决于验证链路，不能因地址多一个s便无条件信任内容。", "anchors": ["PDF p. 261–263"], "pdf_start": 261, "pdf_end": 263, "voice": "editor", "related_concepts": ["crypto", "identity", "security"], "excerpts": []}, {"id": "article-264", "title": "讲讲代理服务器", "detail": "代理代表请求方访问目标，可缓存、转码或压缩，从而改变路径和成本；它也会成为新的信任点。源站看见代理地址不代表用户完全匿名，转码还可能改变内容和体验。文章中“查不到使用者”的保证不成立，需保留边界。", "anchors": ["PDF p. 264–265"], "pdf_start": 264, "pdf_end": 265, "voice": "editor", "related_concepts": ["proxy", "compression", "privacy"], "excerpts": []}, {"id": "article-266", "title": "聊聊 Wi-Fi 技术", "detail": "Wi-Fi相关标准与互通解决设备发现、接入和链路通信，文章区分主动探测与被动广播。认证不是获得互联网访问的全部过程；Wi-Fi、802.11及频段也不是同一个概念。文中的“5G网络”指5GHz Wi-Fi，不能和蜂窝5G混用。", "anchors": ["PDF p. 266–267"], "pdf_start": 266, "pdf_end": 267, "voice": "editor", "related_concepts": ["network", "platform"], "excerpts": []}, {"id": "article-268", "title": "就近接入-怎样让用户找到最近的机房", "detail": "域名解析可结合网络来源和节点情况返回合适入口，多地部署还可支撑故障迁移。它把寻址变成调度入口，但来源IP不一定直接等于终端位置，解析也有缓存。地理近不保证路径最优，历史运营商比较不作当下服务结论。", "anchors": ["PDF p. 268–269"], "pdf_start": 268, "pdf_end": 269, "voice": "editor", "related_concepts": ["dns", "cdn", "performance"], "excerpts": []}, {"id": "article-270", "title": "坑，坑，坑的网络带宽", "detail": "带宽表示单位时间容量，bit与Byte不同；体验还取决于延迟、共享争用和运营路径。升级标称带宽不必然改善交互延迟。正文对个别运营商和所有高带宽套餐的概括带立场，应带走测量维度，不照录市场评价。", "anchors": ["PDF p. 270–271"], "pdf_start": 270, "pdf_end": 271, "voice": "editor", "related_concepts": ["performance", "metrics"], "excerpts": []}, {"id": "article-272", "title": "快播已倒下，P2P 不死", "detail": "P2P让节点既获取也提供片段，分摊集中资源服务的压力，活跃资源可借助更多供给改善分发。去中心化是拓扑特征，不代表不需发现、协调或治理。文中对快播案件和技术中立的评价属于作者立场，不作法律或因果结论。", "anchors": ["PDF p. 272–273"], "pdf_start": 272, "pdf_end": 273, "voice": "editor", "related_concepts": ["distributed", "performance"], "excerpts": []}, {"id": "article-274", "title": "说说后台服务的负载均衡", "detail": "从重定向、DNS分配到按状态调度的例子，说明均分请求不等于均衡负载，不同节点能力与健康也要考虑。文章用厕所类比易懂，但层次和“软件负载”叫法较松散；选择策略应看真实容量、故障与会话等约束。", "anchors": ["PDF p. 274–275"], "pdf_start": 274, "pdf_end": 275, "voice": "editor", "related_concepts": ["distributed", "metrics", "performance"], "excerpts": []}, {"id": "article-276", "title": "讲讲远程文件管理", "detail": "手机在局域网充当服务端，浏览器按IP和端口访问，手机把目录组织成页面并处理后续请求，说明端和服务器角色可以互换。相同协议能连接不同形态设备；文件访问仍需身份、范围和关闭入口设计，不能因同一局域网就假设可信。", "anchors": ["PDF p. 276–277"], "pdf_start": 276, "pdf_end": 277, "voice": "editor", "related_concepts": ["connection", "network", "architecture"], "excerpts": []}, {"id": "article-278", "title": "那些年我们翻过的墙", "detail": "以代理、加密和协议识别的演进说明：路由可达、内容保密与流量特征可见是不同层次。文中对特定工具永远难以识别的描述有时效与过度保证。本页保留网络边界的认识，不生成规避组织访问控制的实施步骤。", "anchors": ["PDF p. 278–279"], "pdf_start": 278, "pdf_end": 279, "voice": "editor", "related_concepts": ["proxy", "network", "privacy"], "excerpts": []}, {"id": "article-280", "title": "你大学学过的 socket，还记得是什么东西吗?", "detail": "Socket把网络能力暴露为程序接口，可用于不同主机或同机进程通信；协议规定规则，接口提供调用方式。文中“Socket天然长连接、HTTP只能短连接”与其他文章矛盾，需区分API、传输协议和应用层连接使用方式。", "anchors": ["PDF p. 280–281"], "pdf_start": 280, "pdf_end": 281, "voice": "editor", "related_concepts": ["connection", "interface"], "excerpts": []}, {"id": "article-282", "title": "你的包裹到了——说说网络数据传输", "detail": "快递包装与中转类比说明物理传送、链路、寻址和端到端差错处理如何配合，发送端封装、接收端还原。类比用于理解层次，不能把每层固定映射成某一家物流部门，也不能认为所有传输都自动重传。", "anchors": ["PDF p. 282–283"], "pdf_start": 282, "pdf_end": 283, "voice": "editor", "related_concepts": ["network", "pipeline", "performance"], "excerpts": []}, {"id": "article-284", "title": "你有空吗？跟我一起搭个服务器好不好?", "detail": "以本机运行Web服务、回环访问和静态文件演示服务器是一个服务角色，再扩展接入、业务与存储分工。教程版本与性能比较是历史材料，不自动照做安装。静态页面也能包含客户端交互，回环请求也不需真的绕外部网卡一圈。", "anchors": ["PDF p. 284–286"], "pdf_start": 284, "pdf_end": 286, "voice": "editor", "related_concepts": ["architecture", "observability", "release"], "excerpts": []}, {"id": "article-287", "title": "如何成功地访问一个网站", "detail": "访问网站先解析域名，再建立网络连接、处理请求并返回内容，任一环节异常都可表现为打不开。DNS、路由、HTTP状态和内容完整性提供不同线索。4xx不全是页面不存在，5xx也需具体查；正文随手给的比例不是统计证据。", "anchors": ["PDF p. 287–289"], "pdf_start": 287, "pdf_end": 289, "voice": "editor", "related_concepts": ["dns", "http", "observability"], "excerpts": []}, {"id": "article-290", "title": "如何访问家庭服务器？", "detail": "DDNS维护变化公网地址与固定域名的关联，端口映射把外部入口转到内网服务，解决的是两类不同问题。是否具有可接入公网及上游限制是前提；暴露入口还需认证和访问控制，不能把记住域名等同于具备安全远程管理。", "anchors": ["PDF p. 290–290"], "pdf_start": 290, "pdf_end": 290, "voice": "editor", "related_concepts": ["dns", "proxy", "security"], "excerpts": []}, {"id": "article-291", "title": "什么是 HTTP 302 跳转？", "detail": "服务器通过重定向状态和Location指向新地址，浏览器再发请求；301与302分别表达不同迁移语义。它可以维护旧链接连续性，但不是只要跳过去就都兼容，登录态、请求方法、缓存及跳转链仍需核对。", "anchors": ["PDF p. 291–292"], "pdf_start": 291, "pdf_end": 292, "voice": "editor", "related_concepts": ["http", "platform", "url"], "excerpts": []}, {"id": "article-293", "title": "神奇的 Hosts 文件", "detail": "Hosts在本地配置域名和地址映射，可用于测试或固定解析结果，也可能因错误、过期映射导致访问异常。它改变寻址，不保证该节点一直最快或服务器身份可信。正文路径与项目示例不作为现行操作手册。", "anchors": ["PDF p. 293–294"], "pdf_start": 293, "pdf_end": 294, "voice": "editor", "related_concepts": ["dns", "configuration", "observability"], "excerpts": []}, {"id": "article-295", "title": "释放你的小水管—说说下载速度那些事儿", "detail": "下载受源站、链路、资源供给和协议行为共同限制；多连接可改善部分未充分利用的通道，却不能突破总瓶颈。离线下载由远端先获取再提供。固定两三线程即最佳及“绕一圈肯定快”都只是经验，需实测与资源条件。", "anchors": ["PDF p. 295–296"], "pdf_start": 295, "pdf_end": 296, "voice": "editor", "related_concepts": ["performance", "distributed", "concurrency"], "excerpts": []}, {"id": "article-297", "title": "说说下载劫持那些事儿", "detail": "下载可能在解析和请求路径上被引向不同文件，302本身是正常机制，也可被恶意滥用。调查需比较请求来源、跳转、最终内容和包身份，不能只看按钮文字。更换DNS只处理其中一种问题，传输校验和发布者验证是不同层次。", "anchors": ["PDF p. 297–299"], "pdf_start": 297, "pdf_end": 299, "voice": "editor", "related_concepts": ["dns", "http", "crypto"], "excerpts": []}, {"id": "article-300", "title": "天天连 WIFI，知道 WIFI 是怎么连上的吗？", "detail": "发现接入点、链路认证与关联，并不等于已通外网；网页认证又是后续准入环节。同名SSID可能属于多个接入点，漫游需终端与网络共同支持。隐藏名称不等于强安全，同名同密码也不能保证无缝切换或真实身份。", "anchors": ["PDF p. 300–301"], "pdf_start": 300, "pdf_end": 301, "voice": "editor", "related_concepts": ["network", "identity"], "excerpts": []}, {"id": "article-302", "title": "微信又要开源组件了，这次叫 Mars", "detail": "Mars把日志、连接、诊断和多平台差异封装为通用网络库，体现从大规模业务中抽取公共能力。原文“以后不用再担心网络问题”是夸张，采用成熟组件仍需适配、监控和失败处理，也需检查版本、许可与维护条件。", "anchors": ["PDF p. 302–302"], "pdf_start": 302, "pdf_end": 302, "voice": "editor", "related_concepts": ["reuse", "architecture", "performance"], "excerpts": []}, {"id": "article-303", "title": "我要当网管：网络命令使用技巧", "detail": "ipconfig/ifconfig看本机配置，Ping看部分连通与往返，nslookup查解析，traceroute类工具看沿途响应。要按层验证假设并记录环境。中间节点不答不等于一定是它丢弃业务，169开头也不能一概认定故障，命令输出需结合地址范围和策略。", "anchors": ["PDF p. 303–305"], "pdf_start": 303, "pdf_end": 305, "voice": "editor", "related_concepts": ["observability", "dns", "network"], "excerpts": []}, {"id": "article-306", "title": "想念 Google？先来学学 VPN 吧", "detail": "VPN在公共网络上构建逻辑专用连接，用隧道连接远程端与目标网络；它与按应用转发请求的代理在覆盖范围和接口上不同。加密、认证和可达性仍有具体条件，所有VPN也不必都有两张实体网卡，不能以“专用”保证绝对保密。", "anchors": ["PDF p. 306–307"], "pdf_start": 306, "pdf_end": 307, "voice": "editor", "related_concepts": ["proxy", "security"], "excerpts": []}, {"id": "article-308", "title": "嘘~小心后台服务「雪崩」", "detail": "突发请求超过处理能力后排队，客户端超时和重试又加大流量，服务器仍处理已失去时效的请求，形成正反馈。4秒与1000条示例是简化模型，重点是让超时、排队、重试与容量协同，而不是只增加重试次数。", "anchors": ["PDF p. 308–309"], "pdf_start": 308, "pdf_end": 309, "voice": "editor", "related_concepts": ["queue", "concurrency", "performance"], "excerpts": []}, {"id": "article-310", "title": "在程序世界里，REST 是什么意思", "detail": "REST入门通过资源URL与HTTP方法区分操作，减少按动作不断新增路径的混乱，强调统一接口。本文将其概括为CRUD风格，未覆盖全部约束；不能认为HTTP只有四个方法，也不能仅凭路径像资源就宣称设计完全符合REST。", "anchors": ["PDF p. 310–312"], "pdf_start": 310, "pdf_end": 312, "voice": "editor", "related_concepts": ["interface", "http", "architecture"], "excerpts": []}, {"id": "article-313", "title": "2.4G 和 5G 的 WiFi，哪个快？", "detail": "比较2.4GHz与5GHz的覆盖、干扰和吞吐取舍。频段影响传播与可用资源，但载波振荡次数不直接等于每秒比特数，原文电磁波速度单位也与算式不一致。应在距离、遮挡、信道、设备和负载条件下测量，而非认定5GHz始终更快。", "anchors": ["PDF p. 313–314"], "pdf_start": 313, "pdf_end": 314, "voice": "editor", "related_concepts": ["network", "performance", "tradeoff"], "excerpts": []}], "takeaways": ["这一专题共有46篇。逐篇保留原题和顺序；点击概念可继续追问机制、条件与边界。", "具体算法、平台与内部实现的限制放在相应条目中，概念层提供跨专题连接。"], "related_concepts": ["network", "dns", "connection", "http", "cdn", "security"], "anchors": ["PDF p. 222–314"], "confidence": "源文释义与编者综合；历史主张未作外部核实"}, {"id": "ch-06", "title": "前端 · 50篇", "part": "专题06", "question": "浏览器怎样把资源与数据变成可交互页面，又怎样与系统和后台协作？", "role": "承接网络进入界面，解释Web方案的灵活性及其边界。", "mainline": "HTML描述内容结构，CSS组织外观与布局，JavaScript处理行为；浏览器解析、构建结构并渲染，异步请求再让部分内容更新而不必重载整页。DOM、模板、数据绑定和组件帮助管理变化，但也让状态与依赖必须更明确。跨域、Cookie、缓存和Service Worker显示浏览器并非无条件执行任何请求，宿主接口则连接网页与原生能力。服务端渲染、单页应用和混合开发是工作位置与组织方式的不同取舍，不是绝对先进程度的排名。文中多篇小程序分析写于早期猜想阶段，页面明确保留其推测性质。", "argument_flow": ["结构样式行为分工", "解析与渲染", "请求与页面状态", "缓存和宿主能力", "组件及组织方式", "可信边界与历史预测"], "sections": [{"id": "article-315", "title": "Ajax 技术的妙用", "detail": "联想词与地图缩放没有整页重载，却发出了数据请求；脚本收到响应后修改DOM，形成局部更新。Ajax是组合使用浏览器能力，并非无需网络，名字含XML也不强制用XML。需要处理请求延迟、失败、乱序及交互中的状态，而不是只加一个loading。", "anchors": ["PDF p. 315–317"], "pdf_start": 315, "pdf_end": 317, "voice": "editor", "related_concepts": ["javascript", "dom", "async"], "excerpts": []}, {"id": "article-318", "title": "Chrome 里的冷知识", "detail": "控制台、离线反馈、主题色、站内搜索和打印等例子展示浏览器不仅是页面容器，还提供观察、配置与输出能力。具体菜单和行为有版本差异；本地修改网页只改变当前呈现，不改变服务器账目，不能把截图当真实业务证据。", "anchors": ["PDF p. 318–320"], "pdf_start": 318, "pdf_end": 320, "voice": "editor", "related_concepts": ["observability", "javascript", "configuration"], "excerpts": []}, {"id": "article-321", "title": "Google 版的微信小程序-PWA 简介", "detail": "PWA组合缓存、独立入口、推送和响应式界面，使Web接近应用体验。Service Worker承担部分资源与后台事件工作，安全上下文和宿主支持是前提。文章把它说成稳定常驻线程过于简单，不能保证无限后台运行或所有硬件接口可用。", "anchors": ["PDF p. 321–322"], "pdf_start": 321, "pdf_end": 322, "voice": "editor", "related_concepts": ["service-worker", "platform", "cache"], "excerpts": []}, {"id": "article-323", "title": "H5 基础知识：表单", "detail": "表单用输入控件收集信息，action、method和字段名约定提交到哪里、如何提交及如何解释。界面输入和服务端处理分工明确。HTML5不是所有表单的起点，表单也不是唯一提交数据方式；校验、反馈与敏感字段传送应在需求中明确。", "anchors": ["PDF p. 323–325"], "pdf_start": 323, "pdf_end": 325, "voice": "editor", "related_concepts": ["dom", "http", "requirements"], "excerpts": []}, {"id": "article-326", "title": "H5 应用程序缓存简介", "detail": "AppCache通过声明资源保存本地副本，先用缓存并另查更新，可能要下次加载或主动刷新才见新版本。关键是离线与更新时序的矛盾。这里分析旧技术模型，不把历史教程作为当前实现建议，也不能把缓存说成真正扩展了服务器处理能力。", "anchors": ["PDF p. 326–327"], "pdf_start": 326, "pdf_end": 327, "voice": "editor", "related_concepts": ["cache", "service-worker", "release"], "excerpts": []}, {"id": "article-328", "title": "再说 H5 应用程序缓存", "detail": "缓存清单把资源分成本地优先和网络获取，减少重复下载；配置更新又决定何时重取。文末提出可编程Service Worker作为更灵活方向。应设计资源变化、失效和动态数据的边界，不能认为加清单后所有功能都能离线。", "anchors": ["PDF p. 328–329"], "pdf_start": 328, "pdf_end": 329, "voice": "editor", "related_concepts": ["cache", "configuration", "service-worker"], "excerpts": []}, {"id": "article-330", "title": "JS DDOS 攻击的原理与防御", "detail": "第三方脚本若在传输或依赖链被替换，会借访问者浏览器发起非预期行为。文章以请求放大说明供应链信任风险，并提及完整性校验和HTTPS。分析只保留风险和防护目标，不嵌入可运行攻击代码；校验还要有可信的基准来源。", "anchors": ["PDF p. 330–331"], "pdf_start": 330, "pdf_end": 331, "voice": "editor", "related_concepts": ["security", "crypto"], "excerpts": []}, {"id": "article-332", "title": "React Native-目前最火的前端技术", "detail": "React Native用JavaScript表达跨平台应用的一部分逻辑与界面，试图兼顾复用与原生体验。文章把共享语言夸大成前端、客户端和后台岗位全部统一，并过度保证随时热更新。真实产品仍有平台差异、原生能力、发布规则和维护成本。", "anchors": ["PDF p. 332–333"], "pdf_start": 332, "pdf_end": 333, "voice": "editor", "related_concepts": ["hybrid", "reuse", "platform"], "excerpts": []}, {"id": "article-333", "title": "UA 的故事", "detail": "User-Agent字符串携带浏览器与环境声明，兼容历史使其混合多种看似矛盾的标识。它可帮助适配，但可被修改且不能证明身份或真实能力。文章用厂商故事解释历史，不宜用品牌子串武断判定功能支持。", "anchors": ["PDF p. 333–334"], "pdf_start": 333, "pdf_end": 334, "voice": "editor", "related_concepts": ["javascript", "platform", "identity"], "excerpts": []}, {"id": "article-335", "title": "关于 url 编码", "detail": "URL中的非ASCII字符和保留字符需按约定编码，重复编码或字符集不一致会使前后端解析失败。百分号序列是表示方式，不是保密手段。应区分整个URL和参数值的编码边界，避免“先全部编码一下”造成分隔符意义改变。", "anchors": ["PDF p. 335–335"], "pdf_start": 335, "pdf_end": 335, "voice": "editor", "related_concepts": ["encoding", "url", "network"], "excerpts": []}, {"id": "article-336", "title": "Web 和 Native 比，到底还差什么？", "detail": "比较网页与原生的后台能力差异，再介绍Service Worker的事件和缓存潜力及不能直接操作DOM的边界。文中“页面切走就立刻停、Worker能做任何事”都过于绝对；可迁移的是按宿主、生命周期和权限评估，而非用Web或Native二分能力。", "anchors": ["PDF p. 336–337"], "pdf_start": 336, "pdf_end": 337, "voice": "editor", "related_concepts": ["service-worker", "hybrid", "lifecycle"], "excerpts": []}, {"id": "article-338", "title": "Web 语言的浅显理解-HTML、CSS、JavaScript", "detail": "HTML表达内容结构，CSS表达样式，JavaScript处理交互和状态变化，三者协同生成页面。房屋类比帮助理解分工，却不应把布局全归HTML或把JS限制于浏览器。修改结构、表现和行为可能产生不同工作量，应按职责讨论需求。", "anchors": ["PDF p. 338–340"], "pdf_start": 338, "pdf_end": 340, "voice": "editor", "related_concepts": ["javascript", "dom", "architecture"], "excerpts": []}, {"id": "article-341", "title": "把 URL 五马分尸", "detail": "把URL拆为协议、主机、端口、路径、查询等部分，说明寻址与业务参数如何配合。路径不必对应真实磁盘文件，参数也不保证被忽略；文中将qq.com称一级域名采用了不严谨口径，域名层级需另作校核，不直接照录。", "anchors": ["PDF p. 341–342"], "pdf_start": 341, "pdf_end": 342, "voice": "editor", "related_concepts": ["url", "network", "dns"], "excerpts": []}, {"id": "article-343", "title": "产品经理的 JS 课：初出茅庐（一）", "detail": "在页面加入脚本、定义函数并重复调用，展示命名代码块如何减少重复和集中修改。入门例子重点是调用与定义的区分，不是背某种放置位置；生产代码还需考虑加载时序、作用域和输入输出，示例排布不是硬性规范。", "anchors": ["PDF p. 343–345"], "pdf_start": 343, "pdf_end": 345, "voice": "editor", "related_concepts": ["javascript", "interface", "reuse"], "excerpts": []}, {"id": "article-346", "title": "产品经理的 JS 课：初出茅庐（二）", "detail": "整数计算器把输入、运算、结果和按钮事件串起来，变量保存值，函数处理逻辑，DOM接口取写内容，回调响应点击。演示揭示界面和代码的连接点；还需补充空输入、非法值、除零和类型转换等边界才能成为可靠功能。", "anchors": ["PDF p. 346–349"], "pdf_start": 346, "pdf_end": 349, "voice": "editor", "related_concepts": ["javascript", "dom", "async"], "excerpts": []}, {"id": "article-350", "title": "产品经理需要掌握的开发技巧之：Chrome DevTools 的使用", "detail": "开发者工具可观察元素、临时调整样式、模拟尺寸、查看请求及限制网络条件，帮助产品提出带证据的问题。模拟视口并不等于完整真机测试，本地修改也不改变后台。资源可见不等于可任意下载传播，原书操作按版本环境理解。", "anchors": ["PDF p. 350–352"], "pdf_start": 350, "pdf_end": 352, "voice": "editor", "related_concepts": ["observability", "javascript", "metrics"], "excerpts": []}, {"id": "article-353", "title": "程序员别唬我系列之：自定义 URL Scheme", "detail": "自定义Scheme由系统登记到处理应用，URL参数可保留场景，实现网页与应用之间跳转。能否打开取决于安装、宿主、规则和处理能力，必须有失败与回退路径。不要把能唤起应用等同于获得可信身份或数据授权。", "anchors": ["PDF p. 353–353"], "pdf_start": 353, "pdf_end": 353, "voice": "editor", "related_concepts": ["url", "interface", "platform"], "excerpts": []}, {"id": "article-354", "title": "程序员别唬我系列之：HTTP Header", "detail": "请求头表达能力、偏好和凭据，响应头说明内容类型、压缩、缓存及处理方式。不同字段各有含义，不能把Accept-Encoding的压缩协商与字符集乱码混同。头部可观察也可伪造，不能单凭UA、Cookie存在或Content-Type判断安全。", "anchors": ["PDF p. 354–355"], "pdf_start": 354, "pdf_end": 355, "voice": "editor", "related_concepts": ["http", "network", "encoding"], "excerpts": []}, {"id": "article-356", "title": "程序员别唬我系列之：WebSocket", "detail": "WebSocket在建立后支持双向消息流，可用于股价等持续更新，减少反复轮询。持久连接仍占资源，需处理断线、心跳与重连；正文以“HTTP无状态所以必短连接”作铺垫不正确，连接复用与业务无状态应分开。", "anchors": ["PDF p. 356–357"], "pdf_start": 356, "pdf_end": 357, "voice": "editor", "related_concepts": ["connection"], "excerpts": []}, {"id": "article-358", "title": "程序员别唬我系列之：跨域与同源", "detail": "协议、主机和端口共同界定源，浏览器限制不同源脚本读写敏感内容，嵌入可见不代表任意访问。跨源协作要显式约定，消息通信需验证目标和来源。书中历史技巧有局限，同源策略也不是拒绝所有跨源网络请求。", "anchors": ["PDF p. 358–360"], "pdf_start": 358, "pdf_end": 360, "voice": "editor", "related_concepts": ["same-origin", "security", "url"], "excerpts": []}, {"id": "article-361", "title": "程序员常讲的「直出」是个什么鬼？", "detail": "服务器先把内容组织进HTML，可减少等待客户端脚本再取数据的关键链路，改善部分首屏。它不是无需脚本或一定更快，也不限定使用Node.js；工作被转移到服务端，还需比较服务器耗时、缓存、交互接续和维护复杂度。", "anchors": ["PDF p. 361–362"], "pdf_start": 361, "pdf_end": 362, "voice": "editor", "related_concepts": ["javascript", "performance"], "excerpts": []}, {"id": "article-363", "title": "程序员冒死揭露黑产系列之：Cookie 和广告联盟", "detail": "广告资源仍向广告服务域请求，浏览器按规则附带该域Cookie，使跨网站的广告服务得以关联访问。不是宿主网站直接读出另一个域的全部Cookie；正文猜测Cookie必含搜索词缺证据，标识也可关联服务端记录。浏览器限制与授权条件有时代变化。", "anchors": ["PDF p. 363–365"], "pdf_start": 363, "pdf_end": 365, "voice": "editor", "related_concepts": ["token", "privacy", "same-origin"], "excerpts": []}, {"id": "article-366", "title": "程序员天天说的 DOM 到底是什么", "detail": "浏览器把文档组织为对象树，脚本据此查找和修改内容；频繁更改可能触发布局绘制成本。虚拟DOM是一种表示与更新策略，不是必然更快的魔法，性能取决于变化、算法和实际提交工作，DOM树也不等同于最终渲染树。", "anchors": ["PDF p. 366–368"], "pdf_start": 366, "pdf_end": 368, "voice": "editor", "related_concepts": ["dom", "rendering", "architecture"], "excerpts": []}, {"id": "article-369", "title": "从一次网页登录简单聊聊 HTTP 的 GET 和 POST", "detail": "用打开登录页和提交表单区分获取资源与提交处理，参数可出现在URL或请求体。GET与POST有语义差异，POST只是位置不同而非自动加密；把密码放URL会扩大暴露，也不能认为后台理应不区分方法。需要与传输和服务端验证一起设计。", "anchors": ["PDF p. 369–369"], "pdf_start": 369, "pdf_end": 369, "voice": "editor", "related_concepts": ["http", "dom", "security"], "excerpts": []}, {"id": "article-370", "title": "当你打开一个网页的时候，浏览器在干什么？", "detail": "从HTML、CSS和脚本的职责进入DOM、样式相关结构、测量、布局与绘制，说明下载完成并不等于可见、可交互。浏览器还有执行与网络模块共同工作；源码、DOM和屏幕图像是不同层次，观察性能应拆出具体阶段。", "anchors": ["PDF p. 370–373"], "pdf_start": 370, "pdf_end": 373, "voice": "editor", "related_concepts": ["rendering", "dom", "javascript"], "excerpts": []}, {"id": "article-374", "title": "动态网页与静态网页", "detail": "静态服务直接返回已有内容，动态处理按请求生成或取得数据，两者最后都由浏览器呈现。扩展名不能可靠判断，静态页面也可用脚本交互或请求动态数据；数据库常见但非动态内容的必要定义，不把“动不动”当视觉效果区别。", "anchors": ["PDF p. 374–375"], "pdf_start": 374, "pdf_end": 375, "voice": "editor", "related_concepts": ["javascript", "architecture"], "excerpts": []}, {"id": "article-376", "title": "互联网的黄金矿工：爬虫", "detail": "爬虫从种子URL取得页面，提取内容与新链接，再继续发现，需处理价值排序、速度、解析和网站差异。robots.txt表达抓取偏好，但公开可见不等于任意使用的权利，认证、负载与内容范围仍需明确；搜索不是抓完就自然形成。", "anchors": ["PDF p. 376–377"], "pdf_start": 376, "pdf_end": 377, "voice": "editor", "related_concepts": ["search", "network"], "excerpts": []}, {"id": "article-378", "title": "技术上看微信小程序", "detail": "作者在未获内测邀请时，推测小程序由脚本、描述式界面、样式及宿主能力组成，并把微信比作中间平台。可分析语言、宿主和API的分工，不能把猜测的React Native式原生渲染写成小程序正式架构事实。", "anchors": ["PDF p. 378–379"], "pdf_start": 378, "pdf_end": 379, "voice": "editor", "related_concepts": ["platform", "hybrid", "interface"], "excerpts": []}, {"id": "article-380", "title": "锚点与网页内跳转的实现", "detail": "元素ID与URL片段可在同页定位，片段变化还可参与浏览历史；脚本滚动是另一种实现。传统锚点通常不为片段本身发服务器请求，但页面脚本可监听并做后续动作，不能把“同页跳转”推成绝不会触发任何网络行为。", "anchors": ["PDF p. 380–381"], "pdf_start": 380, "pdf_end": 381, "voice": "editor", "related_concepts": ["url", "dom", "state-machine"], "excerpts": []}, {"id": "article-382", "title": "你脱掉了我华丽的外衣－广告过滤机制科普", "detail": "广告过滤分为阻止资源请求与隐藏页面元素，规则依赖通用广告网络特征和持续维护。技术重点是抓取、展示可以分开控制；规则会过期或误伤，隐藏元素也不一定停止已发生的请求，不能把视觉消失等同于流量和追踪已停止。", "anchors": ["PDF p. 382–382"], "pdf_start": 382, "pdf_end": 382, "voice": "editor", "related_concepts": ["javascript", "dom", "configuration"], "excerpts": []}, {"id": "article-383", "title": "你想做个怎样的微信小程序？", "detail": "作者根据早期公开能力清单想象轻量新闻等场景，推测缓存与视图优化可减少安装负担。此篇本身明确是设想，应与正式技术实现分开。产品形态选择还要看使用频率、入口深度、身份及平台约束，而非所有低频应用都应被替代。", "anchors": ["PDF p. 383–384"], "pdf_start": 383, "pdf_end": 384, "voice": "editor", "related_concepts": ["platform", "requirements", "tradeoff"], "excerpts": []}, {"id": "article-385", "title": "前端：AngularJS 与双向绑定", "detail": "AngularJS用模板指令及数据绑定减少手工操作界面的代码，输入和显示随共享状态联动。Bootstrap主要侧重界面样式，两者解决的问题不同。双向绑定需明确数据源与更新流，不等于所有框架或MVC都天然只有一种通信方向。", "anchors": ["PDF p. 385–386"], "pdf_start": 385, "pdf_end": 386, "voice": "editor", "related_concepts": ["dom", "javascript", "architecture"], "excerpts": []}, {"id": "article-387", "title": "前端和后台的数据交互与协议", "detail": "客户端组织请求、服务端按业务准备数据、终端解析展示；双方协定字段和格式才能协作。文章比较文本JSON与二进制编码的可读性、体积与解析。二进制并非只能看到0和1，协议也不只是数据格式，还涉及行为和错误约定。", "anchors": ["PDF p. 387–387"], "pdf_start": 387, "pdf_end": 387, "voice": "editor", "related_concepts": ["serialization", "interface", "pipeline"], "excerpts": []}, {"id": "article-388", "title": "前端利器之 Bootstrap", "detail": "Bootstrap提供样式、常见组件及部分脚本交互，复用可快速完成原型或低定制界面。代码短不代表无需设计、适配和测试；“分分钟”针对演示，采用前仍需检查视觉要求、依赖、包体和可维护性，不把成熟库等同于任意需求现成。", "anchors": ["PDF p. 388–391"], "pdf_start": 388, "pdf_end": 391, "voice": "editor", "related_concepts": ["reuse", "view-tree", "tradeoff"], "excerpts": []}, {"id": "article-392", "title": "前端如何适配手机屏幕之 viewport", "detail": "视口决定页面按什么逻辑宽度布局，再由CSS像素映射到设备像素；device-width让移动布局有合适基准。视口设置是适配基础，不能单独保证所有页面完美，固定宽度、字体、内容溢出与缩放仍需处理，默认980也不是所有环境的恒定值。", "anchors": ["PDF p. 392–394"], "pdf_start": 392, "pdf_end": 394, "voice": "editor", "related_concepts": ["display", "platform"], "excerpts": []}, {"id": "article-395", "title": "如何用脚本来抢月饼", "detail": "脚本可重复触发页面操作，案例暴露抢购条件和数量限制不能只依赖前端。作者对争议事件的公平与法律评价属个人立场。分析聚焦服务端业务校验、规则说明和异常处理，不复刻抢购脚本，也不由“能操作”推出有权无限使用。", "anchors": ["PDF p. 395–396"], "pdf_start": 395, "pdf_end": 396, "voice": "editor", "related_concepts": ["automation", "security", "requirements"], "excerpts": []}, {"id": "article-397", "title": "网页与原生 App 如何交互", "detail": "WebView向脚本暴露原生能力，双方约定方法和回调，组合灵活网页与本机能力。同一页面在不同宿主中能力可能不同，桥接还扩大攻击面。接口应有最小权限、来源范围及参数验证，不能将对外开放越多简单视作越好。", "anchors": ["PDF p. 397–397"], "pdf_start": 397, "pdf_end": 397, "voice": "editor", "related_concepts": ["hybrid", "privacy"], "excerpts": []}, {"id": "article-398", "title": "如何爬取公众号的内容", "detail": "作者导出自己公众号数据时，从网络响应找结构化数据，再用脚本解析为表格，比照界面逐项复制更稳。关键是先找到真实数据来源和字段关联。会话信息和接口访问权是前提，示例不表示可批量获取他人私有后台数据。", "anchors": ["PDF p. 398–402"], "pdf_start": 398, "pdf_end": 402, "voice": "editor", "related_concepts": ["search", "observability", "serialization"], "excerpts": []}, {"id": "article-403", "title": "五分钟理解单页 Web 应用", "detail": "单页应用在已有文档内切换视图、取数据并维护前进后退，多页应用通常导航到另一文档。差别在责任分配，不是视觉页面数，也不是单页只能有一个URL。需要兼顾首屏、深链接、刷新恢复和历史状态，不能只比较点击时是否闪白。", "anchors": ["PDF p. 403–404"], "pdf_start": 403, "pdf_end": 404, "voice": "editor", "related_concepts": ["javascript", "url"], "excerpts": []}, {"id": "article-405", "title": "五分钟理解技术名词：盗链与反盗链", "detail": "页面引用他处资源会把带宽与服务成本留给资源提供方，反盗链可根据请求上下文等限制返回。Referer只是信号而非强身份认证，空值、策略和非浏览器请求都有影响；链接使用是否获准还要与技术拦截分别判断。", "anchors": ["PDF p. 405–406"], "pdf_start": 405, "pdf_end": 406, "voice": "editor", "related_concepts": ["http", "security", "performance"], "excerpts": []}, {"id": "article-407", "title": "五分钟理解什么是浏览器缓存", "detail": "新鲜期内直接复用，需验证时用修改时间等条件请求，未变化可返回304。缓存使传输更少但带来旧数据风险，不代表每次都必须访问源站。保质期是策略而非内容不会变化的保证；版本、失效和不同用户数据范围要一起设计。", "anchors": ["PDF p. 407–408"], "pdf_start": 407, "pdf_end": 408, "voice": "editor", "related_concepts": ["cache", "http", "tradeoff"], "excerpts": []}, {"id": "article-409", "title": "协议，序列化，XML，JSON 是什么关系", "detail": "业务协议定义字段含义，序列化把可传输表示与内存对象连接，XML/JSON提供共同格式以便解析。文本也最终以字节传送，二进制格式则有不同体积和模式约定。正文把按钮绝对视为不可序列化太粗略，应区分描述数据与运行资源本体。", "anchors": ["PDF p. 409–411"], "pdf_start": 409, "pdf_end": 411, "voice": "editor", "related_concepts": ["serialization", "encoding", "interface"], "excerpts": []}, {"id": "article-412", "title": "一步一步写爬虫：正则表达式", "detail": "正则用字符类、边界、数量和转义匹配一类文本，适合规则提取与部分格式检查。匹配到数字串不等于真实有效号码，正则也不是所有结构解析的替代。尤其不能把限制输入字符当作完整防SQL注入方案。", "anchors": ["PDF p. 412–413"], "pdf_start": 412, "pdf_end": 413, "voice": "editor", "related_concepts": ["javascript", "search", "requirements"], "excerpts": []}, {"id": "article-414", "title": "一步一步写爬虫之网页分析", "detail": "先确认历史文章所在页面，再沿标签结构找链接并验证目标，最后辨认分页加载。这种先观察数据结构再自动化的顺序比盲点界面可靠。示例只针对作者自己内容，链接、分页和返回格式会变化，应保留失败检查。", "anchors": ["PDF p. 414–417"], "pdf_start": 414, "pdf_end": 417, "voice": "editor", "related_concepts": ["search", "dom", "automation"], "excerpts": []}, {"id": "article-418", "title": "一步一步写爬虫之抓包", "detail": "通过清空请求、触发一次加载更多、比较新增请求及响应，确认分页数据来自何处。它展示控制变量与观察网络的排查方法。复用请求仍须维护授权、游标和结束条件，不能把“抓得到”当作任何范围访问许可。", "anchors": ["PDF p. 418–420"], "pdf_start": 418, "pdf_end": 420, "voice": "editor", "related_concepts": ["observability", "search", "javascript"], "excerpts": []}, {"id": "article-421", "title": "一步一步写爬虫之 JSON 解析", "detail": "JSON解析保留字段嵌套与文章关系，优于把所有URL用正则平铺抓走。数组、对象和值的差异决定如何遍历。原文示例含中文引号和等号等示意写法，不能直接作为有效JSON；解析后仍要验证类型、缺失字段与对应关系。", "anchors": ["PDF p. 421–422"], "pdf_start": 421, "pdf_end": 422, "voice": "editor", "related_concepts": ["serialization", "search", "data-model"], "excerpts": []}, {"id": "article-423", "title": "应用号，传统 APP 的革命？", "detail": "面对尚未公布细节的应用号，作者比较桥接网页、原生插件与跨平台框架三种可能方案，说明宿主复用账号、支付和推送的价值。整篇是前瞻推演，不是已证实实现，也不能据此保证宿主能消除所有多平台开发工作。", "anchors": ["PDF p. 423–423"], "pdf_start": 423, "pdf_end": 423, "voice": "editor", "related_concepts": ["platform", "hybrid", "hot-update"], "excerpts": []}, {"id": "article-424", "title": "优化网页速度的 7 种方法", "detail": "优化围绕减少资源体积、重复请求、重定向与解析成本，利用压缩、缓存和合适节点。图片格式并无脱离内容和保真要求的统一优先级，压缩百分比与静态资源比例也是例值。先找关键链路和质量约束，再挑对应办法。", "anchors": ["PDF p. 424–426"], "pdf_start": 424, "pdf_end": 426, "voice": "editor", "related_concepts": ["performance", "cache", "cdn"], "excerpts": []}, {"id": "article-427", "title": "再谈 JavaScript", "detail": "JavaScript语言标准、执行引擎和宿主接口共同决定行为，历史版本差异使同一调用可能出现不同结果。Node.js与跨平台框架扩展了语言使用场景。共享语言不等于共享全部能力，不能凭“脚本”断定总是逐句解释或固定慢于编译语言。", "anchors": ["PDF p. 427–429"], "pdf_start": 427, "pdf_end": 429, "voice": "editor", "related_concepts": ["javascript", "platform"], "excerpts": []}, {"id": "article-430", "title": "最火的前端技术，React", "detail": "React以组件与状态表达界面，用差异更新策略管理实际DOM操作，试图降低复杂页面的维护成本。JSX不等于直接把HTML丢进浏览器，需相应工具处理；React也不是自带所有精美按钮的成套设计库，虚拟DOM不保证所有场景性能更优。", "anchors": ["PDF p. 430–431"], "pdf_start": 430, "pdf_end": 431, "voice": "editor", "related_concepts": ["dom", "reuse"], "excerpts": []}], "takeaways": ["这一专题共有50篇。逐篇保留原题和顺序；点击概念可继续追问机制、条件与边界。", "具体算法、平台与内部实现的限制放在相应条目中，概念层提供跨专题连接。"], "related_concepts": ["dom", "javascript", "rendering", "http", "hybrid", "same-origin"], "anchors": ["PDF p. 315–431"], "confidence": "源文释义与编者综合；历史主张未作外部核实"}, {"id": "ch-07", "title": "安全 · 22篇", "part": "专题07", "question": "系统在哪些地方信任了不该直接信任的输入、身份或环境？", "role": "把技术可行性补成有授权、可验证的产品行为。", "mainline": "安全专题从输入处理、脚本、请求和网络欺骗，到恶意软件、凭据、证书与第三方SDK，展示攻击常借助正常功能与信任关系发生。产品不能仅根据界面按钮、一个本地返回值或能否调用API来推断授权成立。加密保护数据内容，签名与证书涉及来源与身份，密码保存还需要适当的计算成本和凭据生命周期；这些目标互相相关却不能混为一谈。书中“黑产”写法包含夸张和操作细节，本页仅保留理解风险与设计防护所需的原理。防护建议和协议描述也有简化，不能把某一条输入限制或隐藏配置当作完整安全方案。", "argument_flow": ["识别输入与执行边界", "区分请求和意愿", "认识资源耗尽", "管理密码与凭据", "理解加密和签名", "核对SDK及权限证据"], "sections": [{"id": "article-432", "title": "2059 万淘宝账户被盗，竟然是因为它！", "detail": "撞库利用跨站复用凭据，使一个站点泄漏波及其他服务；风险识别和额外验证可以增加防线。文中按网站名规则变化密码并非不可预测，不能当作强安全保证。案例数字按作者转述，不作独立核实；产品需兼顾异常登录、限速和找回流程。", "anchors": ["PDF p. 432–432"], "pdf_start": 432, "pdf_end": 432, "voice": "editor", "related_concepts": ["identity", "security"], "excerpts": []}, {"id": "article-433", "title": "Web 安全之：SQL 注入攻击", "detail": "将用户输入直接拼进SQL会混淆数据和指令，可能改变查询行为。本文保留信任边界原理，不复刻登录绕过载荷；原文字符白名单与示例语法不足以构成完整防护，应让输入约束与执行接口分离，而非仅禁几个符号。", "anchors": ["PDF p. 433–433"], "pdf_start": 433, "pdf_end": 433, "voice": "editor", "related_concepts": ["requirements", "database", "security"], "excerpts": []}, {"id": "article-434", "title": "Web 安全之：XSS 漏洞", "detail": "不可信内容被当可执行页面代码处理，会在目标上下文中产生非预期行为，存储后还可能传播给更多访问者。正文把反射型示例标作DOM型、把XSS定义为必需两个站点，均不严谨。格式校验、上下文编码与执行控制应分开理解。", "anchors": ["PDF p. 434–435"], "pdf_start": 434, "pdf_end": 435, "voice": "editor", "related_concepts": ["requirements", "dom", "security"], "excerpts": []}, {"id": "article-436", "title": "Web 安全之 CSRF 攻击", "detail": "浏览器可能自动携带已有凭据发请求，因此“来自已登录浏览器”不等于用户有意执行敏感动作。文章介绍请求约束与专用令牌，重点是验证动作上下文。换POST或增加验证码并非独立完备方案，也不能把认证与用户意愿混为一谈。", "anchors": ["PDF p. 436–436"], "pdf_start": 436, "pdf_end": 436, "voice": "editor", "related_concepts": ["token", "same-origin", "security"], "excerpts": []}, {"id": "article-437", "title": "程序员冒死揭露黑产系列之：「ARP」攻击", "detail": "ARP把局域网地址关联到链路身份，错误映射可导致中断或中间转发；静态关系是书中给出的一种限制手段。这里讨论信任和验证，不提供攻击命令。正文将IPv6也直接纳入同一ARP叙述过宽，链路协议与环境应区分。", "anchors": ["PDF p. 437–438"], "pdf_start": 437, "pdf_end": 438, "voice": "editor", "related_concepts": ["network", "security", "identity"], "excerpts": []}, {"id": "article-439", "title": "程序员冒死揭露黑产系列之：Android 应用二次打包党", "detail": "二次打包可能修改分成标识、代码或夹带行为，因此名字、包名与原作者身份不能等同。签名比对和服务端核验帮助建立来源判断，加固提高部分修改成本。不能保证任何加固绝对无法逆向，也不把签名检查失败直接解释为全部恶意。", "anchors": ["PDF p. 439–439"], "pdf_start": 439, "pdf_end": 439, "voice": "editor", "related_concepts": ["crypto", "build", "security"], "excerpts": []}, {"id": "article-440", "title": "程序员冒死揭露黑产系列之：年产百亿的 DDoS 攻击", "detail": "DDoS通过非正常请求消耗容量，使正常服务不可用；文中以连接建立中的等待状态说明成本不对称。分析转为容量、准入、监测与恢复问题，不复现攻击流程。攻击方并非总需比防守方更多资源，标题产业金额亦未在本文充分证实。", "anchors": ["PDF p. 440–441"], "pdf_start": 440, "pdf_end": 441, "voice": "editor", "related_concepts": ["queue", "security", "performance"], "excerpts": []}, {"id": "article-442", "title": "程序员冒死揭露黑产系列之：小心！下个「陈老师」可能是你！", "detail": "高权限和动态介入可能跨越原有应用隔离，在系统能力调用路径观察或改变敏感数据。它提醒授权的影响范围可能大于表面功能。文中企业争议仅为作者转述，Root也不意味着每条数据必定已泄漏，需要具体行为和环境证据。", "anchors": ["PDF p. 442–443"], "pdf_start": 442, "pdf_end": 443, "voice": "editor", "related_concepts": ["privacy", "interface"], "excerpts": []}, {"id": "article-444", "title": "程序员冒死揭露黑产系列之：诈骗短信与伪基站", "detail": "文章借旧移动通信单向认证解释冒充接入设备与诈骗消息的风险，提示看似官方来源不等于可信。不是所有诈骗短信都来自伪基站，换卡也不能概括为杜绝一切降级或诈骗；不复刻设备搭建和发送步骤，聚焦认证、来源与独立核验。", "anchors": ["PDF p. 444–445"], "pdf_start": 444, "pdf_end": 445, "voice": "editor", "related_concepts": ["identity", "network", "security"], "excerpts": []}, {"id": "article-446", "title": "家庭 Wi-Fi 防蹭网指南", "detail": "修改已泄漏凭据和检查连接设备与保护接入有关，但隐藏SSID、关闭DHCP及MAC过滤不能视为强认证，既可能被绕过也增加维护。文章的加密方案分类和“全球唯一”说法过度简单；按历史安全意识教材理解，不直接当当前家庭配置清单。", "anchors": ["PDF p. 446–447"], "pdf_start": 446, "pdf_end": 447, "voice": "editor", "related_concepts": ["network", "privacy", "security"], "excerpts": []}, {"id": "article-448", "title": "开启你的两步验证吧", "detail": "两步验证在常规密码外加入另一个凭据，TOTP以共享秘密和时间产生短期码。不同因素的独立性、恢复方式和时间偏差都影响真实效果。正文算法只作示意，不能按“哈希最后几位”直接实现；有第二步也不等于不会被钓鱼。", "anchors": ["PDF p. 448–449"], "pdf_start": 448, "pdf_end": 449, "voice": "editor", "related_concepts": ["identity", "token", "clock"], "excerpts": []}, {"id": "article-450", "title": "来「设计」一款病毒", "detail": "文章按伪装、启动、隐藏、复制与传播讲恶意程序的生命周期。本文将它重构为识别可疑文件、权限变化、持久化与横向传播风险的防御视角，不保留可执行实现细节。某些历史系统行为不能概括所有当前Windows环境。", "anchors": ["PDF p. 450–451"], "pdf_start": 450, "pdf_end": 451, "voice": "editor", "related_concepts": ["security", "lifecycle", "requirements"], "excerpts": []}, {"id": "article-452", "title": "密码应该如何存-加盐技术", "detail": "从明文到密码摘要再到每用户随机盐，解释同密码可产生不同存储结果、降低预计算复用。盐不以隐藏位置为核心，也不是先反解拼接再辨密码；已知盐仍可能猜弱密码，不能据文中MD5演示宣称安全，具体存储方案需另行设计评估。", "anchors": ["PDF p. 452–453"], "pdf_start": 452, "pdf_end": 453, "voice": "editor", "related_concepts": ["hash", "identity", "security"], "excerpts": []}, {"id": "article-454", "title": "那些年中过的病毒（一）", "detail": "引导与文档宏案例说明：普通文件可能触发执行，扩展能力也会带来传播面。作者将某历史病毒称“世界第一个”缺少足够限定，不能照录为史实。文档含宏不等于必有恶意，风险取决于来源、行为、权限及执行策略。", "anchors": ["PDF p. 454–455"], "pdf_start": 454, "pdf_end": 455, "voice": "editor", "related_concepts": ["security", "automation", "lifecycle"], "excerpts": []}, {"id": "article-456", "title": "那些年中过的病毒（二）——特征码", "detail": "特征识别需兼顾区分性、稳定性和成本，过宽产生误报，过窄或易变造成漏报。它不是对软件安全的绝对裁定，也并非所有检测只看静态串。本文不保留修改恶意样本规避检测的操作信息，把重点放在检测边界和验证。", "anchors": ["PDF p. 456–457"], "pdf_start": 456, "pdf_end": 457, "voice": "editor", "related_concepts": ["crypto", "metrics", "security"], "excerpts": []}, {"id": "article-458", "title": "那些年中过的病毒（三）——免杀", "detail": "此篇讨论文件表示变化可能削弱仅依赖静态特征的识别，说明外观与运行行为可以不同。本文保留这条防御认识及检测博弈，不复现加壳、插入指令或规避工具清单；不能因某次扫描通过就认定程序无害。", "anchors": ["PDF p. 458–459"], "pdf_start": 458, "pdf_end": 459, "voice": "editor", "related_concepts": ["security", "abstraction"], "excerpts": []}, {"id": "article-460", "title": "你的网站升级到 HTTPS 了吗？", "detail": "HTTPS迁移涉及证书、入口、资源、依赖和性能，不只给登录页加密；安全上下文还关系某些浏览器能力。文章证书品牌和有效期建议均有时代范围，迁移后仍有更新与运行维护，不能照录“一次改完无需处理”。", "anchors": ["PDF p. 460–460"], "pdf_start": 460, "pdf_end": 460, "voice": "editor", "related_concepts": ["crypto", "release", "platform"], "excerpts": []}, {"id": "article-461", "title": "你敢使用公共 WiFi 吗？", "detail": "接入密码、链路加密、热点身份和端到端保护是不同层次，陌生热点可能窃听、篡改或诱导。文中把开放网络等同于所有应用数据明文过于绝对，HTTPS会改变攻击者可见范围。分析侧重验证目标身份与传输边界，不把任何单项工具当绝对保护。", "anchors": ["PDF p. 461–462"], "pdf_start": 461, "pdf_end": 462, "voice": "editor", "related_concepts": ["network", "crypto", "privacy"], "excerpts": []}, {"id": "article-463", "title": "你所需要知道的关于加密的事", "detail": "算法可以公开，秘密主要由密钥承担；对称共享密钥与非对称密钥对解决不同分工。非对称不代表更高等级的万能替代，签名也不能简单叫私钥加密。公钥与身份的可信关联还需证明，不能因某人自行声称公钥归他就认定身份。", "anchors": ["PDF p. 463–464"], "pdf_start": 463, "pdf_end": 464, "voice": "editor", "related_concepts": ["crypto", "identity"], "excerpts": []}, {"id": "article-465", "title": "上帝视角看支付宝隐私门", "detail": "相机接口调用、预览、拍摄、保存与上传不是同一行为；作者到结尾也承认需要内存或网络证据才能判断。它提供“先分清机制再裁定”的方法，具体Binder和高权限实现有简化。改善流程的动机不能代替用户知情及必要性说明。", "anchors": ["PDF p. 465–468"], "pdf_start": 465, "pdf_end": 468, "voice": "editor", "related_concepts": ["privacy", "observability"], "excerpts": []}, {"id": "article-469", "title": "想「坑」我，没门———微信是如何校验分享合法性的", "detail": "包名标识应用，签名帮助核对发布身份，平台登记与校验用于识别分享来源；本地信息可减少每次联网。正文对微信离线校验过程属作者描述，并未提供完整证据。签名不是私钥本体，断网、撤销和缓存时效会影响可信判断。", "anchors": ["PDF p. 469–469"], "pdf_start": 469, "pdf_end": 469, "voice": "editor", "related_concepts": ["crypto", "identity", "cache"], "excerpts": []}, {"id": "article-470", "title": "再谈密码安全问题——雅虎密码泄露风波", "detail": "密码重置而非找回原文，是验证凭据与保存明文的区别；安全问题泄漏又可绕开密码本身。哈希不可逆不等于弱密码不可被猜中，安全恢复链不能比登录更弱。事件按书中报道理解，算法名称也不构成充分安全设计。", "anchors": ["PDF p. 470–471"], "pdf_start": 470, "pdf_end": 471, "voice": "editor", "related_concepts": ["identity", "hash"], "excerpts": []}], "takeaways": ["这一专题共有22篇。逐篇保留原题和顺序；点击概念可继续追问机制、条件与边界。", "具体算法、平台与内部实现的限制放在相应条目中，概念层提供跨专题连接。"], "related_concepts": ["security", "crypto", "identity", "privacy"], "anchors": ["PDF p. 432–471"], "confidence": "源文释义与编者综合；历史主张未作外部核实"}, {"id": "ch-08", "title": "开发工具 · 8篇", "part": "专题08", "question": "开发、构建和协作工具具体在减少什么重复劳动，又留下什么责任？", "role": "从名词回到工程工作流，为理解开发机制做过渡。", "mainline": "工具专题介绍编写代码、自动整理、构建、定位和版本管理等协作环节。工具能把重复步骤标准化，让团队保存变更并追踪差异，但不会自动理解产品目标或证明结果正确。版本控制特别说明：一次功能由多个修改叠加，定位回归需要找到可复现的正常与异常版本，再缩小区间；找到某次提交不代表责任就只有那个人。阅读时应问每个工具处理什么输入、输出什么证据、如何与团队约定衔接，而非把安装或熟练使用工具本身等同于研发成熟。", "argument_flow": ["编辑与辅助开发", "把代码变成产物", "保留变更历史", "定位正常与异常区间", "协作和复核"], "sections": [{"id": "article-472", "title": "琅琊榜-编程语言篇", "detail": "多种语言覆盖部分相同任务，但生态、宿主、团队经验和约束不同，不能用单一榜单选型。文章的排名和公司技术栈为当时例子。标记语言、样式语言和通用编程语言角色不同，共享名称或语法也不代表语言有继承关系。", "anchors": ["PDF p. 472–474"], "pdf_start": 472, "pdf_end": 474, "voice": "editor", "related_concepts": ["os", "tradeoff", "collaboration"], "excerpts": []}, {"id": "article-475", "title": "Bye Bye，Eclipse", "detail": "IDE加针对平台的插件形成开发环境，迁移又受稳定性、习惯和官方支持影响。Eclipse与Android Studio的故事说明工具选择有转换成本，但作者把一次调查和UI调整当作衰落主因，因果证据不足，不据此裁定工具现状。", "anchors": ["PDF p. 475–476"], "pdf_start": 475, "pdf_end": 476, "voice": "editor", "related_concepts": ["build", "platform", "tradeoff"], "excerpts": []}, {"id": "article-477", "title": "GitHub 是什么?", "detail": "Git提供分布式版本控制，GitHub在托管之上组织讨论、Fork与合并请求，并支持站点等用途。复用与贡献依靠清楚的历史和协作机制，不是简单复制代码。公开仓库不等于没有许可约束，贡献数量也不能全面代表工程能力。", "anchors": ["PDF p. 477–478"], "pdf_start": 477, "pdf_end": 478, "voice": "editor", "related_concepts": ["version-control", "reuse", "collaboration"], "excerpts": []}, {"id": "article-479", "title": "Instant Run 是如何帮程序员节约时间的", "detail": "编辑到运行包含编译、传送、安装和重启，Instant Run用增量和动态替换缩短一部分反馈链。某些修改仍可能需要更完整重启，不能把“瞬间”当所有变化承诺。它是历史开发工具案例，与向真实用户发布热补丁要区别。", "anchors": ["PDF p. 479–481"], "pdf_start": 479, "pdf_end": 481, "voice": "editor", "related_concepts": ["build", "hot-update"], "excerpts": []}, {"id": "article-482", "title": "程序员都用哪些 Chrome 插件？", "detail": "插件围绕信息可读、请求测试、截图、跨端传递与浏览辅助减少重复操作。本文保留工具类别和所解决问题，不把旧清单作为当前推荐；插件可接触页面和请求数据，能力便利与权限范围应一起看，是否可用需按环境验证。", "anchors": ["PDF p. 482–482"], "pdf_start": 482, "pdf_end": 482, "voice": "editor", "related_concepts": ["build", "observability", "reuse"], "excerpts": []}, {"id": "article-483", "title": "程序员天天用的 IDE，你了解吗", "detail": "IDE把编辑、构建、运行、调试及项目工具集成到工作界面，提高反馈效率，但不是代码运行机制本身。熟练点击不等于理解语言、构建和定位问题。模拟器也不是与真机完全一致，工具替换后基础方法仍应能迁移。", "anchors": ["PDF p. 483–485"], "pdf_start": 483, "pdf_end": 485, "voice": "editor", "related_concepts": ["build", "observability"], "excerpts": []}, {"id": "article-486", "title": "聊聊编码规范", "detail": "命名、缩进、注释与布局规则降低多人代码的阅读和维护成本，价值在于团队一致而非某种个人风格绝对优越。规则应配合工具与真实维护问题，不以表面整齐替代设计质量，也不能据代码风格判断人的整体水平。", "anchors": ["PDF p. 486–486"], "pdf_start": 486, "pdf_end": 486, "voice": "editor", "related_concepts": ["collaboration", "abstraction", "version-control"], "excerpts": []}, {"id": "article-487", "title": "版本管理器之 SVN", "detail": "SVN记录提交、更新与差异合并，使多人各自修改后形成可追溯历史；用版本区间缩小首次引入故障的位置。二分依赖可重复测试和合适的好坏版本，不保证任何历史都单调。找到提交是调查线索，不能把变更作者自动当成全部责任人。", "anchors": ["PDF p. 487–488"], "pdf_start": 487, "pdf_end": 488, "voice": "editor", "related_concepts": ["version-control", "observability", "collaboration"], "excerpts": []}], "takeaways": ["这一专题共有8篇。逐篇保留原题和顺序；点击概念可继续追问机制、条件与边界。", "具体算法、平台与内部实现的限制放在相应条目中，概念层提供跨专题连接。"], "related_concepts": ["build", "version-control", "observability", "automation"], "anchors": ["PDF p. 472–488"], "confidence": "源文释义与编者综合；历史主张未作外部核实"}, {"id": "ch-09", "title": "开发技术 · 44篇", "part": "专题09", "question": "程序怎样组织数据、任务与依赖，为什么局部修改可能牵动整个系统？", "role": "揭开实现机制，把估工、性能和可维护性放到同一张图上。", "mainline": "内存回收、类型、数据结构和编码先说明程序操作的对象是什么；线程池、队列、生产消费与流水线再说明工作如何分配、等待和重叠。随后观察者、接口、MVC、面向对象、继承与多态讨论变化如何传播，重构则在行为基线下改善内部组织。编译、调试和异常把“写出来”“能生成”“能运行”与“业务正确”分成不同验证阶段。这些机制共同反驳两种过度简单的判断：接口能调用不表示整个需求已完成，多开线程也不表示一定更快。专题中同时存在算法、类型和运行时的简化说法，逐篇解读给出适用条件与算术校验。", "argument_flow": ["数据与寿命", "任务与资源", "流水线及吞吐", "抽象与依赖", "编译及运行", "诊断异常与重构"], "sections": [{"id": "article-489", "title": "说说内存回收", "detail": "作者从堆中对象的创建与引用关系解释垃圾回收：程序持续申请内存，运行环境需要识别不再使用的对象并回收空间，四种引用的例子说明对象被保留的强弱可以不同。产品上的连接点是页面退出、图片缓存和长任务的资源寿命。边界：是否可回收取决于可达性等规则，不能把“存在强引用”理解为永远无法回收；循环引用也不能一概判为泄漏。回收时间和停顿需按具体运行环境观察。", "anchors": ["PDF p. 489–490"], "pdf_start": 489, "pdf_end": 490, "voice": "editor", "related_concepts": ["memory", "lifecycle"], "excerpts": []}, {"id": "article-491", "title": "「越界」那些事", "detail": "数组下标从零开始，上界受当前长度限制；列表在访问前被别的流程修改，原先合法的位置也可能失效。另一类越界来自整数等数据类型的取值范围，作者用渠道编号增长说明上线时够用的范围不一定长期够用。要区分索引越界、数值溢出和业务范围错误，检查输入、数据增长与并发时序，而不是只在崩溃处补一个判断。具体位宽随语言和实现变化。", "anchors": ["PDF p. 491–491"], "pdf_start": 491, "pdf_end": 491, "voice": "editor", "related_concepts": ["data-model", "concurrency", "requirements"], "excerpts": []}, {"id": "article-492", "title": "编程五分钟，命名两小时", "detail": "变量和函数名既让机器执行，也帮助后来的人理解意图。年龄、下单等语义明确的名字，比只有作者知道意思的字母更有利于阅读、排错与协作；will、did等约定还能表达动作发生前后。命名问题的主线是让代码结构与业务概念对应，减少维护者重新推理的成本。命名风格依赖团队约定，不应仅凭大小写或单词形式推断行为，也不能用改名代替职责划分。", "anchors": ["PDF p. 492–493"], "pdf_start": 492, "pdf_end": 493, "voice": "editor", "related_concepts": ["abstraction", "collaboration", "architecture"], "excerpts": []}, {"id": "article-494", "title": "不懂深度学习，你就 OUT 了", "detail": "文章用图像风格迁移、生成宋词、图像修复及围棋等例子说明深度学习可以从数据中形成可执行的模型，并提到训练框架降低实现门槛。其价值是帮助产品经理建立任务、数据、训练与输出之间的联系。需要校准：文中把深度学习近似等同卷积神经网络是过度简化，未标注学习也不等于机器会自己给类别取出人类语义名称。这是当时的入门介绍，不能直接当作当前大模型方案或能力保证。", "anchors": ["PDF p. 494–496"], "pdf_start": 494, "pdf_end": 496, "voice": "editor", "related_concepts": ["machine-learning", "data-model", "metrics"], "excerpts": []}, {"id": "article-497", "title": "程序设计的时空大法", "detail": "作者把程序设计中的时间与空间权衡放到阅读和图片渐变场景中：预先保存已计算或已下载的结果，可以减少下次等待，却占用更多存储或内存；临时计算、按需加载能节省空间，但增加响应时间。重点不是背“空间换时间”，而是识别哪项资源稀缺、结果是否会重复使用、缓存何时失效。对首屏、离线和低内存设备，最优选择可能不同，不能把响应速度永远放在唯一首位。", "anchors": ["PDF p. 497–498"], "pdf_start": 497, "pdf_end": 498, "voice": "editor", "related_concepts": ["cache", "memory", "tradeoff", "performance"], "excerpts": []}, {"id": "article-499", "title": "程序员的梦想：自己写一个操作系统有多难", "detail": "操作系统负责在硬件和应用之间管理处理器、内存、文件与进程，并提供应用可以调用的接口；启动过程与Unix、Linux等沿革解释了这一层为何复杂。产品经理应由此理解：界面只是操作系统可见的一小部分，应用能力受系统资源管理和接口限制。POSIX等约定帮助源代码迁移，不等于任意二进制文件自动跨平台；虚拟内存也不是凭空创造无限物理内存。历史叙事与技术机制应分开看。", "anchors": ["PDF p. 499–501"], "pdf_start": 499, "pdf_end": 501, "voice": "editor", "related_concepts": ["os", "cpu", "memory", "concurrency"], "excerpts": []}, {"id": "article-502", "title": "程序员的套路：观察者模式", "detail": "用退出登录通知多个模块为例，作者先呈现逐一调用带来的修改负担，再让各模块通过共同约定注册，事件发生时统一收到通知。观察者模式把事件来源与具体响应者隔开，方便增加响应方。这里的“注销”语境主要是退出登录，不能自动扩展为永久删除账号。实际设计还要交代订阅取消、通知顺序、重复通知及某个响应失败后的处理；采用模式并不意味着模块从此毫无依赖。", "anchors": ["PDF p. 502–504"], "pdf_start": 502, "pdf_end": 504, "voice": "editor", "related_concepts": ["coupling", "interface", "lifecycle"], "excerpts": []}, {"id": "article-505", "title": "程序猿别唬我：开发动画要多少工作量？", "detail": "平移、缩放、透明度、旋转等常见动画可以用系统已有能力组合，设置起止值、时长、中心点和重复规则，往往不必逐帧手写。作者借此反驳“凡是动画都很难”的笼统估工。估算仍须把基础动效与完整交互分开：手势跟随、途中取消、连续点击、布局变化、设备适配和性能验证都会增加工作。产品经理应提供状态与验收条件，再讨论复用接口能覆盖到哪一步。", "anchors": ["PDF p. 505–507"], "pdf_start": 505, "pdf_end": 507, "voice": "editor", "related_concepts": ["animation", "reuse", "requirements", "tradeoff"], "excerpts": []}, {"id": "article-508", "title": "程序中的手术刀之「反射」", "detail": "反射让程序在运行期间查看类型、成员等信息，并在允许的机制内动态调用或操作对象。它像检查内部结构的工具，能服务通用框架、插件等需要延迟决定调用目标的场景。动态能力带来灵活性，也使依赖关系更难在编译阶段检查。不能把反射说成不受任何访问控制或安全边界限制的万能手术刀；可访问范围、性能与平台约束要回到具体实现判断。", "anchors": ["PDF p. 508–508"], "pdf_start": 508, "pdf_end": 508, "voice": "editor", "related_concepts": ["abstraction", "interface"], "excerpts": []}, {"id": "article-509", "title": "从」观察者模式「看设计模式的原则", "detail": "文章从观察者例子抽出设计原则：依赖共同接口而非逐个具体对象，减少一个模块知道其他模块内部细节的程度，让增加新响应者尽量不要求改动事件来源。其主线是控制变化传播，而非追求抽象层越多越好。共同接口本身仍是依赖，事件含义变化也会影响各方。设计评审应问清哪些变化最可能发生，以及新增一层约定是否值得维护成本。", "anchors": ["PDF p. 509–510"], "pdf_start": 509, "pdf_end": 510, "voice": "editor", "related_concepts": ["coupling", "inter
